name: Validate tabletop prototype
on:
  push:
    branches: [codex/tabletop-prototype]
  pull_request:
    paths: ['tabletop/**', 'tests/tabletop-*', 'tests/test_tabletop_build.py', 'build.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python build.py
      - run: node --test tests/*.test.cjs
      - run: npm install
        working-directory: tabletop
      - run: npm test
        working-directory: tabletop
      - run: npm run check:cloudflare
        working-directory: tabletop
      - run: npx playwright install --with-deps chromium
        working-directory: tabletop
      - run: npm run test:browser
        working-directory: tabletop
      - uses: actions/upload-artifact@v4
        with:
          name: vara-tabletop-prototype
          path: site
          if-no-files-found: error
    # Deliberately no Pages deployment or Cloudflare deployment in this workflow.
