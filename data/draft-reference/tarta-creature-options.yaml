section: rules
entries:
- name: Tarta creature options
  group: Tarta Homebrewery - Creature options
  description: Choose these as standalone monsters, NPCs, companions or possible summon forms when an existing rule
    or the GM allows it. Each has its own monster page and editable statblock. This collection does not grant a
    new spell, summoning power, class feature or extra character resource. For a controlled companion, use the existing
    effect’s activation, resource cost, control limits and duration; otherwise the creature acts as an ordinary
    independent monster. Variable duplicate templates require a selected model creature's profile.
  summon_label: Creature options
