section: rules
entries:
- name: Neodrakite
  group: Tarta Homebrewery - Materials
  description: A rare material with distinct Geochemical Golem, infused-weapon and Geomorphic Bastion applications.
    Its Geochemical Golem component costs 300 gp.
  sections:
  - heading: Golem infusion
    body: As an action, the golem creates a magnetic pulse affecting metallic objects within 10 feet. It may move
      unattended metal objects up to 10 feet toward or away from itself. A creature holding a targeted metal item
      makes a DC 14 Strength save; on failure, it drops one such item in its space. The pulse does not move or damage
      the creature. This saving-throw-only effect cannot be Blocked. Only loose handheld objects weighing at most
      50 pounds each may be moved; anchored objects, structures and worn armor are unaffected. A held weapon uses
      the printed disarm save.
  - heading: Weapon infusion
    body: As an action while wielding the infused weapon, create a magnetic pulse affecting metallic objects within
      10 feet. Move unattended metal objects up to 10 feet toward or away from you. A creature holding a targeted
      metal item makes a DC 16 Strength save; on failure, it drops one such item in its space. The pulse does not
      move or damage the creature and cannot be Blocked. Only loose handheld objects weighing at most 50 pounds
      each may be moved; anchored objects, structures and worn armor are unaffected. A held weapon uses the printed
      disarm save.
  - heading: Bastion aura
    body: As an action while within 20 feet of your Bastion, create the weapon infusion magnetic pulse centered
      on the Bastion, with a 20-foot radius and DC 16 Strength save. Unattended metal objects move up to 10 feet
      toward or away from the Bastion; holders that fail drop one targeted metal item in their space. The pulse
      does not move creatures and cannot be Blocked. Only loose handheld objects weighing at most 50 pounds each
      may be moved; anchored objects, structures and worn armor are unaffected. A held weapon uses the printed disarm
      save.
  source_golem_option:
    selectable: true
    cost_gp: 300
    effect: As an action, the golem creates a magnetic pulse affecting metallic objects within 10 feet. It may move
      unattended metal objects up to 10 feet toward or away from itself. A creature holding a targeted metal item
      makes a DC 14 Strength save; on failure, it drops one such item in its space. The pulse does not move or damage
      the creature. This saving-throw-only effect cannot be Blocked. Only loose handheld objects weighing at most
      50 pounds each may be moved; anchored objects, structures and worn armor are unaffected. A held weapon uses
      the printed disarm save.
  source_ref: draft2.pdf / PDF pages 28 and 62
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    golem_infusion:
      cost_gp: 300
      effect: Allows the Golem to pull or push metallic objects within a 10-foot radius
    weapon_infusion: Metallic objects within 10 feet are pulled or repelled. Creatures holding these objects must
      succeed on a DC 16 Strength saving throw or be disarmed.
    bastion_aura: Metallic objects within 20 feet are pulled or repelled. Creatures holding these objects must succeed
      on a DC 16 Strength saving throw or be disarmed.
  conversion_notes:
  - This profile has three separate applications. Owning the material does not grant all three effects. A configured
    golem uses its Golem infusion; weapon and Bastion applications require their existing feature or GM permission.
  - A weapon rider requires an unblocked strike. Saving-throw-only and automatic damage cannot be Blocked. Current
    Poisoned and Blinded conditions apply; the printed source save DCs remain fixed.
  - The source weapon and Bastion effects belong to the level-18 Earthwarden features; they are not automatically
    innate traits of a material dragon. Current rest durations apply whenever a source feature refers to a short
    or long rest.
  - The source omitted magnetic activation and object displacement. Use an action for each pulse, a 10-foot object
    displacement, and a dropped held item rather than forced movement of the holder. The golem uses DC 14; Earthwarden
    applications preserve DC 16.
  - Magnetic movement is limited to loose handheld objects up to 50 pounds each, excluding structures, anchored
    objects and worn armor. This completes the source object-size omission without moving vehicles or fortifications.
- name: Cerithal Stone
  group: Tarta Homebrewery - Materials
  description: A rare material with distinct Geochemical Golem, infused-weapon and Geomorphic Bastion applications.
    Its Geochemical Golem component costs 200 gp.
  sections:
  - heading: Golem infusion
    body: Each ground space the golem leaves while moving becomes difficult terrain until the start of its next
      turn. The trail occupies the spaces the golem occupied; overlapping trail spaces do not multiply movement
      costs. It affects creatures on the ground, not flying creatures.
  - heading: Weapon infusion
    body: After an unblocked strike with the infused weapon, ground within 5 feet of the struck target becomes difficult
      terrain until the start of your next turn. Overlapping areas do not multiply movement costs.
  - heading: Bastion aura
    body: Ground within 20 feet of the Bastion is difficult terrain for the Bastion's duration. Overlapping difficult
      terrain does not multiply movement costs.
  source_golem_option:
    selectable: true
    cost_gp: 200
    effect: Each ground space the golem leaves while moving becomes difficult terrain until the start of its next
      turn. The trail occupies the spaces the golem occupied; overlapping trail spaces do not multiply movement
      costs. It affects creatures on the ground, not flying creatures.
  source_ref: draft2.pdf / PDF pages 28 and 62
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    golem_infusion:
      cost_gp: 200
      effect: Leaves a trail of difficult terrain.
    weapon_infusion: Weapon strikes make a 5-foot radius area difficult terrain.
    bastion_aura: Ground in a 20-foot radius becomes difficult terrain.
  conversion_notes:
  - This profile has three separate applications. Owning the material does not grant all three effects. A configured
    golem uses its Golem infusion; weapon and Bastion applications require their existing feature or GM permission.
  - A weapon rider requires an unblocked strike. Saving-throw-only and automatic damage cannot be Blocked. Current
    Poisoned and Blinded conditions apply; the printed source save DCs remain fixed.
  - The source weapon and Bastion effects belong to the level-18 Earthwarden features; they are not automatically
    innate traits of a material dragon. Current rest durations apply whenever a source feature refers to a short
    or long rest.
  - The source omitted trail and weapon-terrain persistence. Use the occupied ground spaces and a duration until
    the creator's next turn. The Bastion terrain lasts while the Bastion does.
- name: Lanthara Crystal
  group: Tarta Homebrewery - Materials
  description: A rare material with distinct Geochemical Golem, infused-weapon and Geomorphic Bastion applications.
    Its Geochemical Golem component costs 400 gp.
  sections:
  - heading: Golem infusion
    body: Increase the golem's Armor Class by 2 while this infusion is present. The ordinary Geochemical Golem AC
      16 becomes AC 18. This does not add Block, armor training or damage reduction.
  - heading: Weapon infusion
    body: The infused weapon emits bright light in a 20-foot radius and dim light for another 20 feet while wielded.
      This is illumination, not radiant damage.
  - heading: Bastion aura
    body: The Bastion sheds bright light in a 40-foot radius for its duration. It causes no radiant damage.
  source_golem_option:
    selectable: true
    cost_gp: 400
    effect: Increase the golem's Armor Class by 2 while this infusion is present. The ordinary Geochemical Golem
      AC 16 becomes AC 18. This does not add Block, armor training or damage reduction.
  source_ref: draft2.pdf / PDF pages 28 and 62
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    golem_infusion:
      cost_gp: 400
      effect: Enhances the golem's density, increasing its Armor Class by 2.
    weapon_infusion: Weapon emits bright light in a 20-foot radius and dim light for an additional 20 feet.
    bastion_aura: Bastion illuminates a 40-foot radius.
  conversion_notes:
  - This profile has three separate applications. Owning the material does not grant all three effects. A configured
    golem uses its Golem infusion; weapon and Bastion applications require their existing feature or GM permission.
  - A weapon rider requires an unblocked strike. Saving-throw-only and automatic damage cannot be Blocked. Current
    Poisoned and Blinded conditions apply; the printed source save DCs remain fixed.
  - The source weapon and Bastion effects belong to the level-18 Earthwarden features; they are not automatically
    innate traits of a material dragon. Current rest durations apply whenever a source feature refers to a short
    or long rest.
  - The source Bastion gives a radius without a light category; bright light supplies a defined illumination effect.
    Extra AC is not additional Block.
- name: Samarkium Ore
  group: Tarta Homebrewery - Materials
  description: A rare material with distinct Geochemical Golem, infused-weapon and Geomorphic Bastion applications.
    Its Geochemical Golem component costs 250 gp.
  sections:
  - heading: Golem infusion
    body: At the start of the golem's turn, each other creature within 5 feet takes 1d6 poison damage. This automatic
      cloud affects allies as well as enemies, permits no save, does not itself apply Poisoned, and cannot be Blocked.
  - heading: Weapon infusion
    body: After an unblocked strike with the infused weapon, the struck creature makes a DC 16 Constitution save.
      On failure, it takes an additional 1d6 poison damage and becomes Poisoned until the end of its next turn.
      On success, neither rider applies. The save does not allow a Block against the poison after an unblocked strike.
  - heading: Bastion aura
    body: A creature that starts its turn within 20 feet of the Bastion makes a DC 16 Constitution save. On failure,
      it takes 1d6 poison damage and is Poisoned until the end of that turn; on success, neither effect applies.
      Allies and enemies are affected. This saving-throw-only effect cannot be Blocked.
  source_golem_option:
    selectable: true
    cost_gp: 250
    effect: At the start of the golem's turn, each other creature within 5 feet takes 1d6 poison damage. This automatic
      cloud affects allies as well as enemies, permits no save, does not itself apply Poisoned, and cannot be Blocked.
  source_ref: draft2.pdf / PDF pages 28 and 62
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    golem_infusion:
      cost_gp: 250
      effect: Emits a noxious cloud, dealing 1d6 poison Damage to creatures in 5 feet radius.
    weapon_infusion: Struck creatures make a DC 16 Constitution saving throw or take an additional 1d6 poison damage
      and are poisoned until the end of their next turn.
    bastion_aura: Creatures within 20 feet make a DC 16 Constitution saving throw at the start of their turn or
      take 1d6 poison damage and are poisoned for the turn.
  conversion_notes:
  - This profile has three separate applications. Owning the material does not grant all three effects. A configured
    golem uses its Golem infusion; weapon and Bastion applications require their existing feature or GM permission.
  - A weapon rider requires an unblocked strike. Saving-throw-only and automatic damage cannot be Blocked. Current
    Poisoned and Blinded conditions apply; the printed source save DCs remain fixed.
  - The source weapon and Bastion effects belong to the level-18 Earthwarden features; they are not automatically
    innate traits of a material dragon. Current rest durations apply whenever a source feature refers to a short
    or long rest.
  - The source golem cloud omitted its trigger and save. Resolve it automatically at the start of the golem's turn,
    without adding a Poisoned rider that the golem source does not grant. The Bastion phrase for the turn means
    until the end of the affected creature's current turn.
