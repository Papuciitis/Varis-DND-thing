  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    golem_infusion:
      cost_gp: 400
      effect: Enhances the golem's physical strength, adding +2 to its melee attack and damage rolls.
    weapon_infusion: Weapon deals an additional 1d6 bludgeoning damage.
    bastion_aura: Allies within 20 feet gain a +1 bonus to attack and damage rolls.
  conversion_notes:
  - This profile has three separate applications. Owning the material does not grant all three effects. A configured
    golem uses its Golem infusion; weapon and Bastion applications require their existing feature or GM permission.
  - A weapon rider requires an unblocked strike. Saving-throw-only and automatic damage cannot be Blocked. Current
    Poisoned and Blinded conditions apply; the printed source save DCs remain fixed.
  - The source weapon and Bastion effects belong to the level-18 Earthwarden features; they are not automatically
    innate traits of a material dragon. Current rest durations apply whenever a source feature refers to a short
    or long rest.
  - The source golem's strength wording grants the printed +2 melee attack/damage bonus, not an additional increase
    to its Strength score. The ordinary +7 Slam becomes +9, so its ordinary Block DC becomes 17.
- name: Dyspraxium Salt
  group: Tarta Homebrewery - Materials
  description: A rare material with distinct Geochemical Golem, infused-weapon and Geomorphic Bastion applications.
    Its Geochemical Golem component costs 350 gp.
  sections:
  - heading: Golem infusion
    body: As a bonus action once on its turn, the golem becomes incorporeal until the end of that turn. During its
      movement, it may pass through creatures and objects as difficult terrain. It must finish in an unoccupied
      space outside solid matter. If it ends inside solid matter, it takes 5 force damage that cannot be Blocked
      and moves to the nearest unoccupied space outside that matter. This does not otherwise grant damage resistance
      or immunity.
  - heading: Weapon infusion
    body: Once on your turn while wielding the infused weapon, you may move up to 10 feet through creatures and
      objects as difficult terrain. This uses your movement and is not a teleport. You must finish in an unoccupied
      space outside solid matter; if you do not, take 5 force damage that cannot be Blocked and move to the nearest
      unoccupied space outside that matter. No other resistance or immunity is granted.
  - heading: Bastion aura
    body: Once on its turn, an ally of the Bastion's creator that is within 20 feet of the Bastion may move up to
      10 feet through creatures and objects as difficult terrain, using its movement. The creator counts as its
      own ally. It must finish in an unoccupied space outside solid matter; otherwise it takes 5 force damage that
      cannot be Blocked and moves to the nearest unoccupied space outside that matter. This grants no other resistance
      or immunity.
  source_golem_option:
    selectable: true
    cost_gp: 350
    effect: As a bonus action once on its turn, the golem becomes incorporeal until the end of that turn. During
      its movement, it may pass through creatures and objects as difficult terrain. It must finish in an unoccupied
      space outside solid matter. If it ends inside solid matter, it takes 5 force damage that cannot be Blocked
      and moves to the nearest unoccupied space outside that matter. This does not otherwise grant damage resistance
      or immunity.
  source_ref: draft2.pdf / PDF pages 28 and 62
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    golem_infusion:
      cost_gp: 350
      effect: Grants the golem the ability to temporarily become incorporeal, allowing it to move through other
        creatures and objects as if they were difficult terrain.
    weapon_infusion: Once per turn, become incorporeal, moving through objects and creatures as difficult terrain
      for 10 feet.
    bastion_aura: Allies within 20 feet can move through objects and creatures as difficult terrain for up to 10
      feet once per turn.
  conversion_notes:
  - This profile has three separate applications. Owning the material does not grant all three effects. A configured
    golem uses its Golem infusion; weapon and Bastion applications require their existing feature or GM permission.
  - A weapon rider requires an unblocked strike. Saving-throw-only and automatic damage cannot be Blocked. Current
    Poisoned and Blinded conditions apply; the printed source save DCs remain fixed.
  - The source weapon and Bastion effects belong to the level-18 Earthwarden features; they are not automatically
    innate traits of a material dragon. Current rest durations apply whenever a source feature refers to a short
    or long rest.
  - The source golem omitted activation and duration; use a bonus action until the end of its own turn. All three
    contexts require an unoccupied exit; the 5 force damage and nearest-space displacement complete an otherwise
    undefined end-inside-matter outcome. No general incorporeal damage defenses are inferred.
- name: Terbithal Resin
  group: Tarta Homebrewery - Materials
  description: A rare material with distinct Geochemical Golem, infused-weapon and Geomorphic Bastion applications.
    Its Geochemical Golem component costs 300 gp.
  sections:
  - heading: Golem infusion
    body: After an unblocked Geochemical Blast strike, its target makes a DC 14 Constitution save. On failure, the
      target is Blinded until the end of its next turn; on success, it is not Blinded. The Blast's ordinary damage
      is unchanged. A successful Block against the Blast prevents both its damage and this rider.
  - heading: Weapon infusion
    body: After an unblocked strike with the infused weapon, the struck creature makes a DC 16 Constitution save.
      On failure, it is Blinded until the end of its next turn; on success, it is not Blinded.
  - heading: Bastion aura
    body: An enemy that starts its turn within 20 feet of the Bastion makes a DC 16 Constitution save. On failure,
      it is Blinded until the end of that turn; on success, it is not Blinded. This saving-throw-only effect cannot
      be Blocked.
  source_golem_option:
    selectable: true
    cost_gp: 300
    effect: After an unblocked Geochemical Blast strike, its target makes a DC 14 Constitution save. On failure,
      the target is Blinded until the end of its next turn; on success, it is not Blinded. The Blast's ordinary
      damage is unchanged. A successful Block against the Blast prevents both its damage and this rider.
  source_ref: draft2.pdf / PDF pages 28 and 62
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    golem_infusion:
      cost_gp: 300
      effect: Enhances the golem's Geochemical Blast, adding a blinding effect on a failed Constitution saving throw.
    weapon_infusion: Struck creatures make a DC 16 Constitution saving throw or are blinded until the end of their
      next turn.
    bastion_aura: Enemies within 20 feet make a DC 16 Constitution saving throw at the start of their turn or are
      blinded for the turn.
  conversion_notes:
  - This profile has three separate applications. Owning the material does not grant all three effects. A configured
    golem uses its Golem infusion; weapon and Bastion applications require their existing feature or GM permission.
  - A weapon rider requires an unblocked strike. Saving-throw-only and automatic damage cannot be Blocked. Current
    Poisoned and Blinded conditions apply; the printed source save DCs remain fixed.
  - The source weapon and Bastion effects belong to the level-18 Earthwarden features; they are not automatically
    innate traits of a material dragon. Current rest durations apply whenever a source feature refers to a short
    or long rest.
  - The source golem omitted its Constitution save DC and blindness duration. Use DC 14 and the end of the target's
    next turn, matching the source weapon rider's timing. A hit-dependent blinding rider requires an unblocked strike
    under the current rules.
- name: Geochemical Golem infusion options
  group: Tarta Homebrewery - Materials
  description: Optional material configurations for one standalone Geochemical Golem. Each selected material modifies
    that creature; it does not create another creature or grant a spell.
  sections:
  - heading: Choose the infusion context
    body: A golem uses only the Golem infusion section of each selected material. Geomorphic Infusion and Geomorphic
      Bastion are separate level-18 Earthwarden features with their own Weapon infusion and Bastion aura sections.
      Their effects are not automatically added to the golem or to a material dragon.
  - heading: Materials and total cost
    body: 'For a material-configured variant, choose one to four different materials. Add their listed gp costs. The optional construction budget is the greater
      of 1,000 gp or that sum, plus 400 gp if a third material is selected, plus another 2,000 gp if a fourth material
      is selected. These source prices are configuration benchmarks; they do not grant a creation or casting ability. Two materials add no combination
      surcharge. Each chosen material must be present at its full listed value; repeating a material does not stack
      its effect. Example: Neodrakite (300 gp) and Lanthara Crystal (400 gp) cost 1,000 gp total; adding Erbion
      Essence (450 gp) raises the total to 1,550 gp; adding Holmara Rock (400 gp) raises it to 3,950 gp.'
  - heading: Duration and changes
    body: The chosen infusions last for this golem's lifetime and end when it is destroyed or otherwise removed.
      Choose them when configuring the creature. Later changes require the GM's agreement or an existing rule;
      selecting a material does not grant a way to create, dismiss or rebuild a golem. If an existing effect creates
      the creature, use that effect's duration and costs. Material prices are optional configuration benchmarks,
      not general market prices for equipment.
  - heading: Rules shared by infusion effects
    body: The ordinary Geochemical Golem's infusion save DC is 14. The Earthwarden weapon and Bastion save DC is
      16 where printed. Attacks and their attached damage or condition riders require an unblocked strike. Automatic
      aura damage and saving-throw-only effects cannot be Blocked. A source that says allies or enemies uses that
      restriction; otherwise damaging auras affect allies as well as enemies, excluding the originating golem or
      weapon wielder itself. Identical named bonuses or terrain effects do not stack.
  - heading: Earthwarden weapon and Bastion use
    body: A character with the Earthwarden level-18 Geomorphic Infusion feature can infuse one weapon with one chosen
      material during a short or long rest. That infusion lasts until this feature changes it or the character ceases
      to possess it. Geomorphic Bastion is an action creating an inanimate stone structure 10 feet in diameter and
      up to 30 feet tall. It lasts 10 minutes or until the creator dismisses it as a bonus action. Its aura is the
      Bastion aura of the material infused into the creator's weapon when it is formed. After forming a Bastion,
      finish a long rest before using that feature again. Current short- and long-rest durations apply. The Bastion
      is an object, not a summoned creature.
  source_ref: draft2.pdf / PDF pages 28, 61 and 62
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    elemental_infusion: You can customize the golem's abilities based on the situation and your preference. You
      need to have atleast full worth of one element, to gain the effect. You can combine and mix the elements,
      if you want to.
    basic_combination: You can combine up to two different elements for the base casting cost of the spell. The
      total cost would be the sum of the individual elements chosen.
    advanced_combination: For additional element beyond two, you can add a third element for an additional 400 gp,
      the forth element for an additional 2000 gp.
    spell_materials: A mixture of rare earth elements worth at least 1,000 gp, which the spell consumes.
    geomorphic_bastion: As an action, you can command the earth to form a towering bastion of stone. This structure
      stands 10 feet in diameter and reaches up to 30 feet in height, serving as a vantage point or protective barrier.
      The bastion remains for 10 minutes or until you dismiss it as a bonus action. If your weapon is infused with
      a rare-earth material, the bastion emanates an aura reflecting that material's properties. After manifesting
      the bastion, you must complete a long rest before using this feature again.
  conversion_notes:
  - Resolve the source's summed component prices versus its 1,000 gp spell-material minimum using max(1,000, sum
    of selected costs), then add the printed combination surcharges. This avoids charging the minimum twice and
    never permits a mixture below the spell's printed minimum.
  - Choose at least one and at most four distinct materials. The source supplies surcharge rules only through the
    fourth material; no larger combination is inferred.
  - Duration, no duplicate stacking and no changing the selection on an existing golem are explicit completions
    of omitted source limits.
  - The source weapon infusion has no end condition. Treat it as one chosen material on one weapon until replaced
    by the feature or lost. Golem-only component prices are not imposed on the class feature because its source
    specifies no cost.
  - No creature statblock is assigned to the Bastion. Its geometric shape and duration are retained; resolving object
    damage uses the table's ordinary object rules.
  - Material prices are optional construction/configuration benchmarks, not a new casting cost or spell access requirement.
    The source weapon and Bastion contexts are reference adaptations and do not grant a class feature.
- name: Moissanite
  group: Tarta Homebrewery - Materials
  description: Moissanite supplies the reflective theme of the paladin's Earth's Embrace feature. It is not one
    of the twelve Geochemical Golem infusion choices and has no component price in this source.
  sections:
  - heading: Earth's Embrace
    body: A paladin with this level-15 source feature can use a reaction when the paladin or another creature within
      30 feet would take damage. The protected creature gains resistance to all damage against that triggering damage
      and until the start of the paladin's next turn. After applying all reductions, resistance and other prevention,
      an attacker responsible for the triggering damage takes damage of the same type equal to half the damage actually
      dealt to the protected creature, rounded down. Damage from an environmental source without an attacker is
      not reflected. This automatic reflected damage cannot be Blocked or reflected again by Earth's Embrace. The
      feature has three uses, all restored after a short or long rest; use current rest durations.
  - heading: Material context
    body: This record documents the source class feature. Carrying a moissanite gem does not grant the reaction,
      and this entry does not add a thirteenth Geochemical Golem material option. No general purchase price or dragon
      trait is supplied.
  source_ref: draft2.pdf / PDF page 32
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    earths_embrace: At 15th level, your bond with the earth's gemstones allows you to harness the reflective properties
      of moissanite to shield your allies. When you or a creature within 30 feet of you takes damage, you can use
      your reaction to envelop the target in a shimmering shield of refractive energy. The protected creature gains
      resistance to all damage until the start of your next turn. Additionally, the attacker takes damage equal
      to half the damage dealt to the protected creature. You can use this ability 3 times per short or long rest.
  conversion_notes:
  - Resolve the reaction before the triggering damage so the new resistance protects against that damage as well
    as subsequent damage before the next turn.
  - Reflected damage equals half the actual damage suffered after prevention, rounded down, and has the triggering
    damage's type. No reflection occurs after a successful Block that prevents all triggering damage.
  - The source omitted reflection type, rounding and loops. Retain the triggering type, round down, and forbid this
    feature from reflecting its own reflection again.
