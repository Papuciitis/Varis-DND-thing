- name: Erbion Essence
  group: Tarta Homebrewery - Materials
  description: A rare material with distinct Geochemical Golem, infused-weapon and Geomorphic Bastion applications.
    Its Geochemical Golem component costs 450 gp.
  sections:
  - heading: Golem infusion
    body: As an action once on its turn, the golem touches itself or an ally and restores 1d8 HP to that creature,
      up to its maximum HP. It cannot use this action more than once during the same turn.
  - heading: Weapon infusion
    body: As a bonus action once on your turn while wielding the infused weapon, touch a creature and restore 1d8
      HP to it, up to its maximum HP.
  - heading: Bastion aura
    body: An ally of the Bastion's creator that starts its turn within 20 feet of the Bastion regains 1d8 HP, up
      to its maximum HP. The creator counts as an ally of itself for this effect. A creature benefits from this
      Bastion's healing only once per turn.
  source_golem_option:
    selectable: true
    cost_gp: 450
    effect: As an action once on its turn, the golem touches itself or an ally and restores 1d8 HP to that creature,
      up to its maximum HP. It cannot use this action more than once during the same turn.
  source_ref: draft2.pdf / PDF pages 28 and 62
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    golem_infusion:
      cost_gp: 450
      effect: Enhances the golem's healing capabilities, allowing it to heal itself or an ally within touch range
        for 1d8 hit points once per turn.
    weapon_infusion: Once per turn, as a bonus action, touch to heal a creature for 1d8 hit points.
    bastion_aura: Allies within 20 feet heal 1d8 hit points at the start of their turn.
  conversion_notes:
  - This profile has three separate applications. Owning the material does not grant all three effects. A configured
    golem uses its Golem infusion; weapon and Bastion applications require their existing feature or GM permission.
  - A weapon rider requires an unblocked strike. Saving-throw-only and automatic damage cannot be Blocked. Current
    Poisoned and Blinded conditions apply; the printed source save DCs remain fixed.
  - The source weapon and Bastion effects belong to the level-18 Earthwarden features; they are not automatically
    innate traits of a material dragon. Current rest durations apply whenever a source feature refers to a short
    or long rest.
  - The source golem healing omitted an action cost. Use an action on its own turn, keeping the once-per-turn limit.
    Healing does not raise HP above the recipient's maximum.
- name: Thulmara Dust
  group: Tarta Homebrewery - Materials
  description: A rare material with distinct Geochemical Golem, infused-weapon and Geomorphic Bastion applications.
    Its Geochemical Golem component costs 200 gp.
  sections:
  - heading: Golem infusion
    body: At the start of the golem's turn, enemies within 10 feet have their movement speeds reduced by 10 feet,
      to a minimum of 0, until the start of the golem's next turn. This speed reduction does not stack with itself.
      It is not the old slow spell and does not grant a saving throw or a separate condition.
  - heading: Weapon infusion
    body: After an unblocked strike with the infused weapon, the struck creature makes a DC 16 Constitution save.
      On failure, its movement speeds are reduced by 10 feet, to a minimum of 0, until the end of its next turn.
      On success, the rider does not apply. Repeated applications do not stack.
  - heading: Bastion aura
    body: A creature that starts its turn within 20 feet of the Bastion makes a DC 16 Constitution save. On failure,
      its movement speeds are reduced by 10 feet, to a minimum of 0, until the end of that turn; on success, the
      rider does not apply. Allies and enemies are affected. Repeated applications do not stack.
  source_golem_option:
    selectable: true
    cost_gp: 200
    effect: At the start of the golem's turn, enemies within 10 feet have their movement speeds reduced by 10 feet,
      to a minimum of 0, until the start of the golem's next turn. This speed reduction does not stack with itself.
      It is not the old slow spell and does not grant a saving throw or a separate condition.
  source_ref: draft2.pdf / PDF pages 28 and 62
  source_attribution: The Tarta Guide - The Homebrewery, author nerak, draft2.pdf. User-provided Homebrewery export.
  source_original:
    golem_infusion:
      cost_gp: 200
      effect: Grants the golem the ability to emit a chilling aura, slowing enemies within 10 feet by 10 feet of
        movement until the start of the golem's next turn.
    weapon_infusion: Struck creatures make a DC 16 Constitution saving throw or have their speed reduced by 10 feet
      until the end of their next turn.
    bastion_aura: Creatures within 20 feet make a DC 16 Constitution saving throw at the start of their turn or
      have their speed reduced by 10 feet for the turn.
  conversion_notes:
  - This profile has three separate applications. Owning the material does not grant all three effects. A configured
    golem uses its Golem infusion; weapon and Bastion applications require their existing feature or GM permission.
  - A weapon rider requires an unblocked strike. Saving-throw-only and automatic damage cannot be Blocked. Current
    Poisoned and Blinded conditions apply; the printed source save DCs remain fixed.
  - The source weapon and Bastion effects belong to the level-18 Earthwarden features; they are not automatically
    innate traits of a material dragon. Current rest durations apply whenever a source feature refers to a short
    or long rest.
  - The source golem aura omitted its trigger; use the start of the golem's turn. The precise printed 10-foot reduction
    is retained rather than converting it to Hobbled, whose current effects are different.
- name: Holmara Rock
  group: Tarta Homebrewery - Materials
  description: A rare material with distinct Geochemical Golem, infused-weapon and Geomorphic Bastion applications.
    Its Geochemical Golem component costs 400 gp.
  sections:
  - heading: Golem infusion
    body: Add +2 to the golem's melee attack rolls and melee damage rolls. Its ordinary Slam becomes +9 to hit,
      Block DC 17, and 2d8 + 6 bludgeoning damage. This does not improve ranged attacks, saving-throw DCs, Armor
      Class or Block checks.
  - heading: Weapon infusion
    body: Each unblocked strike with the infused weapon deals an additional 1d6 bludgeoning damage. This is part
      of that blockable attack.
  - heading: Bastion aura
    body: Allies of the Bastion's creator within 20 feet gain +1 to attack rolls and attack damage rolls. The creator
      counts as its own ally. The bonus ends immediately on leaving the aura and does not stack with another instance
      of this same Bastion effect.
  source_golem_option:
