  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, you can target one additional
    creature for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 46
- name: Zephyr's Shield
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: Concentration, up to 1 minute
  components: V, S
  classes: Druid, Sorcerer, Wizard
  description: You summon a gust of wind that wraps around you or a creature you can see within range, giving a
    bonus to AC equal to your spellcasting ability modifier for the duration. The spell ends if you cast it again
    or if the creature is ever more than 60 feet away from you.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, the bonus to AC increases by
    1 for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 46
- name: Blossom Shield
  group: 2nd level
  level: 2
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: Concentration, up to 1 minute
  components: V, S, M (petals and thorns worth 15 gp)
  classes: Druid, Sorcerer, Wizard
  description: You create a shield of swirling petals and thorns around you. The shield provides you with a +2 bonus
    to AC and deals 1d6 piercing damage to any creature that hits you with a melee attack.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d6
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 47
- name: Boulder Burst
  group: 2nd level
  level: 2
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: Concentration, up to 1 minute
  components: V, S
  classes: Druid, Sorcerer, Wizard
  description: You choose a point you can see within range and cause the ground in a 20-foot-radius, 40-foot-high
    cylinder centered on that point to erupt in a geyser of stone and earth. Each creature in the area must make
    a Dexterity saving throw. A creature takes 3d8 bludgeoning damage on a failed save, or half as much damage on
    a successful one.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d8
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 47
- name: Crystalize
  group: 2nd level
  level: 2
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: Instantaneous
  components: V, S
  classes: Sorcerer, Wizard
  description: You target a creature you can see within range, and its skin hardens to crystal. The target must
    make a Constitution saving throw. On a failed save, it takes 2d8 piercing damage and has its speed halved until
    the start of your next turn.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d8
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 47
- name: Desert's Wrath
  group: 2nd level
  level: 2
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: Concentration, up to 1 minute
  components: V, S
  classes: Druid, Sorcerer, Wizard
  description: You call forth a violent sandstorm in a 20-foot-radius, 40-foot-high cylinder centered on a point
    you can see within range. Each creature in the area must make a Constitution saving throw. A creature takes
    3d8 slashing damage on a failed save, or half as much damage on a successful one.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d8
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 47
- name: Earth's Grasp
  group: 2nd level
  level: 2
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: Concentration, up to 1 minute
  components: V, S, M (fistful of dirt)
  classes: Druid, Sorcerer, Wizard
  description: You cause the ground in a 10-foot square within range to sprout grasping hands made of earth. Each
    creature in the area must make a Strength saving throw or be restrained for the duration. A creature restrained
    by the hands can use its action to make a Strength check against your spell save DC. On a success, it frees
    itself.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the size of the square increases
    by 10 feet for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 47
- name: Flora's Wisdom
  group: 2nd level
  level: 2
  school: Geomorphy
  casting: 1 action
  range: Touch
  duration: 1 hour
  components: V, S, M (petals worth 5 gp)
  classes: Druid, Sorcerer, Wizard
  description: You touch a willing creature and imbue them with the wisdom of the flora, giving them advantage on
    Wisdom checks and saving throws for the duration.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, you can target one additional
    creature for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 47
