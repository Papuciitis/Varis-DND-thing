section: geomancy-review
entries:
- name: Breeze Whisper
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: 120 feet
  duration: Instantaneous
  components: V, S
  classes: Bard, Druid, Sorcerer, Wizard
  description: You whisper a message of twenty-five words or less to the wind, which carries it to a creature with
    which you are familiar. The creature hears the message in its mind and can reply in a like manner immediately.
    The spell doesn’t have to follow a straight line and can travel freely around corners or through openings.
  source_ref: draft2.pdf / PDF page 41
- name: Gemstone's Glee
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: 1 hour
  components: V, S
  classes: Bard, Druid, Sorcerer, Wizard
  description: You touch a gemstone and it begins to glow brightly, shedding bright light in a 20-foot radius and
    dim light for an additional 20 feet. The light can be any color you choose.
  source_ref: draft2.pdf / PDF page 41
- name: Geomorpher's Compass
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: Instantaneous
  components: V, S
  classes: Artificer, Druid, Ranger, Sorcerer, Wizard
  description: You touch the ground and commune with the earth, seeking guidance towards a known or clearly visualized
    destination. The earth subtly shifts beneath your feet, providing you with an intuitive sense of the direction
    you need to travel. This spell does not account for obstacles or dangers along the path, it merely provides
    the most direct route towards your destination.
  source_ref: draft2.pdf / PDF page 41
  source_notes: This full spell appears on page 41 but is absent from the page-40 spell list. The list includes
    Earth’s Guidance instead; no equivalence is asserted.
- name: Lithoresonance
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: Touch
  duration: 1 hour
  components: V, S
  classes: Bard, Druid, Sorcerer, Wizard
  description: 'You touch a stone object, and depending on its size, it begins to emit a unique sound or vibration.
    The effect varies based on the size of the stone:


    Grain’s Whisper: A grain of sand emits a faint vibration, detectable only by you. It can alert you to the presence
    of nearby creatures that you can’t see.


    Pebble’s Pulse: A pebble emits a rhythmic pulse felt by creatures within 30 feet, providing them with a sense
    of direction or alerting them to danger.


    Stone’s Hum: A stone emits a low hum that can be heard up to 60 feet away. This sound can distract enemies or
    communicate with allies.


    Crystal’s Chorus: A crystal resonates, emitting a sound that can be heard up to 100 feet away. This sound can
    distract enemies or communicate with allies.


    Boulder’s Ballad: A boulder emits a deep, resonating sound that can be heard up to 300 feet away. This sound
    can intimidate enemies or signal allies.


    Erratic’s Echo: An erratic (a large rock or boulder) emits a powerful echo that can be heard up to 600 feet
    away. This echo can serve as a warning signal or a call to arms.'
  source_ref: draft2.pdf / PDF page 41
- name: Magma's Ire
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: 30 feet
  duration: Instantaneous
  components: V, S
  classes: Druid, Ranger, Sorcerer, Wizard
  description: You create a small shard of molten rock in your hand and hurl it at a creature you can see within
    range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 fire damage and its speed
    is reduced by 10 feet until the start of your next turn. This spell’s damage increases by 1d8 when you reach
    5th level (2d8), 11th level (3d8), and 17th level (4d8).
  source_ref: draft2.pdf / PDF page 41
- name: Mud Mire
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: Until the start of your next turn
  components: V, S
  classes: Druid, Ranger, Sorcerer, Wizard
  description: You choose a point within range and cause the ground in a 5-foot square centered on that point to
    become muddy and difficult to traverse. The area becomes difficult terrain until the start of your next turn.
  source_ref: draft2.pdf / PDF page 42
- name: Pebble Pelt
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: 90 feet
  duration: Instantaneous
  components: V, S
  classes: Artificer, Druid, Sorcerer, Wizard
  description: You summon and fling small rocks at a creature or object within range. Make a ranged spell attack
    against the target. On a hit, the target takes 1d6 bludgeoning damage. The spell’s damage increases by 1d6 when
    you reach 5th level (2d6), 11th level (3d6), and 17th level (4d6).
  source_ref: draft2.pdf / PDF page 42
- name: Sand Veil
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: 1 hour
  components: V, S
  classes: Druid, Sorcerer, Wizard
  description: You blend into the desert environment, gaining advantage on Stealth checks while you remain motionless.
  source_ref: draft2.pdf / PDF page 42
- name: Stone Whisper
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: Instantaneous
  components: V, S
  classes: Druid, Sorcerer, Wizard
  description: You touch a natural stone and receive a brief impression of a significant event that occurred around
    it within the past day.
  source_ref: draft2.pdf / PDF page 42
- name: Stone's Serenade
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: 1 hour
  components: V, S
  classes: Bard, Druid, Sorcerer, Wizard
  description: You touch a stone and it begins to hum a soft, soothing melody. This melody can be heard up to 60
    feet away and can calm beasts or provide comfort to allies.
  source_ref: draft2.pdf / PDF page 42
- name: Wind Slash
  group: Cantrips
  level: 0
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: Instantaneous
  components: V, S
  classes: Druid, Sorcerer, Wizard
  description: You create a blade of wind and hurl it at a creature that you can see within range. Make a ranged
    spell attack against the target. On a hit, the target takes 1d8 slashing damage. This spell’s damage increases
    by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).
  source_ref: draft2.pdf / PDF page 42
- name: Blossom Burst
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: Instantaneous
  components: V, S, M (petals and thorns worth 1 gp)
  classes: Bard, Cleric, Druid, Ranger, Sorcerer, Warlock
  description: You cause a small explosion of petals and thorns. Each creature in a 10-foot-radius sphere centered
    on a point you choose within range must make a Dexterity saving throw. A creature takes 2d8 piercing damage
    on a failed save, or half as much damage on a successful one.
  higher_levels: When you cast this spell using a spell slot 2nd level or higher, the damage increases by 1d8 for
    each slot level above 1st.
  source_ref: draft2.pdf / PDF page 43
  source_notes: The source prints range Self while the description selects a point within range; this review entry
    preserves that wording.
- name: Boulder Pugilist
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: Concentration, up to 1 minute
  components: V, S, M (a fist-size rock)
  classes: Bard, Druid, Sorcerer, Wizard
  description: Your fists become as hard as stone, making your unarmed strikes deal 1d6 bludgeoning damage on a
    hit.
  higher_levels: When you cast this spell using a spell slot 2nd level or higher, the damage increases by 1d8 for
    each slot level above 1st.
  source_ref: draft2.pdf / PDF page 43
- name: Crystal Cascade
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: Instantaneous
  components: V, S
  classes: Sorcerer, Wizard
  description: You conjure a cascade of sharp crystals that rain down on a location you specify. Each creature in
    a 10-foot-radius, 40-foot-high cylinder centered on a point within range must make a Dexterity saving throw.
    A creature takes 2d8 piercing damage on a failed save, or half as much damage on a successful one.
  higher_levels: When you cast this spell using a spell slot 2nd level or higher, the damage increases by 1d8 for
    each slot level above 1st.
  source_ref: draft2.pdf / PDF page 43
- name: Desert Mirage
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: 1 hour
  components: V, S
  classes: Bard, Druid, Sorcerer, Wizard
  description: You create a 5-foot-radius sphere illusion of a desert oasis, potentially luring creatures towards
    it. Any creature that examines the illusion can determine that it is false with a successful Intelligence (Investigation)
    check against your spell save DC.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, the size of the illusion increases
    by 10 feet for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 43
- name: Drumbeat of the Ancients
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: Instantaneous
  components: V, S, M (a small drumstick made of bone)
  classes: Bard, Druid, Sorcerer, Wizard
  description: You beat a stone with a drumstick and cause it to resonate with a deep, sonorous tone. Each creature
    within a 15-foot radius must make a Wisdom saving throw or be stunned until the end of its next turn as the
    resonating sound overwhelms its senses.
  higher_levels: When you cast this spell using a spell slot 2nd level or higher, the radius increases by 5ft for
    each slot level above 1st.
  source_ref: draft2.pdf / PDF page 43
- name: Earth's Embrace
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: 30 feet
  duration: Concentration, up to 1 minute
  components: V, S
  classes: Bard, Druid, Sorcerer, Wizard
  description: You cause the ground in a 10-foot square within range to become difficult terrain.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, the size of the square increases
    by 10 feet for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 43
- name: Flora's Blessing
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Touch
  duration: 1 hour
  components: V, S, M (any plants worth 1 gp)
  classes: Druid, Ranger, Cleric
  description: You touch a willing creature and imbue them with the blessing of the flora, giving them advantage
    on Wisdom checks for the duration.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, you can target one additional
    creature for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 44
- name: Gemstone Keenness
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Touch
  duration: Concentration, up to 1 minute
  components: V, S, M (a small piece of sharp gemstone)
  classes: Paladin, Ranger, Druid
  description: You touch a weapon and it becomes as sharp as a gemstone. For the duration, the weapon gets a bonus
    to attack rolls and damage rolls equal to your spellcasting ability modifier. The spell ends if you cast it
    again or if you let go of the weapon.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, the bonus to attack rolls and
    damage rolls increases by 1 for each two slot levels above the 1st.
  source_ref: draft2.pdf / PDF page 44
- name: Geomantic Guidance
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 minute (Ritual)
  range: Self
  duration: 8 hours
  components: V, S, M (a small piece of iron)
  classes: Cleric, Druid, Wizard
  description: This spell allows you to attune your senses to the geomantic forces of the earth. For the duration,
    you can accurately recall any path you have traveled.
  higher_levels: 'When you cast this spell using a spell slot of 2nd level, the duration is 12 hours.

    When you cast this spell using a 3rd-level spell slot, the duration is 1 day.

    When you cast this spell using a 4th-level spell slot, the duration is 3 days.

    When you cast this spell using a 5th-level spell slot, the duration is 7 days.

    When you cast this spell using a 6th-level spell slot, the duration is 10 days.

    When you cast this spell using a 7th-level spell slot, the duration is 30 days.

    When you cast this spell using an 8th-level spell slot, the duration is 6 months.

    When you cast this spell using a 9th-level spell slot, the duration is a year and a day.'
  source_ref: draft2.pdf / PDF page 44
- name: Geomantic Pulse
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 10 minutes (Ritual)
  range: Self
  duration: Instantaneous
  components: V, S, M (a small piece of a map)
  classes: Cleric, Druid, Ranger, Wizard
  description: You sense the natural energy of the land, learning about the geographical features within a radius
    of up to 1 mile.
  higher_levels: 'When you cast this spell using a spell slot of 2nd level, the radius is 2 miles.

    When you cast this spell using a 3rd-level spell slot, the radius is 5 miles.

    When you cast this spell using a 4th-level spell slot, the radius is 25 miles.

    When you cast this spell using a 5th-level spell slot, the radius is 125 miles.

    When you cast this spell using a 6th-level spell slot, the radius is 500 miles.

    When you cast this spell using a 7th-level spell slot, the radius is 1000 miles.

    When you cast this spell using an 8th-level spell slot, the radius is 5000 miles.

    When you use a 9th-level spell slot, the radius is 10000 miles and 1 meter.'
  source_ref: draft2.pdf / PDF page 44
- name: Granite Gaze
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Touch
  duration: Concentration, up to 10 minutes
  components: V, S
  classes: Druid, Sorcerer, Wizard
  description: You touch a stone surface up to 2 feet thick and can see through it as if it were transparent.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, the duration increases by 10
    minutes for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 45
- name: Lanthanide Luminescence
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Touch
  duration: 1 hour
  components: V, S, M (a nonmagical light source made from charcoal)
  classes: Artificer, Wizard
  description: You touch a nonmagical light source made from charcoal, causing it to emit a bright, multicolored
    light. The light illuminates a 30-foot radius with bright light and an additional 30 feet with dim light. You
    can choose the color of the light when you cast the spell. The light can be one color or can gradually shift
    through a spectrum of colors at your discretion.
  higher_levels: When you cast this spell using a spell slot 2nd level or higher, the duration increases by 1 hour
    for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 45
- name: Leaf Armor
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: 5 feet
  duration: 1 hour
  components: V, S, M (oak leaf)
  classes: Druid, Ranger, Cleric
  description: You touch a willing creature and their skin toughens like bark, granting them a +1 bonus to AC for
    the duration.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, you can target one additional
    creature for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 45
- name: Monolith's Mercy
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 bonus action
  range: 10 feet
  duration: Instantaneous
  components: V, S
  classes: Druid, Paladin
  description: You call upon the strength of the earth, granting you and your allies within 10 feet temporary hit
    points equal to your spellcasting ability modifier. These temporary hit points last until the start of your
    next turn.
  higher_levels: When you cast this spell using a spell slot 2nd level or higher, the temporary hit points double
    for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 45
- name: Petrified Pirrouette
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 bonus action
  range: Self
  duration: Until the start of your next turn
  components: V, S
  classes: Bard, Druid, Sorcerer, Wizard
  description: You perform a quick dance that causes the ground around you to ripple and shake, distracting your
    enemies within 10 feet and giving them disadvantage on their next attack roll against you.
  higher_levels: When you cast this spell using a spell slot 2nd level or higher, the distance increases by 5ft
    for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 45
  listed_as: Petrified Pirouette
- name: Sandstorm Scourge
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: 60 feet
  duration: Concentration, up to 1 minute
  components: V, S
  classes: Druid, Sorcerer, Wizard
  description: You call forth a violent sandstorm in a 10-foot-radius, 20-foot-high cylinder centered on a point
    you can see within range. Each creature in the area must make a Constitution saving throw. A creature takes
    2d8 slashing damage on a failed save, or half as much damage on a successful one.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d8
    for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 45
- name: Sand's Shift
  group: 1st level
  level: 1
  school: Geomorphy
  casting: Reaction, which you take when you are hit by an attack
  range: Self
  duration: Instantaneous
  components: V, S
  classes: Druid, Sorcerer, Wizard
  description: You transform into sand to avoid an attack. The attack misses you, and you teleport up to 10 feet
    to an unoccupied space you can see.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, the teleportation distance
    increases by 10 feet for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 46
- name: Stone's Resilience
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: 1 hour
  components: V, S, M (stone dust worth 5 GP)
  classes: Druid, Sorcerer, Wizard
  description: You touch a willing creature and imbue them with the resilience of stone, giving them temporary hit
    points equal to your spellcasting ability modifier + your level (minimum of 1) for the duration.
  higher_levels: When you cast this spell using a spell slot of 2nd level or higher, the temporary hit points increase
    by 5 for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 46
  source_notes: The source prints range Self while its description touches a willing creature; both are preserved.
- name: Stoneform Surge
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Self
  duration: 1 hour
  components: V, S
  classes: Druid, Ranger, Sorcerer, Wizard
  description: Your skin hardens like stone, granting you temporary hit points equal to your spellcasting ability
    modifier.
  higher_levels: When you cast this spell using a spell slot 2nd level or higher, temporary hit points equal your
    spell level times spellcasting modifier for each slot level above 1st.
  source_ref: draft2.pdf / PDF page 46
  source_notes: The higher-level temporary-HP wording is preserved without inventing a clarified formula.
- name: Wind's Guidance
  group: 1st level
  level: 1
  school: Geomorphy
  casting: 1 action
  range: Touch
  duration: 1 hour
  components: V, S
  classes: Druid, Ranger, Sorcerer, Wizard
  description: You touch a willing creature and imbue them with the guidance of the wind, giving them advantage
