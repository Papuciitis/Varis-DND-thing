section: geomancy-review
entries:
- name: Frightful Monolith
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 reaction
  range: 60 feet
  components: V, S
  duration: 1 round
  classes:
  - Cleric
  - Druid
  - Sorcerer
  - Warlock
  - Wizard
  description: You quickly turn your face into frightful stone statue and instill a deep fear in a creature that
    attacks you, causing it to have disadvantage on attack rolls against you until the end of its next turn.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, you can increase the range
    by 10 feet for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 48
- name: Gemstone's Grace
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 bonus action
  range: 30 feet
  components: V, S, M (a gemstone worth at least 50 gp, which the spell consumes)
  duration: Instantaneous
  classes:
  - Bard
  - Cleric
  - Druid
  - Paladin
  - Ranger
  description: Drawing from the healing properties of certain stones and gems, you touch a gemstone and channel
    its energy into a creature you can see within range. The creature regains hit points equal to 2d8 + your spellcasting
    ability modifier.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the healing increases by 1d8
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 48
- name: Geode's Gentle Grasp
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: 30 feet
  components: V, S, M (a handful of dirt)
  duration: Concentration, up to 1 minute
  classes:
  - Druid
  - Paladin
  - Wizard
  description: You cause the ground beneath a creature you can see within range to rise up and form a protective
    barrier around it. The creature gains half cover, which provides a +2 bonus to AC and Dexterity saving throws.
    The barrier lasts for the duration or until it is destroyed. The barrier has AC 12 and 15 hit points.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the barrier’s hit points increase
    by 5 for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 48
- name: Geomorph's Vision
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 10 minutes (Ritual)
  range: Touch
  components: V, S, M (a small piece of the geographical feature)
  duration: Instantaneous
  classes:
  - Cleric
  - Druid
  - Ranger
  - Wizard
  description: You gain the ability to read the history of a specific geographical feature, such as a mountain,
    river, or forest.
  source_ref: draft2.pdf / PDF page 48
- name: Lithoecho Resonance
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S
  duration: 10 minutes
  classes:
  - Druid
  - Ranger
  - Wizard
  description: You touch a stone and imbue it with an echo of your voice. When a creature touches the stone, it
    hears whatever message you spoke into it.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the duration increase by 30
    minutes for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 48
- name: Lithospheric Leap
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S
  duration: Concentration, up to 1 minute
  classes:
  - Artificer
  - Bard
  - Cleric
  - Druid
  - Paladin
  - Ranger
  - Sorcerer
  - Warlock
  - Wizard
  description: You touch the ground and cause a pillar of stone to rapidly form beneath you or a creature you can
    see within range, launching the target up to 20 feet into the air. The target takes no damage from falling and
    lands on its feet.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the range increases by 20 feet
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 48
  source_notes: 'The source prints Range: Touch while referring to a creature within range and increasing that range
    at higher levels.'
- name: Microlith Breath
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: Self (15-foot cone)
  components: V, S
  duration: Instantaneous
  classes:
  - Druid
  - Ranger
  - Sorcerer
  - Wizard
  description: You exhale a 15-foot cone of small, sharp rocks. Each creature in the area must make a Dexterity
    saving throw, taking 3d6 piercing damage on a failed save, or half as much damage on a successful one.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d6
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 49
- name: Petrified Smite
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 bonus action
  range: Self
  components: V
  duration: Concentration, up to 1 minute
  classes:
  - Paladin
  description: The next time you hit a creature with a melee weapon attack during this spell’s duration, your weapon
    flares with earthen energy, and the attack deals an extra 1d8 bludgeoning damage. If the target is a creature,
    it must succeed on a Strength saving throw or be restrained by earthen shackles until the spell ends. A creature
    restrained by the shackles can use its action to make a Strength check against your spell save DC. On a success,
    it frees itself.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the extra damage increases
    by 1d8 for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 49
- name: Rampart of Rubble
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S, M (a boulder 50 pounds of weight)
  duration: Concentration, up to 1 minute
  classes:
  - Cleric
  - Druid
  - Paladin
  - Sorcerer
  - Wizard
  description: You create a shield of solid stone around you. The shield provides you with a +2 bonus to AC and
    deals 1d6 bludgeoning damage to any creature that hits you with a melee attack.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d6
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 49
- name: Rock Throw
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: 60 feet
  components: V, S, M (a small rock)
  duration: Instantaneous
  classes:
  - Artificer
  - Druid
  - Ranger
  - Sorcerer
  - Wizard
  description: You hurl a rock at a creature within range, dealing 1d10 bludgeoning damage.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d10
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 49
  source_notes: The source does not specify an attack roll or saving throw.
- name: Rockbound Resilience
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S
  duration: 1 hour
  classes:
  - Cleric
  - Druid
  - Sorcerer
  - Wizard
  description: You touch a willing creature and imbue them with the might of stone, giving them advantage on Strength
    checks and saving throws for the duration.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, you can target one additional
    creature for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 49
- name: Root Shield
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 reaction, which you take when you are hit by an attack
  range: Self
  components: V, S
  duration: Until the start of your next turn
  classes:
  - Cleric
  - Druid
  - Ranger
  - Warlock
  description: When you are hit by an attack, you can use your reaction to summon a shield of roots, gaining a +5
    bonus to AC against that attack.
  source_ref: draft2.pdf / PDF page 49
- name: Silt Snare
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: 60 feet
  components: V, S, M (fistful of sand)
  duration: Concentration, up to 1 minute
  classes:
  - Druid
  - Ranger
  description: You cause the ground in a 20-foot square within range to become quicksand, making the area as difficult
    terrain. Each creature in the area must make a Strength saving throw or be restrained for the duration. A creature
    restrained by the quicksand can use its action to make a Strength check against your spell save DC. On a success,
    it frees itself.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the size of the square increases
    by 10 feet for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 50
- name: Sinkhole
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: 30 feet
  components: V, S
  duration: Concentration, up to 1 minute
  classes:
  - Sorcerer
  - Wizard
  description: You cause the ground to open up and attempt to swallow a creature you can see within range. The creature
    must succeed on a Dexterity saving throw or be swallowed. The swallowed creature can use its action to make
    a Strength or Dexterity check against your spell save DC. On a success, it frees itself.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the range increases by 10 feet
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 50
- name: Stone's Endurance
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: 60 feet
  components: V, S
  duration: Concentration, up to 1 minute
  classes:
  - Druid
  - Sorcerer
  - Wizard
  description: You summon a gust of wind that wraps around you or a creature you can see within range, providing
    a bonus to AC equal to your spellcasting ability modifier for the duration. The spell ends if you cast it again
    or if the creature is ever more than 60 feet away from you.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the range increases by 10 feet
    for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 50
- name: Terran Traverse
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: Self
  components: V, S
  duration: Up to 1 minute
  classes:
  - Druid
  - Sorcerer
  - Warlock
  - Wizard
  description: You become one with the earth, gaining the ability to move through nonmagical, unworked earth and
    stone as if it was air. While moving in this way, you do not disturb the material you move through. You also
    gain tremorsense out to a range of 30 feet. The spell ends if you end your turn inside a stone object or surface.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, the duration increases by 1
    minute for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 50
- name: Wind's Swiftness
  group: 2nd level
  level: 2
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S
  duration: 1 hour
  classes:
  - Druid
  - Ranger
  - Sorcerer
  - Wizard
  description: You touch a willing creature and imbue them with the swiftness of the wind, enhancing their agility.
    For the duration, the target has advantage on Dexterity checks and their speed increases by 10 feet.
  higher_levels: When you cast this spell using a spell slot of 3rd level or higher, you can target one additional
    creature for each slot level above 2nd.
  source_ref: draft2.pdf / PDF page 50
- name: Actinide Armor
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S, M (a pinch of powdered actinide elements worth 50 gp)
  duration: 1 hour
  classes:
  - Artificer
  - Wizard
  description: You touch a willing creature, and a shimmering protective layer of rare earth elements forms around
    it. For the duration, the target has resistance to acid, cold, fire, lightning, and thunder damage.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, you can target one additional
    creature for each slot level above 3rd. All targets must be within 30 feet of each other when you target them.
  source_ref: draft2.pdf / PDF page 51
- name: Blossom Barrier
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Self
  components: V, S
  duration: Concentration, up to 1 minute
  classes:
  - Druid
  - Ranger
  description: You create a barrier of swirling petals and thorns around you. The barrier provides you with a +3
    bonus to AC and deals 2d6 piercing damage to any creature that hits you with a melee attack.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d6
    for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 51
- name: Boulder Blast
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: 120 feet
  components: V, S
  duration: Instantaneous
  classes:
  - Artificer
  - Druid
  - Sorcerer
  - Wizard
  description: You hurl a massive boulder at a point you can see within range. Each creature in a 10-foot-radius
    sphere centered on that point must make a Dexterity saving throw. A creature takes 5d6 bludgeoning damage on
    a failed save, or half as much damage on a successful one.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d6
    for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 51
- name: Earth's Echo
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 10 minutes (Ritual)
  range: Self
  components: V, S, M (a handful of dirt)
  duration: 8 hours
  classes:
  - Druid
  - Sorcerer
  - Wizard
  description: You can hear through the earth and stone. You gain tremorsense out to a range of 500 feet for the
    duration.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the duration increases by 1
    hour for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 51
- name: Earth's Eyes
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S
  duration: 1 hour
  classes:
  - Druid
  - Ranger
  - Wizard
  description: You gain tremorsense out to a range of 30 feet for the duration.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the duration increases by 1
    hour for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 51
- name: Earthen Endurance
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S
  duration: 1 hour
  classes:
  - Druid
  - Ranger
  - Sorcerer
  - Wizard
  description: You touch a willing creature and imbue them with the might of stone, giving them advantage on Strength
    checks and saving throws for the duration.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, you can target one additional
    creature for each slot level above 3rd. All targets must be within 30 feet of each other when you target them.
  source_ref: draft2.pdf / PDF page 51
- name: Gale Barrier
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 bonus action
  range: Touch
  components: V, S, M (a feather and a handful of sand)
  duration: Concentration, up to 1 minute
  classes:
  - Druid
  - Sorcerer
  - Wizard
  description: You create a wall of swirling wind and debris that provides three-quarters cover. The wall can be
    up to 30 feet long, 10 feet high, and 1 foot thick.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, you can increase the length
    of the wall by 5 feet for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 52
- name: Geomantic Resonance
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 10 minutes (Ritual)
  range: Self
  components: V, S, M (a small piece of a map)
  duration: 1 hour
  classes:
  - Druid
  - Cleric
  - Ranger
  - Wizard
  description: You attune yourself to the land, gaining advantage on Survival and Nature checks within a specific
    geographical area.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the duration increases by 1
    hour for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 52
- name: Geospheric Bastion
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Self (10-foot radius)
  components: V, S, M (a small piece of jade)
  duration: Concentration, up to 10 minutes
  classes:
  - Druid
  - Paladin
  - Sorcerer
  - Wizard
  description: You create a dome of hardened earth around you and your allies, providing half cover for the duration.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, you can increase the radius
    by 5 feet for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 52
- name: Greenery's Grasp
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: 90 feet
  components: V, S
  duration: Concentration, up to 1 minute
  classes:
  - Druid
  - Ranger
  - Sorcerer
  - Wizard
  description: You cause plants in the 20-foot-radius area to grow rapidly, creating difficult terrain for the duration.
    Creatures in the area when the spell is cast must make a Strength saving throw or be restrained by the plants
    until the spell ends. A creature restrained by the plants can use its action to make a Strength check against
    your spell save DC.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the radius of the area increases
    by 5 feet for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 52
- name: Highland's Howl
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Self (30-foot radius)
  components: V, S
  duration: Instantaneous
  classes:
  - Bard
  - Cleric
  - Paladin
  - Wizard
  description: You create a powerful echo that reverberates off the surrounding terrain. All creatures within range
    must make a Constitution saving throw or take 3d8 thunder damage and be deafened for 1 minute. A successful
    save halves the damage and prevents the deafening effect.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d8
    for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 52
- name: Honed Stones
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S
  duration: 1 hour
  classes:
  - Sorcerer
  - Wizard
  description: Sharp rocks jut out from the ground around a creature you can see within range, dealing 2d10 piercing
    damage.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d10
    for each slot level above 3rd
  source_ref: draft2.pdf / PDF page 52
  source_notes: 'The source prints Range: Touch and Duration: 1 hour, but describes damage to a creature within
    range without an attack roll, saving throw or repeat-damage timing.'
- name: Lithic Lore
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Self
  components: V, S
  duration: 10 minutes
  classes:
  - Bard
  - Druid
  - Ranger
  - Wizard
  description: You can communicate with the earth and stones, gaining information about the surrounding terrain
    in 150 feet radius, the presence of creatures, and the location of precious minerals. This spell does not enable
    the caster to understand or be understood by such creatures.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the radius of the area you
    can sense increases by 50 feet for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 53
- name: Rock's Resolve
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S
  duration: 1 hour
  classes:
  - Druid
  - Wizard
  description: You touch a willing creature and imbue them with the power of stone, giving them advantage on Strength
    checks and saving throws and a +2 bonus to Strength-based attack rolls and damage rolls for the duration.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, you can target one additional
    creature for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 53
- name: Rolling Stones
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: 90 feet
  components: V, S, M (a handful of pebbles)
  duration: Concentration, up to 1 minute
  classes:
  - Druid
  - Sorcerer
  - Wizard
  description: You cause the ground in a 20-foot radius to become a shifting, rolling mass of pebbles and stones.
    Each creature in the area must make a Dexterity saving throw or be knocked prone. A creature that enters the
    area for the first time on a turn or starts its turn there must also make the saving throw.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the radius of the area increases
    by 5 feet for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 53
- name: Sanctuary of Slate
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 reaction, which you take when you or a creature you can see within 30 feet of you is hit by an attack
  range: 30 feet
  components: V, S
  duration: 1 round
  classes:
  - Paladin
  - Wizard
  description: When you or a creature you can see within 30 feet of you is hit by an attack, you can use your reaction
    to encase the target in a protective layer of stone, granting it resistance to the damage of the triggering
    attack.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, you can increase the range
    by 5 feet for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 53
- name: Stone's Step
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 bonus action
  range: Self
  components: V, S
  duration: 1 round
  classes:
  - Druid
  - Ranger
  - Sorcerer
  - Wizard
  description: Until the end of your turn, you can move across difficult terrain made of earth or stone without
    expending extra movement, and you can move up, down, and across vertical surfaces and upside down along ceilings,
    leaving your hands free.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, you can increase the duration
    by 1 round for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 53
  source_notes: 'The source lists Duration: 1 round but the base description says until the end of your turn.'
- name: Tectonic Transmutation
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S, M (a small piece of the stone type you wish to transform the object into)
  duration: Permanent
  classes:
  - Artificer
  - Bard
  - Cleric
  - Druid
  - Paladin
  - Ranger
  - Sorcerer
  - Warlock
  - Wizard
  description: You touch a stone object of Medium size or smaller or a section of stone no more than 5 feet in any
    dimension and transform it into a different type of non-precious stone. For example, you could transform a boulder
    into sandstone, a pebble into a piece of granite, or a statue into a perfectly carved piece of marble. The object
    retains its size and shape, but its weight changes to match the new type of stone. The spell has no effect on
    creatures or magical objects.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, you can increase the size by
    5 feet for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 53
- name: Tectonic Trap
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 reaction, which you take when you or a creature within 60 feet of you is attacked
  range: 60 feet
  components: V, S
  duration: Instantaneous
  classes:
  - Druid
  - Ranger
  - Wizard
  description: The ground beneath the attacker cracks and shifts, potentially throwing off their attack. The attacker
    must succeed on a Dexterity saving throw or have the attack miss.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the range increases by 10 feet
    for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 54
- name: Telluric Truths
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 minute (Ritual)
  range: Self
  components: V, S, M (a gemstone worth at least 100 gp)
  duration: 1 hour
  classes:
  - Druid
  - Paladin
  - Ranger
  description: You gain the ability to converse with the earth itself. You can ask the earth a single question,
    and it will answer truthfully to the best of its ability. The earth’s knowledge is limited to its geographical
    area and the events that have occurred upon it.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, you can ask an extra question
    for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 54
  source_notes: The source class line prints “Druid,, Paladin, Ranger”; the duplicated comma is omitted here.
- name: Thorn Burst
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 reaction, which you take when you are hit by a melee attack
  range: Self
  components: V, S
  duration: Instantaneous
  classes:
  - Cleric
  - Druid
  - Ranger
  - Warlock
  description: When you are hit by a melee attack, you can use your reaction to cause thorns to burst from your
    body, dealing 1d10 piercing damage to the attacker.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d10
    for each slot level above 3rd
  source_ref: draft2.pdf / PDF page 54
- name: Wind's Gust
  group: 3rd level
  level: 3
  school: geomorphy
  casting: 1 action
  range: Self (60-foot line)
  components: V, S
  duration: 1 hour
  classes:
  - Druid
  - Ranger
  description: You create a gust of wind that blasts from you in a direction you choose. Each creature in the line
    must make a Strength saving throw or be pushed 15 feet away from you and be knocked prone.
  higher_levels: When you cast this spell using a spell slot of 4th level or higher, the length of the line increases
    by 10 feet for each slot level above 3rd.
  source_ref: draft2.pdf / PDF page 54
