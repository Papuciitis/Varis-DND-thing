  - name: Storm
    group: Mystic spells
    notes: Existing storm family.
- name: Earth's Grasp
  status: draft
  decision: Implement the reviewer's Oath 1 placement with a grounded binding effect and the system's Snared condition.
  conversion:
    name: Earthen Bonds
    magic_class: Oath
    level: '1'
    casting: 1 action
    components: Verbal, somatic, material (a fistful of dirt, not consumed)
    range: 60 feet
    duration: Concentration, up to 1 minute
    effect: 'Choose a 10-foot square of earth or stone you can see within range. Earth rises around the feet of
      each creature touching that surface in the square. Each such creature makes a Strength save against your spell
      DC. On a failure, it is Snared for the duration.


      A Snared creature can spend an action to make a Strength check against your spell DC, freeing itself on a
      success. Teleporting or being moved out of the chosen square by another effect also frees it. Creatures that
      enter the square after the casting are not bound.


      When concentration ends, the bindings fall apart and all creatures bound by this casting are freed.'
    higher_levels: Each slot level above 1st increases the square's side length by 5 feet. The save DC and duration
      do not change.

      At 3rd slot level or higher, this spell no longer requires concentration.
    design_notes: Oath 1 follows the review. Snared replaces imported restrained terminology without adding a new
      condition. Requiring earth or stone, limiting the trigger to the initial casting and changing area growth
      to 5 feet per slot are proposed implementation details.
  related_spells:
  - name: minor geomancy
    group: Arcane cantrips
    notes: Its Earthbind upgrade already provides a single-target binding option; compare the proposed slot cost
      and area before accepting another spell.
  - name: Binding
    group: Oath spells
    notes: 'Comparison only: Binding compels a supernatural creature after a killing blow; it is not ordinary terrain
      restraint.'
  questions:
  - Is an area binding sufficiently distinct from minor geomancy's Earthbind upgrade to warrant a separate Oath
    spell?
  final-answer: The spell is approved. I altered it to lose concentration requirement at slot lvl 3.
