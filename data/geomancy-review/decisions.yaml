- name: Geomantic Ascendancy
  status: draft
  decision: Draft the suggested Mystic 6 earth attunement as one readable paragraph, with explicit damage types
    and safe earth passage instead of broad undefined immunity.
  conversion:
    name: Geomantic Ascendancy
    magic_class: Mystic
    level: '6'
    casting: 10 minutes
    components: Verbal, Somatic, Material (an earth-encrusted diamond worth at least 5,000 gold, which is consumed)
    range: Self
    duration: Concentration, up to 1 hour
    effect: Attune your body to the earth. For the duration, while touching natural earth or stone, you have resistance
      to bludgeoning, piercing, slashing, acid, cold, fire and lightning damage; you can move through nonmagical
      natural earth and stone at a speed of 20 feet without leaving a tunnel; you sense the location of moving creatures
      touching the same continuous ground within 60 feet, although this sense does not let attacks or spells pass
      through barriers; and you can speak with and understand earth elementals. While traveling through earth, you must hold your breath,
      as though you were unable to breathe. You cannot pass through solid metal, worked masonry or magical barriers.

      
      While under the effect of this spell, you are considered an elemental in addition to your other types.
    design_notes: 'The reviewer suggests Mystic 6 with clearer numbers and likes the single-paragraph form. Concentration,
      resistance instead of immunity, the enumerated damage types, natural-material limits and 20-foot speed are
      proposed balance and clarity decisions. Forced exit follows the existing Varis Ethereal condition convention,
      matching the Earthwalk draft: nearest unoccupied space by the shortest permitted route, with falling damage
      based on twice the forced distance. Unlike Earthwalk, this draft still requires ending each turn outside solid
      material. The costly consumed diamond is retained. No free ritual casting is granted because current slot-free
      ritual rules for this new draft have not been confirmed.'
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Existing earth manipulation and stonemail are separate effects; this draft is personal attunement, not
      a package granting those spell options.
  questions:
  - Should the form grant resistance, limited immunity, or a temporary HP shell at Mystic 6?
  final-answer: nah I modified it a bit. it should be approved now.
- name: Geoshape
  status: merge
  decision: Consolidate the fortification and terrain-shaping family with existing construction magic instead of
    another overloaded geomancy ultimate.
  related_spells:
  - name: Structure
    group: Arcane spells
    notes: Existing fortification family.
  - name: Subdomain
    group: Arcane spells
    notes: Existing domain terrain-reforming modes.
  final-answer: Reject this, but I have a request. I want an .md named "world_and_terrain_effects.md" where I want these worts of things to be listed. I deliberately want you to compile 100 things that can be utilized for terrain or world or structure enchanting things. This is either by subdomain, spell, or anything. And different saves or skills are considered duplicates, even if slightly varies, so that a "advantage on dex saves and +1 to attacks cus its like the bloodgrounds" is not gonna cut it. I want to be a scientist about the possibility space with this document, so it should list the possibility space itself. Please also write an analysis of terrain and structure enchantment game design space. Thank you.
