    the more destructive Earthshatter as the existing higher-level option.
  conversion:
    name: Quake Hammer
    magic_class: Oath
    level: '2'
    casting: 1 action
    components: Verbal, Somatic, Material (a melee weapon held by the caster)
    range: Self (10-foot radius)
    duration: Instantaneous
    effect: Strike the ground with the held weapon. Each other creature touching the same continuous ground within
      10 feet makes a Dexterity save against your spell DC. On a failure, it takes 3d6 + casting bonus bludgeoning
      damage and is knocked prone. On a success, it takes half damage and is not knocked prone. Creatures not touching
      the ground are unaffected. This casting replaces a weapon attack; it does not also deal the weapon's damage.

      If done on loose ground, sand, or dust, it also fills the area with dust for 1 round which obscures vision past 5ft.
      Deals double damage to the structure underneath the caster.
    higher_levels: Each spell slot level above 1st adds 1d6 damage. At 3rd level or higher, you may increase the
      radius to 15 feet; at 5th level or higher, you may increase it to 20 feet.
    design_notes: The review specifies Oath 1 and revised upcasting. The 10-foot base radius, 2d6 + casting bonus
      damage, grounded targeting and larger-radius thresholds are proposed balance choices for V.; they are not
