  conversion:
    name: Brethren unite
    magic_class: Oath
    level: '4'
    casting: 1 action
    components: Verbal, Somatic
    range: Self (30-foot radius)
    duration: Until the end of your next turn
    effect: Speak an invocation that draws nearby companions into common purpose. Choose yourself and up to five
      other willing creatures within 30 feet that can hear you. Each chosen creature gains advantage on attack rolls,
