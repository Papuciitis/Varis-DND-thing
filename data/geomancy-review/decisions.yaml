- name: Terran Traverse
  status: draft
  decision: Rename to Earthwalk, place at Mystic 3, and supply explicit sensing, carried-creature and safe-ending
    rules.
  conversion:
    name: Earthwalk
    magic_class: Mystic
    level: '3'
    casting: 1 action
    components: Verbal, somatic
    range: Self
    duration: Concentration, up to 1 minute
    effect: 'Move through nonmagical, unworked earth and stone at your normal walking speed without disturbing the
      material. Worked masonry, metal, magical stone and other materials remain barriers. Your worn and carried
      equipment travels with you, but you cannot take another creature through solid terrain with this spell.


      While touching connected earth or stone, sense the location of creatures moving in contact with that material
      within 30 feet. This sense does not let you see through solids, read, detect airborne creatures or hear conversations.
      The spell does not supply air while you are submerged in terrain.


      You can end a turn inside permitted terrain. If the spell ends while you occupy solid material, you and your
      equipment are forced along the shortest route through permitted material to the nearest unoccupied space that
      can hold you. Apply fall damage as though you had fallen twice the distance you were forced to travel. If
      equally near spaces exist, return toward the space where you entered the terrain.'
    higher_levels: Each slot level above 3rd extends the maximum duration by 1 minute. It does not permit passage
      through additional materials or increase the sensing range.
    design_notes: Mystic 3, the Earthwalk name and explicit submerged-ending rules follow the review. Concentration,
      the equipment/creature limits and limited sensing interpretation are proposed safeguards. Ejection borrows
      the existing Varis Ethereal condition's twice-distance fall-damage rule instead of inventing a new damage
      scale.
  related_spells:
  - name: minor geomancy
    group: Arcane cantrips
    notes: Existing slow tunneling alters terrain; Earthwalk proposes temporary personal passage without excavating
      a tunnel.
  questions:
  - Should Earthwalk retain concentration, or should its short duration be the main restriction?
  - Should magical dispelling always eject toward the entry route, rather than using the nearest-space rule shared
    with Ethereal?
  final-answer: approved. It should retain concentration. earth movement is a weirdly powerful ability. A minute can get you far.
