- name: Greenery's Grasp
  status: draft
  decision: Implement the review's Mystic 2 placement with ten-minute concentration, living-plant dependence and
    a clear distinction from single-target Command nature.
  conversion:
    name: Grasping Green
    magic_class: Mystic
    level: '2'
    casting: 1 action
    components: Verbal, somatic
    range: 90 feet
    duration: Concentration, up to 10 minutes
    effect: 'Choose a point you can see within range where living roots, vines, grass or similar vegetation already
      grows. Animate that vegetation within a 20-foot radius. Planted ground in the chosen area becomes difficult
      terrain for the duration; the spell does not create vegetation on bare surfaces.


      Each grounded creature standing in that vegetation when you cast makes a Strength save against your spell
      DC. On a failure, it becomes Snared. An affected creature can spend an action to make a Strength check against
      your spell DC, freeing itself on a success. A creature within 5 feet of it can instead spend an action with
      a slashing weapon or suitable cutting tool to cut it free.


      Creatures entering later encounter the difficult terrain but are not automatically Snared. Teleporting or
      being moved out of the animated vegetation frees a bound creature. When concentration ends, the plants return
      to their ordinary state and all bindings end.'
    higher_levels: Each slot level above 2nd increases the area's radius by 5 feet. The maximum duration remains
      10 minutes.
    design_notes: Mystic 2 and a longer five- or ten-minute duration follow the review; this draft chooses 10 minutes.
      The living-plant restriction makes the spell depend on the environment. Snared uses the current Varis condition.
      The initial-casting-only binding and automatic cutting action are proposed counterplay details.
  related_spells:
  - name: Command nature
    group: Mystic spells
    notes: Existing Mystic 1 spell already grows plants and snares a target. This draft's proposed distinction is
      sustained area control using existing vegetation.
  questions:
  - Is sustained area control enough to distinguish this candidate from upcast Command nature, or should it become
    an additional option of that spell instead?
  final-answer: approved.
