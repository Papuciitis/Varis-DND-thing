- name: Crystal Mirror
  status: draft
  decision: Draft the tentative Occult 5 reflection as an active held mirror with a reaction cost and slot ceiling,
    preserving the stronger existing Arcane reflection rune.
  conversion:
    name: Malefic Mirror
    magic_class: Occult
    level: '5'
    casting: 1 action
    components: Verbal, Somatic, Material (a hand-held polished mirror)
    range: Self
    duration: Concentration, up to 1 minute
    effect: 'Enchant a mirror held in one of your hands. While holding it, you may spend your reaction when a creature
      you can see casts a spell of 4th level or lower that directly targets only you. Turn the mirror toward the
      caster: you cease to be the target, and the original caster becomes the target instead if it is a legal target
      within that spell''s range measured from you. Resolve the spell using its original caster''s spell DC and
      other casting values. If the caster is not a legal target, the effect against you is negated. This reflection
      cannot affect an area spell, a spell with multiple targets, a continuing effect already on you, or a spell
      that has already been reflected. The enchantment ends if you stop holding the mirror, the mirror is destroyed,
      or you cast this spell again.'
    higher_levels: When cast using a 6th-level spell slot, the mirror may reflect a spell of 5th level or lower.
    design_notes: Occult 5 is a tentative review suggestion. The held focus, reaction cost, single-target trigger
      and exclusion of already reflected effects are proposed limits that replace the source's undefined facing
      and automatic reflection. Original casting values are reused; this is not a new casting by the mirror's wielder.
  related_spells:
  - name: Rune of reflection
    group: Arcane spells
    notes: Existing Arcane 6 reflects direct-target spells without this proposal's fourth-level ceiling and reaction
      limit, and lasts longer.
  questions:
  - Does Occult need this narrower reflection spell, or should it remain solely within Arcane Rune of reflection?
  final-answer: No no this is good for occult. it should be approved. I think it should be a level 5 occult spell, but it should also work if the caster is being targeted by a single creature effect. So like a single spell shoots 3 bolts, one of them hits me, I mirror that bolt, so it hits the caster. You dont want to recast the entire spell. Im uncertain on the wording but id like to see that version first.
