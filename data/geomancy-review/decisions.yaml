- name: Geochemical Golem
  status: needs-design
  decision: Preserve the material-infusion system as a candidate, but redesign summoning and scaling for twelve
    character levels and consolidate elemental options first.
  questions:
  - Can material-infused creatures remain monster options under a consolidated summon?
  - Which template, commands, costs, and scaling fit character levels 1-12?
  answer: >- 
    I think the unique summon system for this monster is quite impressive and should be preserved. This should be a spell since the technology exists. Its quite amazing.
    I want it reconstructed as an arcane spell which is essentially a make-a-golem spell. Geochemical is not a good name for it though. 
    
    Alternatively, this system and mechanics could be really good for a wizard archetype that specializes for golems.

    So this answer isnt final, keep this one for reevaluation, but as for the 12 lvl system, the game is compressed to 12 levels. 12 divides with 2,3,4,6. You can do lots of interesting archetypes. You know that what is at lvl 3/4 at a class has to harmonize with whats at lvl 7/8 for another class for the sake of making multiclassing equivalent, and you know that proficiency goes up to +5. 
    besides that, I would like you to reconstruct Golemancy as a lvl 4 arcane spell which has this original spells infusion mechanic, but uses the materials or exotic stuff actually listed in the items the compendium has at the moment. This is primarily to check how it works. 
    And the scaling should permit for extra infusions at lvl 5(extra options, and +1), and a mini infusion list of 3 ult-like abilities(not in terms of moba-style damage ults but perhaps very weird or unique game alterations that the "golem" can now have, since its blurrin the line between golem and the relic player race now.)

