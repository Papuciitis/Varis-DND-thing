- name: Geomorph's Vision
  status: draft
  decision: Turn the broadly approved Mystic 1 concept into a limited ritual about a natural feature's history,
    without making it a general investigation shortcut.
  conversion:
    name: Landmemory
    magic_class: Mystic
    level: '2'
    casting: 10 minutes (ritual; spends a spell slot)
    components: Verbal, somatic, material (a naturally occurring piece of the chosen feature, not consumed)
    range: Touch
    duration: Instantaneous
    effect: 'Complete the ritual and spend a spell slot of 1st level or higher. Touch a natural geographical feature,
      or a naturally fallen fragment of it, and contemplate its history. Choose one connected feature no more than
      1 mile across, such as a stretch of river, a grove, a cliff or part of a mountain.


      Receive up to three broad impressions of significant natural changes that affected that feature within the
      past century. Examples include a river changing course, a major fire, a landslide or a forest dying back.
      The GM describes impressions and their approximate order, rather than exact dates.


      The spell does not reveal the identities, conversations or individual actions of people who visited the feature,
      expose hidden creatures or treasure, or answer arbitrary questions about nearby events. Recasting it on the
      same feature within a day repeats the same impressions.'
    higher_levels: >-
      If cast using a 3rd level spell slot, the duration one can look back is increased to 300 years.
      If cast using a 4th level spell slot, the duration one can look back is increased to 500 years.
      If cast using a 5th level spell slot, the duration one can look back is increased to 1000 years.
      If cast using a 6th level spell slot, the duration one can look back is increased by 10000 years.
    design_notes: Mystic 1 follows the review. The one-mile feature size, century of history, three impressions
      and repeated-casting restriction are newly proposed limits for the source's otherwise undefined historical
      reading. They require V.'s approval. Spending a spell slot despite the ritual casting time is a provisional
      cost for this draft, not a ruling about Varis rituals generally.
  related_spells:
  - name: Commune with nature
    group: Mystic spells
    notes: Current Mystic 2 Commune with nature communicates and bargains with a creature; it does not survey terrain
      or read a landscape's history. Landmemory therefore proposes a distinct information effect rather than replacing
      that spell.
  questions:
  - Are one century and three broad impressions the right information budget for a Mystic 1 ritual?
  - Should this ritual spend a spell slot as drafted, or should V. define a different ritual cost?
  final-answer: made changes to the proposed version, altering durations and levels, and changing the level to 2. approved otherwise.
- name: Lithoecho Resonance
  status: rejected
