- name: Rockplica
  status: needs-design
  decision: Compare the mimic-tear concept with existing Arcane copy; any distinct version needs a real statblock,
    action and resource restrictions, and duration limits.
  related_spells:
  - name: Arcane copy
    group: Arcane spells
    notes: Already creates a solid copy sharing stats and resources, without item duplication.
  questions:
  - What role differs from Arcane copy?
  - What actions, resources, gear, spells, and independent turns may the duplicate use?
  final-answer: >-
    It doesnt differ and arcane is the only real place where this could be useful. I do propose this be reworked for occult in the following ways:
    The spell is not limited to a range, but it has 1/3 your HP rounded up(for funsies) and can do your actions, but cannot cast spells beyond 3rd level and has 
    1/2 of your  class resources (spell slots, rest dice, etc.) but instead it has a +2 bonus to an attribute of choice and a +1 bonus to another.
    This kind of power would fit a lvl 4 occult spell. Something like clay simulacra. It should have an HP cost and the duration should be 1 day but the casting time should be 1 hour and require something significant.
    higher levels can increase the duration.
    And there should be a "subject to GM" clause in there about having more than one clay simulacra because they are known to conspire, or something, with like no further explanation as both flavor and a gm clause source for the GM to intervene if it gets abused. After all, its essentially spell replication.
    This is like the one spell so far in the list that I dont either reject or approve, and actually would like an iteration for. the rest are either approved, or rejected if input was requested.
