  - What distinguishes sand dispersal from Vermin-form, and should its slot be 4, 5, or 6?
  final-answer: It should be level 4, and make you immune to all other damage except lightning fire and radiant, and grant you 2d8 temp HP.
    Once the temp HP is lost, you are thrown out of the form and overdamage is dealt to you. You can exit it yourself if you want to at will. This effectively gives a flight speed.
