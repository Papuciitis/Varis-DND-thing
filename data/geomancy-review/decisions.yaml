- name: Petrified Smite
  status: draft
  decision: Remove the earth reskin and draft the proposed Oath 2 binding smite, with a short charging window and
    a clear escape procedure.
  conversion:
    name: Binding Smite
    magic_class: Oath
    level: '2'
    casting: 1 bonus action
    components: Verbal, somatic
    range: Self; next melee weapon attack
    duration: Until the end of your next turn; binding up to 1 minute
    effect: 'Enchant a melee weapon you wield. The next unblocked hit you land with that weapon before the end of
      your next turn deals an extra 1d8 radiant damage. The struck creature also makes a Strength save against your
      spell DC. On a failure, oath-forged bands bind it and it becomes Snared for up to 1 minute.


      A bound creature can spend an action to make a Strength check against your spell DC, ending the binding on
      a success. Teleporting also ends its binding. This spell requires no concentration, but you can maintain only
      one binding from it at a time: casting Binding Smite again releases a creature bound by your previous casting
      and replaces any unused charge.


      If the charged weapon leaves your hand before the hit, the unused charge ends.'
    higher_levels: Each slot level above 2nd adds 1d8 extra damage, and the duration increases by 1 minute.
    design_notes: Oath 2 and removal of the earth theme follow the review. The no-concentration version answers
      the reviewer's melee concern as a proposed design choice. The short charge window is based on current Smite;
      requiring an unblocked hit, changing the extra damage to radiant and limiting the caster to one maintained
      binding are new proposal details.
  related_spells:
  - name: Smite
    group: Oath spells
    notes: Existing bonus-action smite for damage and charging-window comparison.
  - name: Binding
    group: Oath spells
    notes: Existing Oath 3 Binding concerns a defeated creature's will; this proposal only prevents movement and
      does not grant control over a creature.
  questions:
  - Should the binding retain concentration, or is the single-maintained-binding limit sufficient?
  final-answer: made a change to the scaling. Its approved.
- name: Rampart of Rubble
  status: draft
  decision: Replace retaliation with the reviewer's temporary-health-linked +2 AC and block-check defense, using
    an actual stone suit at Oath 2.
  conversion:
    name: Stoneshell
    magic_class: Oath
    level: '2'
    casting: 1 action
    components: Verbal, somatic, material (at least 50 pounds of loose nonmagical stone within reach)
    range: Self; touch the stone
    duration: Up to 1 minute, while its temporary health remains
    effect: 'Touch loose stone and bind it around your body as a protective shell. Gain 3d6 + casting bonus temporary
      health (min 3d8 + 1.) While any temporary health from this casting remains, gain a +2 bonus to AC and
      block checks.


      If its temporary health is replenished by another spell(you gain a larger amount than you currently have) it is treated
      as healing and restoring the stoneshell.


      When the spell ends, the material falls harmlessly at your body as ordinary loose stone bits. It is moved by the
      spell, not created.'
    higher_levels: Each slot level above 2nd adds 1d8 temporary health. The AC and block-check bonuses remain +2.
    design_notes: The review explicitly suggested temporary health with +2 AC and block checks at Oath 2. The 2d8
      + casting bonus pool, one-minute maximum, absence of concentration and replacement rule are proposed implementation
      details. The replacement rule prevents unrelated temporary-health grants from indefinitely sustaining the
      shell.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Its existing Stonemail option also provides a temporary-health stone suit; compare roles instead of replacing
      that option.
  questions:
  - Should Stoneshell require concentration as well as its temporary-health and duration limits?
  - Is this distinct enough from Arcane Geomancy's Stonemail to remain a separate Oath spell?
  final-answer: made changes to temp-hp interaction from other spells to make it something you want to play a game to maintain. Is approved now.
