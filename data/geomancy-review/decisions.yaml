geomancy_decisions:
- name: Breeze Whisper
  status: draft
  decision: Keep the short-message concept as a Mystic cantrip. Define delivery and failure without turning it into
    a creature-location oracle.
  conversion:
    name: Breeze Whisper
    magic_class: Mystic
    level: '0'
    casting: 1 action
    components: Verbal, somatic
    range: 120 feet
    duration: Instantaneous
    effect: 'Whisper a message of up to twenty-five words to a creature whose voice you know. The creature must
      be within range, but you do not need to see it. A faint current of air carries your words around corners and
      through openings to the recipient, which hears them as a whisper. It can immediately whisper one reply of
      up to twenty-five words along the same route. The spell does not translate either message.


      An open route through air must connect you and the recipient. The current cannot pass through a solid barrier
      or an area that prevents sound. A creature that cannot hear receives no message. If the recipient is absent,
      out of range, unreachable, or chooses not to reply, you receive no reply and learn no reason for the silence.'
    design_notes: The Mystic category follows the review. The air route, audible delivery, language limit and indistinguishable
      failure are proposed clarifications; the original uses mental delivery. Range and word limits are preserved.
      No combat bonus or automatic location information is granted.
  questions:
  - Should delivery remain mental as in the source, or use the proposed audible wind-whisper?
- name: Gemstone's Glee
  status: draft
  decision: Draft an Oath light cantrip with a utility guiding-mark option. Distinguish it from the existing gemstone
    recovery cantrip and separate Light hex.
  conversion:
    name: Votive Gem
    magic_class: Oath
    level: '0'
    casting: 1 action
    components: Verbal, somatic, material (a gemstone, which is not consumed)
    range: Touch
    duration: 1 hour
    effect: 'Bless a gemstone you touch. It sheds bright light in a 20-foot radius and dim light for a further 20
      feet, in a colour you choose. Covering the gemstone with an opaque object covers its light.


      A creature holding the blessed gemstone can use an action to touch it to a surface and trace a luminous sign
      no larger than a handspan: a simple arrow, warning symbol, or up to five written words. The sign glows visibly
      in darkness but does not illuminate its surroundings. Up to three signs made by this casting can exist at
      once; making another erases the oldest. They last until the spell ends and confer no automatic understanding,
      protection, check bonus or other magical effect.

      A gemstone with this enchantment can function as an spellcasting focus akin to a crystal ball while held, and
      does not require attunement.

      Only one gem can be enchanted in this manner by you at a time. Casting the cantrip again ends your previous casting
      and its signs. You can also end your casting as a bonus action while touching its gemstone.'
    upgrades: At 5th and 9th character level, increase both the bright-light radius and the additional dim-light
      distance by 10 feet, and increase the number of simultaneous signs by one.
    design_notes: The guiding signs, their limits, the one-active-gem limit, proposed name and character-level upgrades
      are utility proposals to complete the review's request for a secondary option. They add no reaction or combat
      bonus. Innervate consumes a gemstone worth at least 50 gold to recover health and a rest die; it does not
      create light. The existing Light minor hex also enhances projectiles, which this proposal does not do.
  related_spells:
  - name: Innervate
    group: Mystic cantrips
    notes: The review's likely gemstone reference; this is recovery magic rather than a light effect.
  - name: Light
    group: Minor hexes
    notes: Existing illumination and projectile enchantment, useful for comparing the new cantrip's niche.
  - name: Rune of light
    group: Oath spells
    notes: Existing level-1 protection resource, distinct from the utility-only proposal.
  - name: Illumination
    group: Mystic spells
    notes: Existing Mystic lighting with distinct utility.
  questions:
  - Is leaving simple guiding signs an appropriate secondary option for this light cantrip?
  - Keep the proposed Votive Gem name, or retain Gemstone's Glee?
  final-answer: I eddited the description with a focus use part. otherwise approved, name is good. secondary effects are good too. upgrades should be as is.
- name: Geomorpher's Compass
  status: draft
  decision: Rename to Compass and move to Mystic 1. Spend a slot for one fixed destination, with finite sensing
    range and no distance or route information.
  conversion:
    name: Compass
    magic_class: Mystic
    level: '1'
    casting: 1 minute
    components: Verbal, somatic, material (a small iron needle, which is not consumed)
    range: Self; destination within 10 miles
    duration: Concentration, up to 10 minutes
    effect: 'While touching the ground, name one stationary place on your current plane that you have personally
      visited or directly observed well enough to distinguish it from other places. A name, rumour, or imagined
      description alone is insufficient. Spend a spell slot and attune the needle to that one destination.


      If the destination lies within 10 miles, the needle points along the direct horizontal bearing from you to
      it. It updates as you travel for the duration, but gives no distance, elevation, safe route, information about
      obstacles, or information about what is at the destination. It does not point to a person, creature, portable
      object, or a place defined by the presence of one.


      If the destination is invalid, outside the spell''s sensing range, on another plane, or protected from this
      divination, the needle gives no bearing. These failures are indistinguishable. The destination cannot be changed
      during the casting; choosing another place requires another casting and another slot. The spell ends if the
      destination moves or you cease touching the ground.'
    higher_levels: Each spell-slot level above 1st adds 10 miles to the sensing range. The casting time, duration
      and one-destination limit remain unchanged.
    design_notes: The review explicitly requests Mystic 1, a simpler name and meaningful range. The 10-mile base
      range, one-minute casting, known-place requirement, concentration duration and indistinguishable failures
      are proposed safeguards against repeated free location queries. The spell still deliberately provides true
      directional information about an eligible known destination.
  questions:
  - Is 10 miles a useful level-1 sensing range, with a further 10 miles per higher slot?
  - Must the caster have personally visited the destination, or is the proposed direct-observation alternative acceptable?
  final-answer: A lvl 1 find spell is interesting. I think the range should be 100 miles, and should jump unevenly. A 3rd spell slot should give 1000 miles, while a 5th slot should give 5000 miles.
- name: Lithoresonance
  status: draft
  decision: Move to Mystic 1 as a ritual with three base effects. Replace vague intimidation and communication claims
    with defined sound effects, then add distinct upcast modes.
  conversion:
    name: Lithoresonance
    magic_class: Mystic
    level: '1'
    casting: 10 minutes (ritual)
    components: Verbal, somatic, material (a natural stone or crystal suitable for the chosen mode, which is not
      consumed)
    range: Touch; sound ranges vary by mode
    duration: 1 hour, or until discharged
    effect: 'Spend a spell slot and attune one stone or crystal by touching it throughout the ritual. Choose one
      mode permitted by the slot used. Only one object can carry your Lithoresonance at a time; completing another
      casting ends your previous one. An object whose mode requires it to remain in place loses its enchantment
      if moved.


      * Whisper pebble. Place a pebble on a solid surface. The first Small or larger creature to move across the
      same connected surface within 10 feet of it causes the pebble to ring for one round, audible within 60 feet,
      then become inert. Creatures that touched the pebble during the ritual do not trigger it. It detects movement
      through the surface, not thoughts, identities, flight, or creatures standing still.

      * Noise stone. Record one sound or spoken message of up to twenty-five words during the ritual. A creature
      touching the stone can use an action to tap it thrice, makeing it sound out the recorded sound. It comes out 
      as crackling, deep, and with an earthy tembre (Subject to GM.)

      * Thunder rock. Prepare one pebble or piece of stone ammunition. The first time it strikes a creature or solid
      surface after being thrown or launched, it gives off a crack audible within 300 feet and becomes inert. Creatures
      within 5 feet of the impact must make a Constitution save against your spell DC, becoming deafened until the
      start of your next turn on a failure. Resolve any weapon attack and its damage normally; this mode grants
      no extra impact damage.


      All sounds are audible warnings or signals, not mental messages. Sound-blocking effects prevent a sound from
      crossing their boundary. The spell cannot force a creature to notice or interpret a sound when it could not
      normally hear it.'
    higher_levels: 'Higher slots retain all lower-level choices and add the following modes:


      * 2nd level: Stone gong. Enchant a stationary boulder at least 3 feet across. Set up to three distinct tones
      during the ritual. A creature touching it can use an action to sound one tone, audible in the open air within
      1 mile. It transmits no words or private information.

      * 3rd level: Crystal resonance. Enchant a stationary natural crystal formation at least 2 feet across. It
      hums audibly within 30 feet. Creatures you designated by touching them during the ritual gain a +1 bonus to
      block checks and saves made to resist being shoved, dragged, or knocked prone while they can hear the hum,
      are within 30 feet of the crystal, and stand on the same connected solid surface. Leaving that area suspends
      the benefit. Multiple Crystal resonance effects do not stack.

      * 4th level: Mountain saga. Enchant a stationary natural stone outcrop at least 10 feet across. While touching
      it, you can use an action to make it sound a signal or repeat up to twenty-five words you speak aloud. The
      sound can be heard in the open air within 5 miles. A 5th-level slot increases this distance to 20 miles; a
      6th-level slot increases it to 100 miles. Ordinary enclosed spaces and magical sound barriers can still prevent
      a creature from hearing the broadcast.'
    design_notes: Mode names and the first four slot tiers follow the review's outline. Trigger sizes, active-object
      limit, ritual slot expenditure, sound distances, Thunder rock's brief deafening, Crystal resonance's defensive
      aura and Mountain saga's 4th-6th level effect are proposed completions. No mode grants an automatic social-check
      success or psychic alarm. The level-3 aura should be compared with Geomancy's existing Crystal resonance option
      before acceptance.
    final-answer: Approved with minor changes to noise stone. Crystal resonance should actually have a different effect. I think it should instead grant structures it is part of or attached to a +1 bonus to saves and resistance to damage.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Its Crystal resonance option already creates a defensive crystal aura; the proposed Mystic ritual uses
      a large natural formation and a different bonus.
  - name: Lightning crystal
    group: Mystic spells
    notes: Existing offensive prepared crystal, useful for checking that Thunder rock remains a minor utility mode.
  questions:
  - Confirm whether this ritual spends a spell slot as drafted, or should use another cost under V.'s ritual conventions.
  - Should Thunder rock have the proposed one-round deafening, or only create a loud report?
  - Approve or replace the proposed Crystal resonance aura and Mountain saga broadcast ranges.
- name: Magma's Ire
  status: rejected
  decision: Reject the fire-bolt reskin and unrestricted creation of magma at cantrip level; do not carry its imported
    damage scaling into current rules.
- name: Mud Mire
  status: merge
  decision: Consolidate small terrain-softening effects within existing geomancy instead of adding a one-round mud
    cantrip.
  related_spells:
  - name: minor geomancy
    group: Arcane cantrips
    notes: Existing earth movement and erosion family.
- name: Pebble Pelt
  status: rejected
  decision: Reject the standalone magical rock-throw cantrip; it does not establish a distinct spell function.
- name: Sand Veil
  status: rejected
  decision: Reject the desert-only stationary stealth spell as too narrow; preserve the review's conclusion without
    inventing new benefits.
- name: Stone Whisper
  status: needs-design
  decision: Preserve the stone-memory concept for a costed information spell, but resolve repeated-query limits
    and GM information burden before drafting.
  questions:
  - How many events or questions can one paid casting reveal, and can repeated castings extract more from the same
    stone?
  - What event, proximity, and detail limits avoid asking the GM to narrate a full day?
  final-answer: I would say reject for now. 
- name: Stone's Serenade
  status: merge
  decision: Fold audible stone music and signaling into the Lithoresonance proposal instead of maintaining a second
    stone-sound spell.
- name: Wind Slash
  status: draft
  decision: Draft the tentative Mystic cantrip with the requested weapon or focus requirement and character-level
    upgrades suited to the 12-level system.
  conversion:
    name: Wind Slash
    magic_class: Mystic
    level: '0'
    casting: 1 action
    components: Verbal, somatic, material (a slashing weapon or a carved wooden casting focus held in one hand)
    range: 60 feet
    duration: Instantaneous
    effect: 'Sweep your held slashing weapon or focus through the air and make one ranged spell attack against a
      creature or object you can see within range. On a hit, the cutting gust deals 1d8 + your casting bonus slashing
      damage. Resolve blocking as for a normal ranged spell attack.


      This is a spell attack, not a weapon attack. It does not add the held weapon''s damage, weapon attack bonus,
      or weapon maneuvers. The gust does not remain after the attack and cannot be used as a persistent cutting
      tool.'
    upgrades: 'At 5th and 9th character level, choose one upgrade:


      * Increase the damage by 1d8. This upgrade can be chosen twice.

      * Increase the range by 30 feet. This upgrade can be chosen twice.'
    design_notes: The review's class assignment is tentative. The weapon-or-focus requirement follows it; adding
      casting bonus and offering upgrades at character levels 5 and 9 are proposed adaptations to current Varis
      cantrip conventions, replacing the source's 5th/11th/17th automatic scaling. The precise eligible focus and
      damage still require V.'s approval.
  questions:
  - Is Mystic the intended magic class, and is an ordinary carved wooden focus sufficiently specific?
  - Approve 1d8 + casting bonus with two selectable character-level upgrades, or retain the source's unmodified
    1d8 base damage?
  final-answer: >-
    Approved with following alterations: 
    
    * Change upgrade levels to 2,6, and 10. 
    * Add the following upgrade option:
      * The target is pushed back 5 ft if the attack hits and is not blocked.
    * The damage is good, the focus perhaps should be limited to a staff or wand, as a crystal ball would not make sense. 
- name: Blossom Burst
  status: merge
  decision: Explore a nature-focus burst as an optional mode of a broader druidic staff spell; do not retain a separate
    reskinned blast.
  related_spells:
  - name: Druidic staff
    group: Mystic spells
    notes: Existing multi-mode Mystic staff enchantment; no new mode is granted.
- name: Boulder Pugilist
  status: merge
  decision: Fold stone fists into a broader stone-armor transformation and check extra unarmed attacks before setting
    damage or scaling.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Stonemail and Cragblade already support stone armor and fist or weapon enhancement.
- name: Crystal Cascade
  status: rejected
  decision: Reject the early-level conjured crystal cylinder; its unusual shape alone does not justify another area-damage
    spell.
- name: Desert Mirage
  status: rejected
  decision: Reject the narrow desert-oasis illusion. Broader illusion rules should support appropriate scenery without
    another themed spell.
- name: Drumbeat of the Ancients
  status: draft
  decision: Re-theme the close-range stun as an Oath rebuke, with clear hearing, area, duration and friendly-fire
    rules. Flag the strength of level-1 area stun explicitly.
  conversion:
    name: Resounding Rebuke
    magic_class: Oath
    level: '1'
    casting: 1 action
    components: Verbal
    range: Self; 10-foot radius
    duration: Until the start of your next turn
    effect: 'Speak an oath of arrest in a ringing voice. Every other creature within 10 feet that can hear you,
      including allies, must make a Wisdom save against your spell DC. On a failure, it is stunned until the start
      of your next turn. On a success, it is unaffected. A creature that cannot hear you is unaffected.


      The spell deals no damage. It has no effect on a creature already stunned by Resounding Rebuke, so repeated
      castings cannot extend that creature''s current stun.'
    higher_levels: Each spell-slot level above 1st increases the radius by 5 feet. The stun's duration does not
      increase.
    design_notes: Oath 1 and removing the stone theme follow the review. The proposed name, 10-foot base radius,
      start-of-caster-turn end point and non-extension clause are deliberate draft safeguards around Varis's strong
      Stunned condition. The source instead has a 15-foot radius and lasts until the end of each affected creature's
      next turn. Allies remain affected; the caster is excluded explicitly.
  related_spells:
  - name: Toll the bell
    group: Oath spells
    notes: Existing level-2 sustained Oath control. Resounding Rebuke is brief, nearby, indiscriminate control rather
      than a replacement.
  - name: Withstand
    group: Oath spells
    notes: Existing level-1 close-range crowd control, for comparison with the stun draft.
  questions:
  - Is any area stun appropriate at Oath 1 under the current Stunned condition, or should this effect use a higher
    slot or a weaker condition?
  - Approve the reduced radius and duration instead of the stronger source values?
  final-answer: >-
    Approved but with the following changes:
    * Change its range to be 30ft, but allow it to target creatures the target is familiar with. Since it is a word spell, it should be word based, allowing you to target creatures behind you and so on as long as you know they are there. Arguably the knowing shouldnt even be required.
    * The spell should target a single creature, but the  caster must know the name of the creatures kind or its actual name.
    * If the caster knows the creatures actual name, there should be a DC bonus of +2.(advantage is too high.)
    * Increase range by 5ft per slot level.
    * Allow targeting an extra creature per slot lvl above 2nd level, but only allowing you to address their kinds name(elves, bandits, witches, gnolls, King Hadvards sons, etc.) and ignoring those that are not of that kind. 
    * Change name to something like Rebuke thy Name.
    * Add 1d3 rounds to duration if the target rolls 5 or lower.
    
    special designer note: The purpose should be to emphasise the logos and contract-like nature of Oath magic. A basic aoe stun is a bit more of a blast spell, even if it has no damage.
- name: Earth's Embrace
  status: merge
  decision: Consolidate this small difficult-terrain effect within existing earth shaping instead of charging a
    separate known spell and slot.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Geomantic shaping already includes difficult terrain.
- name: Flora's Blessing
  status: needs-design
  decision: Resolve whether the intended Oath blessing affects Wisdom checks, saving throws, or fear specifically;
    the source grants checks while the review discusses saves and courage.
  questions:
  - Should the Oath effect protect Wisdom saves, improve Wisdom checks, or resist fear? Source and review describe
    different benefits.
  - Which current blessing is the alleged duplicate? Avoid Clarity as a new name.
  final-answer: >-
    I think all the advantage to save spells variants need to be ignored for now.
- name: Gemstone Keenness
  status: draft
  decision: Replace casting-modifier and slot-based bonus growth with the review's fixed, stacking +1. Consume a
    gemstone and use upcasting only to extend duration.
  conversion:
    name: Gemstone Keenness
    magic_class: Oath
    level: '1'
    casting: 1 action
    components: Verbal, somatic, material (a gemstone worth at least 5 gold, which is consumed)
    range: Touch
    duration: Concentration, up to 1 minute
    effect: 'Crush the gemstone against one weapon you are wielding that deals slashing or piercing damage. For
      the duration, attacks made with that weapon gain a +1 bonus to their attack rolls and damage rolls.


      This is a separate sharpening blessing and adds to the weapon''s existing magical attack and damage bonus.
      Multiple castings of Gemstone Keenness on the same weapon do not stack. The spell ends if you cease wielding
      the weapon or cast Gemstone Keenness again.'
    higher_levels: A 2nd-level slot increases the maximum duration to 10 minutes. A slot of 3rd level or higher
      increases it to 1 hour. Higher slots do not increase the +1 bonus.
    design_notes: Oath, a consumed gemstone, a fixed +1 that can accompany an already enchanted weapon, and duration-only
      2nd/3rd-level upcasting follow the review. Concentration and ending on release are retained from the source.
      The minimum gemstone value of 5 gold is a proposed cost, not an author-established price. This is distinct
      from Lesser weapon enchantment's longer-lasting bonus, which cannot affect already enchanted weapons.
    final-answer: >-
      5 gold is fine. A 3rd level slot or higher should also remove concentration requirement, but still dispell it if re-cast on another target.

  related_spells:
  - name: Lesser weapon enchantment
    group: Arcane spells
    notes: Existing level-2 eight-hour +1 enchantment, limited to weapons that are not already enchanted.
  - name: Enchanted edge
    group: Arcane spells
    notes: Existing level-1 attack-and-maneuver effect; this draft gives a temporary numerical sharpening blessing
      instead.
  questions:
  - What minimum gemstone value should the consumed component require? This proposal uses 5 gold.
  - Keep the source's concentration and ends-on-release restrictions, including for thrown weapons?
- name: Geomantic Guidance
  status: rejected
  decision: Reject the standalone perfect-path-memory spell as a weak known-spell investment that substitutes for
    ordinary navigation play.
- name: Geomantic Pulse
  status: draft
  decision: Keep as a Mystic 1 geography ritual and replace the nine-slot progression with the review's explicit
    six-slot distances.
  conversion:
    name: Geomantic Pulse
    magic_class: Mystic
    level: '1'
    casting: 10 minutes (ritual)
    components: Verbal, somatic, material (a fragment of a map, which is not consumed)
    range: Self; 1-mile sensing radius
    duration: Instantaneous
    effect: 'Spend a spell slot while touching natural ground. Sense the broad natural geography in a 1-mile radius
      around your position: dominant terrain, major rivers and lakes, coastlines, mountain ranges, and the relative
      directions of these features. The GM describes a rough mental overview appropriate to the scale of the area.


      This is an overview of the land, not a detailed survey. It does not reveal creatures, ownership, buildings,
      traps, hidden rooms, valuable mineral deposits, individual underground passages, or a safe route. Larger sensing
      areas give a broader overview rather than proportionally finer detail. The information concerns the land as
      it is when the ritual finishes and does not update afterwards.'
    higher_levels: The sensing radius is 10 miles with a 2nd-level slot, 100 miles with a 3rd-level slot, 500 miles
      with a 4th-level slot, 1,000 miles with a 5th-level slot, and 5,000 miles with a 6th-level slot.
    design_notes: Mystic 1 and all six sensing distances follow the review. Explicit slot expenditure, a natural-ground
      requirement and broad-geography limits are proposed definitions of what the otherwise vague information effect
      supplies. The original spell and its higher-level wording remain preserved separately.
  related_spells:
  - name: Commune with nature
    group: Mystic spells
    notes: Existing Mystic spell communicates and bargains with a creature; despite its name, it does not provide
      a geographical survey.
  questions:
  - Confirm the proposed overview detail and exclusions, especially for underground geography.
  - Confirm whether ritual casting spends the chosen slot as drafted or uses another ritual cost.
  final-answer: This is fine as is. The casting should consume the spell slot. Rename to Geomantic Awareness
- name: Granite Gaze
  status: draft
  decision: Keep the positively reviewed Mystic 1 stone-sight concept. Preserve thickness and duration scaling while
    stating that transparent vision does not remove the physical barrier.
  conversion:
    name: Granite Gaze
    magic_class: Mystic
    level: '1'
    casting: 1 action
    components: Verbal, somatic
    range: Touch
    duration: Concentration, up to 10 minutes
    effect: 'Touch a nonliving natural or worked stone surface no more than 2 feet thick. While you maintain contact
      with that surface and concentration, you can see through that thickness of stone as though it were transparent.
      Only your vision is affected; other creatures do not gain the benefit.


      This grants no light source, darkvision, greater viewing distance, hearing through the stone, or vision through
      additional materials behind it. The stone remains physically solid and continues to block movement, attacks
      and other spell effects normally. The spell ends when you cease touching the chosen surface.'
    higher_levels: Each spell-slot level above 1st adds 10 minutes to the maximum duration. The maximum stone thickness
      remains 2 feet.
    design_notes: Mystic 1 follows the unqualified positive review. Source thickness, base duration and duration-only
      upcasting are preserved. Continuous contact, nonliving stone and physical-barrier wording are proposed clarifications,
      rather than changes to the original source entry.
  questions:
  - Is continuous contact intended, or should one touch allow the vision effect to remain while the caster moves
    away?
  final-answer: this is approved. Yes the continuous touch is intended as you have to touch it to see through it. 
- name: Lanthanide Luminescence
  status: rejected
  decision: Reject a slot-consuming colored torch as insufficiently distinct from existing illumination.
  related_spells:
  - name: Light
    group: Minor hexes
    notes: Existing light effect for comparison.
- name: Leaf Armor
  status: draft
  decision: Draft the simple +1 AC blessing as Oath 1 and apply the review's heavy-armor restriction without adding
    another defensive pool.
  conversion:
    name: Barkskin
    magic_class: Mystic
    level: '1'
    casting: 1 action
    components: Verbal, somatic, material (an oak leaf, which is not consumed)
    range: Touch
    duration: 1 hour
    effect: 'Touch a willing creature and bless its skin with the resilience of bark. It gains a +1 bonus to AC
      for the duration. The blessing provides no benefit while the creature wears heavy armor; removing the heavy
      armor restores the benefit if the duration has not expired.


      This spell grants no additional Block or temporary health. Multiple castings of Barkskin on the same creature
      do not stack.'
    higher_levels: Each spell-slot level above 1st lets you bless one additional willing creature that you touch
      as part of the same casting.
    design_notes: Oath classification, a simple +1 AC bonus and excluding heavy armor follow the review. The source's
      one-hour duration, reusable leaf and additional-target upcasting are preserved. Barkskin is a proposed name;
      no current spell with that exact name exists in the catalog. Suspending rather than ending the blessing while
      heavy armor is worn is a proposed timing clarification.
    final-answer: I changed it to mystic. Oath is not exactly nature themed. Otherwise its approved and should be incorporated.
  related_spells:
  - name: Chant
    group: Oath cantrips
    notes: Existing short-lived +1 AC aura. This draft instead spends a slot for a one-hour blessing with a heavy-armor
      restriction.
  - name: Rune of protection
    group: Mystic cantrips
    notes: Existing protective-rune effect; compare numerical stacking across traditions before approving another
      +1 defense.
  questions:
  - Keep the proposed Barkskin name or retain Leaf Armor?
  - Should wearing heavy armor suspend the bonus as drafted, or end the spell immediately?
- name: Monolith's Mercy
  status: needs-design
  decision: Keep the idea of an area temporary-health Oath blessing for design review; strip the incidental earth
    theme and compare current single-target and area protections first.
  related_spells:
  - name: Temperance
    group: Oath spells
    notes: Existing single-target temporary-health blessing; no exact area equivalent asserted.
  - name: Bestow might
    group: Oath spells
    notes: Existing temporary health plus physical support.
  questions:
  - What area, temporary-health amount, duration, and slot distinguish it from current blessings?
  final-answer: Alright then, set it to 1d3 + casting bonus to all allies within 20ft, change it to Bestow Comfort as a name and the duration to 10 minutes. Ally amount cannot exceed casting bonus + 1(min 2.)
- name: Petrified Pirrouette
  status: rejected
  decision: Reject the standalone dance-based spell; reserve dance casting for a Bard archetype or a specific feature
    if pursued.
- name: Sandstorm Scourge
  status: merge
  decision: Consolidate the sandstorm into a broader atmospheric spell or terrain-dependent storm option; the current
    standalone low-level Mystic blast is rejected.
  related_spells:
  - name: Ethermancy
    group: Arcane spells
    notes: Existing controlled gust and atmospheric modes.
  - name: Storm
    group: Mystic spells
    notes: Existing broader weather-dependent storm spell.
- name: Sand's Shift
  status: rejected
  decision: Reject the sand-themed automatic miss and teleport package. Retain the reaction-mobility goal for comparison
    with existing reaction movement rather than assume that function is absent.
  related_spells:
  - name: Ethermancy
    group: Arcane spells
    notes: Draft-jump already allows reaction movement without automatic miss or teleport.
  - name: Aspect of the hawk
    group: Mystic spells
    notes: Soaring leap already permits reaction movement.
  - name: Shadowwarp
    group: Occult spells
    notes: Conditional reaction teleportation while unobserved; does not cancel an incoming hit.
- name: Stone's Resilience
  status: merge
