    from immediate Oath healing and the existing lower-level Regeneration.
  conversion:
    name: Bloomheal
    magic_class: Mystic
    level: '4'
    casting: 1 action
    components: Verbal, Somatic, Material (an emerald worth at least 500 gold, held against the target)
    range: Touch
    duration: Concentration, up to 2 minutes
    effect: Touch a willing living creature and stimulate its natural healing. It immediately regains 4d8 + casting
      bonus HP, then regains 1 HP at the start of each of its turns while the spell continues. If you maintain concentration
      for the full 2 minutes, the target regrows any limbs, digits or other ordinary body parts lost before the
