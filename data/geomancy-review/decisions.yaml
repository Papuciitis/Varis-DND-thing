- name: Genesis
  status: needs-design
  decision: Verify the suspected duplicate before making a design decision. Existing Subdomain is a temporary local
    overlay, not a persistent independent demiplane like this source.
  related_spells:
  - name: Subdomain
    group: Arcane spells
    notes: Temporary local overlay, not a persistent independent demiplane.
  questions:
  - Is a persistent demiplane deliberately excluded, or should it become a distinct high-level ritual? Subdomain
    is temporary and local.
  final-answer: Yes, it is actually deliberately excluded. Same reason why most things are bounded. Magic should not vaporize the setting. Creating extra dimensions is reserved for a lvl12+campaign or to demonstrate the strength of higher or other powers in the campaign. So in essence, this should be rejected. It doesnt mean "no" extra planes  can exist. It doesnt mean you cant step into a side pocket for a bit or whatever in some other spell, but this one is rejected.
