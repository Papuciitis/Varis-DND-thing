- name: Stone's Immunity
  status: draft
  decision: Draft the suggested stoneskin at the conservative Mystic 5 level and give its strong physical protection
    a visible mobility cost.
  conversion:
    name: Stoneskin
    magic_class: Mystic
    level: '3'
    casting: 1 action
    components: Verbal, Somatic, Material (A gestone or higher metal dust worth 100gp, which is consumed.)
    range: Touch
    duration: Concentration, up to 1 minute
    effect: Touch one willing creature, covering it in a heavy stone shell. For the duration, it is immune to bludgeoning,
      piercing and slashing damage from nonmagical attacks. Magical attacks and other damage types affect it normally.
      The shell halves its movement speed, and it cannot fly or jump while the shell remains. The shell grants no
      bonus to AC, but does grant a +3 bonus to block checks. The creature may shed it as an action, ending the spell on itself.
    higher_levels: When cast using a 6th-level spell slot, you may affect two willing creatures touched as part
      of the same casting. Concentration maintains both shells, and either creature may end only its own shell.
    design_notes: The review suggests Mystic 4 or 5 with extra bulk or another cost. Level 5, consumed dust, halved
      speed, no flying or jumping and action-based shedding are proposed interpretations. The narrow immunity remains
      limited to nonmagical attacks, as in the source; it is not general immunity to falls, hazards or spells.
  questions:
  - Should this use immunity with these drawbacks at Mystic 5, or resistance with a lower slot level?
  final-answer: Actually this is true it should be a lvl 3 spell. I incorporated that in. Also changed it to grant a +3 bonus to block checks.
