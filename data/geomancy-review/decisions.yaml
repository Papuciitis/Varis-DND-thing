    notes: Existing self temporary-health protection.
- name: Wind's Guidance
  status: needs-design
  decision: Resolve the ability-enhancement family together. The original grants Dexterity checks, not saving throws,
    so the trap-avoidance concern needs separate examination.
  questions:
  - Is the objection to Dexterity checks, or to saves the original does not grant?
  - Should the attribute-boost family become one spell, options within a spell, or remain distinct existing effects?
  final-answer: reject for now. ill decide that later myself.
- name: Zephyr's Shield
  status: rejected
  decision: Reject another concentration AC bonus differentiated mainly by a distance limit; preserve the author's
    pass verdict.
- name: Blossom Shield
  status: draft
  decision: Recast the protective retaliation effect as an Occult 1 spell; keep concentration and give it a distinct
    identity from a stone armor spell.
  conversion:
    name: Thornmantle
    magic_class: Occult
    level: '1'
    casting: 1 action
    components: Verbal, somatic, material (petals and thorns worth 15 gold, not consumed)
    range: Self
    duration: Concentration, up to 1 minute
    effect: 'Wrap yourself in a mantle of spectral thorns. For the duration, gain a +2 bonus to AC.

      Whenever a creature within 5 feet deals damage to you with a melee attack, the mantle deals 1d6 piercing damage
      to that creature. This retaliation requires no action and is resolved after the attack''s damage. 


      Casting this spell again ends your previous Thornmantle.'
    higher_levels: When cast with a 3rd-level or higher slot, retaliation damage becomes 2d6. With a 5th-level or
      higher slot, it becomes 3d6. The AC bonus remains +2.

      At 2nd spell level, duration becomes 10 minutes.
      At 4th spell level, the spell no longer requires concentration.
    design_notes: The reviewer proposed Occult 1 and retained concentration. The damage-on-injury trigger, 5-foot
      limit, nonconsumed component and damage increases at slots 3 and 5 are proposed balancing details, rather
      than author-approved rules. Retaliation adds no automatic damage to a successful block that prevents all damage.
  final-answer: Approved with some slight changes already implemented in the proposed conversion. 
    
  related_spells:
  - name: Shield of pain
    group: Occult spells
    notes: Existing reactive damage aura for comparison; Thornmantle offers personal AC and only punishes nearby
      damaging melee attacks.
  questions:
  - Is +2 AC plus this retaliation appropriate at Occult 1, or should the AC bonus be +1?
  - Should the material be consumed instead of functioning as a reusable focus?
- name: Boulder Burst
  status: rejected
  decision: Reject the repeated rock-cylinder blast and undefined ongoing concentration behavior instead of promoting
    another area-damage reskin.
- name: Crystalize
  status: draft
  decision: Keep a lesser crystallization concept as Occult 2, rename it to avoid the existing Arcane Crystallize,
    and use the actual Hobbled condition instead of importing a new restrained condition.
  conversion:
    name: Crystal Blight
    magic_class: Occult
    level: '2'
    casting: 1 action
    components: Verbal, somatic
    range: 60 feet
    duration: Up to 1 minute
    effect: 'Cause brittle crystals to spread over a creature you can see within range. The creature makes a Constitution
      save against your spell DC. On a failure, it takes 2d8 + casting bonus piercing damage and becomes Hobbled
      for up to 1 minute. On a success, it takes half damage and is not Hobbled.


      At the end of each of its turns, an affected creature repeats the Constitution save, ending the Hobbled effect
      on a success. Ending or removing Hobbled also causes the crystals to crumble. They have no value and cannot
      be harvested.


      This spell does not petrify a creature or permanently injure its limbs.'
    higher_levels: Each slot level above 2nd adds 1d8 initial damage. Duration and the Hobbled condition do not
      increase.
    design_notes: Occult 2 was one of the reviewer's alternatives. Hobbled uses the existing Varis condition, which
      is stronger than merely halving speed. The repeat save, one-minute limit and casting bonus are proposed balancing
      choices. The reviewer's permanent-injury idea would be a separate higher-level decision, not an automatic
      addition to this draft.
  related_spells:
  - name: Crystallize
    group: Arcane spells
    notes: Existing Arcane 6 spell; its damage and possible permanent petrification are not replaced by this lesser
      Occult proposal.
  questions:
  - Does V. prefer this temporary Occult 2 version or a separately designed Occult 3 injury that requires restoration?
  final-answer: This is approved.
- name: Desert's Wrath
  status: merge
  decision: Consolidate sandstorm damage into the atmospheric/storm family instead of duplicating Sandstorm Scourge
    at another level.
  related_spells:
  - name: Ethermancy
