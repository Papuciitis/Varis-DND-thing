- name: Rocky Resilience
  status: draft
  decision: Provide a conservative Mystic 6 defensive draft rather than importing the original repeated ability-modifier
    scaling. Its acceptance and exact protection remain an author decision.
  conversion:
    name: Seal of protection
    magic_class: Oath 5
    level: '6'
    casting: 1 action
    components: Verbal, Somatic, Material (a piece of unworked stone touched to the target)
    range: Touch
    duration: Concentration, up to 1 hour
    effect: Touch one willing creature and attune its flesh to the steadiness of stone. It is granted 3 temporary block, and for the duration, it gains
      a fixed +3 bonus to AC. If another spell grants it a numerical bonus to AC, it uses the largest of those spell
      bonuses rather than adding them together. Its ordinary armor, shield and class AC rules still apply.
      
    design_notes: The author floated Mystic 6 after rejecting unrestricted Wisdom stacking at lower levels. A fixed
      +3, one target, no spell-bonus stacking and no additional block benefit are proposed safeguards; the source
      instead added the caster's modifier and allowed extra upcast targets. This draft is deliberately awaiting
      an assessment of whether AC alone merits a level 6 slot.
  related_spells:
  - name: Aegis
    group: Arcane spells
    notes: Existing defensive spell rewards retaining temporary Block rather than adding AC.
  - name: Mage knight armor
    group: Arcane spells
    notes: Existing Arcane 5 armor enhancement provides several benefits and is a useful high-level defense comparison.
  questions:
  - Is a fixed +3 to AC enough for Mystic 6, or should the concept be rejected or incorporated into the proposed
    high-level stone form instead?
  final-answer: >-
    I actually want to specifically commend the wording for the spell AC stacking. this should be incorporated for most spells that just give you AC straight up, with very few exceptions(but probably some.) I would say this would be more of a lvl 5 mystic spell. I changed the name.
    I also changed it to grant 3 block. Reworked it to Seal of protection and switched it to oath.
