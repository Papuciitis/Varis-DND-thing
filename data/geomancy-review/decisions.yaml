- name: Boulder Blast
  status: draft
  decision: Develop the reviewer's Oath siege-projectile idea at level 3, requiring an existing boulder rather than
    creating a themed area blast from nothing.
  conversion:
    name: Siege Stone
    magic_class: Oath
    level: '3'
    casting: 1 action
    components: Verbal, somatic, material (one loose nonmagical boulder between 100 and 1,000 pounds, within reach)
    range: Touch the boulder; launch up to 120 feet
    duration: Instantaneous
    effect: 'Touch a loose boulder and launch it toward a point you can see within 120 feet. It follows a direct
      path and strikes the first substantial obstruction in that path; it cannot travel through a solid barrier
      to reach your chosen point.


      At impact, the stone shatters. Each creature within 10 feet of the impact makes a Dexterity save against your
      spell DC, taking 5d6 + casting bonus bludgeoning damage on a failure or half on a success. A creature may
      instead attempt a block check against your spell DC, taking half damage on a successful block. It chooses
      one defense and cannot attempt both.


      The impact deals double damage to unattended structures in the area. The stone remains as ordinary debris;
      the spell creates no additional stone.'
    higher_levels: Each slot level above 3rd adds 1d6 impact damage. The impact radius and maximum boulder weight
      remain unchanged.
    design_notes: The reviewer suggested Oath 3 or 4 for a catapult-like spell; this draft selects 3 provisionally.
      Requiring a real boulder and a clear trajectory supplies its environmental cost. The weight band, casting
      bonus, block option and structural damage are new proposal details informed by the current Geomancy pillar
      attack.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Pillar resonance already launches stone and doubles structural damage; compare the required material,
      action economy and area.
  questions:
  - Does the material and trajectory constraint justify Oath 3, or should V. choose Oath 4?
  - Should a successfully blocked impact reduce damage to zero instead of half under the table's preferred spell-block
    convention?
  final-answer: I approve. block shouldnt reduce to zero, as its a catapult boulder. Nobodys that tough.
- name: Earth's Echo
  status: draft
  decision: Consolidate the Earth's Echo and Earth's Eyes sensing concepts into one concentration-based Mystic 3
    ritual, with higher-slot range instead of separate spells.
  conversion:
    name: One with the land
    magic_class: Mystic
    level: '3'
    casting: 10 minutes (ritual; spends a spell slot)
    components: Verbal, somatic, material (a handful of local earth or stone, not consumed)
    range: Self; sensing radius 500 feet
    duration: Concentration, up to 1 hour
    effect: 'Complete the ritual and spend a spell slot of 3rd level or higher. Attune your senses to movement carried
      through earth and stone. While you remain in contact with a connected mass of either material, you can sense
      the location of creatures moving in contact with that same mass within 500 feet.

      For the duration of the casting, you must willingly become blinded and close your other senses off from the world.

      Airborne creatures, creatures separated from the connected material, and completely motionless creatures produce
      no location for this sense. It does not provide sight, reveal a creature''s identity, translate conversations,
      read writing or engravings, but it can give you an accurate idea of maps and caverns within it, as well as solid blobs
      and pockets of other material.

      Losing contact with the ground suspends the sense until contact is restored; it does not by itself end concentration.
      Ending concentration ends the sense.'
    higher_levels: The sensing radius is 750 feet with a 4th-level slot, 1000 feet with a 5th-level slot, and 5000
      feet with a 6th-level slot. The maximum duration remains 1 hour.
    design_notes: Mystic 3, concentration and an approximately 1,000-foot radius at slot 6 follow the review. The
      source's 500-foot base radius is retained. The one-hour maximum, intermediate radii and movement-only sensing
      limitations are proposed implementation details. Earth's Eyes should reference this same candidate rather
      than creating another tremorsense spell. Spending a spell slot despite the ritual casting time is a provisional
      cost for this draft, not a ruling about Varis rituals generally.
  questions:
  - Is a 500-foot base radius appropriate with these limitations, or should its initial range be reduced?
  - Should concentration last the source's 8 hours instead of the proposed 1 hour?
  - Should this ritual spend a spell slot as drafted, or should V. define a different ritual cost?
  final-answer: made changes and now its approved. 
