    range: 60 feet
    duration: Concentration, up to 1 minute
    effect: 'Choose one Large or smaller creature you can see within range. It makes a Dexterity save against your
      spell DC. On a failure, a cage of sharp crystal forms around it: it is Snared, and takes 4d6 piercing damage
      at the start of each of its turns. It can use an action to attempt a Strength check against your spell DC,
      breaking the cage and ending the spell on a success. The cage can also be attacked; it has AC 15 and 40 HP.
      Destroying it ends the spell without dealing extra damage to the prisoner. The cage permits air and sight
      and does not block spells or attacks that otherwise have a clear path through its gaps. A creature that teleports
      out of the cage escapes and ends the spell. On a successful initial save, no cage forms and the creature takes
      no damage.'
    higher_levels: When cast using a 6th-level spell slot, the ongoing damage increases to 5d6 piercing damage and
      the cage has 60 HP.
    design_notes: The review specifies Arcane 5. Snared uses the current movement condition rather than assuming
      a 5e Restrained condition. Large-or-smaller targeting, an action-based Strength escape, cage AC/HP and teleport
      escape are proposed completions of missing source procedures. Reaching 0 cage HP never causes an additional
      burst.
  related_spells:
  - name: Crystallize
    group: Arcane spells
    notes: Existing Arcane 6 is a damaging transformation with several conditions and possible permanent petrification;
      this proposal creates an external breakable cage instead.
  questions:
  - Should the breakable cage target larger creatures when upcast, instead of increasing its damage?
  final-answer: I think the size increase should be added to it at higher levels, but the damage effect can stay. Its very Glintstone-y so it works.
- name: Highland's Rise
  status: draft
  decision: Recast the source as Mystic 5 earthworking rather than calling a 100-foot landform a mountain, with
    a specific sixth-level expansion.
  conversion:
    name: Raise Highland
    magic_class: Mystic
    level: '5'
    casting: 1 minute
    components: Verbal, Somatic, Material (a piece of mountain rock worth at least 500 gold)
    range: 500 feet
    duration: Instantaneous; the resulting landform is permanent
    effect: 'Choose a continuous area of natural earth or stone you can see within range, up to 100 feet across.
      Reshape its upper surface into one broad hill, ridge, terrace or plateau up to 100 feet higher than its original
      surface. The new surface must remain attached to and supported by the surrounding ground. Creatures on it
      are carried with the surface into unoccupied space without falling or taking damage from the reshaping itself;
      if no such arrangement is possible, that part of the ground is unchanged. The spell cannot be centered inside
      a constructed building, move manufactured structures, crush buried creatures, or grow through an existing
      solid barrier. It creates no ore, gems, finished masonry or machinery. Once formed, the landform is ordinary
      terrain: dispelling does not remove it, and excavation, erosion or later magic can alter it normally.'
    higher_levels: When cast using a 6th-level spell slot, the chosen area may be up to 200 feet across and its
      surface may rise up to 200 feet above its original height.
    design_notes: The review specifies Mystic 5 terraforming and a sixth-level upgrade. The source's 100-foot base
      and 200-foot first upgrade are retained at the new slot levels. Natural-ground-only, stable support, safe
      displacement and constructed-structure limits are proposed safeguards. This is terrain reshaping, not an instantaneous
      damaging eruption.
  related_spells:
  - name: Greater geomancy
    group: Arcane spells
    notes: Existing Arcane 5 manipulates a smaller stone segment with several repeatable effects.
  - name: Structure
    group: Arcane spells
    notes: Existing Arcane 6 handles manufactured materials, mechanisms and fortifications; this draft deliberately
      leaves those uses to that spell.
  questions:
  - Should Mystic 5 be permitted to reshape land supporting existing buildings, with GM-resolved structural consequences,
    or should the natural-site restriction remain?
  final-answer: Hmm... I think its fine for now. I approve it as it is currently. Perhaps land that is not natural(that contains worked or owned structures) should require an arcana or wisdom check to push successfully, implying this somehow translates to feeling weight for the caster. Hell idk, it probably oes considering things like the shadowfell and ethereal plane mimic structures in the mundane world, at least in the old setting. 
