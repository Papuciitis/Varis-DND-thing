geomancy_decisions:
- name: Breeze Whisper
  status: draft
  decision: Keep the short-message concept as a Mystic cantrip. Define delivery and failure without turning it into
    a creature-location oracle.
  conversion:
    name: Breeze Whisper
    magic_class: Mystic
    level: '0'
    casting: 1 action
    components: Verbal, somatic
    range: 120 feet
    duration: Instantaneous
    effect: 'Whisper a message of up to twenty-five words to a creature whose voice you know. The creature must
      be within range, but you do not need to see it. A faint current of air carries your words around corners and
      through openings to the recipient, which hears them as a whisper. It can immediately whisper one reply of
      up to twenty-five words along the same route. The spell does not translate either message.


      An open route through air must connect you and the recipient. The current cannot pass through a solid barrier
      or an area that prevents sound. A creature that cannot hear receives no message. If the recipient is absent,
      out of range, unreachable, or chooses not to reply, you receive no reply and learn no reason for the silence.'
    design_notes: The Mystic category follows the review. The air route, audible delivery, language limit and indistinguishable
      failure are proposed clarifications; the original uses mental delivery. Range and word limits are preserved.
      No combat bonus or automatic location information is granted.
  questions:
  - Should delivery remain mental as in the source, or use the proposed audible wind-whisper?
- name: Blossom Burst
  status: merge
  decision: Explore a nature-focus burst as an optional mode of a broader druidic staff spell; do not retain a separate
    reskinned blast.
  related_spells:
  - name: Druidic staff
    group: Mystic spells
    notes: Existing multi-mode Mystic staff enchantment; no new mode is granted.
- name: Boulder Pugilist
  status: merge
  decision: Fold stone fists into a broader stone-armor transformation and check extra unarmed attacks before setting
    damage or scaling.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Stonemail and Cragblade already support stone armor and fist or weapon enhancement.
- name: Honed Stones
  status: merge
  decision: Fold the hazardous stone-ground effect into broader geomancy, with an explicit save and damage trigger
    required for any proposed mode.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Geomantic shaping already supports damaging difficult terrain.
- name: Rolling Stones
  status: merge
  decision: Consolidate moving stone hazards into broader geomancy rather than a separate known spell.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Pillar resonance already launches stone hazards.
- name: Wind's Gust
  status: merge
  decision: Fold the gust effect into existing atmospheric magic rather than create a separate air-bending spell.
  related_spells:
  - name: Ethermancy
    group: Arcane spells
    notes: Existing atmospheric manipulation.
  - name: Greater windbinding
    group: Arcane spells
    notes: Existing broad wind control.
- name: Boulder Roll
  status: merge
  decision: Preserve the moving-hazard idea as a possible broader geomancy mode; it needs a distinct extra function
    before a standalone draft is justified.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Potential design home; no new mode granted.
- name: Earthbound Echo
  status: merge
  decision: Consolidate reaction restraint/slow concepts with the earth-binding family rather than keep a fourth-level
    half-speed reskin.
  related_spells:
  - name: minor geomancy
    group: Arcane cantrips
    notes: Existing Earthbind restraint; action and save model differ.
- name: Rockplica
  status: draft
  decision: Replace the overlapping Arcane-copy concept with V.'s requested Occult 4 Clay Simulacra iteration. This
    remains a pending proposal, not an approved spell; the health cost, material value, resource accounting and
    copying details below are concrete choices for V. to review.
  conversion:
    name: Clay Simulacra
    magic_class: Occult
    level: '4'
    casting: 1 hour
    components: Verbal, somatic, material (enough clay to shape a body your size, mixed with powdered silver worth
      500 gold and a drop of your blood; consumed)
    range: Touch the clay; unlimited control range
    duration: 1 day
    effect: 'Shape the clay into one living likeness of yourself throughout the casting.

      On completion, spend the spell slot and lose health equal to one-third of

      your maximum health, rounded up. This cost cannot be reduced, redirected or

      paid with temporary health, and you must have enough current health to pay

      it while retaining at least 1 health. The clay then becomes your simulacrum.


      It copies your permanent creature statistics, proficiencies, memories,

      known spells and class features at the completion of casting, before

      temporary modifiers. Its maximum and starting health are one-third of your

      maximum health at that time, rounded up. Choose two different attributes:

      it gains +2 to one and +1 to the other. These bonuses do not change its fixed

      maximum health. Later changes to your statistics do not update the copy.


      The simulacrum has its own turn, actions, bonus actions and reactions. It

      can perform the actions available to you when it was created, using its own

      statistics and resources and meeting their normal requirements. You can

      give it mental instructions at any distance, with no control-range limit;

      distance does not end the spell. This command link does not share senses

      or let either of you originate actions or spells from the other''s body.


      After you pay this casting''s costs, separately count each remaining class

      resource pool, including each spell-slot level and each rest-die type. The

      simulacrum receives its own pool equal to half that remaining amount,

      rounded down. These are independent resources: its use does not spend

      yours, and yours does not spend its resources. A copied pool''s maximum is

      its starting amount. It copies only spell slots of levels 1 through 3 and

      cannot cast a spell above 3rd level by any means, including a ritual or an

      item. It therefore cannot cast Clay Simulacra itself.


      The simulacrum cannot recover or replenish copied class resources or spell

      slots through rests, restoration effects, conversion of other resources,

      or any other means. Its remaining resources cannot be transferred back to

      you. Its health can be restored normally up to its fixed maximum; this

      does not restore any other resource. It learns no new spells or features.


      Equipment and magic items are not duplicated. Any apparent clothing or

      belongings formed from its clay are part of its body, have no independent

      value or item function, and cannot supply material components. Provide real

      equipment and components for actions that require them; consumed components

      are consumed normally. Real items given to it remain when the spell ends.


      The simulacrum collapses into ordinary clay when reduced to 0 health or

      when the duration ends. More than one of your clay simulacra can exist at

      once, subject to the GM: they are known to conspire.'
    higher_levels: A 5th-level slot gives a duration of 3 days; a 6th-level slot gives a duration of 7 days. Higher
      slots do not increase its health, copied resources or maximum spell level, and do not refresh its resources.
    design_notes: Occult 4, the one-hour casting, one-day base duration, unlimited control range, one-third health
      rounded up, third-level spell ceiling, half class resources, two distinct attribute bonuses, significant component,
      health cost, longer higher-slot durations and GM conspiracy clause follow V.'s request. Using maximum rather
      than current health, charging one-third of maximum health, consuming 500 gold of silver with the clay, the
      3/7-day scaling, mental command delivery, independent turns, the permanent-statistic snapshot and fixed health
      after attribute bonuses are provisional choices. Half of each remaining pool after casting, rounded down,
      is a proposed interpretation of half resources; it does not grant half the caster's full capacity when those
      resources are already spent. No resource recovery, no new learning and no copied equipment are proposed limits
      on independent spell replication. None of these choices establishes a rule for other spells, resource recovery,
      rituals or copies. This iteration awaits V.'s approval and must remain outside the normal spell lists.
  final-answer: 'It doesnt differ and arcane is the only real place where this could be useful. I do propose
    this be reworked for occult in the following ways: The spell is not limited to a range, but it has 1/3 your
    HP rounded up(for funsies) and can do your actions, but cannot cast spells beyond 3rd level and has  1/2 of
    your  class resources (spell slots, rest dice, etc.) but instead it has a +2 bonus to an attribute of choice
    and a +1 bonus to another. This kind of power would fit a lvl 4 occult spell. Something like clay simulacra.
    It should have an HP cost and the duration should be 1 day but the casting time should be 1 hour and require
    something significant. higher levels can increase the duration. And there should be a "subject to GM" clause
    in there about having more than one clay simulacra because they are known to conspire, or something, with like
    no further explanation as both flavor and a gm clause source for the GM to intervene if it gets abused. After
    all, its essentially spell replication. This is like the one spell so far in the list that I dont either reject
    or approve, and actually would like an iteration for. the rest are either approved, or rejected if input was
    requested.'
  questions:
  - Approve losing one-third maximum health, rounded up, while retaining at least 1 health, plus consumed clay and
    500 gold of powdered silver; or what health cost and significant component should replace them? Should the copy's
    one-third health use maximum health as proposed, or current health?
  - Should half resources mean half of each remaining pool after casting, rounded down separately by slot level
    and rest-die type, with no recovery as proposed? A pool with only one use therefore supplies no use to the copy.
    Confirm that spent caster resources do not reappear in the copy.
  - 'Approve the copying rules: permanent statistics and memories at completion, two distinct attribute bonuses,
    fixed maximum health, independent turns, normal requirements and real equipment, no learning or resource recovery,
    and no casting above level 3 from any source? Which parts should differ?'
  - Approve the proposed mental command link without shared senses, 3-day and 7-day higher-slot durations, and the
    brief GM clause allowing multiple clay simulacra that are known to conspire?
- name: Temblor
  status: needs-design
  decision: The earlier AI disposition treated criticism as a rejection. The original author did not give a clear
    final verdict, so this spell remains for attention.
- name: Bloomguard
  status: needs-design
  decision: V. began a new staff-and-plant version, but the latest note ends mid-sentence. Keep the unfinished design
    here; no new spell has been approved.
  questions:
  - Finish the author note after 'As an action, using a staff, po'.
  - Confirm the plant size, duration, HP, damage reduction and regeneration, plus its magic class and level.
  final-answer: "try this. I had a conversation with N about it and he described it as follows:\n  You would\
    \ cause a plant to sprout in a valid tile, growing up to some size, with basically a ton of HP, DR, and regeneration,\
    \ so that mechanically you can take it down\n  in simple terms, but its a tunnel blocker or a bridge or a pillar/support\
    \ to use in addition to being hard to break.\n\nMy idea is this:\n  As an action, using a staff, po"
- name: Boulder's Dominion
  status: merge
  decision: Consolidate permanent stone shaping with greater geomancy and construction magic; compare permanence
    and volume rather than assume exact equivalence.
  related_spells:
  - name: Greater geomancy
    group: Arcane spells
    notes: Existing stone restructuring; permanence and volume need comparison.
  - name: Structure
    group: Arcane spells
    notes: Existing structure alteration with concentration duration.
- name: Dunedash
  status: needs-design
  decision: Rework with the Occult transformation family; the review leaves level 4, 5, or 6 open and has not established
    its distinction from Vermin-form.
  related_spells:
  - name: Vermin-form
    group: Occult spells
    notes: Existing dispersal-transformation comparison; a sand reskin is not automatically distinct.
  questions:
  - What distinguishes sand dispersal from Vermin-form, and should its slot be 4, 5, or 6?
- name: Earth's Awakening
  status: needs-design
  decision: Keep in the design queue because the author requests work without specifying acceptable mechanics, category,
    or level.
  questions:
  - Which source functions survive, with what category, slot, and control limits?
- name: Geochemical Golem
  status: needs-design
  decision: Preserve the material-infusion system as a candidate, but redesign summoning and scaling for twelve
    character levels and consolidate elemental options first.
  questions:
  - Can material-infused creatures remain monster options under a consolidated summon?
  - Which template, commands, costs, and scaling fit character levels 1-12?
- name: Geomorpher's Stone Servant
  status: merge
  decision: Consolidate elemental and construct servants with existing summon options rather than add many separate
    earth-elemental spells.
  related_spells:
  - name: Summon elemental
    group: Arcane spells
    notes: Existing multi-element summon with an earth option.
  - name: Mud servant
    group: Occult spells
    notes: Existing material-based construct servant.
- name: Lithic Luminary
  status: needs-design
  decision: Keep an Oath 5 anti-magic sanctuary as a design candidate, with the review's request for a broader consecration
    identity and a comparison against current Consecrate before assigning new benefits.
  related_spells:
  - name: Consecrate
    group: Oath spells
    notes: Existing Oath 6 consecrates an area with protection and restoration benefits; a narrower Oath 5 ward
      needs a clear distinction.
  - name: Warding rune
    group: Oath spells
    notes: Existing warding aura baseline.
  questions:
  - What protection beyond advantage against spells should justify this Oath 5 ward?
  - Should the existing hour-long duration require concentration, and is the gemstone consumed or reusable?
  - What benefit, cost, and vulnerability distinguish it from Warding rune and Consecrate?
- name: Rockrise
  status: draft
  decision: Keep the interesting extension of existing stone as a Mystic 3 utility spell, with an explicit size,
    lifetime and durability formula.
  conversion:
    name: Rockrise
    magic_class: Mystic
    level: '3'
    casting: 1 action
    components: Verbal, Somatic, Material (an existing stone object or stone surface that is touched)
    range: Touch
    duration: 1 hour
    effect: Touch a nonmagical stone object or continuous stone surface. Grow one attached extension fitting inside
      a 5-foot cube, such as a step, support, simple barrier, bridge segment or blunt tool. The extension must remain
      attached to the touched stone when formed, must fit in unoccupied space and cannot grow inside a creature
      or object. It cannot create machinery, writing, precious minerals or a magically enhanced weapon. Its AC is
      10 + your casting bonus and its HP is 10 times the sum of your character level and casting bonus, with a minimum
      of 10 HP. Damage affects the extension rather than the original stone unless an effect also reaches that stone.
      When the spell ends, the added stone crumbles into ordinary dust; the original stone remains. Detached fragments
      also crumble and cannot be used to produce permanent material.
    higher_levels: Each spell slot level above 3rd adds one adjacent 5-foot cube to the maximum extension and increases
      the extension's total HP by 10. The entire extension must be one connected simple shape.
    design_notes: The review specifies Mystic 3 and favors extending stone structures. Attachment, temporary material,
      unoccupied space and simple shapes are proposed limits. The source HP formula lacked parentheses; this proposed
      version explicitly chooses 10 times (character level + casting bonus), without changing the preserved original.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Existing Arcane 2 shaping alters available ground and has a different collection of combat options.
  - name: Greater geomancy
    group: Arcane spells
    notes: Existing Arcane 5 shaping works across a larger segment of stone and may be repeated.
  questions:
  - Is temporary magical growth distinct enough from the existing Geomancy options to warrant its own Mystic spell?
- name: Sand's Whirlwind
  status: merge
  decision: Consolidate with broader wind and storm magic rather than another standalone sandstorm.
  related_spells:
  - name: Ethermancy
    group: Arcane spells
    notes: Existing atmospheric manipulation.
  - name: Greater windbinding
    group: Arcane spells
    notes: Existing wind-control family.
  - name: Storm
    group: Mystic spells
    notes: Existing broader storm.
- name: Wind's Embrace
  status: merge
  decision: Compare missile protection with existing greater windbinding; consolidate any useful mode rather than
    grant another narrow projectile-denial spell.
  related_spells:
  - name: Greater windbinding
    group: Arcane spells
    notes: Wind wall already rejects projectiles.
- name: Bloomheal
  status: draft
  decision: Draft Mystic 4 as a single-target restorative treatment with delayed limb regrowth. Keep it distinct
    from immediate Oath healing and the existing lower-level Regeneration.
  conversion:
    name: Bloomheal
    magic_class: Mystic
    level: '4'
    casting: 1 action
    components: Verbal, Somatic, Material (an emerald worth at least 500 gold, held against the target)
    range: Touch
    duration: Concentration, up to 2 minutes
    effect: Touch a willing living creature and stimulate its natural healing. It immediately regains 4d8 + casting
      bonus HP, then regains 1 HP at the start of each of its turns while the spell continues. If you maintain concentration
      for the full 2 minutes, the target regrows any limbs, digits or other ordinary body parts lost before the
      casting. A severed part held against its matching wound instead reattaches when the spell is cast. The spell
      cannot revive a dead creature, replace a missing soul, or remove a disease or curse. It restores HP rather
      than Arcane Health or temporary HP.
    higher_levels: Each spell slot level above 4th adds 1d8 + 5 to the initial healing. A higher-level casting does
      not reduce the time needed to regrow a missing part.
    design_notes: The review specifies Mystic 4. This proposal replaces the source's flat +15 with casting bonus
      and its hour of ongoing healing with a 2-minute treatment; regrowing a full limb remains delayed. The original
      emerald is retained as a reusable material because the source does not consume it. These balance choices require
      V.'s approval.
  related_spells:
  - name: Regeneration
    group: Mystic spells
    notes: Existing Mystic 3 grants regeneration 1d6 for a minute and regrows digits and eyes; Bloomheal's proposed
      distinguishing benefit is larger missing parts after a longer treatment.
  - name: Greater heal
    group: Oath spells
    notes: Existing Oath 4 supplies immediate healing and limited revival.
  - name: 'Power word: Heal'
    group: Oath spells
    notes: Existing Oath 6 restores missing limbs immediately and has broader restorative effects.
  questions:
  - Should delayed full-limb regrowth remain a distinct Mystic 4 spell, or become a higher-slot option of Regeneration?
- name: Crystal Prison
  status: draft
  decision: Draft the requested Arcane 5 prison with defined escape rules instead of importing an indefinite restraint
    with no exit procedure.
  conversion:
    name: Crystal Prison
    magic_class: Arcane
    level: '5'
    casting: 1 action
    components: Verbal, Somatic
    range: 60 feet
    duration: Concentration, up to 1 minute
    effect: 'Choose one Large or smaller creature you can see within range. It makes a Dexterity save against your
      spell DC. On a failure, a cage of sharp crystal forms around it: it is Snared, and takes 4d6 piercing damage
      at the start of each of its turns. It can use an action to attempt a Strength check against your spell DC,
      breaking the cage and ending the spell on a success. The cage can also be attacked; it has AC 15 and 40 HP.
      Destroying it ends the spell without dealing extra damage to the prisoner. The cage permits air and sight
      and does not block spells or attacks that otherwise have a clear path through its gaps. A creature that teleports
      out of the cage escapes and ends the spell. On a successful initial save, no cage forms and the creature takes
      no damage.'
    higher_levels: When cast using a 6th-level spell slot, the ongoing damage increases to 5d6 piercing damage and
      the cage has 60 HP.
    design_notes: The review specifies Arcane 5. Snared uses the current movement condition rather than assuming
      a 5e Restrained condition. Large-or-smaller targeting, an action-based Strength escape, cage AC/HP and teleport
      escape are proposed completions of missing source procedures. Reaching 0 cage HP never causes an additional
      burst.
  related_spells:
  - name: Crystallize
    group: Arcane spells
    notes: Existing Arcane 6 is a damaging transformation with several conditions and possible permanent petrification;
      this proposal creates an external breakable cage instead.
  questions:
  - Should the breakable cage target larger creatures when upcast, instead of increasing its damage?
- name: Highland's Rise
  status: draft
  decision: Recast the source as Mystic 5 earthworking rather than calling a 100-foot landform a mountain, with
    a specific sixth-level expansion.
  conversion:
    name: Raise Highland
    magic_class: Mystic
    level: '5'
    casting: 1 minute
    components: Verbal, Somatic, Material (a piece of mountain rock worth at least 500 gold)
    range: 500 feet
    duration: Instantaneous; the resulting landform is permanent
    effect: 'Choose a continuous area of natural earth or stone you can see within range, up to 100 feet across.
      Reshape its upper surface into one broad hill, ridge, terrace or plateau up to 100 feet higher than its original
      surface. The new surface must remain attached to and supported by the surrounding ground. Creatures on it
      are carried with the surface into unoccupied space without falling or taking damage from the reshaping itself;
      if no such arrangement is possible, that part of the ground is unchanged. The spell cannot be centered inside
      a constructed building, move manufactured structures, crush buried creatures, or grow through an existing
      solid barrier. It creates no ore, gems, finished masonry or machinery. Once formed, the landform is ordinary
      terrain: dispelling does not remove it, and excavation, erosion or later magic can alter it normally.'
    higher_levels: When cast using a 6th-level spell slot, the chosen area may be up to 200 feet across and its
      surface may rise up to 200 feet above its original height.
    design_notes: The review specifies Mystic 5 terraforming and a sixth-level upgrade. The source's 100-foot base
      and 200-foot first upgrade are retained at the new slot levels. Natural-ground-only, stable support, safe
      displacement and constructed-structure limits are proposed safeguards. This is terrain reshaping, not an instantaneous
      damaging eruption.
  related_spells:
  - name: Greater geomancy
    group: Arcane spells
    notes: Existing Arcane 5 manipulates a smaller stone segment with several repeatable effects.
  - name: Structure
    group: Arcane spells
    notes: Existing Arcane 6 handles manufactured materials, mechanisms and fortifications; this draft deliberately
      leaves those uses to that spell.
  questions:
  - Should Mystic 5 be permitted to reshape land supporting existing buildings, with GM-resolved structural consequences,
    or should the natural-site restriction remain?
- name: Geomorph's Transendance
  status: needs-design
  decision: Consolidate the kaiju-transformation concepts before choosing an Occult 5-6 draft and defining its full
    stat and action package.
  questions:
  - Should giant-form ideas be one Occult transformation or a distinct Mystic Gianthood, and which effects survive?
- name: Peakforce
  status: needs-design
  decision: Evaluate a level 6 Mystic Gianthood concept alongside existing Primordial strength and other giant-form
    proposals before drafting.
  related_spells:
  - name: Primordial strength
    group: Mystic spells
    notes: Existing high-level physical enhancement with death-save costs.
  questions:
  - How does Gianthood differ from Primordial strength and the proposed Occult kaiju transformation?
- name: Stone's Simphony
  status: draft
  decision: Retheme the suggested Oath 4 group inspiration as a spoken invocation and retain its brief burst of
    advantage.
  conversion:
    name: Invocation of Concord
    magic_class: Oath
    level: '4'
    casting: 1 action
    components: Verbal, Somatic
    range: Self (30-foot radius)
    duration: Until the end of your next turn
    effect: Speak an invocation that draws nearby companions into common purpose. Choose yourself and up to five
      other willing creatures within 30 feet that can hear you. Each chosen creature gains advantage on attack rolls,
      saving throws and ability checks until the end of your next turn. A creature retains the benefit after leaving
      the radius. Additional castings overlap in duration but grant no further advantage to the same roll.
    higher_levels: Each spell slot level above 4th increases the initial selection radius by 10 feet and allows
      two additional creatures to be chosen.
    design_notes: The reviewer tentatively suggests Oath 4 with new theming. A spoken invocation, hearing requirement,
      six-creature base limit and 5th/6th-slot scaling are proposed interpretations. The source's brief advantage
      window is retained. This remains a candidate, not an author-approved addition.
  related_spells:
  - name: Major blessing
    group: Oath spells
    notes: Existing Oath 4 gives one creature a longer numerical bonus and a chance to remove an ongoing effect;
      this candidate trades duration for a group burst.
  questions:
  - Is a one-round group burst of advantage a useful alternative to Major blessing, or should this become its upcast
    option?
- name: Crystal Mirror
  status: draft
  decision: Draft the tentative Occult 5 reflection as an active held mirror with a reaction cost and slot ceiling,
    preserving the stronger existing Arcane reflection rune.
  conversion:
    name: Malefic Mirror
    magic_class: Occult
    level: '5'
    casting: 1 action
    components: Verbal, Somatic, Material (a hand-held polished mirror)
    range: Self
    duration: Concentration, up to 1 minute
    effect: 'Enchant a mirror held in one of your hands. While holding it, you may spend your reaction when a creature
      you can see casts a spell of 4th level or lower that directly targets only you. Turn the mirror toward the
      caster: you cease to be the target, and the original caster becomes the target instead if it is a legal target
      within that spell''s range measured from you. Resolve the spell using its original caster''s spell DC and
      other casting values. If the caster is not a legal target, the effect against you is negated. This reflection
      cannot affect an area spell, a spell with multiple targets, a continuing effect already on you, or a spell
      that has already been reflected. The enchantment ends if you stop holding the mirror, the mirror is destroyed,
      or you cast this spell again.'
    higher_levels: When cast using a 6th-level spell slot, the mirror may reflect a spell of 5th level or lower.
    design_notes: Occult 5 is a tentative review suggestion. The held focus, reaction cost, single-target trigger
      and exclusion of already reflected effects are proposed limits that replace the source's undefined facing
      and automatic reflection. Original casting values are reused; this is not a new casting by the mirror's wielder.
  related_spells:
  - name: Rune of reflection
    group: Arcane spells
    notes: Existing Arcane 6 reflects direct-target spells without this proposal's fourth-level ceiling and reaction
      limit, and lasts longer.
  questions:
  - Does Occult need this narrower reflection spell, or should it remain solely within Arcane Rune of reflection?
- name: Sandgrip
  status: merge
  decision: Consolidate the sandstorm restraint/damage concept with the storm family; its damage and repeated-trigger
    model still need author review.
  related_spells:
  - name: Storm
    group: Mystic spells
    notes: Potential terrain-dependent storm mode, pending design.
- name: Seismic Echo
  status: needs-design
  decision: Preserve the combo mechanic for design review, but define a worthwhile role, setup, range, and payout
    before choosing category or level.
  questions:
  - What setup, trigger, range, and payoff make the combo worthwhile?
- name: Geomantic Ascendancy
  status: draft
  decision: Draft the suggested Mystic 6 earth attunement as one readable paragraph, with explicit damage types
    and safe earth passage instead of broad undefined immunity.
  conversion:
    name: Geomantic Ascendancy
    magic_class: Mystic
    level: '6'
    casting: 10 minutes
    components: Verbal, Somatic, Material (an earth-encrusted diamond worth at least 5,000 gold, which is consumed)
    range: Self
    duration: Concentration, up to 1 hour
    effect: Attune your body to the earth. For the duration, while touching natural earth or stone, you have resistance
      to bludgeoning, piercing, slashing, acid, cold, fire and lightning damage; you can move through nonmagical
      natural earth and stone at a speed of 20 feet without leaving a tunnel; you sense the location of moving creatures
      touching the same continuous ground within 60 feet, although this sense does not let attacks or spells pass
      through barriers; and you can speak with and understand earth elementals. You must finish each turn in an
      unoccupied space outside solid material. If the spell ends while you are inside solid material, you are forced
      along the shortest route through material this spell permits you to enter to the nearest unoccupied space
      outside it; resolve equally short routes toward your entry route. Take falling damage as though you had fallen
      twice the distance you were forced to move. You do not become an elemental, gain immunity to damage, or pass
      through metal, worked masonry or magical barriers.
    design_notes: 'The reviewer suggests Mystic 6 with clearer numbers and likes the single-paragraph form. Concentration,
      resistance instead of immunity, the enumerated damage types, natural-material limits and 20-foot speed are
      proposed balance and clarity decisions. Forced exit follows the existing Varis Ethereal condition convention,
      matching the Earthwalk draft: nearest unoccupied space by the shortest permitted route, with falling damage
      based on twice the forced distance. Unlike Earthwalk, this draft still requires ending each turn outside solid
      material. The costly consumed diamond is retained. No free ritual casting is granted because current slot-free
      ritual rules for this new draft have not been confirmed.'
  related_spells:
  - name: Geomancy
    group: Arcane spells
