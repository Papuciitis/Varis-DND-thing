- name: Bloomguard
  status: needs-design
  decision: Clarify the vague protection and replace nearly-impossible language with actual rules before assigning
    a conversion category and level.
  questions:
  - What does nearly impossible mean mechanically, who is protected, and what ends or bypasses protection?
  final-answer: >- 
    try this. I had a conversation with N about it and he described it as follows:
      You would cause a plant to sprout in a valid tile, growing up to some size, with basically a ton of HP, DR, and regeneration, so that mechanically you can take it down
      in simple terms, but its a tunnel blocker or a bridge or a pillar/support to use in addition to being hard to break.

    My idea is this:
      As an action, using a staff, wand, polearm, or stick, tap a piece of dirt, soil, or mud, forcing a fungal or floral strain or microbe to mutate into a rapidly growing large organism. Its growth, size, and direction can be directed by the caster so long as they maintain the focus tool(staff, wand, polearm, or stick) used for this spell.
      The plant grows up to 3d4 rounds. 
      Each round plant grows, the caster can use an action to direct the new plant, allowing it to grow up to a 5ft cube worth of mass in an area of the casters choice.
      The caster may attempt a bonus action to also do it but that should be a DC 17 arcana or nature check.
      The caster may sacrifice a rest dice to force a 5ft area of the plant into a shape or function.
      If the caster is preoccupied and does not direct the plants growth, the GM decides (Subject to GM.)
      The plant has 200HP, AC 0, cannot block, fails all saves, but has resistance to all non-magical damage, regeneration 20, and if a a segment of it is destroyed, it will attempt to regrow and reconnect with itself within 1d3+1 rounds.
      The plant lasts up to 8 hours, after which it begins to suffer the adverse effects of its accelerated growth, becoming frail and rapidly mutating.
      Technically, due to its magically altered nature, it is closer to an algae or lychen, though its exact appearance and shape will adapt to the macroscopic world, resembling a weird tree, mushroom, or sponge-like structure.

    Please attempt to reincorporate this into a spell.

