- name: Rockrise
  status: draft
  decision: Keep the interesting extension of existing stone as a Mystic 3 utility spell, with an explicit size,
    lifetime and durability formula.
  conversion:
    name: Rockrise
    magic_class: Mystic
    level: '3'
    casting: 1 action
    components: Verbal, Somatic, Material (an existing stone object or stone surface that is touched)
    range: Touch
    duration: 1 hour
    effect: Touch a nonmagical stone object or continuous stone surface. Grow one attached extension fitting inside
      a 5-foot cube, such as a step, support, simple barrier, bridge segment or blunt tool. The extension must remain
      attached to the touched stone when formed, must fit in unoccupied space and cannot grow inside a creature
      or object. It cannot create machinery, writing, precious minerals or a magically enhanced weapon. Its AC is
      10 + your casting bonus and its HP is 10 times the sum of your character level and casting bonus, with a minimum
      of 10 HP. Damage affects the extension rather than the original stone unless an effect also reaches that stone.
      When the spell ends, the added stone crumbles into ordinary dust; the original stone remains. Detached fragments
      also crumble and cannot be used to produce permanent material.
    higher_levels: Each spell slot level above 3rd adds one adjacent 5-foot cube to the maximum extension and increases
      the extension's total HP by 10. The entire extension must be one connected simple shape.
    design_notes: The review specifies Mystic 3 and favors extending stone structures. Attachment, temporary material,
      unoccupied space and simple shapes are proposed limits. The source HP formula lacked parentheses; this proposed
      version explicitly chooses 10 times (character level + casting bonus), without changing the preserved original.
  related_spells:
  - name: Geomancy
    group: Arcane spells
    notes: Existing Arcane 2 shaping alters available ground and has a different collection of combat options.
  - name: Greater geomancy
