- name: Earth's Guidance
  group: Cantrips
  level: 0
  draft_note: Listed in the source index; spell description missing from the supplied PDF.
  description: The page-40 Geomorphy spell list includes Earth's Guidance, but the spell-body pages do not provide
    a description under this name. Casting time, range, components, duration and effects need author text before
    this entry can be evaluated or adapted.
  source_ref: draft2.pdf / PDF page 40
  source_notes: The separate Geomorpher's Compass body on page 41 is retained under its own title; no equivalence
    with Earth's Guidance is assumed.
