    hollow haft. Replace an attack during the Attack action with firing that bolt and spending one or more charges.
    No attack roll is made. The shot forms a 1-foot-wide line from you, 10 feet long plus 10 feet per charge spent.
    Creatures in it make a DC 15 Dexterity save, taking 1d6 piercing plus 1d6 lightning per charge on failure, or
    half on success. This area shot cannot be Blocked and gains no strike riders; the bolt is destroyed. If the
