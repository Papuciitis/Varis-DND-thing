    + your Strength modifier. On failure it is Grappled by a watery tether to the spear until you release it, move
    beyond the weapon''s long range or lose hold of the tether. It can escape as an action with a Strength check
    against that DC. As a bonus action, pull it up to 5 times your Strength modifier feet toward you, minimum 0.
    A barrier stops the pull and deals collision bludgeoning damage once: 1d4 + Strength modifier for half cover,
    1d4 + 2 + modifier for three-quarters cover, or 2d4 + 2 + modifier for total cover, minimum 0. This collision
    does not bypass the barrier or repeat without further movement.'
