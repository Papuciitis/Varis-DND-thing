    be Blocked.'
  conversion_notes: Retains the dangerous prototype failure and clearly separates its Varis weapon strike from area
    discharge and explosion.
  group: Rare
  rarity: Rare
  price: 4000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A31:D31
  original_5e: This halberd is a long-lost prototype from a now-dissolved military research facility. Electricity
    magically courses through the weapon along specially channeled grooves in its hollow haft. When you hit with
    an attack using this halberd, the target takes an extra 1d6 lightning damage This halberd has 10 charges and
    regains 1d6 + 4 expended charges daily at dawn. While the weapon has at least 1 charge, you can use an action
    to load a crossbow bolt into its haft toward the bottom of the weapon. Powerful magnetic forces inside the hollow
    weapon stabilize the bolt and charge it with electricity. When you take the Attack action while holding this
    loaded weapon, you can expend 1 or more of its charges to make a special ranged attack with it by leveling and
    firing the halberd as if it were a crossbow. When you do, you don’t make an attack roll for the attack, and
    the bolt is magically launched forward from the weapon in a 1-foot-wide line that’s 10 feet long, plus an extra
    10 feet for each charge you expend. Each creature in the line must succeed on a DC 15 Dexterity saving throw
    or take 1d6 piercing damage, plus 1d6 lightning damage for each charge you expend. On a successful save, a creature
    takes half as much piercing and lightning damage. After the attack, the bolt is destroyed. If you expend the
    halberd’s last charge, roll a d20. On a 1, the weapon becomes overcharged and splinters into an explosion of
    shrapnel, destroying the halberd. Roll a d10. Each creature within 10 feet of the weapon must make a DC 15 Dexterity
    saving throw. On a failed save, a creature takes 2d6 piercing damage times the number rolled on the d10, or
    half as much damage on a successful one.
  source_name: Prototype Thunderberd (halberd)
  source_price: 4000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Heavenly Chalice
  id: mi-rare-032
  type: Wondrous item
  desc: This 2-pound chalice holds one potion. Once per 24 hours, a Cleric, an oath caster or a creature with an
    established celestial bond can pray over a healing potion in it for 1 minute. The potion becomes a pool of HP
    equal to its maximum possible printed HP healing. Varis healing potions therefore provide 6, 12, 18 or 24 HP
    for their respective 1d6-4d6 strengths. Drinking from it takes an action; the drinker chooses how many pool
    HP to consume. The pool decreases by that amount even if healing is reduced or wasted. The potion vanishes at
    0 pool HP and loses sanctification after 24 hours, spilling or transfer to another vessel. It does not maximize
    temporary HP, arcane health, rest dice or other potion effects.
  conversion_notes: Uses current Varis healing-potion dice and distinguishes the HP pool from other healing resources.
  group: Rare
  rarity: Rare
  price: 1000 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A32:D32
  original_5e: This golden goblet is ornamented with 4 glimmering gems and stripes of jet and ivory. It weighs 2
    pounds and can hold the contents of one potion. When a potion of healing (of any rarity) is poured into the
    cup, a cleric, paladin, or other creature with a magical connection to a celestial can spend 1 minute reciting
    a prayer over it. At the end of the prayer, the potion becomes sanctified and begins to glow with a calming
    blue light. When a potion of healing becomes sanctified, it creates a pool of hit points equal to the maximum
    number of potential regained hit points possible for that potion. When a creature drinks from a sanctified potion
    of healing, that creature can restore a number of hit points of its choice, up to the maximum amount remaining
    in the pool. When the pool is reduced to 0 hit points, the potion is gone. A potion remains sanctified for 24
    hours or until it's spilled or poured into another vessel. Once this property of the goblet has been used, it
    can't be used again for 24 hours.
  source_name: Heavenly Chalice
  source_price: 1000 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Arcanist Gauntlets
  id: mi-rare-033
  type: Wondrous item
  desc: These gauntlets are a spellcasting implement. When committing the normal class resource for a level 1-5
    spell you can cast, roll d6. On a result at least equal to the spell's level, the gauntlets pay its basic casting
    resource instead. On a lower result you pay normally. They can pay up to 5 total spell levels per dawn, and
    can successfully pay for each particular level only once per dawn. You must possess enough of your own appropriate
    resource before attempting the roll; they cannot enable an otherwise impossible casting. A Cleric preserves
    the committed full-slot levels, an Occultist preserves one whole slot, and other classes preserve the corresponding
    basic casting resource. The spell uses its ordinary Varis casting time, level ceiling and extra costs. Failed
    or interrupted spells still consume the gauntlets' commitment if the resource would normally have been spent.
  conversion_notes: Rewrites free 5e slots as class-specific Varis resource substitution and closes missing-resource
    and extra-cost loopholes.
  group: Rare
  rarity: Rare
  price: 2000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A33:D33
  original_5e: This pair of rich silk gloves are guarded by an enchanted mithral shell that sporadically releases
    arcane power. You can use the gauntlets as a spellcasting focus while wearing them, and when you cast a spell
    using a 1st through 5th-level spell slot, you can choose to roll a d6. If you roll a number on the d6 equal
    to or greater than the spell's slot level, the spell draws on the magic within the gauntlets, instead of your
    own, and is cast without expending a spell slot. The slot must be of a level you can normally cast. The gauntlets
    can provide up to 5 levels worth of spell slots in this way each day, and no two slots can be the same level.
    If the number rolled on the d6 is less than the spell slot's level, you cast the spell as normal and expend
    the spell slot. If you don't have the spell slot to cast the spell, the spell fails and the slot is counted
    toward the gauntlets' daily provided spell slots. For example, a 9th-level wizard can use the gauntlets to provide
    either one 5th-level spell slot or a 4th- and 1st-level spell slot over the course of a day, but not two 2nd-
    or 3rd-level spell slots.
  source_name: Arcanist Gauntlets
  source_price: 2000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Coldfire Anvil
  id: mi-rare-034
  type: Wondrous item
  desc: This 50-pound, 18-inch anvil enchants one nonmagical metal weapon after 8 hours of work, or 4 hours with
    smith's-tools proficiency. The weapon keeps its Varis profile, counts as magical and deals an extra 1d6 cold
    damage on unblocked strikes for 7 days. On a natural 1 with its attack roll, roll d20. On 9 or less it shatters
    and is destroyed, dealing 2d6 cold damage to every creature within 10 feet; this burst cannot be Blocked. Once
    the anvil enchants a weapon, it cannot enchant another for 1d6 + 1 days. An already magical or coldfire weapon
    cannot be enchanted again or refresh its duration this way.
  conversion_notes: Applies coldfire to Varis weapon profiles and strike timing; preserves the source's fragile-weapon
    risk and delayed reuse.
  group: Rare
  rarity: Rare
  price: 1000 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A34:D34
  original_5e: This cold, iron anvil weighs 50 pounds and is 1 and a half feet long. It has three magic runes on
    its side from the Everglacier that magically enchant any item sharpened, forged, or otherwise smithed using
    this anvil. Over the course of a full workday, or half as long if you're proficient with smith's tools, you
    can use the anvil to turn a nonmagical metal weapon into a coldfire one. A coldfire weapon is magical and deals
    an extra 1d6 cold damage to any target it hits, but is made fragile like ice. When you make an attack roll using
    a coldfire weapon and roll a 1, roll a d20. On a 9 or lower, the weapon shatters and destroys the weapon, releasing
    a biting burst of cold that deals 2d6 cold damage to all creatures within 10 feet of the weapon. After 7 days,
    a coldfire weapon loses the enchantment and becomes nonmagical again. Once the anvil has been used to enchant
    a weapon in this way, it can't do so again for 1d6 + 1 days.
  source_name: Coldfire Anvil
  source_price: 1000 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Quick Change Ring
  id: mi-rare-035
  type: Ring
  desc: Bind one unworn suit of armor to this ring over 1 hour. Binding a second ejects the first into a free space
    within 5 feet. As an action while wearing the ring, speak its command and touch the bound armor to store it
    extradimensionally, even while wearing it. Another action recalls it fitted onto you, or at your feet. If you
    already wear armor it appears at your feet. It cannot remove armor that magically prevents doffing. Stored armor
    counts as within 100 feet for bonds with its wearer, but grants no AC, Block, protection or passive worn benefits.
    Donning changes your available equipment statistics immediately but does not refill spent Block or grant combat-start
    Block again. Harmless sparks or a similar sensory flourish may accompany the change. A found ring has a 50%
    chance of armor inside; choose an existing Varis suit rather than a 5e armor table.
  conversion_notes: Replaces obsolete armor categories with current Varis suits and prevents rapid armor changes
    from repeatedly restoring Block.
  group: Rare
  rarity: Rare
  price: 850 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A35:D35
  original_5e: This ring grows and shrinks to fit its wearer, but always seems slightly large for the finger it's
    on. The ring has an extradimensional space inside it dedicated to carrying armor. You can magically bind one
    set of unworn light, medium, or heavy armor to this extradimensional space over the course of 1 hour by resting
    the ring on top of the armor. Only one suit of armor can be bound to the ring's extradimensional space. Binding
    a second suit breaks the bond with the first one, causing it to be forced from the extradimensional space and
    appear in an unoccupied space within 5 feet of the ring. While wearing the ring, you're considered to be within
    100 feet of any armor stored inside its extradimensional space. While wearing this ring, you can use an action
    to speak its command word and touch a suit of bound armor, even if you're wearing it, to shunt it into the ring's
    extradimensional space. Speaking the command word again while the armor is in this extradimensional space causes
    you to magically don the armor, adjusting to fit you as needed, or causes it to appear at your feet (your choice).
    If you're already wearing a suit of armor when you don one in this way, the bound armor appears at your feet
    instead. If the armor would magically prevent you from doffing it, this property of the ring has no effect.
    You can create an instantaneous, harmless sensory effect when you don or doff a suit of armor with the ring
    in this way, such as a shower of sparks, a puff of wind, faint musical notes, or an odd odor. When found, the
    ring has a 50 percent chance to have a set of bound armor in its extradimensional space. The GM can choose a
    suit of bound armor from the following table or roll a d12 to determine it randomly. d12 Armor 1 Padded 2 Leather
    3 Studded leather 4 Hide 5 Chain shirt 6 Scale mail 7 Breastplate 8 Half plate 9 Ring mail 10 Chain mail 11
    Splint 12 Plate
  source_name: Quick Change Ring
  source_price: 850 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Blackthorn Spear of the Moonless Hunter
  id: mi-rare-036
  type: Weapon
  base_item: Spear
  magic_bonus: '1'
  desc: This +1 Varis Spear adds 1 to attack, damage and Block DC; its attuned wielder can always see its outline
    in darkness. As a bonus action, channel its hunting spirit for up to 8 hours, ending freely as a bonus action
    or after spending 1 minute more than 120 feet from the spear. While channeling, suppress penalties from Fatigue,
    but keep your recorded Fatigue and apply its maximum-level death-save risk normally. You cannot sleep, be magically
    put to sleep, or benefit from any rest. You have advantage on Stealth and on Perception or Survival to detect
    or track creatures, see through magical and mundane darkness within 120 feet, gain 5 feet of speed and deal
    an extra 1d6 necrotic damage with unblocked spear strikes. When channeling ends, gain 2 Fatigue. Those two levels
    can be removed only by a long rest; other accumulated Fatigue recovers normally.
  conversion_notes: Replaces 5e exhaustion with tracked Varis Fatigue and preserves both the no-rest cost and maximum-Fatigue
    risk.
  group: Rare
  rarity: Rare
  price: 2000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A36:D36
  original_5e: 'This spiny, black bone spear is a favorite among nocturnal hunting tribes. While attuned to the
    spear, you can always see the faint outline of it, even in total darkness. You gain a +1 bonus to attack and
    damage rolls made with this magic weapon. This spear contains a fragment of the moonless hunter, an ancient
    spirit that can be channeled to assume some of its powers. While you''re not channeling the spirit, you can
    use a bonus action while holding this spear to call forth the magic within it and assume the spirit of the moonless
    hunter. While you''re assuming this spirit, your eyes become pure white, and you gain the following benefits:
    You ignore the effects of exhaustion. You can''t sleep or be put to sleep by magical means, and you can''t take
    or benefit from finishing a long rest. You have advantage on Dexterity (Stealth) checks and on Wisdom (Perception)
    and Wisdom (Survival) checks made to detect and track creatures. You can see normally in darkness, both magical
    and nonmagical, out to a range of 120 feet. Your attacks with the blackthorn spear of the moonless hunter deal
    an extra 1d6 necrotic damage to any creature it hits. Your movement speed increases by 5 feet. You can assume
    the spirit in this way for up to 8 hours or until you release it as a bonus action. The effect ends early if
    you are more than 120 feet away from the blackthorn spear of the moonless hunter for more than 1 minute. When
    the effect ends and you are no longer assuming the spirit of the moonless hunter, you gain 2 levels of exhaustion
    as the spirit returns to the spear. Exhaustion gained in this way can only be reduced by finishing a long rest.'
  source_name: Blackthorn Spear of the Moonless Hunter
  source_price: 2000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Magma War Pick
  id: mi-rare-037
