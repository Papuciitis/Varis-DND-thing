- name: The Starlight Silver (Katana)
  id: mi-rare-038
  type: Weapon
  base_item: Katana
  magic_bonus: '1'
  desc: This +1 Varis Katana adds 1 to attack, damage and Block DC, and gains Throw 20/60. After its thrown attack
    hits a creature or object and is not Blocked, spend a bonus action to teleport to a visible unoccupied space
    within 5 feet of the impact and grip the sword. You must be able to see the destination, which must support
    you, and must be within 60 feet of it. If no legal destination exists the teleport is unavailable. Teleporting
    does not deal an extra strike, recover movement or trigger another attack. Against an unattended inanimate object
    use its normal object AC; a Blocked strike cannot anchor the teleport.
  conversion_notes: Adds the Varis Throw property and defines legal arrival and Block timing for the source teleport.
  group: Rare
  rarity: Rare
  price: 3000 GP
