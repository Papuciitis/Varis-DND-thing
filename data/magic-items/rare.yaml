- name: Gloves of Healing
  id: mi-rare-021
  type: Wondrous item
  desc: While wearing these gloves, when a level 1 or higher spell you cast restores HP to a creature, add your
    proficiency bonus to the HP it regains. The same benefit can instead apply when you use healer's supplies to
    stabilize or heal that creature. Stabilizing in this way also restores that bonus as HP. After a creature benefits,
    it cannot benefit from any Gloves of Healing again until it finishes a short or long rest. Apply healing modifiers
    such as Diseased to the complete healing total. This benefit restores HP, not Block, rest dice, Fatigue or arcane
    health.
  conversion_notes: Defines the affected Varis healing pool and per-recipient rest limit.
  group: Rare
  rarity: Rare
  price: 3000 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A21:D21
  original_5e: These silken gloves enhance the rejuvenating power of healers and clerics. While wearing the gloves,
    whenever you cast a spell of 1st level or higher to restore hit points to one creature, the creature regains
    additional hit points equal to your proficiency bonus. Alternatively, a creature can regain these additional
    hit points if you use a healer's kit to stabilize or restore hit points to it. Once a creature regains extra
    hit points in this way, it can't do so again until it finishes a short or long rest.
  source_name: Gloves of Healing
  source_price: 3000 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Mistwalker Armor (light armor)
  id: mi-rare-022
  type: Armor
  base_item: Leather armor
  desc: This armor uses the Varis Leather armor profile. Once per dawn, use an action to create dense fog in a 40-foot-radius
    sphere centered on a point within 120 feet for up to 1 hour while concentrating. Wind of at least 10 miles per
    hour disperses it. The fog blocks ordinary vision, but you see through all fog normally while wearing this armor.
    Inside opaque fog, spend movement to teleport to a visible unoccupied location in the same connected bank of
    fog, paying 1 foot of movement per foot teleported. The teleport cannot pass a solid barrier, and this armor
    gives no sight through walls.
  conversion_notes: Replaces Fog Cloud with an explicit fog power and uses a Varis light-armor base.
  group: Rare
  rarity: Rare
  price: 1500 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A22:D22
  original_5e: This dark leather armor releases thin wisps of fog from its seams. While wearing this armor, you
    can use an action to cast the fog cloud spell (2nd-level version) from it. Once this property of the armor has
    been used, it can't be used again until the next dawn. In addition, fog doesn't obscure your vision, and while
    you're in opaque fog, you can use your movement to teleport to an unoccupied space that you can see in the fog.
    Doing so costs an amount of movement equal to the distance you teleport.
  source_name: Mistwalker Armor (light armor)
  source_price: 1500 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Bow of the Eldritch Archer
  id: mi-rare-023
  type: Weapon
  base_item: Longbow
  desc: This magical Varis Longbow consumes each arrow when fired and transforms it into energy. Replace its base
    weapon damage with 1d10 force damage, retaining normal ability bonuses, weapon properties, range and maneuvers.
    The projectile retains additional magical powers of the consumed arrow, but is lost whether the attack hits
    or misses. Once on your turn when firing it, select another creature 5 feet directly behind the original target.
    That creature makes a DC 15 Dexterity save, taking 1d10 force damage on failure or no damage on success. This
    secondary area effect has no attack riders and cannot be Blocked, even if the original attack misses or is Blocked.
  conversion_notes: Separates its ordinary Varis weapon strike from the piercing saving-throw effect and changes
    the base damage type.
  group: Rare
  rarity: Rare
  price: 1500 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A23:D23
  original_5e: This unearthly bow is disjointed and gruesome. It's made of an ashen, twisted wood that acts as a
    conduit for eldritch energy and has a series of fleshy tendril-like growths that bulge through the wood's grain.
    Arrows shot from this bow are destroyed once they're fired, turning into a projectile of pure energy instead.
    This projectile deals 1d10 force damage, instead of the arrow's normal damage, and retains any magical properties
    of the destroyed arrow. Hit or miss, a projectile is lost after the attack. These energy projectiles can sometimes
    pierce enemies. Once on each of your turns when you make an attack using this weapon, you can force another
    creature 5 feet directly behind the original target to make a DC 15 Dexterity saving throw. On a failed save,
    a creature takes 1d10 force damage.
  damage: 1d10 force
  source_name: Bow of the Eldritch Archer
  source_price: 1500 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Djinn and Tonic
  id: mi-rare-024
  type: Potion
  desc: Drink this single-use potion as an action. For 1 hour a harmless breeze dramatically stirs your hair and
    clothing, and its alcohol is twice as potent as an ordinary drink. For the first 10 minutes, or until you end
    the transformation as an action, you and your carried gear become a cloud. You have a flying speed of 10 feet,
    can pass through tiny gaps, cannot attack, cast spells or manipulate objects, and have resistance to physical
    damage. You retain your mental statistics and cannot enter liquids or sealed spaces. No concentration is required.
    On rematerializing, Large or smaller creatures within 30 feet make a DC 15 Strength save or are pushed 10 feet
    away and knocked Prone. No creature is forced into your space when you reform.
  conversion_notes: Replaces Gaseous Form with a complete transformation and uses the Varis Prone condition.
  group: Rare
  rarity: Rare
  price: 300 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A24:D24
  original_5e: The typical djinn and tonic, a common potion, is a specialty alcoholic beverage that causes a magical
    wind to tussle your hair, cloak, or other clothing dramatically for 1 hour after you drink it. A small mote
    of mist dances above the potion's liquid and gently stirs it. The beverage is smooth, bubbly, and very refreshing
    with notes of juniper, elderberries, white peach, and lavender. Due to its magical nature, the alcohol within
    this potion affects a creature twice as much as the alcohol within a nonmagical beverage. The following djinn
    and tonic is a rare variant with additional properties. It also tastes better. When you drink this potion, you
    gain the effect of the gaseous form spell for 10 minutes (no concentration required) or until you end it early
    using an action. When the effect ends, your form rematerializes in a rush of air, forcing all Large and smaller
    creatures within 30 feet of you to make a DC 15 Strength saving throw. On a failed save, a creature is pushed
    10 feet away from you and knocked prone.
  source_name: Djinn and Tonic
  source_price: 300 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Spellsword
  id: mi-rare-025
  type: Weapon
  base_item: Short sword
  desc: 'As a bonus action while gripping this hilt, expend your own Varis casting resource for a spell of level
    1-6 that you can cast, creating a blade for 8 hours. A Cleric spends that many levels from one full slot; an
    Occultist expends one slot at its current level; another caster uses its class''s resource at the chosen level.
    This is not casting a spell and gains no spell-refund benefits. The blade uses the Varis Short sword profile
    but deals force damage. You are proficient with it and may use your spellcasting ability for attack, damage
    and Block DC. Level 1-2 gives its normal base die; level 3-4 instead gives d8 and +1 enhancement; level 5-6
    gives d10 and +2 enhancement. Enhancement adds equally to attack, damage and Block DC. It is a casting implement
    while active. As an action, end it in a 10-foot cone: creatures there make a DC 15 Dexterity save, taking 3d6
    force damage, or 4d8 at level 3-4, or 5d10 at level 5-6; success halves damage. This blast cannot be Blocked.
    A bonus action hides or restores the active blade. Releasing the hilt or ending the 8 hours dismisses it without
    a blast.'
  conversion_notes: Replaces universal spell-slot costs with Varis class resources, caps at level 6 and adds enhancement
    to Block DC.
  group: Rare
  rarity: Rare
  price: 3000 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A25:D25
  original_5e: This item appears to be a shortsword hilt. While grasping the hilt, you can use a bonus action to
    expend a spell slot of 1st level or higher to activate the sword, causing a blade of pure energy to spring into
    existence. The sword remains activated for 8 hours, or until you deactivate it early using an action. Once you
    activate the sword in this way, you can use it as a spellcasting focus, and you are proficient with the spellsword
    for the duration. You can use your spellcasting ability, instead of Strength or Dexterity, for your attack and
    damage rolls using this weapon, which deals force damage instead of piercing damage. If you activate the sword
    using a 3rd- or 4th-level spell slot, its damage die becomes a d8, and you gain a +1 bonus to attack and damage
    rolls made with it. If you use a 5th-level slot or higher, its damage die becomes a d10, and the bonus increases
    to +2 instead. When you deactivate the weapon early using an action, the remaining magic stored within the blade
    erupts into a wave of energy. Each creature in a 10-foot cone must make a DC 15 Dexterity saving throw. A creature
    takes 3d6 force damage on a failed save, or half as much damage on a successful one. If the sword was activated
    using a 3rd- or 4th-level spell slot, the force damage becomes 4d8, or 5d10 if it was activated with a 5th-level
    slot or higher. The blade emits bright light in a 20-foot radius and dim light for an additional 20 feet, and
    disappears if the sword is no longer activated or if you let go of the weapon. While holding the activated sword,
    you can use a bonus action to cause the blade to vanish or reappear.
  source_name: Spellsword
  source_price: 3000 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Bounder's Ball
  id: mi-rare-026
  type: Wondrous item
  desc: Thrown by itself, this glowing metal strip summons a harmless animal spirit that immediately retrieves it.
    Spend 10 minutes pressing it to a weapon that can be wielded in one hand to attach it; a Versatile weapon qualifies,
    but a weapon requiring two hands does not. While attached, a bonus-action command makes the weapon emit bright
    light for 10 feet and dim light for another 10 feet; another command or stowing it ends the light. After you
    make a thrown attack with the glowing weapon, the spirit returns it to your hand or feet immediately after the
    attack resolves, including its Block check. This does not grant Throw, extend range, retrieve a weapon through
    a solid barrier or wrest it from another creature's grip. Remove the strip during a short rest. The spirit is
    ethereal, has no occupied space and cannot fight or carry other objects.
  conversion_notes: Replaces the absent Heavy property with a one-handed weapon requirement and resolves retrieval
    after Varis Block.
  group: Rare
  rarity: Rare
  price: 500 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A26:D26
  original_5e: This enchanted strip of metal is bound to a friendly spirit, which emits a faint glow and seems to
    vibrate with excitement when held. When you throw this item, a playful animal spirit appears beside you and
    chases after it. Immediately after you throw it, the spirit returns the ball to you. You can attach the bounder's
    ball to the base of a weapon that does not have the heavy property by pressing it against the weapon for at
    least 10 minutes. Once you do, you can use a bonus action to speak the ball's command word to cause the weapon
    to shed bright light in a 10-foot radius and dim light for an additional 10 feet. Speaking the command word
    again or stowing the weapon puts out the light. When you make a ranged attack with the glowing weapon, the ball's
    animal spirit appears and happily retrieves it. Immediately after the attack, the spirit returns the weapon
    to your hand or drops it at your feet (your choice). You can remove the ball from the weapon over the course
    of a short rest by gently tugging at it, as if from an animal's mouth. The spirit is ethereal and doesn't occupy
    any space. If you have a companion's band, the spirit can interact with the one created by the band.
  source_name: Bounder's Ball
  source_price: 500 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Screaming Longbow
  id: mi-rare-027
  type: Weapon
  base_item: Longbow
  desc: This magical Varis Longbow's arrows howl audibly within 100 feet. Every unblocked strike deals an extra
    2d4 thunder damage. When an attack roll is a natural 20 and the strike is unblocked, each creature within 5
    feet of the target makes a DC 15 Constitution save or is Deafened for 1 minute. A creature repeats the save
    at the end of each of its turns, ending the deafness on success. The adjacent sonic pulse cannot be Blocked
