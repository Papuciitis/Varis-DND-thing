- name: Insatiable Tome
  id: mi-rare-020
  type: Wondrous item
  desc: This 12-pound tome has 1,000 blank vellum pages. Over 1 minute it devours and destroys a smaller nonmagical
    book or document placed beside it. As an action, speak its command word and the document's title to reproduce
    its contents, language and cipher on the blank pages. Another command erases or replaces the display. Its memory
    holds all devoured documents regardless of page capacity, but displays only 1,000 pages at once. It spits out
    magical pages, scrolls and active spell diagrams unchanged. Notes and spell instructions written into the tome
    normally can be recalled if dated or titled, but recalling them does not duplicate a consumable spell or bypass
    Varis learning, copying or casting costs. Commentary reappears with its document.
  conversion_notes: Retains the archive and specifies that reproduction cannot create free scrolls or bypass Varis
    spell rules.
  group: Rare
  rarity: Rare
  price: 1500 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A20:D20
  original_5e: This large, ragged tome weighs 12 pounds and has up to one thousand blank vellum pages inside it.
    The tome is magical and devours any smaller nonmagical book or document placed next to it with rows of hidden
    teeth over the course of 1 minute. After the tome has eaten a book, you can use an action to speak the tome's
    command word, followed by the name of a book or document it's eaten, to cause the previously destroyed contents
    to appear on the blank pages of the book. The contents are magically printed on the tome's pages in the same
    language or cipher they were written in and remain until you speak its command word again to erase or replace
    them with another document's contents. The tome dislikes the taste of magic. Any swallowed pages containing
    spells, magical sigils, or arcane scrolls are harmlessly spat back out by the tome. However, any notes, spells,
    or magical sigils that are written in the tome (instead of having been eaten by it) can be recalled if they're
    either dated, labeled, or titled. Written commentary, notes, and other such addenda to documents within the
    tome are saved by it and appear whenever the document is recalled again.
