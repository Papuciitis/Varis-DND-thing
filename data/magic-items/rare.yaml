    play this chord a number of times equal to your Charisma modifier, minimum 1, recovering these uses on a long
    rest. Whenever you grant a Bardic Inspiration die to an ally, add 1 to that die''s result; instead add 2 if
    you dealt an unblocked strike with this instrument earlier on the same turn. The enhanced die still follows
    your actual Varis Bardic Inspiration options, targets and recovery; it grants no new inspiration dice or rest
    dice.'
  conversion_notes: Supplies two Varis weapon modes and scopes the inspiration bonus to an actual Bard feature rather
    than importing a 5e resource.
  group: Rare
  rarity: Rare
  price: 1500 GP
  attunement: Yes (by Bard)
