- name: Reap and Sew (light crossbow)
  id: mi-rare-028
  type: Weapon
  base_item: Light crossbow
  magic_bonus: '2'
  desc: |-
    This +2 Varis Light crossbow adds 2 to attack, damage and Block DC. Its bound needle-bolt deals force instead of piercing damage, returns after every attack and reloads itself, removing this crossbow's Reload cost. As an action, mend one break no larger than 1 foot across in a nonmagical object you touch; missing material and magical properties are not restored. The bow has 4 charges and regains 1d4 at dawn. After an unblocked strike against a Large or smaller creature, spend 1 charge to tether it to an adjacent ground point until the end of its next turn. If it tries to move more than 10 feet from that point, it makes a DC 15 Strength save or its speed becomes 0 until its next turn starts. The bolt returns after tethering; the tether is magical thread, not the bolt itself. A lost or destroyed bolt reappears after 24 hours; after 1 minute without it the crossbow loses all magical benefits until it returns.
    Curse: whenever you try to begin a short or long rest, make a DC 12 Wisdom save. On failure, spend 1 hour compulsively crafting textiles before the rest can begin. Ending attunement does not remove the curse. A Varis effect that explicitly removes curses can end it.
  conversion_notes: Includes enhancement in Block DC, replaces Mending with a full utility power and retains the
    rest-delaying curse without unavailable spell names.
  group: Rare
  rarity: Rare
  price: 6000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A28:D28
  original_5e: You gain a +2 bonus to attack and damage rolls made with this magic weapon. While attuned to the
    weapon, you can cast the mending cantrip at will. A special, needle-like bolt is magically bound to the crossbow.
    When fired, the bolt leaves a faint thread of arcane energy behind it and deals force damage instead of piercing.
    The bolt returns to the crossbow and loads itself after each attack, ignoring the crossbow’s normal loading
    property. The crossbow has 4 charges and regains 1d4 expended charges each day at dawn. When you fire the special
    bolt from this crossbow and hit a Large or smaller creature, you can expend 1 charge to tether that creature
    to a point on the ground adjacent to it. If the creature attempts to move more than 10 feet away from that point
    before the end of its next turn, it must succeed on a DC 15 Strength saving throw or have its movement speed
    reduced to 0 until the start of its next turn. If the special bolt is somehow destroyed or lost, the bolt reappears
    loaded in the crossbow after 24 hours. The weapon is considered to be a mundane, nonmagical crossbow while separated
    from the bolt for longer than 1 minute. Curse. Once attuned to this weapon, you must make a DC 12 Wisdom saving
    throw whenever you attempt to take a short or long rest. On a failure, you are overcome with the urge to craft
    and are forced to sew, knit, crochet, or cross-stitch feverishly for at least 1 hour before being able to rest.
    The curse remains even if the attunement ends, but can be undone by any effect that removes a curse such as
    a greater restoration or remove curse spell.
  damage: 1d6 force
  source_name: Reap and Sew (light crossbow)
  source_price: 6000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Bartender's Armistice
  id: mi-rare-029
  type: Wondrous item
  desc: 'A found set contains 1d3 + 1 coasters. As an action, throw one to a visible ground point within 30 feet
    and speak its command. It anchors and projects a 30-foot-radius, 15-foot-high cylinder for 10 minutes. On appearing,
    on first entry each turn, and at the start of a turn there, a creature makes a DC 15 Charisma save or is charmed
    by you while inside and becomes indifferent toward visible enemies. A creature may fail willingly. Harming it
    or its friends ends its indifference and charm; ordinary hostility returns when the field ends. Any creature
    attempting an attack or harmful spell whose path or target crosses the field first makes a DC 15 Wisdom save.
    On failure the attempt and its action and committed resource are wasted. Creatures within have advantage on
    Persuasion checks to de-escalate violence. Creatures already at 0 HP in the field when it appears become stable,
    without regaining HP. The coaster has AC 15, 25 HP and no Block. Its destruction ends the field. After the full
    duration roll d10: on 1 it remains reusable, otherwise it becomes mundane.'
  conversion_notes: Uses Varis charmed and stabilization, defines noncreature coaster defenses and charges committed
    casting resources rather than assuming slots.
  group: Rare
  rarity: Rare
  price: 800 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A29:D29
  original_5e: A bartender's armistice is a magical coaster typically kept by wary tavernkeepers for cases of extreme
    danger. When found, a bartender's armistice comes in a set of 1d3 + 1 coasters. Each coaster is 4 inches across,
    and its weight is negligible. As an action, you can speak the coaster's command word and throw it at a point
    on the ground you can see within 30 feet of you. When you do, the coaster becomes fixed in place at the point
    and emits a magical field in a 30-foot-radius, 15-foot-high cylinder that's centered on it. Each creature within
    the area must make a DC 15 Charisma saving throw when the field appears or when it enters the area for the first
    time on a turn or starts its turn there. A creature can choose to fail this saving throw if it wishes. On a
    failed save, a creature is charmed by you while it remains within the field. A charmed creature is indifferent
    about creatures it can see that it's hostile toward. This indifference ends if the target is attacked or harmed
    by a spell, or if it witnesses any of its friends being harmed. If you or your companions harm a charmed creature
    or its friends, the charm ends. When the charm or field ends, the creature becomes hostile again, unless the
    GM rules otherwise. When a creature makes an attack or casts a harmful spell that either affects a target within
    the field or enters or leaves the field's area, that creature must first make a DC 15 Wisdom saving throw. On
    a failed save, the attack or spell fails and is expended, and the action is wasted. Each creature within the
    field has advantage on any Charisma (Persuasion) check it makes to deescalate a violent situation. In addition,
    if a creature in the area is unconscious when the field appears, it immediately stabilizes if it has 0 hit points.
    The coaster has AC 15 and 25 hit points. The field remains for 10 minutes or until the coaster drops to 0 hit
    points, at which point the coaster is destroyed and the field ends. If the field ends after the full duration,
    there is a 10 percent chance that the coaster remains magical and can be used again. Otherwise, the coaster
    becomes nonmagical.
  source_name: Bartender's Armistice
  source_price: 800 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Aged Goodberry Wine
  id: mi-rare-030
  type: Potion
  desc: A bottle contains 1d4 + 3 servings. Drink a serving over 1 minute. You may spend any number of your remaining
    rest dice, rolling each and regaining that roll + your Constitution modifier + 1 HP per die, to a minimum of
    0 per die. This is healing and follows healing modifiers. It does not count as finishing a rest, recover dice,
    restore Block or reduce Fatigue. A serving nourishes you for one day. For 24 hours after drinking, add 1d4 to
    Wisdom and Charisma checks and saves. Further servings refresh the duration but do not stack this die.
  conversion_notes: Replaces Hit Dice with an explicit expenditure of Varis rest dice and prevents the drink from
    granting other rest benefits.
  group: Rare
  rarity: Rare
  price: 450 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A30:D30
  original_5e: This bottle of thick red wine is miraculously made from magical goodberries and peonies using a closely-kept
    family recipe. It tastes fruity and floral, with notes of honey and the feeling of a fresh breeze, and is deeply
    rejuvenating. The bottle comes with 1d4 + 3 servings of the syrupy potion. A serving takes 1 minute to drink.
    When you drink this wine, you can regain hit points by spending any number of Hit Dice, as if you'd finished
    a short rest. You regain 1 extra hit point for each Hit Die you spend in this way. The wine provides enough
    nourishment to sustain a creature for one day. In addition, for the next 24 hours, whenever you roll a Wisdom
    or Charisma ability check or saving throw, you add 1d4 to the total of the roll.
  source_name: Aged Goodberry Wine
  source_price: 450 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Prototype Thunderberd (halberd)
  id: mi-rare-031
  type: Weapon
  base_item: halberd
  desc: 'This magical Varis halberd deals an extra 1d6 lightning damage on an unblocked strike. It has 10 charges
