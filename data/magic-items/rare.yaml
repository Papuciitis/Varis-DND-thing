  original_5e: You gain +1 bonus to attack and damge rolls made with this magic weapon. When you make a thrown (20/60)
    attack with this weapon and your attack roll beats the target's AC, as bonus action, you may choose to teleport
    to it upon impact, gripping the weapon. This also works with inanimate objects.
  source_name: The Starlight Silver (Katana)
  source_price: 3000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Warlute (Lute/axe/light crossbow(30/90))
  id: mi-rare-039
  type: Weapon
  base_item: hand-axe
  desc: 'Requires attunement by a Bard. This magical instrument is also a Varis hand-axe and a Light crossbow; choose
    the mode for each attack. Its axe mode deals 1d6 slashing, and its crossbow mode deals 1d6 piercing at range
    30/90 with the Varis Light crossbow''s Reload and other properties. Use the chosen mode''s proficiencies, Block
    DC and maneuvers. As an action, play a chord for another creature within 60 feet that hears you: it has advantage
