    to the debt. While the spectacles are on, the penalty is suppressed and the debt does not count down. Whenever
    you remove them, you are Blinded until you have spent that much time without them, reducing the debt as time
    passes. Putting them on again merely pauses the unpaid debt and adds the new wearing time; it never resets the
    debt. A Varis restorative effect that explicitly ends Blinded clears this debt. Their drawback persists if attunement
    ends.
  conversion_notes: Replaces Detect Magic with full detection rules and translates the prolonged drawback into tracked
    Varis Blinded time that cannot be reset by briefly rewearing the spectacles.
