- name: Mask of Memories
  id: mi-rare-041
  type: Wondrous item
  desc: While wearing this fragile mask, you form exact permanent memories of what you consciously see, hear, think
    and do. Creatures seeing or hearing you also perfectly remember your actions they actually perceived, but gain
    no other improved memory. Perfect recall does not interpret unknown languages, expose an unseen illusion, reveal
    forgotten details never perceived, or grant free learned spells, preparation, copied scrolls or skill proficiency.
    A memory can still be altered by a power that explicitly alters memories. Removing the mask does not erase memories
    already formed.
  conversion_notes: Preserves the unusual shared memory effect while separating recall from Varis spell-learning
    and perception rules.
  group: Rare
  rarity: Rare
  price: 250 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A41:D41
  original_5e: 'Frequently abused in academic circles, these fragile masks endow the wearer with the ability to
    form perfect memories - everything the wearer sees, hears, thinks and does while wearing the mask is permanently
    etched into their mind. Anyone who can see or hear the wearer is similarly affected with permanent memories
    of the wearer''s actions. These secondary users do not form perfect memories of anything that does not involve
    the individual wearing the mask. '
  source_name: Mask of Memories
  source_price: 250 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Orb of Passage
  id: mi-rare-042
  type: Wondrous item
  desc: Place a physical key on this orb and speak 'Find a Passage' as an action. The key dissolves. The floating
    orb follows you and, on command, indicates a traversable route toward the specific lock for which that key was
    made, while both are on the same plane. It cannot pass walls or locate a destroyed or nonexistent lock. Within
    5 feet of the matching lock it unlocks it, consuming one of the orb's three lifetime uses. Magical seals, additional
    locks and effects preventing unlocking remain. The orb dissolves after its third success. It holds only one
    key's destination at a time; absorbing another discards the previous destination without refunding a key. It
    slightly dims light within 5 feet without creating darkness.
  conversion_notes: Defines route and magical-lock limits without introducing an unavailable knock or divination
    spell.
  group: Rare
  rarity: Rare
  price: 500 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A42:D42
  original_5e: Its origins unknown, this orb has the word, "Passage" inscribed in various languages throughout it.
    It's gold lining holds arcane infused onyx that slightly dims any light within 5ft. of it. To activate this
    orb, you must place a key upon its center axis and speak words "Find a Passage". When the orb is activated,
    the key is dissolved into the orb. The orb then floats at your side and begins to lead you, on your command,
    to the lock the dissolved key was made to unlock. If the orb is within 5ft. of the lock, it is magically unlocked.
    Once the orb has unlocked 3 locks, the orb dissolves.
  source_name: Orb of Passage
  source_price: 500 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Ring of Splat
  id: mi-rare-043
  type: Ring
  desc: This cinnamon-and-fruit-scented ring gives creatures disadvantage on checks to identify or track you by
    smell alone. It holds 5 charges and regains 1d4 + 1 at dawn. As a bonus action, spend 1 charge to make a melee
    improvised-weapon attack against a creature within 5 feet, using Strength, or Dexterity if you prefer, and proficiency
    only if trained with improvised weapons. Its Block DC is 8 + your attack ability modifier + any applicable proficiency
    bonus. An unblocked hit deals 1d4 force damage and Blinds the target until the end of its next turn. On a miss,
    you may make one additional attack against a creature directly behind the first and within 5 feet of it, adding
    1 to that creature's AC for this shot. A Blocked pie does not ricochet. Only ghosts can eat the conjured pie.
  conversion_notes: Gives the improvised attack a Varis Block DC and resolves its blind and ricochet after Block.
  group: Rare
  rarity: Rare
  price: 250 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A43:D43
  original_5e: 'A ring that smells of rich cinnamon and sweet fruit, creating a unique scent that encapsulates the
    wearer, confusing creatures that rely on scent. As a bonus action, the wearer of the ring can conjure a ghostly
    pie and attempt to smash it in the face of a creature within melee range (improvised weapon attack). On a hit,
    the pie explodes in the creature''s face, blinding them for one turn and dealing 1d4 force damage. If the attack
    misses and there''s a creature directly behind the original target, another attack is made against this new
    target (target has +1 to his AC). The Ring of Splat contains five charges and regains 1d4+1 charges every day
    at dawn. Ghost pie can only be eaten by ghosts. '
  source_name: Ring of Splat
  source_price: 250 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Chalk of Hiding
  id: mi-rare-044
  type: Wondrous item
  desc: This chalk can draw a total of 50 feet of line before being consumed. Draw a complete border on a single
    flat surface around a creature or object. While wholly within the border and touching that surface, the enclosed
    subject is visually hidden behind an illusion matching the untouched surface. It is not physically removed,
    silenced or made scentless; attacks, touch and detection through other senses work normally. Any portion extending
    outside becomes visible. Breaking or smearing the border ends the illusion. An intact border needs no concentration
    and can last for years. Drawing takes an action per 5 feet; an unwilling moving creature cannot be enclosed
    unless held motionless long enough.
  conversion_notes: Defines the source's illusion and drawing time without treating it as the different Varis Invisible
    condition or extradimensional refuge.
  group: Rare
  rarity: Rare
  price: 100 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A44:D44
  original_5e: The Chalk of Hiding makes a creature or item on a flat surface disappear when a complete border is
    drawn around it. From the outside, the surface will appear completly normal. The Chalk of Hiding can last up
    to several years in the right conditions or until the border is broken. If a body part exits the border, it
    will become visible. The Chalk of Hiding can draw for 50 feet. Chalk of Hiding does not disguise sound or smell.
  source_name: Chalk of Hiding
  source_price: 100 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Overdue Lesson (Mace)
  id: mi-rare-045
  type: Weapon
  base_item: mace
  desc: This magical Varis mace is stitched from books. A Wizard wielding it is proficient and may use Intelligence
    instead of Strength for its attack rolls, damage and Block DC. If that Wizard's Intelligence is at least 16,
    add 2 to attack rolls and Block DC and 4 to damage rolls with it. These are this item's fixed bonuses, not a
    +4 enhancement. Against a creature with Intelligence 12 or less, convert half the final strike's damage, rounded
    down, to psychic; the remainder retains its normal type. It remains a weapon strike and can be Blocked normally.
    Non-Wizards use the normal mace profile without these special bonuses.
  conversion_notes: Makes ability substitution and the asymmetric attack/damage bonuses interact explicitly with
    Varis Block DC.
  group: Rare
  rarity: Rare
  price: 5000 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A45:D45
  original_5e: This mace is made out of various books stiched together. You gain proficiency in using a mace while
    weilding this weapon if your class is wizard and use your intelligence ability score for what would regularly
    be strenght. If your intelligence is higher than 15 you gain an additional +2 to attacks and an additional +4
    to damage. Half of the damage dealt is psychic if the creature has an intelligence score of 12 or less.
  source_name: Overdue Lesson (Mace)
  source_price: 5000 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Throgdore's Big Stick (Greatclub)
  id: mi-rare-046
  type: Weapon
  base_item: Great-club
