    half on success. Shape water (1): create or destroy up to 10 gallons of nonmagical water in an open container
    within 30 feet. Desert veil (4): disguise the natural appearance of terrain in a 100-foot cube within 300 feet
    for 8 hours; physical contact reveals the illusion, and an action with a successful DC 15 Investigation check
    reveals it to an observer. These powers expend no personal casting resources. The lightning is an area effect
    and cannot be Blocked.'
  conversion_notes: Replaces the mixed unavailable 5e spell list with four complete item powers at the original
