- name: Feie's favor(ring)
  id: mi-rare-040
  type: Ring
  desc: While wearing this ring, you can communicate simple ideas, warnings and questions with wolves. It does not
    make them friendly or command them. At each dawn roll d4; that is the ring's number of uses until the following
