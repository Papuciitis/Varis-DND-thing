  original_5e: Damage 1d6 Slashing by blade or 1d6 by crossbow (30/90). As an action you can strike a special chord
    on the warlute. One creature of your choice has advantage on their next roll. You can not use this feature on
    yourself and a creature can be affected  by it once per long rest. You can use this feature number of times
