- name: Spectacles of Revelation
  id: mi-rare-071
  type: Wondrous item
  desc: While worn, these spectacles reveal the presence of magic within 30 feet and a visible aura on creatures
    and objects you can see. You can read magical script as literal writing, but do not automatically understand
