section: magic-items
entries:
- name: Necklace of fireballs(up to 6 beads)
  id: mi-rare-002
  type: Wondrous item
  desc: The necklace holds up to six expendable beads. As an action, detach and throw one or more beads at a point
    within 60 feet. They explode together in a 20-foot-radius sphere using the Varis Fireball damage of 6d8 fire.
    Creatures there make a DC 15 Dexterity save, taking full damage on a failure or half on success. Each bead beyond
    the first adds 1d8 damage, to a maximum of 11d8. Solid barriers block the blast from its center. The explosion
    is an area effect and cannot be Blocked. Thrown beads are destroyed and never recharge.
  conversion_notes: Uses the current Varis Fireball dice and replaces escalating spell levels with a six-bead damage
    ceiling.
  group: Rare
  rarity: Rare
  price: 20 GP + 240 GP per bead
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A2:D2
  original_5e: You can use an action to detach a bead and throw it up 60 feet away. When it reaches the end of its
    trajectory, the bead detonates as a 3rd-level fireball spell (save DC 15). You can hurl multiple beads, or even
    the whole necklace, as one action. When you do so, increase the level of the fireball by 1 for each bead beyond
    first.
  source_name: Necklace of fireballs(up to 6 beads)
  source_price: 20 GP + 240 GP per bead
  source_attunement: 'No'
  source_rarity: Rare
- name: Glasses of Lightning
  id: mi-rare-003
  type: Wondrous item
  desc: While wearing these glasses, you can read and absorb written information in a language you understand ten
    times as quickly. This accelerates reading only. It does not shorten spell preparation, copying, crafting, rituals,
    rests, or learning requirements and does not decipher unknown languages or codes.
  conversion_notes: Retains the reading benefit and distinguishes reading from Varis spell-learning and recovery
    procedures.
  group: Rare
  rarity: Rare
  price: 600 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A3:D3
  original_5e: Allows you to read and absorb written informaton in a language you understand ten times as fast.
  source_name: Glasses of Lightning
  source_price: 600 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Dragonbreath Ammunition (up to 20 bolts or arrows)
  id: mi-rare-004
  type: Ammunition
  desc: Replace one ranged weapon attack with firing a piece of this ammunition at a point within your weapon's
    range. It is destroyed and releases a breath effect forward from that point along the shot's direction. Creatures
    in the area make a DC 15 Dexterity save, taking 4d8 damage on a failure or half on success. This area effect
    cannot be Blocked and adds no ordinary weapon damage or strike rider. Brass makes a 5-by-60-foot fire line;
    bronze a 5-by-90-foot lightning line; copper a 5-by-60-foot acid line; gold a 60-foot fire cone; silver a 60-foot
    cold cone; platinum a 10-by-90-foot fire line. Determine the metal when the ammunition is found.
  conversion_notes: Separates the saving-throw area attack from normal weapon hits and Block resolution.
  group: Rare
  rarity: Rare
  price: 1000 GP per bolt/arrow
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A4:D4
  original_5e: 'This metallic ammunition flies effortlessly on its own when fired. When you take the attack action
    to make a ranged weapon attack, you can instead fire this ammunition at a point you can see within range. The
    arrow or bolt explodes when it reaches the point, destroying the ammunition and creating either a cone or 5-foot-wide
    line of dragon''s breath in the direction it was fired. The created effect depends on the metal it was cast
    from. Each creature in that area must make a DC 15 Dexterity saving throw, taking 4d8 damage of the associated
    type on a failed save, or half as much damage on a successful one. Use the rolls below to determine the effect''s
    area of effect and damage type: (1) Brass 60-foot line Fire (2) Bronze 90-foot line Lightning (3) Copper 60-foot
    line Acid  (4) Gold 60-foot cone Fire (5) Silver 60-foot cone Cold (6) Platinum 10x90-foot line Fire'
  source_name: Dragonbreath Ammunition (up to 20 bolts or arrows)
  source_price: 1000 GP per bolt/arrow
  source_attunement: 'No'
  source_rarity: Rare
- name: Cinnabar Rapier
  id: mi-rare-005
  type: Weapon
  base_item: Rapier
  desc: This magical Rapier retains its Varis damage, properties and maneuvers. It has 10 charges and regains 1d8
    + 2 spent charges at dawn, up to 10. After an unblocked strike, spend any number of remaining charges to deal
    an extra 1d4 poison damage per charge to that target. A blocked strike cannot deliver the poison or spend charges.
  conversion_notes: Poison is delivered on an unblocked strike; the weapon inherits the Varis Rapier profile.
  group: Rare
  rarity: Rare
  price: 1200 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A5:D5
  original_5e: This magic rapier’s blade is alchemically coated in a thin but toxic layer of cinnabar. The weapon
    has 10 charges and regains 1d8+2 expended charges each day at dawn. When you hit a creature with this weapon,
    you can expend 1 or more of its charges. The blade’s poison leeches into the blood of the creature you struck
    to deal an extra 1d4 poison damage for each charge expended in this way.
  source_name: Cinnabar Rapier
  source_price: 1200 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Chain Devil gloves
  id: mi-rare-006
  type: Wondrous item
  desc: While wearing these gloves, each weapon you throw using a Throw property can remain joined to your hand
    by an ethereal chain, to a maximum of four chains. A chain ends if the weapon is held by another creature or
    moves more than 60 feet from you. As an action, retract any or all chains. Each creature crossed by one or more
    returning weapons makes one DC 15 Dexterity save. On a failure it takes force damage equal to one roll of each
    returning weapon's base damage dice that crosses it, without ability, enhancement or strike riders. On success
    it takes no damage. This is a saving-throw effect, not a weapon strike, and cannot be Blocked. Solid barriers
    stop a returning weapon. Weapons reach an open hand or land at your feet.
  conversion_notes: Uses Varis Throw and base weapon dice; returning weapons form one saving-throw effect rather
    than extra strikes.
  group: Rare
  rarity: Rare
  price: 3000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A6:D6
  original_5e: These leather gloves are fashioned from the hands of a slain chain devil. While wearing these gloves,
    an ethereal chain attaches itself to any weapon you throw that has the thrown property. The chain has a reach
    of 60 feet and breaks its connection to the weapon if the weapon is held by a creature or if you are ever more
    than 60 feet away from it. You can have up to 4 of these chains at any time. As an action, you can cause these
    chains to suddenly retract and pull any attached weapons with them. Any creature within the path of one or more
    of these weapons must make a DC 15 Dexterity saving throw. On a failed save, a creature takes force damage equal
    to the damage die of the thrown weapon. A solid object or wall blocks the path of the retracted chain and weapon.
    A retracted weapon lands harmlessly at your feet or in an open hand once it reaches you.
  source_name: Chain Devil gloves
  source_price: 3000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Windswept Wyvernplate (Medium armor)
  id: mi-rare-007
  type: Armor
  base_item: Plated leather armor
  desc: This armor uses the Varis Plated leather armor profile, including Bulk 5, Block 1, Slow 1 and Protection
    1. While consciously holding your breath, reduce its Bulk by 2, to a minimum of 0, and ignore disadvantage on
    Stealth caused specifically by the armor's noise. Other penalties remain. As a reaction when you begin falling,
    hold your breath to slow your fall to 60 feet per round for up to 1 minute. You take no falling damage if you
    land while this effect lasts. It ends if you breathe, become unconscious or remove the armor.
  conversion_notes: Maps half plate to a Varis medium-armor profile, makes lightening affect Bulk and replaces absent
    Feather Fall with a defined reaction.
  group: Rare
  rarity: Rare
  price: 2000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A7:D7
  original_5e: This half plate armor seems to grow lighter when you inhale. You can hold your breath at any point
    to both lighten the armor and quiet its clattering, negating the normal disadvantage on Dexterity (Stealth)
    checks imposed by half plate armor. In addition, if you fall while wearing this armor, you can hold your breath
    as a reaction to cast the feather fall spell, targeting only yourself, at will.
  source_name: Windswept Wyvernplate (Medium armor)
  source_price: 2000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Salamander Flame Gauntlets
  id: mi-rare-008
  type: Wondrous item
  desc: Your unblocked unarmed hand strikes deal an extra 1d4 fire damage. As a bonus action, create a fiery blade
    in a free hand for 1 minute, dismissible freely. It requires no concentration. Choose Strength, Dexterity or
    a spellcasting ability you possess when creating it. As an action, make a proficient melee attack with that
    ability, dealing 4d6 fire damage plus its modifier on an unblocked strike; its Block DC is 8 + your proficiency
    bonus + that modifier. Alternatively, use the action to make a ranged attack against a creature within 30 feet
    for the same damage, after which the blade reforms. The blade has no mundane weapon maneuvers, and its own damage
    does not gain the unarmed fire bonus. Creating another blade ends the first.
  conversion_notes: Replaces a 4th-level 5e Flame Blade with a complete item weapon and explicit Varis Block DC
    and action cost.
  group: Rare
  rarity: Rare
  price: 5000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A8:D8
  original_5e: These dark metal gauntlets were forged using fire from the heart of a salamander. While wearing them,
    your unarmed strikes with your hands deal an extra 1d4 fire damage to any target they hit. In addition, you
    can use a bonus action to cast the flame blade spell (4th-level version, no concentration required) from the
    gauntlets, using either your spellcasting ability or your choice of Strength or Dexterity for the spellcasting
    ability of the spell when you do. While holding the fiery blade, you can use an action to make a ranged spell
    attack with it instead. When you do, the blade becomes a fiery spear with a range of 30 feet. On a hit, the
    spear deals 4d6 fire damage. Immediately after the attack, the fiery blade reforms in your hand.
  source_name: Salamander Flame Gauntlets
  source_price: 5000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Bow of the Twilight Valkyrie
  id: mi-rare-009
  type: Weapon
  base_item: Longbow
  desc: This magical Longbow uses its Varis profile. Once on your turn when taking the Attack action, declare positive
    or negative energy before one shot and take a -5 penalty to that attack roll. The penalty does not reduce the
    shot's Block DC. On an unblocked strike, positive energy deals an extra 2d6 radiant damage and grants advantage
    to the next attack against the target by someone else before your next turn starts. Negative energy instead
    deals an extra 2d6 necrotic damage and imposes disadvantage on the target's next attack roll before your following
    turn ends. A miss or successful Block expends that turn's opportunity without applying either rider.
  conversion_notes: Gives the bow a Varis base and defines its paid attack penalty separately from Block DC and
    unblocked riders.
  group: Rare
  rarity: Rare
  price: 7000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A9:D9
  original_5e: This bow balances the positive and negative magics from the upper and lower planes of existence.
    Once on each of your turns when you take the Attack action, you can channel either positive or negative energy
    into one of your attacks. When you do, you take a -5 penalty to the attack roll. If you channeled positive energy
    into the attack and hit, the target takes an extra 2d6 radiant damage, and the next attack roll made against
    it by a creature other than you before the start of your next turn has advantage. If you channeled negative
    energy into the attack, the target takes an extra 2d6 necrotic damage, and the next attack roll the target makes
    before the end of your next turn has disadvantage.
  source_name: Bow of the Twilight Valkyrie
  source_price: 7000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Conspirator's Coat
  id: mi-rare-010
  type: Wondrous item
  desc: While wearing this coat, you have advantage on Deception checks. It holds 5 charges and regains 1d4 + 1
    at dusk, up to 5. As a bonus action, spend 1 charge to disappear and release one to three ravens. Each has AC
    12, 1 HP and no Block, and immediately flies up to 40 feet without provoking reactions to movement. You cannot
    act, affect creatures or be targeted while dispersed. At the start of your next turn, the ravens vanish and
    you reappear in one raven's space. If the last raven is destroyed first, you reappear there immediately and
    take any excess damage from that attack. Your existing timed effects continue, and you make concentration checks
    for damage carried over to you.
  conversion_notes: Defines the dispersed state and raven defenses so the transformation resolves within Varis combat.
  group: Rare
  rarity: Rare
  price: 3500 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A10:D10
  original_5e: This magic longcoat is adorned with raven feathers and carved jet buttons. While wearing this coat,
    you have advantage on Charisma (Deception) checks. In addition, the coat has 5 charges and regains 1d4 + 1 expended
    charges daily at dusk. While wearing the coat, you can use a bonus action to expend 1 of its charges to disappear,
    releasing up to three ravens from your location under your control that scatter into the air. Each raven has
    AC 12, 1 hit point, and can fly up to 40 feet as part of this bonus action without provoking opportunity attacks.
    At the start of your next turn, the ravens vanish, and you reappear in the space of one of the ravens (your
    choice). If all the ravens are reduced to 0 hit points, you reappear early in the same space as the last one
    that died. When you do, any excess damage dealt to the raven carries over to your normal form.
  source_name: Conspirator's Coat
  source_price: 3500 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Champion's Greatbow (longbow)
  id: mi-rare-011
  type: Weapon
  base_item: Longbow
  desc: You need Strength 13 to wield this magical Longbow. Use the Varis Longbow properties and maneuvers, but
    its base damage die is d10 and its attacks critically hit on a natural 19 or 20. Once on each of your turns,
    fire a javelin or spear instead of an arrow. For that shot halve both listed range distances, rounding down,
    and add your Strength modifier to damage on an unblocked strike. The ammunition does not add its own damage
    dice, properties or maneuvers. Ordinary ability and enhancement bonuses otherwise apply normally.
  conversion_notes: Preserves the greatbow's individual damage die and critical range while retaining Varis ranged-weapon
    rules.
  group: Rare
  rarity: Rare
  price: 3000 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A11:D11
  original_5e: This large bow is wrought from the boughs of an old, resilient tree. Its wooden frame is exceptionally
    sturdy but difficult to draw. You must have a Strength score of 13 or higher to wield this bow. This bow's damage
    die is a d10, and when you make a ranged attack with this bow, you score a critical hit on a roll of 19 or 20.
    Once on each of your turns when you make a ranged attack with this weapon, you can use the bow to fire a javelin
    or spear, instead of an arrow, without affecting the bow's damage die. When you do, the bow's normal and long
    ranges are halved for the attack. If the attack hits, the target takes extra piercing damage equal to your Strength
    modifier.
  damage: 1d10p
  source_name: Champion's Greatbow (longbow)
  source_price: 3000 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Coldsnap (whip)
  id: mi-rare-012
  type: Weapon
  base_item: whip
  magic_bonus: '1'
  desc: This +1 Varis whip adds 1 to attack rolls, damage rolls and Block DC. Every unblocked strike deals an extra
    1d4 cold damage. It has 3 charges, all restored at dawn. After an unblocked strike against a creature not immune
    to cold, spend 1 charge to force a DC 15 Constitution save. Until the start of your next turn, its speed becomes
    0 on failure or is halved on success. This restriction is not a grapple and does not prevent teleportation.
    The handle feels warm to its attuned wielder.
  conversion_notes: Enhancement includes Block DC; cold damage and the charge trigger require an unblocked strike.
  group: Rare
  rarity: Rare
  price: 5000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A12:D12
  original_5e: This icy whip deals an extra 1d4 cold damage to any target it hits. In addition, you have a +1 bonus
    to attack and damage rolls made with this magic weapon. The whip has 3 charges and regains all of them each
    day at dawn. When you hit a creature that is not immune to cold damage with this weapon, you can expend 1 of
    its charges to force the creature to make a DC 15 Constitution saving throw. On a failure, its speed becomes
    0 until the start of your next turn. On a success, its speed is halved instead. Once you attune to this weapon,
    its normally frigid handle feels warm to the touch.
  source_name: Coldsnap (whip)
  source_price: 5000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Bow of Mind Thievery
  id: mi-rare-013
  type: Weapon
  base_item: Longbow
  desc: This magical Varis Longbow deals an extra 1d4 psychic damage on every unblocked strike. Once per dawn, after
    an unblocked strike against a humanoid, force a DC 15 Wisdom save. On failure, it is charmed by you for 1 minute.
    While it is within 60 feet, you may use a bonus action to issue a simple command that it follows on its next
    turn using its ordinary actions. It cannot be commanded to harm itself directly. It repeats the save whenever
    it takes damage, ending the control on success. No concentration is required. As a bonus action while control
    lasts, perceive through its senses until your next turn starts, losing your own sight and hearing during that
    time. This sensory option does not also issue a command.
  conversion_notes: Replaces absent Dominate Person with a bounded control power, repeat saves and explicit action
    economy.
  group: Rare
  rarity: Rare
  price: 5000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A13:D13
  original_5e: Arrows fired from this magic bow deal an extra 1d4 psychic damage to any creature that they hit.
    When you hit a humanoid with an arrow in this way, you can force that creature to make a DC 15 Wisdom saving
    throw after the attack. On a failed save, that creature falls under the effects of the dominate person spell
    for up to 1 minute as if cast by you. This effect does not require concentration. In addition, you can use a
    bonus action to see through that creature’s eyes and hear what it hears until the start of your next turn, gaining
    the benefits of any special senses that the creature has. During this time, you are deaf and blind with regard
    to your own senses. Once this property of the bow has been used, it can’t be used again until the next dawn.
  source_name: Bow of Mind Thievery
  source_price: 5000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Scarlet Scourge
  id: mi-rare-014
  type: Weapon
  base_item: whip
  magic_bonus: '1'
  desc: This +1 Varis whip adds 1 to attack, damage and Block DC. Each unblocked strike against a Small or larger
    living creature that is not a construct, plant or undead grants 1 blood charge, up to 10. It loses all charges
    when you finish any rest. While holding it, spend a bonus action to consume every charge and regain 2 HP per
    charge consumed. Its reach increases by 5 feet while it has at least 5 charges, or by 10 feet at 10 charges;
    this is additional to its Varis reach. It cannot gain charges from a corpse or a blocked attack.
  conversion_notes: Converts on-hit blood delivery to unblocked strikes and clarifies the Varis reach and rest interactions.
  group: Rare
  rarity: Rare
  price: 2000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A14:D14
  original_5e: This whip is made from the severed vertebrae of a slain vampire's victims. You gain a +1 bonus to
    attack and damage rolls made with this magic weapon. The whip siphons blood from creatures that it hits. Whenever
    you hit a Small or larger living creature with the whip that is not a construct, plant, or undead, the bone
    blade at its end absorbs some of its blood and gains 1 charge. The whip can hold up to 10 charges and loses
    its charges whenever you complete a short or long rest. While holding the whip, you can use a bonus action to
    speak its command word to convert these charges into healing energy. When you do, the whip loses all its charges
    and you regain 2 hit points for each charge lost. For every 5 charges the whip has, the muscle fibers that hold
    it together loosen and add 5 feet to the weapon's reach.
  source_name: Scarlet Scourge
  source_price: 2000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Thalamus Thread
  id: mi-rare-015
  type: Wondrous item
  desc: Fit this oily psychic thread to one bow or crossbow during a rest. Its ammunition counts as magical while
    fired from that weapon, without granting an enhancement bonus. Once per dawn, after an unblocked ranged strike,
    speak the command word to deal an extra 1d8 psychic damage and force a DC 15 Intelligence save. On failure the
    target is Stunned until the end of your next turn. Constructs and undead automatically succeed, but still take
    the psychic damage unless immune. Moving the thread to another weapon does not restore this power.
  conversion_notes: Uses Varis Stunned and weapon delivery; an unblocked strike is required before spending the
    daily power.
  group: Rare
  rarity: Rare
  price: 1000 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A15:D15
  original_5e: This pale gray thread is made from the remains of a powerful mystic's brain. The overdeveloped organ
    creates a congealed fiber that, once spun, can be used as a functional bowstring. It's always oily to the touch
    and leaves a faint residue on your fingers when pulled. Ranged attacks made with a weapon strung with this thread
    are considered magical. When you hit a creature with a ranged attack using a bow or crossbow that was strung
    with this thread, you can speak the thread's command word as part of the attack to charge the arrow or bolt
    with psychic power. When you do, the target of the attack takes an extra 1d8 psychic damage and is forced to
    make a DC 15 Intelligence saving throw. On a failed save, the creature is stunned until the end of your next
    turn. On a successful save, the creature is not stunned. A construct or undead creature automatically succeeds
    on the saving throw. This property of the thread can't be used again until the next dawn.
  source_name: Thalamus Thread
  source_price: 1000 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Spiderbite Daggers
  id: mi-rare-016
  type: Weapon
  base_item: Dagger
  desc: This item is a matched pair of magical Varis Daggers. If both deal an unblocked strike to the same creature
    during your turn, that creature makes one DC 13 Constitution save. On failure it takes an extra 2d4 poison damage
    and is Poisoned until the end of its next turn. This pair can trigger only once per target per turn. Use the
    normal Varis bonus-action cost and damage rules for an off-hand attack; the pair does not grant additional attacks.
    Add two inventory weapons when wielding both.
  conversion_notes: Retains Varis off-hand action economy and makes both dagger strikes pass Block before poison
    triggers.
  group: Rare
  rarity: Rare
  price: 1000 GP
  attunement: 'No'
  source_ref: Magic item generator.xlsx — Rare!A16:D16
  original_5e: This pair of daggers is made using the harvested fangs of a large, venomous spider. When you hit
    the same creature on your turn with both daggers, that creature must succeed on a DC 13 Constitution saving
    throw or take an extra 2d4 poison damage and become poisoned until the end of its next turn.
  source_name: Spiderbite Daggers
  source_price: 1000 GP
  source_attunement: 'No'
  source_rarity: Rare
- name: Thunderous Flail
  id: mi-rare-017
  type: Weapon
  base_item: flail
  desc: This magical Varis flail has 3 charges and regains 1d3 at dawn. While it has a charge, its first unblocked
    strike each of your turns deals an extra 1d6 lightning damage. As an action, spend 1 charge to blast a 15-foot
    cone from its ball. Creatures there make a DC 15 Constitution save, taking 2d8 thunder damage and being pushed
    10 feet on failure, or half damage without the push on success. This area effect cannot be Blocked. After a
    melee attack with the flail, you may instead create that blast as a bonus action aimed toward the attacked creature.
    You can throw the detachable ball with range 20/60 using Strength and the flail's base damage, then pull it
    20 feet toward you as a bonus action while within 60 feet. It reconnects in your space. While detached, the
    flail cannot make melee strikes, and its blast instead fills a 10-foot-radius sphere centered on the ball.
  conversion_notes: Replaces Thunderwave with a self-contained area power and makes the flail's damage riders follow
    Block.
  group: Rare
  rarity: Rare
  price: 3000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A17:D17
  original_5e: This flail has 3 charges and regains 1d3 expended charges each day at dawn. You can expend 1 charge
    to cast the thunderwave spell (save DC 15). The ball of the flail is the origin of the spell. As long as the
    flail has at least 1 charge, you deal an extra 1d6 lightning damage to the first target you hit with it on each
    of your turns. If you make a melee attack using the flail, you can immediately expend 1 charge to cast thunderwave
    as a bonus action in the direction of your last attacked target. The ball of the flail is attached to the chain
    with a powerful magnetic connection that can be released at will. You can make a ranged attack using the flail
    by releasing the ball mid-swing. This attack has a normal range of 20 feet and long range of 60. Strength is
    your ability modifier for this attack. While the ball is within 60 feet of you, you can magnetically pull it
    back up to 20 feet towards you as a bonus action. It magically reattaches itself to the chain when it enters
    the same space as you. While the ball is detached, you can still use the flail to cast thunderwave. When you
    do, the spell’s area of effect becomes a 10-foot radius sphere centered on the ball.
  source_name: Thunderous Flail
  source_price: 3000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Spellwriter's Brace
  id: mi-rare-018
  type: Wondrous item
  desc: At the end of a long rest, while wearing this brace, inscribe up to four different or repeated spells from
    your own spellbook as tattoos on your arm. Each must be level 1-5 and a level you can normally cast. They count
    as additional prepared spells if your class uses preparation, but do not create slots or additional known spells.
    As an action, touch a willing spellcaster and transfer one tattoo to it. Only one transferred tattoo may exist;
    transferring another erases the previous one. The recipient may cast that tattoo once using its own appropriate
    Varis casting resource, ability, attack bonus and save DC, observing the spell's printed casting time and additional
    costs. It cannot cast above its own maximum casting level. The tattoo disappears after casting. All tattoos
    vanish when you remove the brace or finish another long rest.
  conversion_notes: Replaces generic 5e slot expenditure with each recipient's own Varis casting resource and maximum
    level.
  group: Rare
  rarity: Rare
  price: 5000 GP
  attunement: 'Yes'
  source_ref: Magic item generator.xlsx — Rare!A18:D18
  original_5e: This writer's hand brace allows you to prepare four extra spells from your spellbook whenever you
    finish a long rest. The spells can be no higher than 5th level and must be of a level for which you have spell
    slots. When you do, the prepared spells appear on the skin of your arm as abstract spell tattoos that represent
    them. You can prepare the same spell multiple times in this way, taking the necessary time in order to do so,
    to create multiple copies of the same spell tattoo. As an action, you can touch a willing creature and speak
    the brace's command word to transfer one of your spell tattoos to it, causing the spell tattoo to disappear
    from your arm and appear on the creature instead. You can only have one tattoo transferred in this way at a
    time. Transferring a second spell tattoo causes the first one to disappear. A spellcaster with a spell tattoo
    can expend a spell slot of the tattooed spell’s level or higher, using its spell save DC, spell attack bonus,
    and spellcasting ability to do so. Once the spell is cast, its tattoo disappears. Any spell tattoos created
    by the brace disappear when you finish a long rest or remove the brace.
  source_name: Spellwriter's Brace
  source_price: 5000 GP
  source_attunement: 'Yes'
  source_rarity: Rare
- name: Sandstorm Dancer
  id: mi-rare-019
  type: Wondrous item
  desc: 'This cloak billows illusory sand. It has 8 charges and regains 1d6 + 2 at dawn. Spend an action and charges
