  base_item: war pick
  magic_bonus: '1'
  desc: This +1 Varis war pick adds 1 to attack, damage and Block DC and deals an extra 1d4 fire damage on each
    unblocked strike. It holds 4 charges and regains 1d4 spent charges at dawn. After an unblocked strike against
    a target made of metal or wearing metal armor, spend 1 charge to deal another 2d8 fire damage to that target.
