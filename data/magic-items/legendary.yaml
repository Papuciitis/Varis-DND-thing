section: magic-items
entries:
- type: Wondrous item
  desc: |-
    While wearing this black garnet phoenix-feather amulet, you are immune to necrotic damage. Once every seven days, when damage reduces your HP to 0, you may immediately manifest a shadow form for 1 minute. Your unconscious body becomes an immovable, untargetable shadow-veiled object: it takes no damage, receives no healing or other effects and makes no death saves. An action and a DC 30 Strength check can move it 10 feet.

    You control the shadow using your current statistics, features and resources. It has a separate 100-point shadow-health pool, resistance to damage other than force, psychic and radiant, and cannot move more than 60 feet from your body. Its copied equipment disappears with it and cannot create permanent objects or extra resource uses. Damage to it affects only shadow health; it receives no additional Temp HP or Arcane Health. When the minute ends with shadow health remaining, it returns to your body and restores HP equal to that remaining pool, capped at your HP maximum. If shadow health reaches 0 first, the amulet is destroyed, your body becomes vulnerable again, and you immediately record two failed death saves. The form cannot be activated again from the same reduction to 0 HP.
  conversion_notes: Defined the shadow as a separate health pool rather than stacking it with Varis Temp HP/Arcane
    Health, shared all expended resources with the original, and made the transition back to Varis death saves explicit.
  name: Death's shadow
  group: Legendary
  id: mi-legendary-002
  category: wearables
  rarity: Legendary
  attunement: 'Yes'
  price: 36000 GP
  source_ref: Magic item generator.xlsx — Legendary!A2:D2
  original_5e: 'This black garnet amulet is carved into the shape of a bird''s skull and is adorned with several
    dark feathers. At its center is a single phoenix feather that serves as a catalyst for this strange talisman''s
    necrotic magic. While wearing this amulet, you are immune to necrotic damage. Shadow Form. When you are reduced
    to 0 hit points while wearing this amulet, a shadowy version of yourself rises from your unconscious body. You
    control this form, which has your equipment and statistics. It has 100 temporary hit points and resistance to
    all damage that isn''t force, psychic, or radiant. The shadow form can''t move more than 60 feet from your body.
    The shadow vanishes after 1 minute or when it falls to 0 temporary hit points. If the shadow survives for the
    duration, it returns to your body and causes you to regain a number of hit points equal to the shadow''s remaining
    number of temporary hit points. If the shadow is defeated, the amulet is destroyed and you immediately fail
    2 death saving throws. While your shadow form is defending you, your unconscious body is covered by an impenetrable
    veil of shadow. While covered in this way, you can''t be interacted with: you are immune to all damage, don''t
    make death saving throws, can’t regain hit points, and can’t be affected by spells or magical effects. A creature
    can use an action to make a DC 30 Strength check, moving the covered body up to 10 feet on a success. Once this
    property has been used, it can''t be used again until 7 days have passed.'
  source_name: Death's shadow
  source_price: 36000 GP
  source_attunement: 'Yes'
  source_rarity: Legendary
- type: Weapon
  base_item: glaive
  magic_bonus: '3'
  desc: A +3 Varis glaive; its enhancement adds to attacks, weapon damage and block DC. When an unblocked strike
    reduces a hostile Small or larger creature to 0 HP, gain 1d10 temporary HP for 1 minute. These follow the normal
    nonstacking Temp HP rule. The blade glows green and stores the rolled amount. Your next unblocked melee strike
    with it before the minute ends adds that much necrotic damage, then the glow ends; a new kill replaces the stored
    amount rather than stacking it. Undead reduced to 0 HP by the glaive cannot be reanimated. Once per turn, your
    first unblocked melee strike against a Prone target maximizes only the glaive's base weapon damage dice, before
    critical dice and other riders.
  conversion_notes: Inherited Varis glaive properties and maneuvers, added enhancement to block DC, and clarified
    unblocked-strike, nonstacking Temp HP and base-dice maximization timing.
  name: Crypt Keeper Glaive
  group: Legendary
  id: mi-legendary-003
  category: weapons
  rarity: Legendary
  attunement: 'Yes'
  price: 28000 GP
  source_ref: Magic item generator.xlsx — Legendary!A3:D3
  original_5e: You gain a +3 bonus to attack and damage rolls made with this magic weapon. When you use the glaive
    to reduce a Small or larger creature that is hostile toward you to 0 hit points, roll a d10. You gain temporary
    hit points equal to the number you roll. In addition, the glaive’s blade begins to glow with a sickly green
    haze whenever you gain temporary hit points in this way. While glowing, the first successful melee attack you
    make with the glaive deals extra necrotic damage equal to the number of temporary hit points you gained. Once
    you deal this bonus damage, the haze fades. The haze and any remaining temporary hit points are lost after 1
    minute. Undead creatures killed by this weapon cannot be raised from the dead again. 6 feet under. The first
    time on your turn that you land a successful melee attack with this weapon against a creature that is prone,
    the weapon’s damage die is maximized.
  source_name: Crypt Keeper Glaive
  source_price: 28000 GP
  source_attunement: 'Yes'
  source_rarity: Legendary
- type: Weapon
  base_item: Greataxe
  magic_bonus: '3'
  desc: |-
    A +3 Varis Greataxe that deals force instead of slashing damage. Its enhancement adds to attack, weapon damage and block DC. A bonus action manifests or dismisses its prismatic blade. It sheds bright light for 15 feet and dim light for 15 more; a bonus action changes each radius by 5 feet, to a minimum of 10 and maximum of 30. An unblocked strike against an aberration or undead adds 1d12 radiant damage.

    Destructive glyph. Spend 1 minute carving one glyph into the suspended diamond. Choose death, terror, pain or sleep. The next unblocked strike against a creature consumes the glyph and forces a DC 17 Wisdom save; aberrations and undead have disadvantage. On a failure: death deals 10d10 necrotic damage; terror prevents the target willingly approaching you and imposes disadvantage on its attacks while it sees you; pain makes it Incapacitated; sleep makes it Unconscious until damaged or another creature uses an action to wake it. Terror, pain and sleep last 1 minute, with a new Wisdom save at the end of each target turn to end the effect. On a successful initial save, death deals half damage and the other glyphs have no effect. The glyph's damage cannot be separately blocked. You can prepare a glyph once every 12 hours and hold only one at a time.
  conversion_notes: Replaced an unavailable high-level Symbol dependency with four fully defined single-target glyphs.
    Retained the twelve-hour preparation limit, species disadvantage and light controls; integrated the force Greataxe
    with Varis Block.
  name: Realmswarden Greataxe
  group: Legendary
  id: mi-legendary-004
  category: weapons
  rarity: Legendary
  attunement: 'Yes'
  price: 34000 GP
  source_ref: Magic item generator.xlsx — Legendary!A4:D4
  original_5e: 'This ancient stone axe hilt is intricately carved. At its center is a gap that houses a single,
    perfect diamond that''s magically suspended in place and glows with an uncanny energy. While grasping the hilt,
    you can use a bonus action to cause a wide blade of pure prismatic light to radiate from the axe''s head, or
    make the blade disappear. The axe''s blade emits bright light in a 15-foot radius and dim light for an additional
    15 feet. You gain a +3 bonus to attack and damage rolls made with this magic weapon, which deals force damage
    instead of slashing damage. When you hit an aberration or undead with it, that target takes an extra 1d12 radiant
    damage. While the blade persists, you can use a bonus action to expand or reduce its radius of bright and dim
    light by 5 feet each, to a maximum of 30 feet each or a minimum of 10 feet each. The light that comes from the
    diamond at the axe''s center and forms the blade can be wrought to create powerful, destructive glyphs. Over
    the course of 1 minute, you can trace a glyph onto the surface of the axe, starting with the gem at its center,
    to recreate the effects of the symbol spell (save DC 17) with the following changes: The glyph you create as
    part of the spell exists on the axe and moves with it. The glyph can only be triggered when you hit a creature
    with the axe. The spell only affects the target that triggered the glyph. Aberrations and undead have disadvantage
    on the saving throw to resist the spell''s effects. Once this property of the axe has been used, it can''t be
    used again until 12 hours have passed. You can only have one glyph on the axe in this way at a time.'
  damage: 1d12 force
  source_name: Realmswarden Greataxe
  source_price: 34000 GP
  source_attunement: 'Yes'
  source_rarity: Legendary
- type: Weapon
  base_item: trident
  magic_bonus: '3'
  desc: |-
    A +3 Varis trident with a retrieval chain. Add its enhancement to attacks, weapon damage and block DC. It has Throw 20/60 if its base version has no throwing range. A bonus action retrieves it into a free hand from within 60 feet along an unobstructed chain. An unblocked thrown strike adds 1d8 lightning damage.

    Stormcall. Immediately after an unblocked strike, once per dawn, call lightning on the struck creature and all other creatures within 5 feet of it. Each makes a DC 16 Dexterity save, taking 6d10 lightning damage on a failure or half on a success. This magical area cannot be blocked, you are immune to its damage, and it fails if the target is sheltered from the sky. Creatures submerged in water or wearing metal armor have disadvantage; Soaked applies normally and does not create a second disadvantage.

    Impale and haul. As a Varis maneuver, replace one Attack-action attack and spend a bonus action or move action to make a thrown attack against a creature no more than one size larger than you. On an unblocked strike, resolve normal damage and make a Strength (Athletics) check contested by its Strength (Athletics). Winning pulls it up to 20 feet toward you without passing through obstacles.
  conversion_notes: Added Varis maneuver cost, an explicit retrieval distance and chain path, unblocked-strike triggers
    and area Block handling. Soaked and metal armor use one disadvantage rather than stacking penalties.
  name: Storm Thrower Harpoon (trident)
  group: Legendary
  id: mi-legendary-005
  category: weapons
  rarity: Legendary
  attunement: 'Yes'
  price: 28000 GP
  source_ref: Magic item generator.xlsx — Legendary!A5:D5
  original_5e: This weapon has a +3 bonus to attack and damage rolls made with this magical weapon. The trident
    has a chain attached to its handle that can be used to retrieve the weapon once it’s been thrown using a bonus
    action. When you hit with a ranged attack using this weapon, it deals an additional 1d8 lightning damage. In
    addition, this trident acts as a conduit for the sky’s ferocious power. Immediately after hitting a creature
    with the trident, you can call down a bolt of lightning upon it, forcing it and all creatures within 5 feet
    to make a DC 16 Dexterity saving throw. On a failed save, creatures take 6d10 lightning damage, or half as much
    on a success. Creatures have disadvantage on the saving throw if they’re submerged in water or wearing metal
    armor. You are immune to the lightning damage caused by this effect. This ability fails if the creatures are
    obstructed from the sky. Once you use this ability, you cannot do so again until the next dawn. Impale. You
    can use your action to try to impale and pull a creature toward you. If your target is a creature that is no
    more than one size larger than you, you can make a ranged weapon attack against it using the trident. If you
    hit, you can attempt to pull the impaled creature toward you by making a Strength (Athletics) check contested
    by the target’s Strength (Athletics) check. If you succeed, you can pull the creature up to 20 feet toward you.
  source_name: Storm Thrower Harpoon (trident)
  source_price: 28000 GP
  source_attunement: 'Yes'
  source_rarity: Legendary
- type: Weapon
  base_item: Dagger
  magic_bonus: '3'
  desc: A +3 Varis Dagger that deals slashing instead of piercing damage. Add its enhancement to attacks, weapon
    damage and block DC. Once per dawn, use an action while holding it to gain the Varis Ethereal condition for
    up to 1 minute. You can end this state without an action on your turn. While ethereal in this way, you may make
    one Spirit Cleaver melee attack against a creature you can see on your original plane, with advantage. This
    is an explicit exception to Ethereal's inability to attack and ends the ethereal state immediately after that
    attack. The target may Block normally. If the attack was an unblocked strike that legally applies one of your
    existing Sneak Attack features, and leaves a living nonconstruct, nonundead target at 75 HP or fewer, it must
    make a DC 17 Constitution save or die. The dagger grants no Sneak Attack feature of its own. Expiry or emergence
    inside solid material uses the current Ethereal rule.
  conversion_notes: Replaced Etherealness with the system's Ethereal condition plus a precise one-attack exception.
    Preserved the assassination threshold without granting a nonexistent class feature, and required an unblocked
    Sneak Attack strike.
  name: Spirit Cleaver (dagger)
  group: Legendary
  id: mi-legendary-006
  category: weapons
  rarity: Legendary
  attunement: 'Yes'
  price: 34000 GP
  source_ref: Magic item generator.xlsx — Legendary!A6:D6
  original_5e: 'This dark metal blade can slip between a person and their spirit to sever their connection to one
    another. You gain a +3 bonus to attack and damage rolls made with this magic weapon, which deals slashing damage
    instead of piercing damage. While holding this weapon, you can use an action to cast the etherealness spell
    from it with the following changes: While on the Ethereal Plane, you can attack targets that you can see on
    the plane you originated from with the spirit cleaver. These attacks are made with advantage. If a target has
    75 hit points or fewer after taking Sneak Attack damage in this way and isn''t a construct or undead, it must
    succeed on a DC 17 Constitution saving throw or die. The spell has a duration of 1 minute, but ends early if
    you attack a creature on the plane you originated from with the spirit cleaver. Once this property of the weapon
    has been used, it can''t be used again until the next dawn.'
  damage: 1d4s
  source_name: Spirit Cleaver (dagger)
  source_price: 34000 GP
  source_attunement: 'Yes'
  source_rarity: Legendary
- type: Weapon
  base_item: glaive
  magic_bonus: '3'
  desc: |-
    A +3 Varis glaive with Balanced added to its normal properties. Add its enhancement to attacks, weapon damage and block DC. An elf or half-elf is proficient with this particular weapon; other wielders use their normal weapon training. While attuned, gain advantage on Charisma checks to interact with fey. An unblocked strike strips its target of fire and cold resistance and immunity until the end of your next turn; other defenses remain.

    Kelren, the elven king of Imfe Mythse, speaks from within the glaive. It has Intelligence 14, Wisdom 15, Charisma 16, hearing and darkvision to 120 feet, understands Elvish and Sylvan, and speaks telepathically with its wielder. He is stern, honest and dedicated to protecting natural ecosystems from fiends and unnatural devastation. He can refuse initial attunement to a creature actively destroying those ecosystems or knowingly serving fiends, but does not control the wielder's actions or remove an already-earned class feature.
  conversion_notes: Converted 5e finesse to Varis Balanced, made species training local to this weapon, specified
    the unblocked resistance-stripping trigger and retained the sentient king's purpose and communication.
  name: Glaive of the Revenant King
  group: Legendary
  id: mi-legendary-007
  category: weapons
  rarity: Legendary
  attunement: 'Yes'
  price: 34000 GP
  source_ref: Magic item generator.xlsx — Legendary!A7:D7
  original_5e: This long-lost silver glaive once belonged to an elven king. Its impeccable elven make lets it be
    swung nimbly, despite its size. This weapon has the finesse property. In addition, you gain a +3 bonus to attack
    and damage rolls made with this magic weapon. Sentience. The glaive is a sentient weapon of chaotic good alignment,
    with an Intelligence of 14, a Wisdom of 15, and a Charisma of 16. It has hearing and darkvision out to a range
    of 120 feet. The weapon communicates telepathically with its wielder and can speak, read, and understand Elvish
    and Sylvan. Personality. The glaive is inhabited by the spirit of Kelren, the elven king of Imfe Mythse. His
    life's mission to rid his kingdom of demons, fiends, and other unwelcome ilk lives on inside the weapon. He
    seeks to rebalance the flow and seasons of nature, eager to destroy anything that threatens to change the natural
    ecosystems of the world. Kelren is stern, but honest. He may share stories of his kingdom from time to time
    if an anecdote serves to further his ambitions. A character who he deems unworthy of wielding the blade, such
    as a weak or evil creature, may be denied the ability to attune to the weapon. Elven Kinship. You are considered
    proficient with this weapon if you are an elf or half-elf. In addition, while attuned to this weapon, you have
    advantage on Charisma checks made to interact with fey creatures. Energy Nullification. If you hit a target
    with this weapon that is either resistant or immune to cold or fire damage, that target loses that resistance
    or immunity until the end of your next turn.
  properties:
  - versatile 2d4
  - reach I
  - balanced
  source_name: Glaive of the Revenant King
  source_price: 34000 GP
  source_attunement: 'Yes'
  source_rarity: Legendary
- type: Weapon
  base_item: Greatsword
  magic_bonus: '1'
  desc: |-
    A +1 Varis Greatsword. Two willing friendly creatures can jointly attune during one long rest; it then grants +2 instead, while counting against each creature's attunement limit. Set its inventory Magic bonus to +2 while jointly attuned. The enhancement adds to attacks, weapon damage and block DC.

    A bonus-action command splits it into two Varis Scimitars or joins the blades in your hands. Each separated blade has Throw 20/60 and deals piercing damage when thrown. One adds 1d6 fire and the other 1d6 cold damage to each unblocked strike; the combined Greatsword adds both. Each attuned creature can use the command from anywhere on the same plane to summon one separated blade into a free hand, or both as the Greatsword if neither is held by the other attuned creature. A creature holding a blade can allow its recall without an action. Record split blades as Scimitars with the same enhancement; one physical blade cannot occupy two inventories.

    Once per dawn per attuned creature, use an action while holding a blade to sheath yourself in fire or frost for 10 minutes. Fire grants cold resistance and frost grants fire resistance. When a creature within 5 feet makes an unblocked melee strike against you, it takes 2d8 fire or cold damage respectively. This shield needs no concentration and ends when you dismiss it or lose attunement.
  conversion_notes: Replaced Fire Shield with a complete item power. Mapped split and joined states to current weapons,
    accounted for Block and shared ownership, and preserved the special two-creature long-rest bond.
  name: Love's Embrace (Greatsword)
  group: Legendary
  id: mi-legendary-008
  category: weapons
  rarity: Legendary
  attunement: 'Yes'
  price: 16000 GP
  source_ref: Magic item generator.xlsx — Legendary!A8:D8
  original_5e: You gain a +1 bonus to attack and damage rolls made with this magic weapon. This weapon can be attuned
    to by two friendly creatures together over the course of a long rest. If the weapon is attuned to by two creatures
    in this way, the weapon’s attack and damage bonus becomes +2 instead. This greatsword is made of two long scimitars
    that are held together by a powerful, unidentifiable magic. You can speak the weapon’s command word using a
    bonus action to separate it into a pair of scimitars or recombine them into the greatsword. If you are not already
    holding it when you speak the weapon’s command word and are on the same plane of existence as it, you can choose
    to summon either one or both scimitars to your hand as individual blades or as the combined greatsword. The
    scimitars have the thrown property with a normal range of 20 feet and a long range of 60 feet when separated.
    The scimitars deal piercing damage when thrown. Each scimitar also has its own elemental effect — either fire
    or cold — that inflicts an extra 1d6 fire or 1d6 cold damage with each strike, depending on which sword you
    hit with. When you hit with an attack using the greatsword, the target takes both fire and cold bonus damage
    from the attack. Each attuned creature can cast the fire shield spell once at 4th level without expending a
    spell slot. You do not need material or somatic components when casting it in this way. Once you cast this spell,
    you cannot cast it again until the following dawn.
  source_name: Love's Embrace (Greatsword)
  source_price: 16000 GP
  source_attunement: 'Yes'
  source_rarity: Legendary
- type: Wondrous item
  desc: |-
    An attuned arcane caster may use Ogden Fellweaver's tome as an arcane focus and, if they have a spellbook feature, as that spellbook. When attunement ends, its written contents vanish.

    Absorb knowledge. Once while its absorption is ready, when a visible creature within 60 feet finishes casting a level 1–6 spell, use a reaction while holding the book to make an Intelligence (Arcana) check against DC 10 + that spell's actual casting level. On success its current Varis rule is recorded. You can learn or prepare it only if your class permits its tradition, level and preparation method; the tome neither grants a new tradition nor bypasses a class's known-spell limit. Incompatible notation remains readable historical information but cannot cast the spell. Absorption becomes ready again after a number of dawns equal to that level, whether the check succeeded or failed.

    Shift knowledge. Once per dawn at the end of a short rest, a character who prepares spells from a spellbook may replace up to three prepared spells with other eligible spells in this tome. This does not create prepared casting for a class that knows spells instead. Unknown knowledge: once per dawn, use an action holding it to gain proficiency in one skill or tool until the next dawn; if already proficient, double your proficiency contribution instead, never more than twice.

    Curse. You are unwilling to part with it and, if you use a spellbook, compelled to use this one. Preparing a spell from another book deals unblockable psychic damage equal to its level for each spell prepared. An effect that explicitly ends curses permits you to end attunement; merely hiding or dropping the tome does not.
  conversion_notes: Removed 5e Wizard-list assumptions. Absorption now respects Varis traditions, level-six ceiling
    and actual class preparation/known-spell systems; clarified cooldown on failure and preserved the spellbook
    curse.
  name: Tome of Lost Knowledge
  group: Legendary
  id: mi-legendary-009
  category: misc
  rarity: Legendary
  attunement: 'Yes'
  price: 24000 GP
  source_ref: Magic item generator.xlsx — Legendary!A9:D9
  original_5e: This gold-trimmed book's cover is embossed with a portrait of Ogden Fellweaver, a legendary wizard
    infamous for his ill-gotten knowledge. If you can attune to this item, you can use it as a spellbook and an
    arcane focus. If your attunement to the book ends, anything written in the book disappears. Absorb Knowledge.
    Immediately after a creature that you can see within 60 feet of you casts a spell of 1st level or higher, you
    can use your reaction to make an Intelligence (Arcana) check. The DC equals 10 + the spell's level. On a success,
    the spell is magically added to the book in your own notation. You must be holding the book to use this property.
    If the added spell is a wizard spell and of a spell level you can prepare, you can prepare this spell just like
    your other spells. If the spell is not a wizard spell, its notation is garbled and impossible to use. Once this
    property has been used, it can't be used again until a number of days equal to the spell's level have passed.
    Shift Knowledge. While using this book as your spellbook, you can replace up to 3 spells from your prepared
    list of spells when you finish a short rest. Once this property has been used, it can't be used again until
    the next dawn. Unknown Knowledge. While holding the book, you can use an action to channel its hidden knowledge.
    When you do, you gain proficiency in one skill or tool of your choice until the next dawn. If you're already
    proficient in the chosen skill or tool, your proficiency bonus is doubled, instead. Once this property has been
    used, it can't be used again until the next dawn. Curse. This book is cursed, and becoming attuned to it extends
    the curse to you. As long as you remain cursed, you are unwilling to part with the book, keeping it within reach
    at all times. In addition, you are compelled to use this book as your spellbook. Each time you prepare a spell
    from another spellbook, you take psychic damage equal to the spell's level.
  source_name: Tome of Lost Knowledge
  source_price: 24000 GP
  source_attunement: 'Yes'
  source_rarity: Legendary
- type: Ammunition
  desc: |-
    This elemental quiver displays at most five arrows or bolts. As a bonus action create one elemental piece; it can create five each of air, earth, fire and water between dawns. Only you receive its magic, which fades at the end of the turn a piece leaves the quiver. The ordinary weapon attack and Block still apply. Air ignores long-range disadvantage, adds 1d6 thunder on an unblocked strike, and ends a magical cloud or atmospheric effect of level 3 or lower that its path crosses. Earth adds 2d6 bludgeoning on an unblocked strike and forces a DC 15 Strength save or pushes the target 10 feet away. Fire adds 1d6 fire on an unblocked strike; hit, miss or Block, it explodes at the target's position, requiring creatures within 5 feet to make a DC 15 Dexterity save or take another 1d6 fire. Water ignores underwater attack penalties, adds 2d6 piercing on an unblocked strike (3d6 against a creature made of fire), and extinguishes mundane flames within 10 feet of impact.

    As a bonus action press a compatible pair to create a hybrid; each of the following four hybrids can be created once between dawns, separately from elemental quotas. Ice (air/water): an unblocked strike adds 3d6 cold and forces a DC 15 Constitution save; failure Paralyzes for 1 minute, with a new save at each turn's end (it can make these recovery saves despite being Paralyzed), while success halves speed until the end of its next turn. Cold resistance or immunity automatically succeeds; taking fire damage ends paralysis. Magma (earth/fire): an unblocked strike adds 3d6 fire; hit, miss or Block, creatures in a 20-foot-radius sphere at impact make a DC 15 Constitution save or gain 1 Fatigue. Fire resistance or immunity automatically succeeds. Ooze (earth/water): impact coats a 10-foot square for 1 minute; it is difficult terrain, and creatures there on impact or entering or ending a turn there make one DC 15 Dexterity save per turn or fall Prone. Smoke (air/fire): impact creates a heavily obscured 20-foot-radius smoke sphere for 1 minute; strong wind disperses it. Hybrid area effects cannot be blocked. Pressing incompatible pairs spends no quota and creates nothing.
  conversion_notes: Replaced Exhaustion levels with Fatigue and undefined Grease/Smoke dependencies with complete
    areas. Distinguished attack riders from impact explosions that still occur on a miss or Block; retained separate
    elemental and hybrid quotas.
  name: Quiver of Elemental Chaos
  group: Legendary
  id: mi-legendary-010
  category: weapons
  rarity: Legendary
  attunement: 'Yes'
  price: 16000 GP
  source_ref: Magic item generator.xlsx — Legendary!A10:D10
  original_5e: 'This quiver has a lid with 5 holes in it and has depictions of the Elemental Planes on its side.
    It has 4 buttons along its top that correspond to each of the four elements: Air, Earth, Fire, and Water. Elemental
    Ammunition. The quiver can have up to 5 arrows or bolts on display at a time, which appear through the holes
    in its lid. You can press one of the quiver''s buttons using a bonus action to cause it to create and display
    1 elemental arrow or bolt. The type of arrow or bolt depends on the button you press. The quiver can produce
    up to 5 of each type of ammunition in this way each day. Any arrow or bolt created by this quiver is magical
    and has the following properties based on its element. The ammunition is only magical for you, and any arrow
    or bolt removed from the quiver loses its magic at the end of the turn. Air Ammunition. This ammunition is weightless
    and whistles softly as it moves. This piece of ammunition can be fired at its long range without disadvantage
    and deals an extra 1d6 thunder damage to any target it hits. In addition, any magical atmospheric effect that
    the arrow passes through cast at 3rd level or lower, such as a fog cloud or stinking cloud, is dispelled. Earth
    Ammunition. This ammunition carries an uncanny force behind it and turns to stone at its end. When you hit with
    a ranged attack using this ammunition, the target takes an extra 2d6 bludgeoning damage and must succeed on
    a DC 15 Strength saving throw or be pushed 10 feet away from you. Fire Ammunition. This ammunition has tongues
    of fire licking up its side and spews embers at the slightest movement. When shot, it erupts into a plume of
    white-hot flame. This piece of ammunition deals an extra 1d6 fire damage to any target it hits. Hit or miss,
    the ammunition explodes. The target and each creature within 5 feet of it must succeed on a DC 15 Dexterity
    saving throw or take 1d6 fire damage. Water Ammunition. This ammunition has a silky texture and glitters with
    watery reflections. A ranged attack made with this ammunition ignores the normal penalties of underwater fighting
    and deals an extra 2d6 piercing damage to any target it hits, or 3d6 piercing damage if the target is made of
    fire. In addition, any nonmagical flames within 10 feet of this ammunition''s point of impact are extinguished
    when it hits. Paraelemental Ammuntion. You can press two compatible elemental buttons at the same time as a
    bonus action to create a paraelemental arrow or bolt: a hybrid piece of ammunition. Water and Air create Ice,
    Fire and Earth create Magma, Earth and Water create Ooze, and Air and Fire create Smoke. This ammunition appears
    from a special compartment in the quiver''s lid. The quiver can create 1 of each type of paraelemental ammunition
