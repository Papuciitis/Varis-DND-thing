section: magic-items
entries:
- name: Scroll of Message
  group: Common
  id: mi-common-002
  category: scrolls
  type: Scroll
  rarity: Common
  attunement: 'No'
  price: 20 GP
  desc: As an action, read and consume this scroll to whisper a message of up to 25 words to one creature you can
    see within 120 feet. Only that creature hears it and it can immediately whisper a reply of up to 25 words that
    only you hear. No spell slot, known spell, or concentration is required.
  conversion_notes: The workbook supplies a name only. Authored a self-contained single-use communication power
    rather than importing an absent 5e spell.
  source_ref: Magic item generator.xlsx — Common!A2:D2
  original_5e: No description supplied in workbook.
  source_name: Scroll of Message
  source_price: 20 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Scroll of Color Spray
  group: Common
  id: mi-common-003
  category: scrolls
  type: Scroll
  rarity: Common
  attunement: 'No'
  price: 120 GP
  desc: As an action, read and consume this scroll to release dazzling colors in a 15-foot cone. Creatures in the
    cone make a DC 13 Constitution save. On a failure, a creature is Blinded until the end of your next turn. A
    sightless creature is unaffected. This is a magical visual effect and deals no damage.
  conversion_notes: The workbook supplies a name only. Authored a fixed-DC visual power using the Varis Blinded
    condition.
  source_ref: Magic item generator.xlsx — Common!A3:D3
  original_5e: No description supplied in workbook.
  source_name: Scroll of Color Spray
  source_price: 120 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Scroll of Goodberry
  group: Common
  id: mi-common-004
  category: scrolls
  type: Scroll
  rarity: Common
  attunement: 'No'
  price: 120 GP
  desc: As an action, read and consume this scroll to create ten berries in your hand. A creature can use an action
    to eat one berry, recovering 1 HP. Eating at least one provides a day of nourishment. Uneaten berries lose their
    magic after 24 hours. The berries cannot restore rest dice, Fatigue, Block, or Arcane Health.
  conversion_notes: The workbook supplies a name only. Authored a bounded healing and nourishment effect without
    assuming an absent spell.
  source_ref: Magic item generator.xlsx — Common!A4:D4
  original_5e: No description supplied in workbook.
  source_name: Scroll of Goodberry
  source_price: 120 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Scroll of Detect Evil and Good
  group: Common
  id: mi-common-005
  category: scrolls
  type: Scroll
  rarity: Common
  attunement: 'No'
  price: 120 GP
  desc: As an action, read and consume this scroll. For 10 minutes, while concentrating, you sense whether an aberration,
    celestial, elemental, fey, fiend, or undead is within 30 feet and know its direction. You also sense ground
    or objects consecrated or desecrated by divine magic. The sense does not reveal alignment, identity, invisibility,
    or a creature behind 1 foot of stone, 1 inch of metal, or a thin sheet of lead.
  conversion_notes: The workbook supplies a name only. Authored a self-contained creature-type and consecration
    sense; alignment is not treated as a detectable statistic.
  source_ref: Magic item generator.xlsx — Common!A5:D5
  original_5e: No description supplied in workbook.
  source_name: Scroll of Detect Evil and Good
  source_price: 120 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Phasing Bow
  group: Common
  id: mi-common-006
  category: weapons
  type: Weapon
  rarity: Common
  attunement: 'No'
  price: 1500 GP
  desc: Use the Longbow entry, including its training, range, properties, and maneuvers. This magic bow has 5 charges
    and regains all charges at dawn. When making a ranged attack, spend 1 charge to ignore cover, including total
    cover, unless the obstruction is lead or more than 1 foot thick. Effects preventing ethereal travel stop this
    arrow. On an unblocked strike, deal an extra 2d6 force damage. Alternatively, as a bonus action spend 3 charges
    and fire an arrow at a visible point within normal range. If it hits a solid surface, teleport to the nearest
    unoccupied space beside that point.
  conversion_notes: Kept charge economy and dawn recovery. Uses Varis Longbow statistics and makes the damage rider
    require an unblocked strike.
  source_ref: Magic item generator.xlsx — Common!A6:D6
  original_5e: This flexible bow is made from the chitinous legs of a phase spider and retains some of its ethereal
    properties. The bow has 5 charges and regains all expended charges daily at dawn. When you make a ranged attack
    roll with this magic bow, you can expend 1 of its charges to cause the arrow to slip partially into the Ethereal
    Plane. When you do, the target of the attack gains no benefit from cover, including total cover, as long as
    the cover isn't made of lead or more than 1 foot thick. If you hit, the target takes an extra 2d6 force damage.
    Any effect that blocks travel through the Ethereal Plane also blocks the arrow. Alternatively, you can speak
    the bow's command word as a bonus action to expend 3 of its charges and fire an arrow at a point you can see
    within the weapon's normal range. When the arrow hits a solid surface, you vanish from your location and reappear
    in an unoccupied space nearest to that point.
  base_item: Longbow
  source_name: Phasing Bow
  source_price: 1500 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Forecaster's Cloak
  group: Common
  id: mi-common-007
  category: wearables
  type: Wondrous item
  rarity: Common
  attunement: 'No'
  price: 500 GP
  desc: While wearing this warm, fur-lined cloak, use an action to open it and speak its command word. Harmless
    sensory effects inside the cloak depict the weather expected at your present location during the next 8 hours.
    The display lasts 1 minute or until you close the cloak. It does not protect against weather, predict supernatural
    interference, or forecast another location.
  conversion_notes: Utility power retains its action, forecast window, and duration; no combat conversion is needed.
  source_ref: Magic item generator.xlsx — Common!A7:D7
  original_5e: This warm, fur-lined cloak creates illusory representations of the impending weather. While wearing
    this cloak, you can use an action to open it and speak its command word to create a harmless, sensory effect
    within the cloak that represents what the weather will be at your location for the next 8 hours. This effect
    persists for 1 minute or until you close the cloak.
  source_name: Forecaster's Cloak
  source_price: 500 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Merry Berry
  group: Common
  id: mi-common-008
  category: consumables
  type: Potion
  rarity: Common
  attunement: 'No'
  price: 60 GP
  desc: This berry tastes like shortbread. When properly cooked and eaten, it grants advantage for 24 hours on Intelligence
    or Wisdom checks relying on smell or taste and checks using cooking tools. Raw or overcooked berries grant no
    mechanical benefit. Preparing an edible berry takes ordinary cooking time and equipment; no check is needed
    under normal conditions. Eating more berries refreshes the duration and does not stack the benefit.
  conversion_notes: Kept the sensory and cooking benefits; clarified preparation and non-stacking so it is usable
    without a new cooking subsystem.
  source_ref: Magic item generator.xlsx — Common!A8:D8
  original_5e: 'This small fruit is highly sought after by cooks and sweet-lovers everywhere, both for its flavor
    as well as its unique sensory-enhancing properties. Eating a berry raw yields a taste and texture like that
    of a rich shortbread: the perfect way to end a day of adventure or travel. Cooking the berry, whether it be
    in a cuisine or simply roasted over a campfire, brings out more uncommon effects. When properly cooked, a creature
    that eats the fruit gains advantage on all Wisdom and Intelligence checks based on smell or taste for the next
    24 hours, as well as advantage on ability checks using cook’s utensils. Overcooking the fruit not only cooks
    out the berry’s benefits, but also results in a soggy and overall bland dish.'
  source_name: Merry Berry
  source_price: 60 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Squasher
  group: Common
  id: mi-common-009
  category: weapons
  type: Weapon
  rarity: Common
  attunement: 'No'
  price: 100 GP
  desc: Use the Great-club entry for this durable magical squash, including its damage and properties. A Druid is
    trained with it and may use Wisdom instead of Strength for its attack roll, damage modifier, and attack Block
    DC. Other users use the normal Great-club rules. It grants no enhancement bonus.
  conversion_notes: Assigned a definite Varis base weapon and applied its Wisdom substitution consistently to Block
    DC.
  source_ref: Magic item generator.xlsx — Common!A9:D9
  original_5e: This enormous squash is strangely durable and makes for a functional magic weapon. Druids wielding
    squasher are proficient with the weapon and can use their Wisdom modifier for the weapon’s attack and damage
    rolls instead of Strength.
  base_item: Great-club
  source_name: Squasher
  source_price: 100 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Dress of Many Pockets
  group: Common
  id: mi-common-010
  category: wearables
  type: Wondrous item
  rarity: Common
  attunement: 'No'
  price: 100 GP
  desc: The dress has six magical pockets. As a bonus action while wearing it, make any number appear or disappear
    anywhere on the dress. Each holds one parcel no larger than 4 inches in any dimension and no heavier than 2
    pounds. Hidden contents remain distributed inside the dress and retain their weight. Retrieve or stow an item
    using the normal object interaction. If the dress is destroyed, its contents fall into its space.
  conversion_notes: Retained six-pocket capacity and bonus-action shifting; clarified weight and destruction without
    creating an extradimensional storage exploit.
  source_ref: Magic item generator.xlsx — Common!A10:D10
  original_5e: This dress has six pockets that can be magically shown or hidden. While wearing the dress, you can
    use a bonus action to cause any number of its pockets to appear or vanish from it. The pockets can be located
    anywhere on the dress, and needn't be in the same place each time they appear. Each pocket is large enough for
    a small parcel, measuring no more than 4 inches in any dimension and weighing no more than 2 pounds. While a
    pocket is hidden, its contents are magically moved to the inside of the dress and evenly distributed throughout
    it so as to not affect its delicate appearance.
  source_name: Dress of Many Pockets
  source_price: 100 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Freerunner's Armor (light armor)
  group: Common
  id: mi-common-011
  category: armor-shields
  type: Armor
  rarity: Common
  attunement: 'No'
  price: 500 GP
  desc: Use Leather armor, including its Base AC and normal Varis armor rules. Once on each of your turns, when
    you long jump onto or beside a non-slippery wall, you may travel along the wall for the remaining distance of
    that jump and jump again from it. Every foot traveled costs movement, and the second jump must follow the normal
    jump limits. If you end this movement unsupported, you fall.
  conversion_notes: Selected a concrete light-armor base and made wall running consume movement rather than grant
    free distance.
  source_ref: Magic item generator.xlsx — Common!A11:D11
  original_5e: While wearing this armor, you feel light on your feet and agile. When you make a long jump onto or
    alongside a wall or similar surface that isn't slippery for the first time on your turn, you can move along
    that wall for the length of the jump during the move. While on that surface, you can make a second jump, provided
    you have the movement to do so.
  base_item: Leather armor
  source_name: Freerunner's Armor (light armor)
  source_price: 500 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Leatherbeard
  group: Common
  id: mi-common-012
  category: wearables
  type: Wondrous item
  rarity: Common
  attunement: 'No'
  price: 150 GP
  desc: 'Use an action to put on or remove this leather mask. While worn it creates an illusory beard of a chosen
    color and style, up to 2 feet long. A creature examining it can identify the illusion with a DC 10 Intelligence
    (Investigation) check. After each uninterrupted 7-day period worn, roll d100: the beard becomes real on 25 or
    lower, then 50 or lower after the next period, then 75, then automatically after the fourth. When it becomes
    real, the mask is destroyed. The real beard grows further only if you can naturally grow one.'
  conversion_notes: Resolved the cumulative 25-percent timing explicitly while keeping the original illusion and
    transformation.
  source_ref: Magic item generator.xlsx — Common!A12:D12
  original_5e: This leather mask sits over your mouth and chin and can be worn or removed using an action. While
    wearing the mask, you grow an illusory beard. You choose the color and style of the beard each time you wear
    the mask. The beard can be up to 2 feet long. A DC 10 Intelligence (Investigation) check reveals the beard is
    an illusion. For every 7 consecutive days that pass in which you do not remove the mask, there is a cumulative
    25 percent chance that the beard becomes real. When it does, the mask is destroyed. The real beard doesn't continue
    to grow unless you can already naturally grow a beard.
  source_name: Leatherbeard
  source_price: 150 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Smash Potatoes
  group: Common
  id: mi-common-013
  category: consumables
  type: Potion
  rarity: Common
  attunement: 'No'
  price: 30 GP
  desc: Eat one potato as an action. For 1 hour your ordinary unarmed damage die is 1d4 if it was smaller; retain
    the normal ability modifier and training rules. It does not improve an unarmed die already 1d4 or larger. Each
    additional potato eaten extends the duration by 1 hour, to a maximum of three potatoes before your next long
    rest.
  conversion_notes: Kept the source consumption limit and long-rest recovery; Varis long rests take a week, and
    the item does not change that.
  source_ref: Magic item generator.xlsx — Common!A13:D13
  original_5e: This hearty root vegetable is grown by the clerics and champions of a god of war and combat, whose
    strength is said to make its way onto the Material Plane through their gardens. Eating one of these vaguely
    fist-shaped potatoes will cause your hands to itch for the thrill of combat. Eating a potato increases your
    unarmed damage to 1d4 for 1 hour. Each additional eaten potato increases the duration by 1 hour. You can eat
    up to 3 potatoes before needing to finish a long rest to benefit from them again. If you already have an unarmed
    combat die that is 1d4 or higher, this vegetable has no effect but is nevertheless delicious.
  source_name: Smash Potatoes
  source_price: 30 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Griffon Coinpouch
  group: Common
  id: mi-common-014
  category: misc
  type: Wondrous item
  rarity: Common
  attunement: 'No'
  price: 150 GP
  desc: This 6-inch purse holds up to 1,000 coins and always weighs 1 pound while intact. Coins removed from it
    are clean and shiny. Other objects do not receive the weight reduction. At the GM's discretion it may contain
    a cryptic written warning; that note grants no compulsory prediction or mechanical bonus.
  conversion_notes: Coin storage and weight remain unchanged. The optional story note has no imported combat mechanic.
  source_ref: Magic item generator.xlsx — Common!A14:D14
  original_5e: 'This stylized purse is sewn and stitched in the style of the griffon''s saddlebag, a classic treasure
    and character from children''s stories and legends. The purse is 6 inches across and holds up to 1,000 coins.
    Coins taken from the purse are miraculously clean and shiny, as if freshly minted. The bag always weighs 1 pound,
    regardless of the number of coins within it. At the GM''s discretion, a small slip of parchment can be found
    folded among the coins inside. The parchment can have anything on it, although it usually carries enigmatic
    warnings or peculiar words of guidance. You can write your own notes or roll a d8 and consult the table below
    to determine what the parchment says: d8 Message 1 Falling rocks play to the rhythm of catastrophe. 2 Whether
    or not you succeed, you can certainly try. 3 Draughts are meant to be drunk. 4 Strength in numbers. 5 Acid,
    fire, and diamonds can solve most problems. 6 Not all strangers are trustworthy. 7 Asking for directions is
    not a sign of weakness. 8 Keep on adventuring.'
  source_name: Griffon Coinpouch
  source_price: 150 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Cleaning Cube
  group: Common
  id: mi-common-015
  category: misc
  type: Wondrous item
  rarity: Common
  attunement: 'No'
  price: 20 GP
  desc: As an action, place this dehydrated 2-inch cube in at least 1 gallon of water. It becomes a soapy 1-foot
    cube weighing 6 pounds for 8 hours. It moves 1 foot per round and can climb any surface, including ceilings,
    cleaning ordinary dirt without harming the surface. It obeys simple spoken cleaning commands, hears and has
    blindsight to 60 feet, and cannot speak or read. It is a magical object with AC 10, 10 HP, and resistance to
    all damage. At 0 HP it dehydrates instead of being destroyed; rehydrating restores its HP. Squeezing it as an
    action dehydrates it early. It cannot attack or block. It harmlessly holds stray coins and gems until removed
    as an action or it dehydrates.
  conversion_notes: Kept the object statistics and cleaning role; explicitly excluded creature actions and Block
    checks.
  source_ref: Magic item generator.xlsx — Common!A15:D15
  original_5e: This Tiny, sentient piece of an enchanted gelatinous cube is harmlessly soapy, instead of acidic,
    and enjoys cleaning the surfaces it travels across. When found, the cleaning cube is a dehydrated, 2-inch cube.
    While dehydrated, the cube is inanimate and its weight is negligible. You can place the dehydrated cube in 1
    or more gallons of water as an action, causing it to animate and grow in size to become a 1-foot cube that weighs
    6 pounds. The rehydrated cube moves slowly while animated in this way, methodically cleaning objects and surfaces
    it comes into contact with. The cube remains hydrated for up to 8 hours, but can be squeezed as an action (as
    if it were a sponge) to dehydrate it again early. The cleaning cube is considered a magical object and is not
    a creature. It has a speed of 1 foot and can climb difficult surfaces, including upside down on ceilings, without
    needing to make an ability check. It has AC 10, 10 hit points, and resistance to all damage. The cube dehydrates
    when it drops to 0 hit points, but regains all its hit points when hydrated again. Sentience. The cleaning cube
    is a sentient unaligned item with an Intelligence of 1, a Wisdom of 6, and a Charisma of 1. It has hearing and
    blindsight out to a range of 60 feet. It can't speak or read, but obeys your commands as best as it can understand
    them. Personality. The cleaning cube is happiest finding and dissolving dirt and other grime, and enjoys the
    feeling of moving across clean, polished surfaces. It doesn't concern itself with combat, preferring to continue
    its cleaning instead of involving itself in confrontation. If the cube finds a stray coin, gemstone, or other
    similar small item out of place while it cleans, it will absorb and clean the item until it's removed by a creature
    as an action or until it becomes dehydrated once again.
  source_name: Cleaning Cube
  source_price: 20 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Rope Caster (hand crossbow)
  group: Common
  id: mi-common-016
  category: weapons
  type: Weapon
  rarity: Common
  attunement: 'No'
  price: 10 GP
  desc: Use the Hand crossbow's attack training and range, but this device fires only rope and deals no damage.
    Load a length of rope as a bonus action. Make a ranged attack against a willing creature or an unattended object.
    On a hit, if sufficient rope reaches and encircles the target, the rope ties around it and leaves the excess
    hanging. A willing creature gains a secure harness and no condition. Against an unwilling creature the rope
    falls harmlessly away. A creature within reach can use an action and a DC 10 Strength or Dexterity check to
    release a tied object.
  conversion_notes: Preserved the non-damaging infiltration use; it cannot impose an undefined restrained condition
    or enable weapon maneuvers. The generated profile suppresses ordinary damage and crossbow maneuvers; its bonus-action
    rope loading replaces normal Reload.
  source_ref: Magic item generator.xlsx — Common!A16:D16
  original_5e: This magic weapon is a favorite among infiltrators. Its firing mechanism has no string, unlike other
    crossbows. Instead, this weapon can only be loaded with rope. As a bonus action, you can load a length of rope
    into the crossbow. When you do, individual strands from the rope magically latch onto the weapon's limbs and
    pull the mechanism taut. You can make a ranged attack with the crossbow to fire the rope at a willing creature
    or an object within range that isn't being worn or carried. If it hits, the target takes no damage from the
    attack but is bound by the rope. If the rope is long enough, it magically wraps around the target in a single
    loop and securely ties itself, leaving the remaining rope to hang from the knot. If the target is a willing
    creature, the rope ties itself around the creature's chest or waist as a harness but does not restrain them.
    If the attack hits an unwilling creature, the rope falls harmlessly to the ground without being tied. A creature
    can use its action to make a DC 10 Strength or Dexterity check, releasing a bound object within its reach on
    a success.
  base_item: Hand crossbow
  damage: '-'
  properties:
  - range 30/60
  - light
  maneuvers: []
  source_name: Rope Caster (hand crossbow)
  source_price: 10 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Invisible wand
  group: Common
  id: mi-common-017
  category: spellcasting
  type: Wand
  rarity: Common
  attunement: 'No'
  price: 5 GP
  desc: This wand can serve as an arcane focus if your class permits such a focus. The wand itself is Invisible.
    While held by an Invisible creature it becomes visible, without ending that creature's invisibility. It provides
    no spell, spell-slot, attack, or save-DC bonus.
  conversion_notes: Retained the focus and reversed visibility gimmick; no slot-system conversion is required.
  source_ref: Magic item generator.xlsx — Common!A17:D17
  original_5e: This arcane focus is invisible. Don't lose track of it. If the creature holding the wand is invisible,
    the wand becomes visible.
  source_name: Invisible wand
  source_price: 5 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Ring of The Rodent
  group: Common
  id: mi-common-018
  category: wearables
  type: Ring
  rarity: Common
  attunement: 'Yes'
  price: 100 GP
  desc: While attuned and wearing this ring, add +2 to Stealth checks and understand and speak simple ideas with
    ordinary rats. Rats are not compelled to obey, become friendlier, or know anything beyond their experience.
  conversion_notes: Kept the fixed skill bonus and made animal speech usable without referring to an external spell.
  source_ref: Magic item generator.xlsx — Common!A18:D18
  original_5e: This ring gives +2 to stealth checks and you can speak with rats.
  source_name: Ring of The Rodent
  source_price: 100 GP
  source_attunement: 'Yes'
  source_rarity: Common
- name: Arctic Smite (Battleaxe)
  group: Common
  id: mi-common-019
  category: weapons
  type: Weapon
  rarity: Common
  attunement: 'Yes'
  price: 1000 GP
  desc: Use the Battle axe entry. When you roll a natural 20 with this magic axe, each Medium enemy within 10 feet
    of the target makes a DC 15 Dexterity save. On a failure it takes 1d8 cold damage and is Paralyzed until the
    start of its next turn; on a success it takes 1d4 cold damage. This burst is a separate magical effect and cannot
    be blocked. It does not require the initial weapon strike to be unblocked.
  conversion_notes: The source explicitly triggers on a natural 20, so kept that hit trigger separate from its area
    damage. Uses the printed Varis Paralyzed condition and Battleaxe base.
  source_ref: Magic item generator.xlsx — Common!A19:D19
  original_5e: The cold steel of this axe's blade shines like cracked ice. Trailing behind this blade when held
    is an aura of arcane snow that glows a dim blue. The runes etched in the handle also seem to be older than the
    languages spoken or written today. When you croll a natural 20 when attacking with this weapon, arcane ice bursts
    from your weapon. All medium size enemy creatures within 10ft. of the tageted creature must make a dexterity
    saving throw (DC 15). If they fail, they take 1d8 cold damage and are frozen, paralyzing them until their next
    turn. If they succeed, they only take 1d4 cold damage.
  base_item: Battle axe
  source_name: Arctic Smite (Battleaxe)
  source_price: 1000 GP
  source_attunement: 'Yes'
  source_rarity: Common
- name: Close Quarters Bow (Shortbow 50/150)
  group: Common
  id: mi-common-020
  category: weapons
  type: Weapon
  rarity: Common
  attunement: 'No'
  price: 300 GP
  desc: Use the Short bow entry, but its range is 50/150 feet. While holding it in both hands, gain +1 AC from its
    small shield; this does not grant a shield's Block, Bolster, Brace, or bash properties. As an action, make one
    Strength-based melee attack using your Short bow training. On an unblocked strike it deals 1d4 piercing damage
    plus your Strength modifier if trained. Its Block DC is 8 + applicable proficiency + applicable Strength modifier.
  conversion_notes: Rebuilt the attached shield and melee bash with explicit Varis training, Block DC, and unblocked-damage
    timing.
  source_ref: Magic item generator.xlsx — Common!A20:D20
  original_5e: When you have this bow equipped in 2 hands, the small metal shield grants you a +1 bonus to your
    AC. As an action you can bash the shield on this bow into an enemy. Make a Melee attack roll. You use your Strength
    modifier for the attack. On a successful attack you deal 1d4 Piercing damage.
  base_item: Short bow
  properties:
  - range 50/150
  - two-handed
  - reload I
  - crit range+
  source_name: Close Quarters Bow (Shortbow 50/150)
  source_price: 300 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Luxurious Satin Bedroll
  group: Common
  id: mi-common-021
  category: misc
  type: Wondrous item
  rarity: Common
  attunement: 'No'
  price: 300 GP
  desc: The bedroll remains comfortably warm or cool in ordinary climates but grants no protection against damaging
    heat, cold, fire, or cold damage. When you complete a long rest sleeping in it, recover one additional spent
    rest die, up to your normal maximum. It does not shorten the rest, restore health directly, or grant a die above
    your maximum.
  conversion_notes: Converted hit-die recovery into rest-die recovery while retaining the long-rest trigger and
    ordinary cap.
  source_ref: Magic item generator.xlsx — Common!A21:D21
  original_5e: The interior of this thin bedroll is always at the perfect temperature to sleep no matter which climate
    you are in. However, the soft pillows and fabrics of the bedroll do not protect you against extreme heat (Fire
    damage) or extreme cold (Frost damage). When sleeping in this bedroll during a long rest, you feel well rested
    and you regain one extra hit die on top of the usual you regain.
  source_name: Luxurious Satin Bedroll
  source_price: 300 GP
  source_attunement: 'No'
  source_rarity: Common
- name: Unlucky Bastard (Longsword)
  group: Common
  id: mi-common-022
  category: weapons
  type: Weapon
  rarity: Common
  attunement: 'Yes'
  price: 300 GP
  desc: 'Use the Longsword entry while attuned. A natural 20 is not a critical hit: resolve it as an ordinary attack
    against AC. On a natural 1, the attack instead hits and deals 3d8 + your applicable Strength modifier slashing
    damage, or 3d10 + that modifier if held in two hands. This exceptional hit can still be blocked using the weapon''s
