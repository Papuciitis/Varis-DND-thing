section: magic-items
entries:
- name: Antitoxin
  group: Uncommon
  id: mi-uncommon-002
  type: Potion
  rarity: Uncommon
  attunement: 'No'
  price: 50 GP
  desc: As an action, administer one dose to yourself or a creature within reach. End the Poisoned condition and
    ongoing poison effects on that creature, including a poison's continuing damage, but not unrelated disease,
    a curse, or damage already suffered. The dose is consumed.
  conversion_notes: Kept the source broad poison cure and supplied the missing dose, action, and scope.
  source_ref: Magic item generator.xlsx — Uncommon!A2:D2
  original_5e: Removes all posions from the creature when applied.
  source_name: Antitoxin
  source_price: 50 GP
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Scroll of Plant Growth
  group: Uncommon
  id: mi-uncommon-003
  type: Scroll
  rarity: Uncommon
  attunement: 'No'
  price: 453 GP
  desc: 'As an action, read and consume this scroll. Choose ordinary plants in a 100-foot-radius area centered at
    a point you can see within 150 feet. They become thick growth for 1 hour: each foot of movement through the
    area costs 4 feet of movement. You may leave paths and spaces unaffected. This does not animate plants, trap
    creatures outright, or affect creatures made of plants. Alternatively, spend 8 hours reading it over farmland
    to double the ordinary harvest of plants within a half-mile for one year; this consumes the same scroll.'
  conversion_notes: The workbook supplies a name only. Authored a complete terrain or cultivation power without
    assuming an imported Plant Growth spell.
  source_ref: Magic item generator.xlsx — Uncommon!A3:D3
  original_5e: No description supplied in workbook.
  source_name: Scroll of Plant Growth
  source_price: 453 GP
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Cloak of Elvenkind
  group: Uncommon
  id: mi-uncommon-004
  type: Wondrous item
  rarity: Uncommon
  attunement: 'Yes'
  price: 5000 GP
  desc: While attuned and wearing this cloak with its hood raised, you have advantage on Stealth checks to hide,
    and creatures have disadvantage on sight-based Perception checks to find you. Raise or lower the hood as an
    action. The cloak does not make you Invisible and cannot let you hide while clearly observed without cover or
    concealment.
  conversion_notes: The workbook supplies a name only. Authored a bounded concealment effect using Varis skill checks
    rather than assuming an external item definition.
  source_ref: Magic item generator.xlsx — Uncommon!A4:D4
  original_5e: No description supplied in workbook.
  source_name: Cloak of Elvenkind
  source_price: 5000 GP
  source_attunement: 'Yes'
  source_rarity: Uncommon
- name: Robe of Useful Items
  group: Uncommon
  id: mi-uncommon-005
  type: Wondrous item
  rarity: Uncommon
  attunement: 'Yes'
  price: 13200 GP
  desc: 'This robe bears twelve removable patches: two daggers, two bullseye lanterns, two 10-foot poles, two 50-foot
    hemp ropes, two 10-foot ladders, one sack, and one wooden door up to 10 feet high and wide. While attuned and
    wearing the robe, use an action to detach one patch. It becomes the corresponding ordinary object in an unoccupied
    space within reach, permanently consuming the patch. The door can fill an existing opening but cannot cut through
    a wall. Weapon patches use the current Varis Dagger rules and grant no proficiency or enhancement. The robe
    does not regrow patches.'
  conversion_notes: The workbook supplies a name only. Authored a finite, explicit patch list instead of importing
    an unspecified random table.
  source_ref: Magic item generator.xlsx — Uncommon!A5:D5
  original_5e: No description supplied in workbook.
  source_name: Robe of Useful Items
  source_price: 13200 GP
  source_attunement: 'Yes'
  source_rarity: Uncommon
- name: Cactus Mace
  group: Uncommon
  id: mi-uncommon-006
  type: Weapon
  rarity: Uncommon
  attunement: 'No'
  price: 500 GP
  desc: Use the mace entry. On the first unblocked strike you make with it on each of your turns, the target takes
    an extra 1d4 piercing damage from regrowing cactus needles. The weapon is magical but grants no enhancement
    bonus.
  conversion_notes: Converted first-hit bonus damage to an unblocked-strike rider and uses the current Mace properties
    and maneuvers.
  source_ref: Magic item generator.xlsx — Uncommon!A6:D6
  original_5e: This magical weapon’s head is an enchanted cactus that rapidly regrows its missing needles. The first
    target hit by this weapon on each of your turns takes an extra 1d4 piercing damage from the attack.
  base_item: mace
  source_name: Cactus Mace
  source_price: 500 GP
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Weaving Wasp Needles (up to 20 darts)
  group: Uncommon
  id: mi-uncommon-007
  type: Weapon
  rarity: Uncommon
  attunement: 'No'
  price: 350 GP per Pair
  desc: Each needle is a magical throwing weapon using javelin training, 1d4 piercing damage, Agile, Light, and
    thrown range 20/60 feet. They also function as weaver's tools. A needle that makes an unblocked strike against
    a Large or smaller creature orbits it for 1 minute or until it falls to 0 HP. If both needles orbit the same
    creature, that creature becomes Snared, its attacks and block checks have disadvantage, and attacks against
    it have advantage. The binding ends when either orbit ends, when you release it with a bonus-action command,
    or when the creature or an adjacent helper uses an action and succeeds on a DC 13 Strength check. After a pair
    binds a creature, that pair cannot bind again until dawn. As an action, command the pair to mend a simple tear
    in 1 minute or craft a simple garment during a short rest, given adequate material. Another action ends the
    task.
  conversion_notes: Converted restrained to explicit Varis Snared and attack/Block penalties. Kept pair-specific
    dawn recovery and the source short-rest crafting time. Varis has no Dart entry, so supplied a 1d4 thrown profile
    with javelin training and no inherited javelin maneuvers.
  source_ref: Magic item generator.xlsx — Uncommon!A7:D7
  original_5e: This pair of dark, chiseled throwing needles are linked by a magical bond. A needle that hits a Large
    or smaller creature flies around it for 1 minute or until the creature falls to 0 hit points. If both needles
    fly around the same creature, they spin a magical thread that binds and restrains it. The creature is restrained
    until freed or until you take a bonus action to speak the needles' command word to release it. A creature can
    use its action to make a DC 13 Strength check, freeing itself or another creature within its reach on a success.
    Once the needles restrain a creature in this way, this property can't be used again until the next dawn. In
    addition, you can use the needles as a set of weaver's tools. These magical needles can act on their own to
    either mend a simple tear or craft a simple garment given the proper materials in 1 minute or over the course
    of a short rest, respectively. As an action, you can speak the needles' other command word, followed by a description
    of the task, to cause them to spring to life and begin sewing and crafting. Uttering this command word again
    causes them to stop early and fall to the ground.
  base_item: javelin
  damage: 1d4p
  properties:
  - agile
  - light
  - throw 20/60
  maneuvers: []
  source_name: Weaving Wasp Needles (up to 20 darts)
  source_price: 350 GP per Pair
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Great Owl's Shroud
  group: Uncommon
  id: mi-uncommon-008
  type: Wondrous item
  rarity: Uncommon
  attunement: 'Yes'
  price: 3000 GP
  desc: While attuned and wearing this cloak, it has 10 charges and regains all charges at dawn. When taking the
    Attack action, replace any number of your attacks, spending 1 charge each, with magical feather attacks at +5
    to hit, range 30/120 feet, Block DC 13. On an unblocked strike a feather deals 2d4 + 3 force damage and vanishes.
    Once per dawn, when you fall, use a reaction to slow your descent to 60 feet per round for 1 minute; you take
    no falling damage if you land during this time. This affects only you.
  conversion_notes: Replaced the absent Feather Fall spell with complete falling rules and gave the ranged item
    attacks an explicit Varis Block DC.
  source_ref: Magic item generator.xlsx — Uncommon!A8:D8
  original_5e: This draping shoulder cloak flutters softly while worn, even if there isn't a breeze. The cloak has
    10 charges and regains all expended charges daily at dawn. When you take the Attack action while wearing this
    garment, you can replace one or more of your attacks with a special ranged spell attack using the cloak, expending
    1 of its charges for each attack you replace. When you do, you flourish the cloak and release a barrage of magical
    feathers that fly toward the target. You have a +5 bonus to attack rolls made with the cloak, which have a normal
    range of 30 feet and a long range of 120 feet. On a hit, the target takes 2d4 + 3 force damage. After the attack,
    the feathers vanish. In addition, you can use a reaction when you fall to cast the feather fall spell from the
    cloak, targeting only yourself. Once this property of the cloak has been used, it can't be used again until
    the next dawn.
  source_name: Great Owl's Shroud
  source_price: 3000 GP
  source_attunement: 'Yes'
  source_rarity: Uncommon
- name: Ambitious Medic's Box
  group: Uncommon
  id: mi-uncommon-009
  type: Wondrous item
  rarity: Uncommon
  attunement: 'Yes'
  price: 3000 GP
  desc: This 3-pound box can be used without attunement. From dawn to dusk, its sun compartment contains a medical
    kit with 10 uses. As an action spend a use to stabilize a dying creature within reach, ending the need for death
    saves until it takes damage or another effect makes it dying again; it gains no HP. The kit refreshes at dusk.
    From dusk to dawn, the moon compartment contains three steins, a pipe refilled with tobacco at dusk, and a flask.
    Once per dusk, as an action command the flask to make up to 4 gallons of beer, 1 gallon of wine, or 8 ounces
    of spirits; it pours at up to 1 gallon per minute. At dawn the compartment shuts and removed box equipment returns;
    consumed contents do not. While attuned, you may open either half at any time and gain Medicine proficiency,
    or double proficiency on Medicine checks if already trained. This does not stack with another doubling effect.
  conversion_notes: Replaced the external healer-kit dependency with an explicit stabilization action; kept dawn/dusk
    compartments and the attunement-only skill benefit.
  source_ref: Magic item generator.xlsx — Uncommon!A9:D9
  original_5e: This wooden box has two halves which are magically locked by ornamental clasps that can only be opened
    during certain times of the day. The box is 1 foot wide, 2 feet long, and weighs 3 pounds. You can open and
    use the box as normal, as described below, even if you aren't attuned to it. The left side is locked by a metal
    clasp decorated with a sun. From dawn until dusk, you can open the left side of the box, which contains the
    same contents and functions identically to a healer's kit. Each day at dusk, the left side of the box magically
    closes and regains all expended uses of its healer's kit. The right side is locked by a metal clasp decorated
    with a moon smoking a pipe. From dusk until dawn, you can open the right side of the box, which contains three
    pewter steins, a flask, and a wooden pipe. While holding the flask, you can use an action to speak its command
    word followed by either "beer", "wine", or "whiskey". When you do, the flask magically fills with up to 4 gallons
    of beer, 1 gallon of wine, or 8 ounces of liquor, depending on the chosen drink, which can be poured out as
    an action, up to 1 gallon per minute. Once this property of the flask has been used, it can't be used again
    until the next dusk. The wooden pipe is magically refilled with tobacco daily at dusk. Each day at dawn, the
    right side of the box magically closes, and anything removed from the box is magically returned to it. While
    attuned to the box, you are proficient in the Medicine skill and can open either side of the box at any time.
    If you're already proficient in the Medicine skill, your proficiency bonus is doubled for any ability check
    you make that uses that skill.
  source_name: Ambitious Medic's Box
  source_price: 3000 GP
  source_attunement: 'Yes'
  source_rarity: Uncommon
- name: Mimicloak
  group: Uncommon
  id: mi-uncommon-010
  type: Wondrous item
  rarity: Uncommon
  attunement: 'No'
  price: 750 GP
  desc: While wearing this cloak, speak its command word as a bonus action to change its style, color, and apparent
    quality. It remains a cloak of the same weight. You have advantage on checks to escape Grappled or physical
    restraints. Once per turn, when you use an action to attempt such an escape, its toothed fabric deals 1d10 piercing
    damage to the creature or object holding you, whether the check succeeds or fails. This reactive magical bite
    cannot be blocked and does not harm restraints you are not actually held by.
  conversion_notes: Applied the escape benefit to current Grappled rules and bounded repeated bite damage to one
    paid escape attempt per turn.
  source_ref: Magic item generator.xlsx — Uncommon!A10:D10
  original_5e: This strange cloak is made using the enchanted remains of a young mimic. While wearing it, you can
    use a bonus action to speak its command word to change the style, color, and apparent quality of the cloak.
    The garment's weight doesn't change. Regardless of its appearance, the cloak can't be anything but a cloak with
    these properties. While wearing this cloak, you have advantage on ability checks made to escape from a grapple.
    Whenever you make an ability check to escape a grapple or free yourself of restraints, the creature or object
    holding you takes 1d10 piercing damage as the cloak's fabric magically splits into a toothed maw to bite it.
  source_name: Mimicloak
  source_price: 750 GP
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Kraken's Whip
  group: Uncommon
  id: mi-uncommon-011
  type: Weapon
  rarity: Uncommon
  attunement: 'No'
  price: 1000 GP
  desc: Use the whip entry. As an action, one visible creature within 10 feet makes its choice of a DC 13 Strength
    or Dexterity save. On failure it takes 1d4 + 2 bludgeoning damage and is Grappled by the tentacle. At the end
    of each of its turns it takes another 1d4 + 2 bludgeoning damage. It or an adjacent helper may use an action
    to repeat the save, ending the grapple on success. You cannot attack with this whip while it holds a creature.
    Release it at any time without an action; dropping the whip also releases it. Moving a held creature costs twice
    the usual movement, and it must remain within 10 feet. The initial save-based power cannot be blocked.
  conversion_notes: Kept the paid grapple power while replacing ambiguous dragging beyond reach with explicit held
    range and movement cost.
  source_ref: Magic item generator.xlsx — Uncommon!A11:D11
  original_5e: This whip is made using the shrunken tentacle of a great sea creature. It still writhes slightly
    on its own. As an action, you can force a creature you can see within 10 feet of you to make a DC 13 Strength
    or Dexterity saving throw (their choice). On a failure, the creature is grappled by the whip’s tentacle and
    takes 1d4+2 bludgeoning damage. The affected target or another creature can use an action to reattempt the saving
    throw, escaping the grapple upon a success. While grappled, the creature takes 1d4+2 bludgeoning damage at the
    end of each of its subsequent turns. You can’t use the whip to attack while grappling a creature with it in
    this way. While holding the whip, you can end the grapple at any time (no action required), and your movement
    speed is halved when you move more than 10 feet away from the grappled creature as you drag it along behind
    you.
  base_item: whip
  source_name: Kraken's Whip
  source_price: 1000 GP
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Eye of the Bookwurm
  group: Uncommon
  id: mi-uncommon-012
  type: Wondrous item
  rarity: Uncommon
  attunement: 'No'
  price: 500 GP
  desc: As a bonus action while holding this glass sphere, speak its command word and a word or phrase. For the
    next hour, that exact word or phrase is highlighted green wherever you can already see it in writing. Change
    the search phrase with another bonus action during that hour. After the hour ends, the eye cannot activate again
    until dawn. It does not translate, reveal hidden writing, or let you read unseen pages.
  conversion_notes: Kept the search effect and one-hour daily window; clarified that it enhances visible text rather
    than supplies remote sight.
  source_ref: Magic item generator.xlsx — Uncommon!A12:D12
  original_5e: This small, glass sphere is enchanted with weak divination magics to help you find specific words
    or phrases in writing. It has a stylized iris etched into the glass. You can use a bonus action to speak the
    eye’s command word aloud, followed by the word or phrase you’re searching for. The word or phrase magically
    appears and floats within the sphere. By holding the eye in a free hand, your vision becomes magically enhanced
    to subconsciously highlight the word or phrase you searched for in a green light wherever you see it. Once you’ve
    used the eye’s ability for the first time, you can change the word or phrase as many times as you like for the
    next hour, after which the item can’t be used again until the following dawn.
  source_name: Eye of the Bookwurm
  source_price: 500 GP
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Dagger of the Ogre Mage (shortsword)
  group: Uncommon
  id: mi-uncommon-013
  type: Weapon
  rarity: Uncommon
  attunement: 'Yes'
  price: 2000 GP
  desc: Use the Short sword entry with a +1 bonus to attack rolls, damage, and Block DC. Its hollow hilt holds up
    to three scrolls recording current Varis cantrips. A scroll installed for 1 minute activates a gem; while attuned,
    you may cast that cantrip at will, following its printed action, components, concentration, and effect. Use
    your existing spellcasting ability or Intelligence if you have none; attacks add proficiency and saves use DC
    8 + proficiency + that modifier. The weapon serves as its focus and can provide somatic gestures, but does not
    waive costly components. The scroll survives and removal deactivates the gem. After you cast a damaging cantrip
    this way, choose one of its damage types to replace the sword's piercing damage for 1 minute; you may end the
    change freely.
  conversion_notes: Restricted the reusable-scroll mechanism to actual Varis cantrips and added +1 to Block DC consistently;
    retained the source ability fallback.
  source_ref: Magic item generator.xlsx — Uncommon!A13:D13
  original_5e: This blade was once used as a dagger by an ogre, but is nevertheless large enough to be a shortsword.
    You gain a +1 bonus to attack and damage rolls made with this magic weapon. This blade’s hilt is hollow and
    can hold up to 3 cantrip spell scrolls. Cantrip scrolls left within the compartment for 1 minute activate one
    of the three clear gems adorning its grip. Once activated, you can cast these cantrips at will using your spellcasting
    modifier. If you don’t have a spellcasting modifier, use your Intelligence modifier instead. You have proficiency
    with these cantrips. Cantrips cast from the blade use the weapon as an arcane focus and allow you to perform
    any somatic components with the weapon instead of requiring a free hand. Scrolls contained within the sword
    are not destroyed after using them in this way. When you cast a cantrip using the sword that deals damage, the
    sword’s damage type changes to match the cantrip’s for 1 minute or until you end it early (no action required).
  base_item: Short sword
  magic_bonus: '1'
  source_name: Dagger of the Ogre Mage (shortsword)
  source_price: 2000 GP
  source_attunement: 'Yes'
  source_rarity: Uncommon
- name: Ring of Volleys
  group: Uncommon
  id: mi-uncommon-014
  type: Ring
  rarity: Uncommon
  attunement: 'No'
  price: 500 GP
  desc: While wearing this ring and loading or drawing a bow or crossbow, you may create one magical arrow or bolt
    in place of ordinary ammunition. It vanishes if not immediately fired or immediately after hitting or missing.
    It grants no enhancement bonus, extra attack, faster reload, or special ammunition effect.
  conversion_notes: Kept unlimited ordinary magical ammunition while preserving current weapon reload and attack
    costs.
  source_ref: Magic item generator.xlsx — Uncommon!A14:D14
  original_5e: While wearing this ring, you can choose to summon a nocked arrow or bolt whenever you draw a bow
    or crossbow. The ammunition is magical. An arrow or bolt vanishes if you don’t fire it right away and disappears
    right after it hits or misses.
  source_name: Ring of Volleys
  source_price: 500 GP
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Camper's Respite
  group: Uncommon
  id: mi-uncommon-015
  type: Rod
  rarity: Uncommon
  attunement: 'No'
  price: 800 GP
  desc: This 3-pound rod has a brazier and ground spike. Use a bonus-action command to light or extinguish a torch-like
    magical flame. As an action place it upside down in a clear 5-foot square and command it to unfold over 1 minute
    into an immobile tent. Its interior is an extradimensional room 15 feet square and 10 feet high, with a comfortable
    dry atmosphere and a smokeless central fireplace controlled by the first command. The entrance fits Medium or
    smaller creatures. The tent lasts 12 hours, until dismissed as an action, or until reduced to 0 HP (AC 13, 20
    HP, immune to poison and psychic damage). At the end, everything inside is safely moved to the nearest unoccupied
    spaces and it becomes a rod. It cannot unfold again for 12 hours. It does not shorten the time required for
    a rest.
  conversion_notes: Kept the extradimensional shelter statistics and cooldown; clarified that its 12-hour duration
    does not automatically complete a Varis one-day short rest.
  source_ref: Magic item generator.xlsx — Uncommon!A15:D15
  original_5e: This rod weighs 3 pounds and has an iron brazier at its top and spike at its base. You can use a
    bonus action while holding the rod to speak its first command word and create a magical flame at its top. While
    lit, this rod functions as a burning torch. You can use a bonus action to speak its command word again to extinguish
    the flame. You can use an action to place the rod's brazier upside down on the ground in an unoccupied space
    and speak its second command word. When you do, the spike at the rod's other end begins to glow from within,
    revealing its subtle design as a tent. Over the course of 1 minute, the rod expands and magically unfurls a
    canvas from its top, creating a 5-foot-square opaque tent in its space with an entrance large enough for a Medium
    or smaller creature to comfortably fit. You choose the style, color, and quality of the tent each time you use
    this property. Regardless of its appearance, the tent can't be anything but a tent. Inside the tent is a square
    extradimensional dwelling, 15 feet on a side and 10 feet high, with the enlarged camper's respite supporting
    it at its center. The walls and ceiling are made of the same canvas as the tent, but the floor is made of smooth
    stone. The rod's enlarged brazier functions as a magical fireplace that can be lit or extinguished by speaking
    the rod's first command word. This fire gives off light and heat like a normal fire, but doesn't require oxygen
    or create smoke. The atmosphere inside the space is comfortable and dry, regardless of the weather outside.
    The tent is immobile and remains for up to 12 hours, until you use an action to speak its second command word
    again to dismiss it, or until the tent collapses. Dealing 20 damage to the tent (AC 13) causes it to collapse.
    The tent is immune to poison and psychic damage. The tent reverts to a rod at the end of its duration, and anything
    inside the tent is forced into the nearest unoccupied space. When the tent becomes a rod again, this property
    of the rod can't be used again for 12 hours.
  source_name: Camper's Respite
  source_price: 800 GP
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Alchemist's Potion Belt
  group: Uncommon
  id: mi-uncommon-016
  type: Wondrous item
  rarity: Uncommon
  attunement: 'No'
  price: 300 GP
  desc: 'This belt holds two potion bottles in resizing stoppers. Attach a bottle as an action. While wearing it,
    you may drink one attached potion as a bonus action instead of the potion''s normal action; all its other rules
    still apply. This does not allow administering it to another creature. Whenever you roll a natural 1 on a Dexterity
    save or are struck by a critical hit, roll d20: on a 1, one attached bottle chosen randomly shatters and its
    contents are lost.'
  conversion_notes: Retained the potion action conversion and breakage risk while preserving the potion's underlying
    effects and consumption limits.
  source_ref: Magic item generator.xlsx — Uncommon!A16:D16
  original_5e: This enchanted belt has two stoppers that magically resize to fit the mouth of any kind of bottle.
    The belt can carry up to two potions in this way. The belt can be worn comfortably around your waist or across
    your chest as a bandolier. While wearing the belt, any potion carried on it seems to magically unstopper and
    spring to your hand, allowing you to drink it as a bonus action. You can attach a bottle to the belt using an
    action. When you roll a 1 on a Dexterity saving throw or are hit by a critical hit, roll a d20. On a 1, one
    of the bottles on the belt is shattered and destroyed.
  source_name: Alchemist's Potion Belt
  source_price: 300 GP
  source_attunement: 'No'
  source_rarity: Uncommon
- name: Frostbitten Buckler (shield)
  group: Uncommon
  id: mi-uncommon-017
  type: Shield
  rarity: Uncommon
  attunement: 'Yes'
  price: 1000 GP
  desc: Use the Buckler entry. While attuned, the shield has 3 charges and regains all charges at dawn. When a visible
    creature hits you with a melee attack, use a reaction and spend 1 charge to deal 2d4 cold damage to it. This
    magical retaliation cannot be blocked and can trigger even if you successfully block the original hit. After
    resolving that attack, gain temporary HP equal to the cold damage actually dealt, lasting 1 minute. Temporary
    HP follow the normal non-stacking rule.
  conversion_notes: Preserved the source on-hit trigger and separated it from blocking; converted temporary health
    to the current pool and kept Buckler defense.
  source_ref: Magic item generator.xlsx — Uncommon!A17:D17
  original_5e: This icy shield has 3 charges and regains all of them each day at dawn. When a creature you can see
    hits you with a melee attack, you can expend 1 of the shield’s charges as a reaction to deal 2d4 cold damage
    to the attacking creature. After the attack, you gain that same amount of cold damage as temporary hit points
    that last for up to 1 minute.
  base_item: Buckler
  source_name: Frostbitten Buckler (shield)
  source_price: 1000 GP
  source_attunement: 'Yes'
  source_rarity: Uncommon
- name: Tub of Churning and Fermentation
  group: Uncommon
  id: mi-uncommon-018
  type: Wondrous item
  rarity: Uncommon
  attunement: 'No'
  price: 150 GP
  desc: 'This lidded tub holds 2 gallons of liquid or 1 cubic foot of material. Place suitable ordinary ingredients
    inside, secure the lid, and name a plausible processed food or drink. The lid locks for 10 minutes, then opens
    to reveal that product: milk can become butter, cheese, or yogurt; apples can become cider; fruit can become
    wine; cabbage can become sauerkraut; cucumbers and vinegar can become pickles. No missing ingredient, magical
    potion, poison, or increased mass is created. It can process one batch per dawn.'
  conversion_notes: Preserved the food-processing utility and dawn recovery; defined its limits so it does not manufacture
    arbitrary magical reagents.
  source_ref: Magic item generator.xlsx — Uncommon!A18:D18
  original_5e: This squat wooden and ceramic tub has a screw-on lid that fits snuggly around its base. The tub can
    hold up to 2 gallons of liquid or 1 cubic foot of material within it. You can leave a liquid or other perishable
    in the tub and secure the lid before saying the name of the end result you’d like the contents to turn into.
    If you say the name of a possible result, the tub clicks lightly before locking its lid shut for 10 minutes.
    After 10 minutes, the tub gives a second, louder click as the lid unlocks. The contents of the tub will have
    been stirred, processed, or otherwise fermented in such a way to generate the commanded end product. Adding
    extra ingredients into the tub can impact the end result’s flavor. Once the tub has been used in this way, it
