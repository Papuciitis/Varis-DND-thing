  source_price: 1500 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-020
  type: Weapon
  base_item: Spear
  magic_bonus: '2'
  desc: |-
    This Varis Spear grants +2 to attack rolls, damage, and Block DC, with Throw 20/60. Twice per dawn, after an unblocked strike, speak its command word without an additional action. The target makes a DC 14 Constitution save; on failure it takes 2d4 + 2 radiant damage and is Blinded until the end of its next turn; on success it suffers neither effect.

    Once per round, after an unblocked thrown strike, you may teleport with carried equipment to an unoccupied space within 5 feet of that target, without an action. The spear remains where the attack left it; you can retrieve it using an available object interaction. If no adjacent space is free, you cannot teleport.
  conversion_notes: Both strike-triggered powers require penetration of Block, and teleportation places the wielder
