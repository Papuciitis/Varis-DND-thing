  desc: |-
    Wield this as a Varis Greatsword. Once per long rest, use an action to target up to four creatures you can see within 60 feet. Each makes a DC 16 Constitution save. If any fail, divide necrotic damage equal to three times your character level among the failed targets as evenly as possible; assign any remainder one point at a time in an order you choose. Successful targets take none. This is save-based damage and cannot be blocked. Resistance, immunity, and reduction apply separately to each share.

