- id: mi-very-rare-026
  type: Potion
  desc: Drink this potion as an action. A living creature other than a construct is cured of its current diseases,
    including the Diseased condition. For the next 48 hours it has advantage on Constitution saves and may change
    all damage of each damaging spell it casts to radiant damage. Choose before rolling that spell's damage; this
    does not change saves, other effects, casting costs, or damage from magic items. The extract has no effect on
    a construct. An undead drinker instead takes 5 radiant damage, gains none of the benefits, and consumes the
    potion.
  conversion_notes: Disease removal uses Varis Diseased and spell conversion applies to the current six-level magic
    systems without changing their costs or other effects.
  name: Divim Extract (potion)
  group: Very Rare
  rarity: Very Rare
  attunement: 'No'
  price: 300 GP
  source_ref: Magic item generator.xlsx — Very Rare!A26:D26
  original_5e: A creature can use its action to drink this potion. A creature that drinks this potion is cured of
    any disease. This potion has no effect on constructs. If the creature is undead, this potion deals 5 radiant
    damage instead. If the creature is not a construct or undead, for next 48 hours it has advantage on Constitution
    saving throws, and any damage it deals from spells becomes radiant damage.
  source_name: Divim Extract (potion)
  source_price: 300 GP
  source_attunement: 'No'
