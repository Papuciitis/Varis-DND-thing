  source_price: 4000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-017
  type: Wondrous item
  desc: |-
    This owlbear-hide cloak has two grasping cloth arms. As a bonus action, use them to draw or stow one object in an unlocked, accessible container within 5 feet; the object must fit through the opening. The cloak can carry one object of up to 50 pounds in each arm, but cannot wield weapons or shields, use items, cast spells, or bypass locks. Carrying something in its arms does not grant you extra actions.

    While at least one arm is empty, you can instead use a bonus action for one claw attack at +7 to hit, reach 5 feet, dealing 1d8 + 5 magical slashing damage on an unblocked strike, Block DC 15. This is the cloak's attack and cannot deliver your weapon maneuvers or Sneak Attack.
  conversion_notes: The arm attack gains an explicit damage type and Block DC. Accessible-container and carrying
    limits prevent the cloak from creating unlimited storage access or additional equipment slots.
  name: Owlbear Cloak
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 1000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A17:D17
  original_5e: This cloak is made of the hide of an owlbear and has been infused with fey wild magic. The arms of
    the cloak can be used to draw or stow a weapon or item as a bonus action regardless of the size of the item
    and regardless of what type of container the item is stowed in. This does not superceed locked containers and
    the container must be within 5 feet of the user of this cloak. The cloak can hold, but not use or manipulate
    items. So long as the cloak has one free hand, it can make a melee attack as a bonus action. Attack +7 to hit,
