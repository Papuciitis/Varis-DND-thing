- id: mi-very-rare-015
  type: Weapon
  base_item: Heavy crossbow
  desc: |-
    Use a Varis Heavy crossbow's damage, properties, training, and maneuvers. Its critical range is 19-20; this does not stack with another critical-range increase. If its attack roll misses AC, deal half of one roll of the weapon's base damage dice, rounded down, with no modifiers. The target may block this glancing shot against the attack's normal Block DC. A shot that hits AC but is blocked does not also become a glancing shot.

    Keep a personal engineering mastery rating, initially 0. Whenever you would spend actions on this crossbow's Reload, first roll d6. On a result of 6 minus mastery or higher, reload instantly. After such a success, attempt a DC 16 Wisdom (Perception) check; success raises mastery by 1, maximum 5. At mastery 5 the reload is always instant. Mastery belongs to that wielder and this crossbow only.
  conversion_notes: The 5e Loading property becomes the Varis Reload process. Miss damage still permits Block, and
    successful Block never triggers a second packet of damage. Engineering progress is explicitly bounded.
  name: Gearwork Crossbow
  group: Very Rare
  rarity: Very Rare
  attunement: 'No'
  price: 3000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A15:D15
  original_5e: |-
    This crossbow is equipped with the latest in Gnome engineering, including a fitted looking glass to target your enemies and a series of levers and pulleys to help load and reload, though the working of which are a maze of steel and string. This weapon scores a critical hit on a 19 or a 20. Additionally, when a ranged attack with this crossbow misses, the player can still roll damage die – dealing damage equal to half of the number rolled with no modifier.
    When this crossbow must be loaded roll a d6, on a 6 the player can ignore the loading property for this turn. On a success the player can make a DC16 perception to check to see if they better understand the working of how to load the crossbow, on a pass the next time a d6 roll is made to load the crossbow – the loading property is ignored by a 5 or a 6. This effect can continue until the player has achieved a complete mastery of the workings of this crossbow, and can always ignore the loading property.
