  source_price: 2000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-019
  type: Ring
  desc: |-
    This ring stores up to 6 soul charges, initially 0. Gain 1 when you kill or materially assist in killing a hostile creature with a character level or Challenge of at least 1; harmless captive or summoned creatures grant none. As a bonus action, spend charges for one power: 1 charge grants advantage on Intimidation checks for 1 hour; 2 charges cloak you in shadow for 1 hour, granting +1 AC and advantage on Stealth checks, but no invisibility; 6 charges empower your next three unblocked weapon strikes within 10 minutes, each dealing an extra 3d6 necrotic damage. A new activation replaces the same power's previous duration or strikes.

    Curse: when beginning a long rest with stored charges, make a Wisdom save against DC 13 + stored charges. On failure, that rest provides no recovery; charges remain. Removing the ring does not end this curse. A curse-removing effect does.
  conversion_notes: Attack empowerment is consumed by unblocked strikes. The missing shadow duration is set to 1
    hour, kill-farming is excluded, and the curse's DC is expressed from its original scaling formula.
  name: The Black Seal (ring)
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 1500 GP
  source_ref: Magic item generator.xlsx — Very Rare!A19:D19
  original_5e: 'The ring can hold 6 charges. You gain 1 charge whenever you kill (or actively assist in the killing
    of) a creature. As a bonus action you can activate one of the effects by spending charges. The effects are:
    (1 charge) You surrond yourself in an ominous aura that grants you advantage on Intimidation checks for 1 hour
    ; (2 charges) cloaks your body in darkness, grants +1 to your AC and you gain advantage on all Stealth checks;
    (6 charges) Imbues your next 3 melee and or ranged weapon attacks within 10 minutes with 3d6 Necrotic Damage.
    Curse : If there is one charge in the ring and you take a long rest, make a Wisdom saving throw (DC 14). On
    a failure you do not gain the benefits of the rest as your dreams are filled with the visions of the souls.
