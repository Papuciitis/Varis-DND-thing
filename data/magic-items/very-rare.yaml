  base_item: Hand crossbow
  desc: This magical Varis Hand crossbow retains its normal damage, properties, maneuvers, and Reload rules. Its
    weapon damage is radiant instead of piercing. It can fire fitted silvered stakes in place of bolts. When a silvered
