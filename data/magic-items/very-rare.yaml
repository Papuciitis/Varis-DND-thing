section: magic-items
entries:
- id: mi-very-rare-002
  type: Weapon
  base_item: Dagger
  desc: |-
    A starmetal dagger using the Varis Dagger's damage, properties, training, and maneuvers. As an action, set it orbiting 1d4 feet from you, or seize and wield or stow it. While it orbits, taking the Attack action lets you spend a bonus action to make one dagger attack against a creature within 10 feet, using your normal dagger attack, damage ability, and Block DC. It returns to orbit after the attack. This attack can be blocked normally.

    While it orbits, reduce damage from each ranged weapon attack that reaches you by 1d10 + 4, after any Block check. If reduced to 0, its missile falls at your feet. Another creature can spend an action to seize it with an attack against AC 24 or a DC 24 Dexterity (Acrobatics) check; a successful seizure ends the orbit.
  conversion_notes: Orbital strikes use the current dagger and Block rules; missile reduction is applied only to
    damage remaining after Block. Seizing the blade is an object interaction rather than an unblockable damaging
    attack.
  name: Starmetal Sliver (dagger)
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 24000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A2:D2
  original_5e: This slim blade was forged using strange, unearthly metals from a meteorite. When you use an action
    to toss this magic dagger into the air, it orbits your body at a distance of 1d4 feet. Another creature can
    use an action to grasp the dagger to separate it from you, either by making a successful attack roll against
    AC 24 or a successful DC 24 Dexterity (Acrobatics) check. You can use an action to seize and either wield or
    stow the dagger. When you take the Attack action while the dagger is orbiting you, you can use a bonus action
    to cause the dagger to attack a target within 10 feet of you. The dagger uses your attack roll and ability score
    modifier to damage rolls. Immediately after the attack, the dagger returns to orbit you. In addition, the dagger
    creates a small gravitational field that wards off harm. While the dagger orbits you, when you are hit by a
    ranged weapon attack, the damage you take from the attack is reduced by 1d10 + 4. If the damage is reduced to
    0, the missile slows to a stop without hitting you and falls to the ground at your feet.
  source_name: Starmetal Sliver (dagger)
  source_price: 24000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-003
  type: Weapon
  base_item: Longbow
  desc: |-
    This phase-spider bow uses the Varis Longbow's damage, properties, training, and maneuvers. It holds 5 charges and regains all expended charges at dawn. Before a ranged attack roll, spend 1 charge to phase its arrow through cover, including total cover, provided you know the target's location. Lead, material thicker than 1 foot, or an effect preventing ethereal travel stops the arrow. The attack still rolls against AC and can be blocked. On an unblocked strike, add 2d6 force damage.

    As a bonus action, spend 3 charges to shoot an unoccupied point on a solid surface you can see within the bow's normal range. Teleport with carried equipment to the nearest unoccupied space beside that point. This teleport makes no attack and deals no damage.
  conversion_notes: Cover penetration does not bypass Block or reveal hidden creatures. The teleport is a distinct
    bonus-action power and the force rider requires an unblocked strike.
  name: Phasing Bow (longbow)
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 26000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A3:D3
  original_5e: This flexible bow is made from the chitinous legs of a phase spider and retains some of its ethereal
    properties. The bow has 5 charges and regains all expended charges daily at dawn. When you make a ranged attack
    roll with this magic bow, you can expend 1 of its charges to cause the arrow to slip partially into the Ethereal
    Plane. When you do, the target of the attack gains no benefit from cover, including total cover, as long as
    the cover isn't made of lead or more than 1 foot thick. If you hit, the target takes an extra 2d6 force damage.
    Any effect that blocks travel through the Ethereal Plane also blocks the arrow. Alternatively, you can speak
    the bow's command word as a bonus action to expend 3 of its charges and fire an arrow at a point you can see
    within the weapon's normal range. When the arrow hits a solid surface, you vanish from your location and reappear
    in an unoccupied space nearest to that point.
  source_name: Phasing Bow (longbow)
  source_price: 26000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-004
  type: Wondrous item
  desc: |-
    While wearing this feathered cloak, increase Constitution by 2, to a maximum of 20; gain poison resistance and advantage on saves against disease and poison. As a bonus action, transform it into vulture wings for 1 minute, gaining a flying speed of 60 feet. While transformed, an unblocked melee weapon strike against a creature missing HP deals an extra 1d6 necrotic damage. Regain the wing power at dusk.

    Curse: attuning binds the cloak to you. You refuse to remove or surrender it, and ordinary food becomes tasteless although it sustains you. Whenever you reduce a creature within 5 feet to 0 HP, make a DC 13 Wisdom save; automatically succeed for constructs, undead, and plants. On failure, forfeit your remaining action, bonus action, and move action to feast. Repeat the save at the start of each turn; success ends the compulsion. A curse-removing effect ends the binding.
  conversion_notes: Feeding explicitly consumes Varis action types. The necrotic rider requires an unblocked strike;
    the original curse and dusk recovery remain.
  name: Carrion Shroud
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 30000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A4:D4
  original_5e: 'This ruffled cloak of dull feathers and down grants you the resilience and cunning of a ravenous
    vulture. When you move while wearing this cloak, small, tattered feathers drift from the cloak that vanish when
    they touch the ground. While wearing the cloak, your Constitution score increases by 2 to a maximum of 20, you
    have advantage on saving throws against disease and poison, and you have resistance against poison damage. In
    addition, while wearing the cloak, you can speak its command word as a bonus action to cause it to transform
    into a pair of sickly vulture wings for 1 minute. While the cloak is transformed, you gain a a flying speed
    of 60 feet, and when you hit a creature that''s missing any of its hit points with a melee weapon attack, that
    creature takes an extra 1d6 necrotic damage. This property of the cloak can''t be used again until the next
    dusk. Curse. This cloak is cursed, and becoming attuned to it extends the curse to you until you are targeted
    by the remove curse spell. As long as you remain cursed, you are unwilling to part with the cloak, keeping it
    worn at all times. The cloak gives you an insatiable hunger for flesh, and while traditional food can sustain
    you, you no longer enjoy the smell or taste of it. While cursed, whenever you reduce a creature within 5 feet
    of you to 0 hit points, you''re forced to make a DC 13 Wisdom saving throw. If the creature is a construct,
    undead, or plant, you automatically succeed on this saving throw. On a failed save, you are overcome with the
    urge to tear into the creature''s flesh and feast: sacrificing any additional movement, action, or bonus action
    you had left on your turn. You can repeat this saving throw at the start of each of your following turns, ending
    your need to feast on a success.'
  source_name: Carrion Shroud
  source_price: 30000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-005
  type: Weapon
  base_item: Rapier
  magic_bonus: '2'
  desc: |-
    As a bonus action, form or dismiss a circulating sand blade from this quartz hourglass hilt. While formed, it is a Varis Rapier with +2 to attack rolls, damage, and Block DC.

    While holding the hilt, use an action to choose one power, each available once per dawn. Quicken: touch a willing creature; for up to 1 minute while you concentrate, it gains +10 feet speed, +2 AC, advantage on Dexterity saves, and one additional move action on each turn. The extra action cannot attack or cast. When this ends, the creature is Winded until the end of its next turn. Delay: choose up to three creatures you can see within 60 feet. Each makes a DC 16 Wisdom save. On failure, for up to 1 minute while you concentrate, its speed is halved, AC is reduced by 2, it cannot react, and each turn it must forfeit either its bonus action or move action. Repeat the save at the end of each turn. You have advantage on Constitution saves to maintain either power.
  conversion_notes: Haste and slow references are replaced by explicit Varis action effects, rather than importing
    extra 5e actions or spell-slot levels. Enhancement includes Block DC.
  name: Timepiercer (rapier)
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 26000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A5:D5
  original_5e: This item appears to be a sword hilt that has a small hole on either end of it. The hilt is made
    of clear quartz and contains an hourglass with sand inside it. Despite the holes on the hilt, the sand never
    seems to flow out of the hourglass. You can speak the hilt’s command word as a bonus action to cause it to form
    a thin blade of sand. The hourglass spills sand from the bottom of the hilt that circulates up and around to
    form the blade and guard of the rapier before returning to the hourglass again through the hole at the top.
    You can speak the hilt’s command word again as a bonus action to cause all the sand to return to the hourglass.
    While the blade is formed, you gain a +2 bonus to attack and damage rolls made with this magic weapon. While
    holding the hilt, you can use an action to cast either the haste or slow spell (save DC 16) from it. You have
    advantage on Constitution saving throws you make in order to maintain concentration on a spell cast in this
    way. Once a spell has been cast using the hilt, it can’t be used to cast that spell again until the next dawn.
    The sands in the hourglass move quickly while you concentrate on a haste spell cast in this way, or more slowly
    when you concentrate on a slow spell.
  source_name: Timepiercer (rapier)
  source_price: 26000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-006
  type: Wondrous item
  desc: |-
    This eyepiece holds 5 charges and regains 1d4 + 1 at dawn. As a reaction at the end of another creature's turn, spend 1 charge and target that creature if you can see it within 60 feet. Choose Past or Future.

    Past teleports the target to the space it occupied at the start of that turn, or the nearest unoccupied space if occupied. A willing target accepts; an unwilling target resists with a DC 16 Charisma save. This changes position only, without reversing damage, costs, actions, or other events.

    Future lets a willing target immediately move up to half its speed without provoking opportunity attacks. Its speed is then halved until the end of its next turn. This grants movement only, not another action.
  conversion_notes: The reaction has an explicit end-of-turn trigger. Time reversal moves the target without rewinding
    resources or actions, and Future supplies movement without duplicating a move action.
  name: Chronomancer's Eyepiece
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 12000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A6:D6
  original_5e: This singular lens lets you faintly see and command the flow of time around a target. The eyepiece
    has 5 charges and regains 1d4 + 1 expended charges daily at dawn. While wearing the eyepiece, you can expend
    1 charge as a reaction at the end of another creature's turn to speak either of the eyepiece's two command words
    to warp the flow of time around that creature. You must be able to see the target, and it must be within 60
    feet of you. Past. If the target is willing, it is teleported back to the space it was at the beginning of its
    turn. If another creature or object is occupying the space, the target is teleported to nearest unoccupied space
    instead. An unwilling target must succeed on a DC 16 Charisma saving throw or be teleported in this way against
    its will. Future. If the target is willing, it can immediately choose to move again, up to half its speed, without
    provoking opportunity attacks. After a target moves in this way, its speed is halved until the end of its next
    turn.
  source_name: Chronomancer's Eyepiece
  source_price: 12000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-007
  type: Weapon
  base_item: Longspear
  magic_bonus: '2'
  desc: |-
    This lance uses the Varis Longspear and grants +2 to attack rolls, damage, and Block DC. It holds 4 charges and regains 1d4 at dawn. As an action, spend 1 charge to surround yourself with wind for 1 minute. During it, you can Disengage as a bonus action. Spend a second charge without an action to extend this benefit to your current mount; that benefit ends if you dismount. The wind ends if you become unconscious or stop wielding the lance.

    Once per dawn, use an action to release a thunder burst in a 15-foot cube adjacent to you. Creatures inside make DC 16 Constitution saves, taking 4d8 thunder damage and being pushed 10 feet away on failure, or half damage without movement on success. This area power is resolved by saves and cannot be blocked.
  conversion_notes: The unavailable thunderwave reference becomes a complete area power. Lance enhancement raises
    Block DC, and the original wind charges remain separate from the dawn burst. The lance is mapped to the current
    Longspear base.
  name: Hurricane Lance
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 10000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A7:D7
  original_5e: You gain a +2 bonus to attack and damage rolls made with this magic weapon. The lance has 4 charges
    and regains 1d4 expended charges each day at dawn. You can expend 1 charge as an action to surround yourself
    with a flurry of wind that lasts for 1 minute. While surrounded by this wind, you can take the Disengage action
    using a bonus action. You can expend a second charge of the weapon (no action required) while surrounded by
    the wind to extend the effect to any mount you’re currently riding. If you dismount or are forced off your mount,
    the effect fades from it. The effect ends early if you fall unconscious or are no longer wielding the lance.
    In addition, you can use the lance to cast the thunderwave spell at 3rd level (save DC 16). Once this property
    of the lance has been used, it can’t be used again until the following dawn.
  source_name: Hurricane Lance
  source_price: 10000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-008
  type: Weapon
  desc: |-
    A matched Varis Dagger (Hour) and Short sword (Minute), sharing one attunement. Wield each using its own base weapon, training, and maneuvers. Holding one lets you spend an action to learn the distance and direction to the other on the same plane. Competing attunement is resolved by opposed Intelligence (Arcana) checks; a tie preserves the current bearer. The winner controls the pair and cannot be displaced this way for 24 hours.

    While holding both, each grants +1 to attack rolls, damage, and Block DC, and you gain +1 AC. On Hour's unblocked natural-20 strike, the target's speed is halved, it cannot react, and it must forfeit its bonus action or move action on its next turn; this ends at the end of your next turn. On Minute's unblocked natural-20 strike, gain +10 feet speed, +2 AC, and one extra move action until the start of your next turn, with no ending penalty. As an action, lay both down to point north and display the local time as clock hands, with 12 facing north.
  conversion_notes: The pair retains a shared attunement and separate weapon bases. Brief haste/slow effects are
    written in Varis actions and cannot grant extra attack actions; both enhancements include Block DC.
  name: Hour (Dagger) and Minute (Shortsword)
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 10000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A8:D8
  original_5e: 'These two magical weapons are bound by a powerful force. Despite there being two weapons, you only
    need to attune to one of them to use their properties. While holding one of the weapons, you can use an action
    to determine the distance and direction of the other paired weapon as long as you''re on the same plane of existence.
    If you attune to one of the weapons while another creature is attuned to the other, you are each aware of the
    other creature''s attunement and must make an Intelligence (Arcana) check contested by the other creature''s
    Intelligence (Arcana) check. The creature that wins the contest remains attuned to the item, and for the next
    24 hours, its attunement cannot be broken by another creature attempting to attune to the other weapon. The
    creature that loses the contest is no longer attuned to the weapon. While holding both weapons in either hand,
    you gain several benefits: You gain a +1 bonus to attack and damage rolls made with these magic weapons. Your
    perception of time is slightly quickened: allowing you to dodge attacks that would have normally hit you. You
    gain a +1 bonus to AC. When you roll a 20 on an attack roll using Hour (the dagger) against a creature, that
    creature is under the effects of the slow spell until the end of your next turn. When you roll a 20 on an attack
    roll using Minute (the shortsword), you''re under the effects of the haste spell until the start of your next
    turn. When the effect ends, you don''t suffer the normal effects of the spell ending. In addition, you can use
    an action to lay the two weapons down on the ground. When you do, they magically point north before spinning
    around to align and tell the current time. When they do, 12:00 is always facing north.'
  source_name: Hour (Dagger) and Minute (Shortsword)
  source_price: 10000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-009
  type: Weapon
  base_item: Longbow
  desc: |-
    This gilded bow uses the Varis Longbow and deals an extra 1d4 force damage on each unblocked strike. Once per short or long rest, when you see a creature casting within 60 feet, use a reaction to lose 30 current HP and fire a force arrow to interrupt it. You must have more than 30 HP; this loss bypasses Block, Arcane Health, Temp HP, resistance, and damage reduction.

    A spell of Varis level 3 or lower fails automatically. Against a level 4-6 spell, make a check using a mental ability chosen at attunement, adding proficiency, against DC 12 + spell level; success interrupts it. Interrupted spells spend their costs. If interrupted, the caster makes a DC 16 save using its casting ability, taking 30 force damage on failure or 15 on success. The interrupt arrow is resolved by these checks and saves, without an attack roll or Block check.
  conversion_notes: Automatic interruption is reduced to the lower half of Varis's six spell levels, with a check
    for higher levels. The life cost is actual HP loss and cannot be paid by renewable secondary pools.
  name: Bow of the Spelldrinker
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 7000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A9:D9
  original_5e: This gilded bow creates hazy illusions of the cosmos when drawn. Attacks made with this magic bow
    deal an extra 1d4 force damage to any target hit by it. When you see a creature casting a spell within 60 feet
    of you while holding this bow, you can use your reaction to draw from your own life force and attempt to counter
    it. When you do, you lose 30 hit points and fire a magical arrow of pure force from the bow toward the creature.
    If the creature is casting a spell of 5th level or lower, its spell fails and has no effect. In addition, the
    target must make a DC 16 saving throw, using its spellcasting modifier. On a failed save, the creature takes
    30 force damage as the magic is ripped from them. On a successful save, the creature takes half as much force
    damage. Once this property has been used, it can't be used again until you finish a short or long rest.
  source_name: Bow of the Spelldrinker
  source_price: 7000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-010
  type: Wondrous item
  desc: |-
    As an action, summon two spectral arms attached to your torso for 1 minute. They manipulate unattended objects, open unlocked containers, draw or stow accessible items, or pour a vial, but cannot wield weapons, shields, or spell components. Each carries up to 10 pounds and does not grant additional actions or equipment slots.

    The bracers hold 5 charges and regain 1d4 + 1 at dawn. While arms are active, spend 1 charge and a bonus action for two unarmed attacks: proficiency + 3 to hit, reach 5 feet, 1d4 + 3 magical bludgeoning damage, Block DC 11 + proficiency. Each attack is blockable normally. Alternatively, spend 1 charge when summoning to double each arm's capacity and extend their duration to 5 minutes.
  conversion_notes: Extra arms do not multiply Varis actions or shield benefits. Their attacks receive a defined
    Block DC and fixed ability-equivalent +3 modifier.
  name: Fourarm Bracers
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 12000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A10:D10
  original_5e: These bracers can summon another pair of spectral arms below your existing ones. These arms can be
    summoned as an action and last for up to 1 minute before disappearing. While active, you can use the arms to
    manipulate an object, open an unlocked door or container, stow or retrieve an item from an open container, or
    pour the contents out of a vial. Each arm can carry up to 10 pounds. The arms stay attached to your torso at
    all times and cannot be moved to other parts of your body, but can be turned around to face the opposite direction.
    In addition, the gems adorning the bracers can amplify the arms’ strength for short bursts. The gems have a
    total of 5 charges and recharge 1d4+1 expended charges each day at dawn. By uttering the bracers’ command word
    using a bonus action and expending 1 charge, you can empower the arms to immediately make two unarmed melee
    attacks. The arms have a +3 bonus to attack and damage rolls and use your proficiency bonus when making the
    attacks. Each strike does 1d4 magical bludgeoning damage upon a successful hit. Alternatively, you can expend
    1 charge to double the arms’ carrying capacity and increase their duration to 5 minutes instead.
  source_name: Fourarm Bracers
  source_price: 12000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-011
  type: Wondrous item
  desc: While wearing this platinum helm, gain +1 AC and +1 to saving throws. If you possess a breath-weapon feature,
    once per dawn you can replace one use with a holy blue breath, spending its normal action and resource. Use
    your breath's normal area, save ability, DC, and number of damage dice. Hostile creatures take radiant damage
    instead of its usual damage, with the breath's normal successful-save result. Hostile fiends and undead have
    disadvantage on that save. Friendly creatures in the area instead regain HP equal to a roll of those damage
    dice, without modifiers. A creature chooses whether to accept this healing. The helm does not itself grant a
    breath weapon.
  conversion_notes: The original alignment-based disadvantage is replaced with the explicit fiend/undead categories.
    The helm uses the bearer's existing Varis breath feature and does not create an extra racial resource.
  name: Helm of the Platinum Dragon
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 3000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A11:D11
  original_5e: This magical platinum helmet has been blessed by a powerful, holy dragon. While wearing this helmet,
    you gain a +1 bonus to AC and saving throws, and when you use your breath weapon, you can choose to exhale a
    holy blue plume of healing energy instead. When you do, this breath weapon deals radiant damage, evil-aligned
    hostile creatures within the area have disadvantage on the saving throw, and any friendly creatures in the area
    regain a number of hit points equal to your breath weapon's damage dice instead. This property of the helm can't
    be used again until the next dawn.
  source_name: Helm of the Platinum Dragon
  source_price: 3000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-012
  type: Wondrous item
  desc: |-
    This warhorn holds 4 charges and regains 1d4 at dawn. Its sound carries 300 feet. As an action, spend 1 charge to summon one loyal Large war elk in an unoccupied space within 30 feet. A previous elk from this horn vanishes. It remains until killed, dismissed as an action, or your attunement ends. It has AC 14, HP 37, speed 60 feet, Strength 18, Dexterity 12, Constitution 16, Intelligence 6, Wisdom 12, Charisma 8; saves use these modifiers. It acts after you, obeys spoken commands, and takes one action and one move action each turn. Its antlers attack at +6, reach 5 feet, dealing 2d6 + 4 piercing damage, Block DC 14. If ridden it supplies movement and cannot attack on that turn.

    Alternatively, spend 1 charge and an action for a spectral stampede in a 60-foot-long, 15-foot-wide line. Each creature makes a DC 15 Dexterity save, taking 4d10 force damage and falling Prone on failure, or half damage without falling on success. This save-based area damage cannot be blocked.
  conversion_notes: Find steed and giant elk references are replaced by a complete companion stat block and action
    limits. The stampede uses the current Prone condition.
  name: Horn of the Wild Hunt
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 3000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A12:D12
  original_5e: 'This large, spiraling warhorn has 4 charges and regains 1d4 expended charges daily at dawn. You
    can use an action to expend 1 charge and blow the horn, summoning a war elk as if you had cast the find steed
    spell. A war elk uses the same statistics as a giant elk with the following changes: its size is Large, it has
    AC 14 (hide barding), and has 37 hit points. The steed disappears if your attunement to the horn ends. Alternatively,
    you can use an action to expend 1 of the horn''s charges to speak its command word and then blow the horn. When
    you do, a spectral stampede of elk trample the area in a line 60 feet long and 15 feet wide that extends from
    you in a direction you choose. Each creature in the line must make a DC 15 Dexterity saving throw. On a failed
    save, a creature takes 4d10 force damage and is knocked prone. On a successful save, a creature takes half as
    much damage and isn''t knocked prone. When you blow the horn, it emits a deep, rumbling tone that is audible
    300 feet away.'
  source_name: Horn of the Wild Hunt
  source_price: 3000 GP
  source_attunement: 'Yes'
  source_rarity: Very Rare
- id: mi-very-rare-013
  type: Wondrous item
  desc: |-
    Turn this key in empty air as an action. Over 1 minute, a spectral doorway appears and remains for 24 hours, leading to an extradimensional dwelling with up to twenty furnished 20-foot rooms, food and beds for twenty guests, and an additional library. Only creatures you name can enter; you can open, close, or dismiss the doorway as an action while within 30 feet. It cannot be used to enter another plane or bypass a barrier in the surrounding world. When dismissed or expired, occupants and their possessions appear safely beside the entrance; created food, furnishings, and copied library books vanish outside it.

    A creature can spend 1 hour researching one topic in the library. Make an Intelligence (History, Arcana, Nature, or Religion) check: DC 12 for common lore, 16 for specialist knowledge, or 20 for rare historical records. Success supplies a truthful useful lead about that topic, never a creature's present private thoughts or unknowable future. The key becomes usable again 24 hours after its doorway closes.
  conversion_notes: The seventh-level mansion reference is replaced by a self-contained dwelling and research procedure.
    Library DCs and exit behavior are defined for immediate play.
  name: Archivist's Key
  group: Very Rare
  rarity: Very Rare
  attunement: 'No'
  price: 1000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A13:D13
  original_5e: This magical key is one of several made by a secret order of historians and archivists. While holding
    the key, you can use an action to twist the key, as if you were unlocking a door. When you do, a magical, spectral
    door slowly appears in front of you over the course of 1 minute, duplicating the effect of the magnificent mansion
    spell with the following change. The dwelling always includes a large library that magically includes copies
    of books, scrolls, maps, and more. The library does not count toward the total amount of space created by the
    spell. Its contents are strangely organized and seemingly change each time the key is used. A creature can visit
    the library and attempt to uncover a piece of knowledge, such as ancient poetry, the history of a forgotten
    kingdom, or the family lineage of a tyrannical king. The GM determines the checks and DCs needed to locate a
    given piece of information. For example, a book of foreign nursery rhymes may be easy to find, but a copy of
    necromantic research documents would be extremely difficult, if not impossible. When the spell ends, the key
    can't be used this way again for 24 hours.
  source_name: Archivist's Key
  source_price: 1000 GP
  source_attunement: 'No'
  source_rarity: Very Rare
- id: mi-very-rare-014
  type: Weapon
  base_item: Greataxe
  magic_bonus: '2'
  desc: 'This Varis Greataxe grants +2 to attack rolls, damage, and Block DC, and an extra 1d4 cold damage on each
    unblocked strike. Once per dawn, use an action to emit a winter howl. Other creatures within 15 feet take 1d6
