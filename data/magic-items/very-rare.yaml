- id: mi-very-rare-022
  type: Armor
  base_item: Plated leather armor
  magic_bonus: '2'
  desc: |-
    The default converted suit is Varis Plated leather armor with its normal Bulk, Block, Slow, and Protection properties, and +2 AC. While worn, gain slashing resistance, bludgeoning vulnerability, and advantage on checks or saves to resist or escape Grappled.

    Three times per dawn, use an action to become amorphous slime with your carried equipment for 1 minute. You retain your HP, AC, and slime defenses, can pass through openings at least 1 inch wide, and have advantage on grapple checks. You cannot use equipment, attack with weapons, activate items, or cast spells in this form. You can end it as a bonus action; it also ends at 0 HP. Re-form in the nearest free space large enough for your body. A newly created variant may use another specifically named Varis armor as its base, retaining that armor's properties and the same +2 AC.
  conversion_notes: The any-armor source receives a concrete default with current armor/Block properties. Grapples
    use Varis checks, and ending a narrow-space transformation has a defined safe placement.
