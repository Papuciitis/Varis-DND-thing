  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 800 GP per piece
  source_ref: Magic item generator.xlsx — Very Rare!A25:D25
  original_5e: This dart deals additonal +3 Force damage. As you throw this dart it seems to become alive and fly
