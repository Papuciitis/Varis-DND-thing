- id: mi-very-rare-025
  type: Weapon
  base_item: javelin
  desc: |-
    This flying dart uses Dexterity for proficient attacks and damage, has range 45/90, and deals 1d4 piercing damage plus the applicable ability modifier and 3 force damage. Add +3 to its attack roll and Block DC. It ignores half and three-quarters cover but not total cover. On an unblocked strike that damages a creature, regain 1 HP, or 2 HP if that strike was a critical hit. This healing cannot exceed maximum HP and is subject to effects that reduce healing.

    As part of each throw, you may return the dart to an empty hand after the attack resolves. If separated from it, use a bonus action to call it from within 200 feet on the same plane; it flies to you only if a path wide enough for the dart exists. Its homing does not waive normal training or allow additional attacks.
  conversion_notes: The source dart receives explicit Varis attack and Block formulas and a defined remote-recall
    cost. The javelin reference is a picker fallback; the printed dart damage and range override that base.
