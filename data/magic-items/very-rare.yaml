- id: mi-very-rare-018
  type: Ring
  desc: While wearing this ring and having at least 1 current HP, regain 1d6 HP every 10 minutes. This does not
    restore Arcane Health, Temp HP, Block, or rest dice, and cannot raise you from 0 HP. Apply Diseased and other
    healing modifiers normally. If you lose a body part, it regrows to full function after 1d6 + 1 days of continuous
    wear while you remain at 1 HP or more throughout; falling to 0 HP restarts that regrowth period. The ring does
    not remove curses, disease, Fatigue, or magical replacements.
