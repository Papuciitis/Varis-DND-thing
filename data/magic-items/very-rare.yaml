- id: mi-very-rare-027
  type: Potion
  desc: |-
    Drink this foul root potion as an action. For 8 hours, roll 2d20 whenever you begin casting a spell. If neither die is 1 or 2, cast normally and double the spell's rolled damage, after adding its normal modifiers, before resistance or vulnerability. Healing, secondary conditions, and later independent damage rolls are not doubled; for ongoing spells, double only the first damage roll.

    If either die is 1 or 2, the spell fails after its normal costs are spent. Roll d6 for a root surge: 1, you take 2d6 force damage; 2, gain 1 Fatigue; 3, you become Soaked; 4, teleport to the nearest unoccupied space 10 feet in a random compass direction; 5, you and creatures within 5 feet gain 1d6 Arcane Health for 1 minute; 6, you shed bright light 20 feet for 1 hour and cannot become Invisible during it. Multiple doses do not stack.
  conversion_notes: The unavailable wild-magic table is replaced by a complete six-result Varis table. Damage doubling
    is limited to the spell's first damage roll to prevent indefinite multipliers.
  name: Dai Root Potion
  group: Very Rare
  rarity: Very Rare
  attunement: 'No'
  price: 600 GP
  source_ref: Magic item generator.xlsx — Very Rare!A27:D27
  original_5e: 'The stench of this thick brown liquid rivals the armpits of the most vile orc in the tribe. After
    drinking this potion you gain the following effects for 8 hours: all  damage spells you successfully cast deal
    double damage; everytime you cast a spell roll 2d20 outside the attack roll. If either d20 roll is a 1 or 2
    the spell does not cast. Instead roll on the wild magic table.'
  source_name: Dai Root Potion
  source_price: 600 GP
  source_attunement: 'No'
  source_rarity: Very Rare
- id: mi-very-rare-028
  type: Potion
  desc: |-
    Drink as an action. One hour later, you lay 3d4 eggs, hatching into loyal chickens after 10 minutes. Each has AC 10, HP 1, speed 20 feet, no effective attack, and obeys simple empathic instructions to follow, wait, or move to a visible place. They cannot perform skilled tasks or carry more than 1 pound. Throwing a chicken at range 30/60 is an improvised ranged attack for 1d4 bludgeoning damage, Block DC 8 + your Dexterity modifier; the chicken dies or flees after impact.

    Each properly fed, sheltered chicken lays one restorative egg at dawn. Eating an egg takes 1 minute and restores one spent rest die up to the eater's normal maximum. A creature benefits from at most one such egg between dawns, regardless of the number of chickens. An egg loses this restorative magic at the next dawn. Eating a cooked chicken provides a meal and restores 1 HP, without restoring rest dice.
  conversion_notes: Hit-die restoration becomes Varis rest-die restoration. Explicit dawn limits and egg expiry
    prevent an unlimited stockpile from bypassing the system's long rest cadence; chicken damage becomes bludgeoning.
  name: Potion of Chicken
  group: Very Rare
  rarity: Very Rare
  attunement: 'No'
  price: 600 GP
  source_ref: Magic item generator.xlsx — Very Rare!A28:D28
  original_5e: 'When you drink this effervescent yellow potion your stomach and intestines gurgle and cramp.  After
    1 hour you lay 3d4 eggs, each of which hatches soon thereafter producing an adorable fluffy chicken.  The chickens
    are loyal to you and follow you around where ever you go.  You maintain a rudimentary empathetic link to the
    chickens, and can instruct them to wait, follow, or to go to a place you can point at.  However these and any
    more complex commands are hindered by the fact that they are chickens.  A chicken can be thrown (range 30/60)
    dealing 1d4 chicken damage on a hit, tho the chicken becomes most upset with you.  A chicken can be eaten to
    regain hit points, but why would you do that, you monster!  If kept happy and well cared for, each chicken will
    lay 1 egg at dawn.  These eggs are delicious and eating one restores one spent hit die to the character who
    eats it.  '
  source_name: Potion of Chicken
  source_price: 600 GP
  source_attunement: 'No'
  source_rarity: Very Rare
- id: mi-very-rare-029
  type: Wondrous item
  desc: |-
    Danion's skull-shaped bottle bears the warning DO NOT DRINK. Its sealed cork or glass requires an action and DC 20 Strength check to open or break while enchanted. Removing its enchantment makes it ordinary glass. While a hostile fiend, undead, or creature that has deliberately killed an innocent in the last day is within 30 feet, the liquid vibrates and sheds dim red light 10 feet.

    Opening it consumes the contents and releases 2d6 hostile ooze trackers in free spaces within 15 feet. Each has AC 12, HP 22, speed and swim 30 feet, Strength 14, Dexterity 14, Constitution 14, other scores 3; it can move through 1-inch gaps, has acid resistance, and ignores Prone. It acts after the opener, moving toward the nearest creature and making one pseudopod attack: +4 to hit, reach 5 feet, 2d6 acid damage, Block DC 12. On an unblocked strike the target is Grappled until it escapes with an action and DC 12 Strength check or the ooze dies. The trackers remain until destroyed; they obey no one.
  conversion_notes: Alignment detection becomes an explicit creature/deed trigger. Slithering trackers are replaced
    by a complete local stat block, so the trap needs no external monster manual.
  name: Bottle of Concentrated Malice
  group: Very Rare
  rarity: Very Rare
  attunement: 'No'
  price: 1000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A29:D29
  original_5e: |-
    A clear glass bottle in the shape of a human skull. It is filled with a black fluid with shimmering red wisps moving through it. The bottle is magically sealed. While the magic is active, it requires a DC20 strength check in order to open the cork or to smash it open. Removing the magic makes the bottle function like a normal one. A tag on the bottle, written in Common, reads:

    "Milking the evil out of a creature is not something I would ever like to do again.

    You have no idea what I went through to make this.

    Please handle with care. This shouldn't need to be said, but DO NOT DRINK! I mean it. Do not even try to open it."

    - Master Ranger Danion

    When an evil aligned creature is within 30 feet of the bottle, the fluid inside starts to vibrate and emit a dim red light out to 10 feet.
    If the bottle is opened, the fluid instantly expands to multiple times its original volume. From the fluid spawns 2d6 slithering trackers that are hostile to all creatures in the area that they can see.
  source_name: Bottle of Concentrated Malice
  source_price: 1000 GP
  source_attunement: 'No'
  source_rarity: Very Rare
- id: mi-very-rare-030
