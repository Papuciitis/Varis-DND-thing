- id: mi-very-rare-024
  type: Ammunition
  desc: 'This single arrow has living wings in place of fletching. When fired from a bow, add +3 to the shot''s
    attack roll and Block DC, without adding damage. It uses that bow''s damage, range, training, and applicable
    properties. You can instead throw it at range 20/60: a proficient ranged weapon attack using Dexterity, dealing
    1d4 piercing damage plus Dexterity, with Block DC 8 + proficiency + Dexterity + 3. Its +3 attack bonus applies
    to this throw too. A creature not proficient with bows gains neither proficiency nor ability bonuses. It cannot
    turn around total cover or target an unknown location. After a shot or throw it becomes a normal spent arrow;
    its enchantment is consumed.'
  conversion_notes: Homing raises Block DC consistently with magic weapons, and the otherwise unspecified throw
