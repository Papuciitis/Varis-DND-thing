- id: mi-very-rare-016
  type: Weapon
  base_item: Greatsword
  desc: |-
    This Varis Greatsword glows blue-green within 15 feet of a pool of water, shedding dim light for 10 feet. While wielding it, gain a swimming speed of 30 feet and breathe underwater.

    Once per long rest, use an action to create a wall of water within 60 feet, either 30 feet long, 10 feet high and 1 foot thick, or a ring 20 feet across and 10 feet high. It remains up to 1 minute while you concentrate. Its space is difficult terrain. Ranged weapon attacks crossing it have disadvantage; fire damage passing through it is halved. It does not stop creatures or other damage. A 5-foot section struck by cold damage freezes for the remaining duration, becoming an opaque barrier with AC 12 and 15 HP; destroying it opens that section. The water vanishes when the power ends.
  conversion_notes: Wall of Water becomes a self-contained concentration power compatible with Varis movement, attack,
    and object rules. The sword keeps its current mundane base.
  name: Krakeblade (Greatsword)
  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 4000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A16:D16
  original_5e: A massive sword that is able to be wielded fluidly despite its size and weight. Much like the kraken
    itself.  It draws its power from the domain of the kraken. While within 15ft. of a pool of water it glows in
    a blue-green color and casts dim light in this color out to 10 ft. The weilder while holding the sword gains
