- id: mi-very-rare-032
  type: Wondrous item
  desc: |-
    Within any three consecutive days, cast a total of 40 spell levels of transformation magic within 5 feet of this seed to awaken it. Count each paid spell level once; cantrips count 0, and free item effects count 0. Transformation magic must physically alter a creature, object, or material. A DC 16 Intelligence (Nature) check reveals the need for transformation magic, DC 18 reveals the 40-level requirement, and DC 22 reveals the growth category. A power allowing speech with plants reduces these DCs by 2.

    Roll d12 when acquired, hidden until growth. Five days after awakening it reaches full size. Results 1-3 grow a 20-foot square of grass, 4-6 a 15-foot square of flowers, 7-9 a 10-foot square of bushes, 10-12 a tree. Once per dawn its harvest supplies one benefit: 1 flax, strong rope or cloth worth 5 GP; 2 blackroot, one ingested poison dose (DC 14 Constitution, Sickened 1 hour); 3 mugwort, one antidote ending one mundane poison; 4 daisy, a poultice restoring 1d6 HP after 10 minutes; 5 powderpuff, one contact poison dose (DC 14 Constitution, Incapacitated until end of next turn); 6 Selune's Tear, burn a flower to consult a harmless ancestral spirit for one truthful local-history answer; 7 blueberries, a nourishing meal for four; 8 honeysuckle, tea granting advantage on the next disease save within 24 hours; 9 forester's bane, a 10-foot patch that Snares a hostile entrant until an action and DC 14 Strength check; 10 hiexel, smoke-wood obscuring a 10-foot radius for 10 minutes when burned; 11 phandar, strong timber worth 10 GP; 12 domesticated Gulthias, one loyal blight immediately and another every three years.

    A blight has AC 13, HP 18, speed 20 feet, Strength 14, Dexterity 12, Constitution 12, mental scores 6; it acts after you, with one move action and a branch attack (+4, reach 5 feet, 1d6 + 2 bludgeoning, Block DC 12). It obeys simple commands from those who awakened the seed. A second blight does not multiply your actions; each follows the same action limit. Harvests spoil after 24 hours and cannot reproduce the enchanted plant. Fire can permanently destroy the plant; otherwise it has ordinary botanical needs and lifespan.
  conversion_notes: The original botanical lore is condensed into twelve distinct usable harvests. Missing poison,
    ghost, and blight mechanics receive complete bounded Varis effects, without introducing external spell schools
    or stat blocks.
  name: Ancient seed
  group: Very Rare
  rarity: Very Rare
  attunement: 'No'
  price: 600 GP
  source_ref: Magic item generator.xlsx — Very Rare!A32:D32
  original_5e: "This seed has been dorment for millenia. It's hard to tell what it does or how it grows, but when\
    \ you put it close to your ear, you are sure that you can hear some kind of tiny whispers. \nTo activate it,\
    \ in 3 day period you have to use atleast combined 40 levels of transmutation spells near it (in 5 feet radius\
    \ from it). Druids can make Nature check, on DC 16, they know that they have to use transmutation spells for\
    \ something, on DC 18, they know that they have to use 40 levels combined to make it grow into one of 4 plant\
    \ types. On DC 22 they know what kind of plant they will grow - grasses, flowers, bushes, trees. Using speaking\
    \ with plants spell, the DC gets lowered by 2. When aquired, GM or player rolls d12, to see what kind of plant\
    \ he will get(player does not know). The plant is fully grown in 5 days, reagrdless of its type. Plants can\
    \ be destroyed forever with fire, but after that they live like normal plants.\nGrasses (They grow in 20x20\
    \ feet area):\n1 - Flax. It was commonly cultivated for its fibers, which were also known as flax, as well as\
    \ for its seeds. The fibers of this plant were commonly cultivated for use in textiles, being used to make linen.\
    \ Elf wizards often wore sashes made from flax fibers that were woven into an intricate knotwork. Some were\
    \ known to wrap flax fibers around the end of torches in place of cloth. The seeds of this plant could be pressed\
    \ into a substance known as linseed oil. Wizards used flax seeds as a material component for the Enlarge spell.\n\
    2 - Blackroot. It was an herb that could be distilled to create a poison used in the Underdark. The herb caused\
    \ paralyzation. One could be become immune to the poison by ingesting small quantities of it over a long period\
    \ of time. Blackroot could be distilled into notoriously thick alcoholic blackroot beer. One tankard of it was\
    \ considered to be almost a full meal.\n3 - Mugwort. It was a common fast-growing weed often disliked by farmers\
    \ and gardeners, but useful to druids and potion-makers. Mugwort plants often grew back within mere days after\
    \ being cut. It is used tto brew a powerful anti-toxin called the Elixir of Silvanus - a powerful curative potion\
    \ that could cure even the most lethal poisons. \nFlowers (They grow in 15x15 feet area): \n4 - Daisy. Daisy\
    \ plants could be used to create healing poultices. \n5 - Powderpuff. It was a small white flower with bluish\
    \ leaves that grew in the polar regions. It was a triple-stemmed plant with small bluish-green leaves. The flowers\
    \ were white and small and highly poisonous. Any bruise caused the flowers to secrete a potent poison that could\
    \ penetrate the skin and leave a creature in a catatonic state for ten days. The flowers could be dried and\
    \ powdered to produce an explosive substance akin to smokepowder, but only about half as potent.\n6 -  Selûne's\
    \ Tear. It was a flower that grew in the Swamp on the Coast. It could function as a spell component when burned,\
    \ allowing the summoning of a ghost. Summoned ghost is friendly to the creatures which used the transmutation\
    \ to activate the seed. Selûne's Tears had green leaves and dark blue flowers. \nBushes (They grow in 10x10\
    \ feet area):\n7 - Blueberries. They were a common type of berry in the world that grew on bushes. Blueberries\
    \ were one of the many types of edible berries in the world that could be used as material components for the\
    \ spell goodberry. Some used blueberries in the treatment of certain medical conditions, such as dropsy and\
    \ typhoid.\n8 - Honeysuckle. The scent of these shrubs was one of many that saurials used to communicate emotions.\
    \ The scent of honeysuckle expressed an emotion of tendernesss or concern. The petals of honeysuckles were commonly\
    \ mixed with those of roses when making Lotus Cheese. Honeysuckles could be used to help treat liver, spleen,\
    \ and respiratory disorders. Unicorns were fond of the taste of honeysuckles.\n9 - Domesticated Forester's Bane.\
    \ This plant was largely green to dark green. Its leaves were tough and broad, with sinewy ribs that radiated\
    \ 5​ to ​7 feet from the bushy center. Within this center was three to six purple stalks with saw-toothed edges.\
    \ Any leaves or stalks removed would regrow within two to eight weeks. Overall their bodies measured up to 15 feet\
    \ in a radius. Whenever a creature stepped on or near the leaves of this plant, they would snap shut around\
    \ them. The saw-toothed edges on the plant's stalks then gradually sawed away at the trapped prey. But because\
    \ it's domesticated it will not attack the creatures which used the transmutation to activate the seed. \nWithin\
    \ the center of this bush grew large, plump berries that had a sweet smell to them. These berries were typically\
    \ bright yellow, golden, greenish, or white. They were said to be very delicious and rich in protein.\nTrees:\n\
    10 - Hiexel. Trees usually grew about 30 feet tall. They had sparse branches that curved to make an overall\
    \ oval shape. They had silver-green bark. The wood itself was green. Hiexel produced a great quantity of smoke\
    \ when burned, so it was useful in cooking and signal fires. Hiexel bark was used in bookbinding and as a sealant\
    \ in buildings. The wood was unstable and so was not useful in construction or crafting.\n11 - Phandar. Trees\
    \ grew about 60 feet tall, had numerous curving branches sprouting from a knobby trunk. The branches faced away\
    \ from the wind, meaning that a group of phandars almost always pointed the same direction. Phandar leaves were\
    \ triangular and mottled green. Phandar trees were said to resemble ropers. Because of its strength, phandar\
    \ wood was an excellent building material. It was also used in the crafting of bows, tools, and weapon handles.\
    \ Its multicolored grains made it prized in jewelry making.\n12 - Domesticated Gulthias tree. Gulthias tree\
    \ grew about 50 feet tall and it was a plant infused with supernatural evil, capable of spreading corruption\
    \ to nearby plant life and generating malevolent creatures known as blights. But, because it's domesticated,\
    \ it can't corrupt nearby plant life, it still generates blights - first one right after the tree is grown,\
    \ and then every 3 years new blight is born. They are friendly to creatures, which used the transmutation magic\
    \ to make the seed activate. They are neutral to everyone else unless attacked or commanded to attack. They\
    \ listen to simple commands of friendly creatures and try to complete them as best as they can. From Gulthias\
    \ tree 1 of 4 blights can be born: Needle blight, Tree blight, Twig blight, Vine blight."
  source_name: Ancient seed
  source_price: 600 GP
  source_attunement: 'No'
  source_rarity: Very Rare
