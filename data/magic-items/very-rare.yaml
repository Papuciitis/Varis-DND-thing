  original_5e: 'It is +2 armor. Your armor constantly secretes a thin layer of slime. Whilst wearing it you gain:
    resistance to slashing damage; vulnerable to bludgeoning damage; advantage on saves against being grappled.
    3 times in a day you can, as an action, you and your equipment become gooey amorphous slime for 1 minute, or
