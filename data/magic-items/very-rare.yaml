  group: Very Rare
  rarity: Very Rare
  attunement: 'Yes'
  price: 8000 GP
  source_ref: Magic item generator.xlsx — Very Rare!A20:D20
  original_5e: This is +2 Spear. When you successfully hit a creature with this weapon, you can speak a command
    word which invokes the essence of desert sun as part of your attack. The creature has to make a Constitution
    saving throw (DC 14). On a failed save they take 2d4+2 Radiant damage and are blinded until the end of their
    next turn. On a successful save they take no damage. You can use this feature twice per day. After making a
    successful ranged attack against a creature with this spear you can instantly teleport to its location. This
    is a free action that is part of the attack and can be used once per round.
