    Strength save, despite the ice, ending it on success. Any damaging attack against it shatters the ice after
    that attack resolves and deals an extra 1d6 cold damage. The howl''s area damage is save-based and cannot be
    blocked.'
  conversion_notes: Rather than using Varis Paralyzed, which forbids the stated recovery saves, the ice defines
