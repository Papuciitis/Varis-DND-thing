- name: Infernal Behemoth
  group: Smash and grab
  meta: Large fiend (Infernal Descendant), chaotic evil
  size: Large
  type: fiend
  alignment: chaotic evil
  cr: '7'
  xp: 2,900
  ac: 18 (natural armor)
  block: 0 / +0
  hp: 142 (15d10 + 60)
  speed: 25 ft.
  abilities:
    str: '22'
    dex: '10'
    con: '18'
    int: '7'
    wis: '11'
    cha: '12'
  skills: Intimidation +5
  senses: darkvision 60 ft., passive Perception 10
  languages: Common, Infernal
  traits:
  - name: Menacing Presence
    description: A creature that starts its turn within 30 feet and can see the Behemoth makes a DC 15 Wisdom save
      or becomes Afraid until the end of that turn. Use the existing Afraid condition and its escalation rules,
      replacing the undefined Frightened condition.
  - name: Fiendish Durability
    description: When damage would reduce it to 0 HP, it makes a Constitution save with DC 5 + the damage taken.
      On success it drops to 1 HP instead. This cannot prevent being reduced to 0 by radiant damage or a critical
      hit.
  actions:
  - name: Multiattack
    description: Make two Maul attacks.
  - name: Maul
    description: 'Melee attack: +10 to hit; reach 10 ft.; one target; Block DC 18. On an unblocked strike, deal
      19 (3d8 + 6) bludgeoning damage. '
  - name: Ground Slam
    description: Make a separate +10 melee attack roll against every other creature within 10 feet, using the source's
      explicit 10-foot area rather than its conflicting reach 5 notation. Each hit can be Blocked separately against
      DC 18. An unblocked strike deals 17 (2d10 +6) bludgeoning damage and forces that target to make a DC 16 Strength
      save or fall Prone.
  conversion_notes:
  - Printed monster AC, speed, attack bonuses, saves and CR remain fixed source statistics, rather than recalculated
    player-character equipment totals. Source dice expressions are retained; arithmetic errors in optional damage
    averages are corrected and recorded. CR has not been recalculated for Varis balance.
  - 'Uses per day refresh after 24 hours. Rest-based uses retain their stated rest type: default short rest one
    day, long rest one week. Recharge X-Y is rolled on a d6 at the start of the creature''s turn and also recovers
    after a short or long rest.'
  - Weapon and spell attacks use the printed Block DC and require an unblocked strike for damage and attached on-strike
    effects. Saving-throw-only areas cannot be Blocked unless the particular spell explicitly permits it. Natural
    armor alone grants no extra Block or worn-armor proficiency.
  - Ground Slam source conflicts between reach5 and10-foot area. The explicit all-creatures10-foot area governs
    targeting; retained attack rolls and separate Blocks rather than inventing an auto-hit area save.
  replacement_sources:
  - field: Frightened
    alternative: Current Afraid condition
    source: data/conditions.yaml
  damage_resistances: fire; bludgeoning, piercing and slashing from nonmagical attacks
  saving_throws: STR +10, CON +8
  reactions:
  - name: Retaliatory Strike
    description: When a creature within its Maul reach damages it, make one Maul attack against that creature, with
      the normal Block DC and unblocked-strike rules.
  id: smash-infernal-behemoth
  source_ref: Smash and grab.docx / Infernal Behemoth
  original_5e: 'Infernal Behemoth


    Large fiend (Infernal Descendant), chaotic evil

    Armor Class: 18 (natural armor)

    Hit Points: 142 (15d10 + 60) (210 max HP)

    Speed: 25 ft.

    STR 22 (+6) | DEX 10 (+0) | CON 18 (+4) | INT 7 (-2) | WIS 11 (+0) | CHA 12 (+1)


    Saving Throws: Str +10, Con +8

    Skills: Intimidation +5

    Damage Resistances: Fire; bludgeoning, piercing, and slashing from nonmagical attacks

    Senses: Darkvision 60 ft., passive Perception 10

    Languages: Common, Infernal

    Challenge: 7 (2,900 XP)

    Abilities:


    Menacing Presence: Any creature that starts its turn within 30 feet of the Behemoth and

    can see it must make a DC 15 Wisdom saving throw or become frightened until the end of

    their turn.

    Fiendish Durability: If damage reduces the Behemoth to 0 hit points, it must make a

    Constitution saving throw with a DC of 5 + the damage taken, unless the damage is radiant

    or from a critical hit. On a success, the Behemoth drops to 1 hit point instead.

    Actions:


    Multiattack: The Behemoth makes two attacks with its maul.

    Maul: Melee Weapon Attack: +10 to hit, reach 10 ft., one target. Hit: 19 (3d8 + 6)

    bludgeoning damage.

    Ground Slam: Melee Weapon Attack: +10 to hit, reach 5 ft., all creatures other than the

    Behemoth in a 10 ft. radius. Hit: 17 (2d10 + 6) bludgeoning damage and the targets must

    succeed on a DC 16 Strength saving throw or be knocked prone.

    Reactions:


    Retaliatory Strike: When the Behemoth takes damage from a creature within reach, it can

    make a maul attack against that creature.'
  hp_max_variant: 210
