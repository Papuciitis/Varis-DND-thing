    description: 'Ranged attack: +6 to hit; range 120 ft.; one target; Block DC 14. On an unblocked strike, deal
      16 (2d10 + 5) force damage. '
  - name: Mute (1/day; replaces Silence)
    description: 'Cast the current level-1 Arcane Mute spell without a slot: action, somatic component, one creature
      within 60 feet, DC 13 Wisdom save. On failure it is mute for 1d4 + 3 rounds and Shaken for 1 round; on success
      halve the duration and do not apply Shaken. This is not the source''s obsolete 20-foot silence sphere.'
  conversion_notes:
  - Printed monster AC, speed, attack bonuses, saves and CR remain fixed source statistics, rather than recalculated
    player-character equipment totals. Source dice expressions are retained; arithmetic errors in optional damage
    averages are corrected and recorded. CR has not been recalculated for Varis balance.
  - 'Uses per day refresh after 24 hours. Rest-based uses retain their stated rest type: default short rest one
    day, long rest one week. Recharge X-Y is rolled on a d6 at the start of the creature''s turn and also recovers
    after a short or long rest.'
  - Weapon and spell attacks use the printed Block DC and require an unblocked strike for damage and attached on-strike
    effects. Saving-throw-only areas cannot be Blocked unless the particular spell explicitly permits it. Natural
    armor alone grants no extra Block or worn-armor proficiency.
  - Eldritch Blaster average corrected from source10 to16; source dice 2d10 +5 retained. Mage armor is represented
    by fixed source AC15, not an undefined imported player spell.
  - Mute uses the existing spell-save formula with Intelligence3 and CR4 proficiency2, giving DC13; the source fixed
    Eldritch Blaster attack bonus+6 remains unchanged.
  replacement_sources:
  - field: Silence
    alternative: 'Mute: current single-target silencing spell'
    source: data/draft-spells/lvl-1-arcane-spells.yaml
  - field: Shield
    alternative: 'Shield: current temporary Block reaction'
    source: data/draft-spells/lvl-1-arcane-spells.yaml
  - field: Mute DC
    alternative: Existing spell save DC =8 + proficiency + casting modifier
    source: https://www.dndbeyond.com/sources/dnd/basic-rules-2014/spellcasting#SpellSaveDC
  damage_resistances: fire
  reactions:
  - name: Shield (1/day)
    description: Cast the current level-1 Arcane Shield spell as a reaction to an incoming attack, gaining 1 temporary
      Block for 1 turn. Spend that Block and make the normal Block check if using it against the attack. It does
      not grant the old +5 AC bonus. No spell slot is spent; use verbal and somatic components.
