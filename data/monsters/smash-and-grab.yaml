- name: Infernal Saboteur
  group: Smash and grab
  meta: Medium fiend (Infernal Descendant), chaotic evil
  size: Medium
  type: fiend
  alignment: chaotic evil
  cr: '3'
  xp: '700'
  ac: 14 (leather armor)
  block: 4 / +6 (Dexterity)
  hp: 52 (8d8 + 16)
  speed: 30 ft., fly 50 ft.
  abilities:
    str: '12'
    dex: '18'
    con: '14'
    int: '11'
    wis: '13'
    cha: '10'
  skills: Stealth +7, Acrobatics +7
  senses: darkvision 60 ft., passive Perception 11
  languages: Common, Infernal
  traits:
  - name: Sneak Attack
    description: An attack made with advantage deals an extra 4d6 damage of the attack's type on an unblocked strike.
      The trigger is the current Rogue Sneak attack rule; it does not add the old 5e ally-adjacency trigger.
  - name: Stealthy
    description: Advantage on Dexterity (Stealth) checks.
  - name: Leather armor training
    description: 'Using the existing monster-equipment proficiency rule, it is trained with its printed leather
      armor. Block check: Dexterity 4 + proficiency 2 =+6; base pool 4.'
  actions:
  - name: Serrated Dagger
    description: 'Melee attack: +7 to hit; reach 5 ft.; one target; Block DC 15. On an unblocked strike, deal 6
      (1d4 + 4) piercing damage. '
  - name: Cloaking Device
    description: Become Invisible until the end of its next turn, or until it attacks, casts a spell or uses a device,
      whichever happens first. Use the current Invisible condition.
  - name: Explosive Charge (1/day)
    description: Set the source explosive charge, which detonates at the start of the Saboteur's next turn. Creatures
      within 10 feet of the charge make a DC 14 Dexterity save, taking 18 (4d8) fire damage on failure or half on
      success. This saving-throw area cannot be Blocked.
  conversion_notes:
  - Printed monster AC, speed, attack bonuses, saves and CR remain fixed source statistics, rather than recalculated
    player-character equipment totals. Source dice expressions are retained; arithmetic errors in optional damage
    averages are corrected and recorded. CR has not been recalculated for Varis balance.
  - 'Uses per day refresh after 24 hours. Rest-based uses retain their stated rest type: default short rest one
    day, long rest one week. Recharge X-Y is rolled on a d6 at the start of the creature''s turn and also recovers
    after a short or long rest.'
  - Weapon and spell attacks use the printed Block DC and require an unblocked strike for damage and attached on-strike
    effects. Saving-throw-only areas cannot be Blocked unless the particular spell explicitly permits it. Natural
    armor alone grants no extra Block or worn-armor proficiency.
  - 'Optional damage averages corrected: Serrated Dagger7→6 for1d4+4, Hellish Rebuke14→16 for3d10. Source dice and
    explicit Hellish Rebuke DC14 remain.'
  replacement_sources:
  - field: Sneak Attack missing trigger
    alternative: 'Current Rogue: Sneak attack (attack with advantage)'
    source: data/draft-classes/rogue.yaml
  - field: Hellish Rebuke missing range/components
    alternative: Hellish Rebuke at second level
    source: https://www.dndbeyond.com/spells/2142-hellish-rebuke
  - field: leather armor proficiency
    alternative: Monster Armor, Weapon and Tool Proficiencies
    source: https://www.dndbeyond.com/sources/dnd/basic-rules-2014/monsters#ArmorWeaponandToolProficiencies
  damage_resistances: fire
  equipment:
