section: monsters
entries:
- name: Infernal Commando
  group: Smash and grab
  meta: Medium fiend (Infernal Descendant), chaotic evil
  size: Medium
  type: fiend
  alignment: chaotic evil
  cr: '5'
  xp: 1,800
  ac: 18 (plate armor and shield)
  block: 4 / +10 (Strength); combat armor floor 2
  hp: 75 (10d8 + 30)
  speed: 30 ft.
  abilities:
    str: '18'
    dex: '14'
    con: '16'
    int: '12'
    wis: '11'
    cha: '15'
  skills: Intimidation +5, Perception +3
  senses: darkvision 120 ft., passive Perception 13
  languages: Common, Infernal, Abyssal
  traits:
  - name: Magic Resistance Shield
    description: While using its shield, the Commando has advantage on saves against spells and other magical effects.
  - name: Equipment Block
    description: Base Dexterity Block 2 plus armor Block 2. At combat start raise remaining Block to at least 2.
      It is trained with its printed armor and shield using the existing monster-equipment proficiency rule. Block
      check uses Strength +4, proficiency +3 and Protection +3, total +10.
  - name: Fiendish resilience (1/short rest)
    description: On its turn, take one additional action. It does not grant another bonus action, move action or
      reaction. This uses the existing 2014 Action Surge procedure to complete the source's missing activation timing;
      it remains the source's monster power, not the Varis Fighter class feature.
  actions:
  - name: Multiattack
    description: Make two Hellfire Blade attacks; resolve and Block each separately.
  - name: Hellfire Blade
    description: 'Melee attack: +7 to hit; reach 5 ft.; one target; Block DC 15. On an unblocked strike, deal 10
      (1d8 + 6) slashing damage plus 7 (2d6) fire damage. The fire rider belongs to the blockable strike.'
  - name: Darkness (1/day)
    description: Cast the current Darkness Occult cantrip without a spell slot, using its action, somatic component,
      concentration and 30-foot sphere within 60 feet. It dims existing light and grants its printed passive effects;
      it does not create the old 5e magical-darkness effect. No optional upgrade is assumed.
  conversion_notes:
  - Printed monster AC, speed, attack bonuses, saves and CR remain fixed source statistics, rather than recalculated
    player-character equipment totals. Source dice expressions are retained; arithmetic errors in optional damage
    averages are corrected and recorded. CR has not been recalculated for Varis balance.
  - 'Uses per day refresh after 24 hours. Rest-based uses retain their stated rest type: default short rest one
    day, long rest one week. Recharge X-Y is rolled on a d6 at the start of the creature''s turn and also recovers
    after a short or long rest.'
  - Weapon and spell attacks use the printed Block DC and require an unblocked strike for damage and attached on-strike
    effects. Saving-throw-only areas cannot be Blocked unless the particular spell explicitly permits it. Natural
    armor alone grants no extra Block or worn-armor proficiency.
  - The source plate/shield have been mapped to named current equipment and their Block/Protection/Reduction rules;
    fixed monster AC 18 and speed 30 feet remain the source values, not the result of rebuilding it as a PC. The
    unnamed shield is assigned the existing Round shield baseline.
  - The source explicitly offers120 max HP, although10d8 +30 has a mathematical dice maximum of110. Preserve120
    as its source tougher-HP variant, separate from the default75 HP; do not label it the rolled-dice maximum.
  replacement_sources:
  - field: plate and unnamed shield
    alternative: Plated armor suit and Round shield
    source: data/draft-reference/armor-and-shields.yaml
  - field: armor proficiency
    alternative: Monster Armor, Weapon and Tool Proficiencies
    source: https://www.dndbeyond.com/sources/dnd/basic-rules-2014/monsters#ArmorWeaponandToolProficiencies
  - field: Fiendish resilience activation
    alternative: '2014 Fighter: Action Surge procedure'
    source: https://www.dndbeyond.com/sources/dnd/basic-rules-2014/classes#ActionSurge
  - field: Shield Parry duration
    alternative: 'Knight: Parry applies to the triggering attack'
    source: https://www.dndbeyond.com/monsters/16938-knight
  - field: Darkness
    alternative: Current Darkness Occult cantrip
    source: data/draft-spells/occult-cantrips.yaml
  - field: Hellish Rebuke missing range, damage and timing
    alternative: Hellish Rebuke at second level
    source: https://www.dndbeyond.com/spells/2142-hellish-rebuke
  - field: Hellish Rebuke omitted DC
    alternative: 'Infernal Saboteur same second-level Hellish Rebuke: DC14'
    source: Smash and grab.docx / Infernal Saboteur
  damage_resistances: fire; bludgeoning, piercing and slashing from nonmagical attacks
  equipment:
  - name: Plated armor suit
    description: 'Current plate equivalent: Bulk 9, Block 2, Slow 4, physical Reduction 2, Protection 3. The armor
      is included in the fixed AC and speed above; apply Reduction 2 to physical damage.'
  - name: Round shield
    description: 'Current shield baseline for the unnamed source shield: +2 AC (already in fixed AC), Bolster 1,
      Brace 2, Bash 1d6. Bolster can grant 1 temporary Block by spending an action. The source Shield Parry is retained
      below.'
  bonus_actions:
  - name: Misty Step (1/long rest)
    description: Teleport up to 30 feet to an unoccupied space it can see. This is the complete source-specific
      bonus-action power and spends no spell slot.
  reactions:
  - name: Shield Parry
    description: When hit by an attack while using its shield, spend its reaction to add +3 AC against that triggering
      attack; if the attack no longer hits it deals no damage. This uses the existing Parry procedure to complete
      the source duration.
  - name: Hellish Rebuke (1/day)
    description: After a creature it can see within 60 feet damages it, spend its reaction and use verbal and somatic
      components. The triggering creature makes a DC 14 Dexterity save, taking 16 (3d10) fire damage on failure
      or half on success. This self-contained second-level Hellish Rebuke effect cannot be Blocked and spends no
      spell slot. The omitted DC is supplied by the existing Infernal Saboteur's same second-level Hellish Rebuke.
  id: smash-infernal-commando
  source_ref: Smash and grab.docx / Infernal Commando
  original_5e: 'Infernal Commando


    Medium fiend (Infernal Descendant), chaotic evil

    Armor Class: 18 (plate armor)

    Hit Points: 75 (10d8 + 30) (120 max HP)

    Speed: 30 ft.

    STR 18 (+4) | DEX 14 (+2) | CON 16 (+3) | INT 12 (+1) | WIS 11 (+0) | CHA 15 (+2)


    Skills: Intimidation +5, Perception +3

    Damage Resistances: fire; bludgeoning, piercing, and slashing from nonmagical attacks

    Senses: Darkvision 120 ft., passive Perception 13

    Languages: Common, Infernal, Abyssal

    Challenge: 5 (1,800 XP)

    Abilities:


    Multiattack: Infernal Commando attacks twice with Hellfire Blade.

    Hellfire Blade: Melee Weapon Attack: +7 to hit, reach 5 ft., one target. Hit: 10 (1d8 + 6)

    slashing damage plus 7 (2d6) fire damage.

    Magic Resistance Shield: The Commando has advantage on saving throws against spells

    and other magical effects.

    Darkness (1/day): Casts darkness without expending a spell slot.

    Hellish Rebuke (1/day): In response to being damaged, can cast hellish rebuke at 2nd

    level.

    Misty Step (1/long rest): As a bonus action, the Commando can teleport up to 30 feet to an

    unoccupied space it can see.

    Fiendish resilience (1/short rest). Can make another action.


    Reaction: Can add +3 to AC, when hit by an attack using it’s shield.'
  hp_max_variant: 120
