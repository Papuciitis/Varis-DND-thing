    \ Infernal Behemoth\n    ● 80-90 - portal regains 6d10+30 HP\n    ● 90-99 - portal deals in 100ft sphere 8d6\
    \ force damage (DC 14 DEX save) or half\n        when succeeded\n    ● 100 - portal regains all hit points and\
    \ summons one Infernal Hound, Infernal\n        Saboteur, Infernal Behemoth\nActions:\n\nClose Portal (Special):\
    \ The portal can be closed if a character spends an action to cast\ndispel magic at 4th level (DC 15) on it\
