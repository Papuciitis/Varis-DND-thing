  group: Smash and grab
  meta: Object, unaligned
  type: object
  alignment: unaligned
  cr: '-'
  ac: 17 (arcane protection)
  block: 0; object cannot make Block checks
  hp: '200'
  speed: 0 ft. (stationary object)
  damage_immunities: poison, psychic, necrotic, thunder; bludgeoning, piercing and slashing from nonmagical attacks
  damage_vulnerabilities: force
  condition_immunities: Charmed, Fatigue, Shaken, Afraid, Terrified, Grappled, Incapacitated, Paralyzed, petrification,
    Poisoned, Prone
  senses: none
  languages: none
  traits:
  - name: Portal round and legendary pool
    description: While active in combat, the stationary portal acts on initiative count 20 (losing ties), borrowing
      the existing Steel Dragon lair cadence. At that count it regains 3 legendary actions, regains its reaction
      for the round, and resolves Unstable if below 50 HP. The portal has no creature ability scores and cannot
      make Block checks.
  - name: Arcane Lock
    description: 'The seal is a specific target for current Dispel magic: spend the spell''s action at its 20-foot
      range and make an Arcana check against the portal''s specific DC 15. On success, its AC becomes 10 until the
      end of the caster''s next turn. This is the portal''s printed special interaction and does not replace the
      other procedures for closing it.'
  - name: Dimensional Anchor
    description: A creature attempting to teleport within 60 feet makes a DC 15 Charisma save. On failure the attempted
      teleport fails.
  - name: Unstable
    description: At the portal's initiative count 20, if it has fewer than 50 HP, roll 1d100 once and resolve the
      Unstable table. This adopts the existing Steel Dragon lair round cadence to fill the source's missing timing.
      Source-order precedence resolves duplicate endpoints, so every roll produces exactly one original outcome.
  - name: Summoned arrivals
    description: Summoned fiends appear in unoccupied spaces within 30 feet of the portal, using the existing Deck
      of Many Things Knight arrival-distance procedure. Roll initiative for each arriving group, giving it its own
      turns as in Conjure Animals. The GM runs these NPCs using their compendium statblocks; this does not grant
      any player a summoning spell or control.
  unstable_table:
    columns:
    - d100
    - Effect
    rows:
    - - '1'
      - Portal is destroyed.
    - - 2-50
      - Nothing happens.
    - - 51-60
      - Summon3d4 Infernal Hounds.
    - - 61-70
      - Summon1d4 Infernal Saboteurs.
    - - 71-80
      - Summon1d2 Infernal Behemoths.
    - - 81-90
      - Regain6d10 +30 HP, up to200.
    - - 91-99
      - Creatures in a100-foot-radius sphere centered on the portal make a DC14 Dexterity save, taking8d6 force
        damage on failure or half on success. This area cannot be Blocked.
    - - '100'
      - Regain all HP and summon one each of Infernal Hound, Infernal Saboteur and Infernal Behemoth.
  actions:
  - name: Close Portal (character interaction)
    description: A character closes the portal by casting current Dispel magic using a 4th-level slot and succeeding
      on the portal's specific DC 15 Arcana check, or by causing it to take at least 50 force damage from a single
      attack. Use the spell's action and20-foot range; apply force vulnerability before testing the damage actually
      taken. Destroying the portal at 0 HP also stops this object from functioning.
  legendary_actions:
  - name: Summon Hound (1 action)
    description: At the end of another creature's turn, summon 2d4 Infernal Hounds. Only usable with more than 50
      HP.
  - name: Summon Infernal (2 actions)
    description: At the end of another creature's turn, summon one Infernal Saboteur. Only usable with more than
      100 HP.
  - name: Summon Behemoth (3 actions)
    description: At the end of another creature's turn, summon one Infernal Behemoth. Only usable with more than
      150 HP.
  reactions:
  - name: Portal Feedback
    description: When it takes force damage, spend its reaction to burst with energy. Each creature within 10 feet
      makes a DC 13 Dexterity save, taking 2d6 force damage on failure and none on success. This area cannot be
      Blocked.
  conversion_notes:
  - Printed monster AC, speed, attack bonuses, saves and CR remain fixed source statistics, rather than recalculated
    player-character equipment totals. Source dice expressions are retained; arithmetic errors in optional damage
    averages are corrected and recorded. CR has not been recalculated for Varis balance.
  - Weapon and spell attacks use the printed Block DC and require an unblocked strike for damage and attached on-strike
    effects. Saving-throw-only areas cannot be Blocked unless the particular spell explicitly permits it. Natural
    armor alone grants no extra Block or worn-armor proficiency.
  - Portal is an object; no Strength, Dexterity or other creature ability scores have been fabricated. Its stationary
    speed and inability to Block follow its object role.
  - Exhaustion immunity maps to current Fatigue; Frightened immunity covers the current Shaken/Afraid/Terrified
    fear chain. Other source object immunities remain.
  - The source does not specify an Unstable trigger cadence or own turn to refresh legendary actions. Both use the
    already existing Steel Dragon lair initiative20 cadence, losing ties; this borrowed procedure is recorded rather
    than described as printed portal content.
  - Unstable source intervals overlap at50,60,70,80 and90. The first printed row containing an endpoint takes precedence.
    Only duplicate endpoints are removed; no outcomes are added. The100-foot sphere is read as a radius, using the
    existing Fireball sphere notation; the source does not explicitly label radius.
  - The source does not provide arrival spaces or summoned-creature initiative. Borrow only the existing Deck of
    Many Things Knight appearance procedure (an unoccupied space within30 feet of the summoning source) and Conjure
    Animals group-initiative procedure. Summoned creatures remain GM-run NPCs with their own printed statistics;
    these borrowed procedures do not turn them into beasts or grant a player spell or control.
  - Source Dispel magic DC15 interactions use current Arcana checks rather than imported5e ability checks. The source
    fourth-level slot requirement for fully closing it is retained.
