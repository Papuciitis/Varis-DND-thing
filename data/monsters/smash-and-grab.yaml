    description: Current Leather armor baseline; no extra Block or Protection. Fixed source AC 14 and speed remain
      unchanged.
  reactions:
  - name: Hellish Rebuke (1/day)
    description: After a creature it can see within 60 feet damages it, spend its reaction and use verbal and somatic
      components. The creature makes the source DC 14 Dexterity save, taking 16 (3d10) fire damage on failure or
      half on success. This self-contained second-level effect cannot be Blocked and spends no spell slot.
  id: smash-infernal-saboteur
  source_ref: Smash and grab.docx / Infernal Saboteur
  original_5e: 'Infernal Saboteur


    Medium fiend (Infernal Descendant), chaotic evil

    Armor Class: 14 (leather armor)

    Hit Points: 52 (8d8 + 16) (80 max HP)

    Speed: 30 ft., fly 50 ft.

    STR 12 (+1) | DEX 18 (+4) | CON 14 (+2) | INT 11 (+0) | WIS 13 (+1) | CHA 10 (+0)


    Skills: Stealth +7, Acrobatics +7

    Damage Resistances: fire

    Senses: Darkvision 60 ft., passive Perception 11

    Languages: Common, Infernal

    Challenge: 3 (700 XP)

    Abilities:


    Serrated Dagger: Melee Weapon Attack: +7 to hit, reach 5 ft., one target. Hit: 7 (1d4 + 4)

    piercing damage.

    Sneak Attack: Extra 4d6 damage

    Stealthy: The Saboteur has advantage on Dexterity (Stealth) checks.

    Cloaking Device: As an action, the Saboteur can become invisible until the end of its next

    turn or until it attacks, casts a spell, or uses a device.

    Explosive Charge (1/day): The Saboteur can set an explosive charge that detonates at the

    start of its next turn. All creatures within a 10-foot radius must make a DC 14 Dexterity

    saving throw, taking 18 (4d8) fire damage on a failed save, or half as much damage on a

    successful one.

    Hellish Rebuke (1/day): In response to being damaged, can cast hellish rebuke at 2nd

    level, dealing 14 (3d10) fire damage on a failed Dexterity saving throw (DC 14), and half on

    a successful one.'
