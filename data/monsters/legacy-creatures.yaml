  - name: Transparent
    description: While still, spotting it requires a DC 15 WIS (Perception) check. Moving into its occupied
      space reveals it and lets it make one Slam as a reaction; resolve the attack and Block normally.
  - name: Corrosive Contact
    description: Each Slam deals an additional 1d6 acid damage on an unblocked strike. On an unblocked strike,
      choose one nonmagical metal/wood weapon or worn armor touching the creature; its wielder/wearer makes
      a CON save against the listed DC. On failure, that item's attack rolls (weapon) or AC (armor) take a
      -1 penalty, to a maximum -2 from this creature's corrosion. One hour with suitable tools and a DC 12
      smithing or woodworking check repairs 1 penalty. This does not destroy items or lower Block, and magical
      items are unaffected. Corrosion save DC 18. A nonmagical wood or metal object held continuously against
      it for a whole round takes 12 acid damage; stone is unaffected.
  actions:
  - name: Slam
    description: 'Melee attack: +5 to hit, reach 5 ft., one target; Block DC 13. Unblocked strike: 1d6 + 4
      bludgeoning damage. A Medium or smaller target is Grappled (escape action: STR or DEX check DC 13). Only
      one creature can be held with this limb. The hold ends if the grappler is incapacitated or the target
      leaves its reach. '
  - name: Constrict
    description: 'One creature already Grappled by this ooze makes a DC 13 STR save; failure: 1d6 + 1 bludgeoning
      and 1d6 acid damage; success: no damage. Requires an action and does not add a free Slam.'
