section: monsters
entries:
- name: Froghemoth
  group: Cross-system creature conversions
  id: converted-froghemoth
  meta: Huge monstrosity, neutral
  size: Huge
  type: monstrosity
  alignment: neutral
  cr: '15'
  ac: '25'
  hp: '287'
  speed: 30 ft., swim 80 ft.
  block: 1 / +1 check
  abilities:
    str: '24'
    dex: '13'
    con: '21'
    int: '1'
    wis: '6'
    cha: '1'
  proficiency_bonus: '+5'
  senses: darkvision 30 ft., passive Perception 8
  languages: —
  traits:
  - name: Adhesive Skin
    description: A Medium or smaller creature that touches its skin or makes an unarmed/natural melee strike
      against it must pass a DC 18 DEX save or become Grappled (escape action STR or DEX DC 20). A weapon alone
      can stick without grappling its wielder; a bonus action releases the weapon. A target cannot be stuck
      through a successfully Blocked froghemoth strike.
  actions:
  - name: Multiattack
    description: Makes two Slam attacks and two Stomp attacks, or one Tongue attack and one Slam attack. Swallow
      is a separate action.
  - name: Slam
    description: 'Melee attack: +12 to hit, reach 10 ft., one target; Block DC 20. Unblocked strike: 2d8 +
      6 bludgeoning damage. '
  - name: Stomp
    description: 'Melee attack: +12 to hit, reach 10 ft., one target; Block DC 20. Unblocked strike: 2d10 +
      8 bludgeoning damage. '
  - name: Tongue
    description: 'Melee attack: +12 to hit, reach 30 ft., one target; Block DC 20. Unblocked strike: 1d8 +
      4 bludgeoning damage. A Medium or smaller target is Grappled (escape action: STR or DEX check DC 20).
      Only one creature can be held with this limb. The hold ends if the grappler is incapacitated or the target
      leaves its reach. The tongue can hold only one target; a held target is pulled up to 20 ft. closer. '
  - name: Swallow
    description: 'One Medium or smaller creature Grappled by the tongue within 5 ft. makes a DC 20 STR save.
      Failure: it is swallowed, ending the tongue''s hold. Success: it remains Grappled outside. One creature
      can be swallowed. Inside it is Blinded, has no line of effect outside, and takes 4d6 acid damage at the
      start of the froghemoth''s turn. It can attack the stomach (AC 15); 25 damage in one turn opens an escape
      and deposits it Prone within 5 ft. Teleporting out or incapacitating the froghemoth also releases it.
      There is no automatic death timer.'
  ability_score_status: sourced
  source_system: 3.x homebrew / PFSRD-labelled screenshot
  source_ref: User-supplied statblock screenshot / Froghemoth
  original_5e:
    source_system: 3.x homebrew / PFSRD-labelled screenshot
    name: Froghemoth
    printed_scores:
    - 24
    - 13
    - 21
    - 1
    - 6
    - 1
    printed_cr: not supplied
    printed_ac: -4 size, +1 DEX, +18 natural; touch 10, flat-footed 15 (inconsistent)
    printed_hp: 25d10 + 150, no fixed total
    printed_speed: 30 ft., swim 80 ft.
    printed_attacks:
    - two slams +18 (2d8+6)
    - two stomps +18 (2d10+8)
    - tongue +22 (1d8+4)
    - swallow +30 (4d12+10)
    legacy_saves: Fort +25, Ref +13, Will +4
    legacy_adhesive_dc: 33
    legacy_swallow: Automatic death after three rounds unless immune to acid.
    alignment: neutral
  source_completion:
    fields:
    - current proficiency, saves, Block, action costs, durations and escape procedures
    - AC 25 from 10 - 4 + 1 + 18; HP 287 from the supplied hit dice; CR 15 estimate; tongue reach 30 ft.
    cr_status: Provisional Varis encounter estimate; not a balance certification
  source_conversion:
    theme: Forests & wilds
    attack_profiles:
    - name: Slam
      ability: str
      bonus: 12
      block_dc: 20
      dc_adjustment: 0
      damage_modifier: 6
      offset: 0
    - name: Stomp
      ability: str
      bonus: 12
      block_dc: 20
      dc_adjustment: 0
      damage_modifier: 8
      offset: 0
    - name: Tongue
      ability: str
      bonus: 12
      block_dc: 20
      dc_adjustment: 0
      damage_modifier: 4
      offset: 0
    batch: 2026-11-28-cross-system
  block_rules: 'Rested Block is max(0, DEX modifier); natural armor grants neither equipment Block nor armor
    training. Temporary Block does not stack: keep the higher grant. A successful Block negates blockable damage
    and attached strike riders. Saving-throw-only and automatic damage cannot be Blocked.'
  conversion_notes:
  - Adapted to current Varis rules. Source-system bonuses and action economies are not interchangeable; original
    statistics remain in the source panel.
  - Daily uses recover after 24 hours; a short rest is one day and a long rest is one week. Recharge rolls
    1d6 at the start of its turn while expended.
  - CR is a provisional encounter estimate. Powers with completed timings, limits or escape methods are conversions,
    not missing published text.
  - Source +24/+13/etc are treated as ability scores, not enormous modifiers. The contradictory touch/flat-footed
    ACs, BAB and Reflex DC are archived. Instant-death digestion becomes damage with a defined rescue.
  replacement_sources:
  - name: Current monster template
    description: docs/monsters.md
  - name: Block, equipment, conditions and rests
    description: data/draft-reference/combat.yaml; data/draft-reference/armor-and-shields.yaml; data/weapons.yaml;
      data/conditions.yaml; data/draft-reference/progression.yaml
  saving_throws: STR +7, DEX +1, CON +5, INT -5, WIS -2, CHA -5
  source_ability_scores:
    method: Six numeric scores copied from the supplied statblock; incompatible derived bonuses are converted
      separately.
    scores:
