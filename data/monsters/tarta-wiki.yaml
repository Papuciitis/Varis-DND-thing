      terrain as a bonus action. The effect lasts for 1 minute.'
    - 'Rocky Breath: Exhales a cone of jagged rocks in a 60-foot cone. Each creature in that area must make a DC
      19 Dexterity saving throw, taking 14d6 bludgeoning damage on a failed save, or half as much damage on a successful
      one.'
    - 'Stone Spike (Legendary): The Cerithal Stone Dragon uses its deep connection with the earth to cause a sharp
      stone spike to erupt from the ground at a point it can see within 60 feet. This spike targets one creature
      that the dragon can see at that location.bThe targeted creature must make a Dexterity saving throw (DC 19).
      On a failed save, the creature takes 4d10 piercing damage and is restrained by the stone spike. On a successful
      save, the creature takes half damage and is not restrained. A restrained creature can use its action to make
      a Strength check (DC 19) on its turn to break free from the spike. After the attack, the spike remains as
      a 5-foot-tall obstacle in the terrain, potentially providing cover or hindering movement.'
    combat_lore: In combat, a Cerithal Stone Dragon uses its mastery over stone to control the battlefield. It can
      create barriers, pitfalls, and spires of rock to challenge and confound its enemies. Its rocky breath weapon
      is a devastating force, capable of decimating entire areas.
