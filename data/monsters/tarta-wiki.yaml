  - name: Aether Breath (Recharge 5-6)
    description: Exhale energy in a 120-foot line, 10 feet wide. Each creature in the area makes a DC 21 Dexterity
      save, taking 20d6 radiant damage on a failure, or half as much on a success. This saving-throw-only effect
      cannot be Blocked. After use, roll 1d6 at the start of each of the dragon's turns; on 5 or 6, this breath
      recharges.
  legendary_actions:
  - name: Legendary action pool
    description: The dragon has 3 legendary actions. At the end of another creature's turn, it can use one listed
      option and pay its cost. Use only one option at a time. It regains all spent legendary actions at the start
      of its own turn. These do not consume its action, bonus action or reaction.
  - name: Detect (1 action)
    description: Make a Wisdom (Perception) check.
  - name: Tail Attack (1 action)
    description: Make one Tail attack using its printed attack bonus, reach, Block DC and unblocked-strike damage.
  - name: Wing Attack (2 actions)
    description: Each other creature within 15 feet makes a DC 25 Dexterity save. On a failure, it takes 3d6 + 10
      bludgeoning damage and falls Prone. On a success, it takes no damage and does not fall Prone. The dragon may
      then fly up to half its flying speed. This saving-throw-only effect cannot be Blocked.
  - name: Magical Pulse (2 actions)
    description: Each other creature within 60 feet makes a DC 19 Constitution save. On a failure, it takes 3d10
      radiant damage and is Hobbled for 1 minute. An affected creature repeats the save at the end of each of its
      turns, ending the effect on a success. On an initial success, it takes no damage and is not Hobbled. This
      saving-throw-only effect cannot be Blocked.
