  traits:
  - name: Sewer Plague
    description: Each time a target takes damage from an arrow they must make a DC 11 Constitution saving throw
      or suffer the effects of Sewer Plague. It takes 1d4 days for sewer plague's symptoms to manifest in an infected
      creature. Symptoms include fatigue and cramps. The infected creature suffers one level of Fatigue and it regains
      only half the normal number of hit points from spending rest dice and no hit points from finishing a long
      rest. At the end of each long rest an infected creature must make a DC 11 Constitution saving throw. On a
      failed save the character gains one level of Fatigue. On a successful save the character's Fatigue level decreases
      by one level. If a successful saving throw reduces the infected creature's level of Fatigue below 1 the creature
      recovers from the disease.
  - name: Tarkir Arrow
    description: The target must succeed on a DC 14 Constitution saving throw or become poisoned. Each day the target
      must succeed on another DC 14 Constitution saving throw or it reduces its hit point maximum by five points
      if the hit point maximum is reduced to zero the target dies and a Marrashi is born from the remains. This
      disease requires magical restoration to cure it.
  actions:
  - name: Longbow
    description: 'Attack +7 to hit; Block DC 15. Reach/range: 600 ft. Unblocked strike: 2d8+2 Piercing.'
