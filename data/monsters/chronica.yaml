      As an action, conjure arcane crystalline ice at a point within the target tile. It immediately spreads to
      cover additional connected tiles equal to 1d4 per casting bonus (min 1.)

      Direfrost is difficult terrain, creatures must make a strength save to not become snared, requiring a strength
      save as an action to break free. Characters that enter or start their turn on direfrost take 1d10 + your casting
      bonus cold damage. The DC and damage increases by 1 per turn spent in direfrost (maximum 10.)

