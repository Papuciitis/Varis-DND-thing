    level: '3'
    current_rule: 'Casting: action.


      Range: 20 feet.


      Duration: special.


      Components: somatic, verbal.


      As an action, cause a creature or object to be dispelled. Make an arcana check against its most prominent
      magical effect. It is calculated as follows: The level of the effect + 10. The DC is further increased by
      1 per half the targets level if it is unwilling to be dispelled, and by 2 per level if the target is an item
      or object. On a success, the magical effect is ended.

      On a failure, continue onwards down the list of effects, ordered by DC from greatest to least.

      Permanent effects or permanent enchantments may only flicker and be disabled for 1d8 turns.'
