  traits:
  - name: Collect Soul
    description: As a bonus action the giant can target one creature it can see within 5 feet of it that has 0 hit
      points and is still alive. The target must succeed on a DC 20 Constitution saving throw against this magic
      or die. If the target dies the giant collects its soul (see Release Soul below). If a creature whose soul
      is collected by the giant is restored to life the giant loses its soul. The giant can only collect thirteen
      souls at one time.
  - name: Death's Sight
    description: Magical darkness doesn't impede the giant's darkvision.
  - name: Innate Spellcasting
    description: The giant's innate spellcasting ability is Charisma (spell save DC 20).
  - name: Fall Undead
    description: Every time when he got's hit by more than 10% of his current HP 1 dead creature falls from his
      body.
