  - name: Greatsword (2x)
    description: 'Attack +15 to hit; Block DC 23. Reach/range: 15 ft.. Unblocked strike: 4d12+8 + 4d6 Slashing +
      necrotic.'
  - name: Death Shard (1x)
    description: 'Attack +12 to hit; Block DC 20. Reach/range: 60/240 ft. Unblocked strike: 4d10 Necrotic.'
  - name: Release Soul
    description: 'Action; expend one collected soul and choose one source benefit. Guide: advantage on attack rolls
      until the end of its next turn. Harm: make one Death Shard attack; an unblocked strike deals an additional
      4d10 necrotic damage and forces a DC 20 Constitution save or Paralyzed until the end of the target''s next
      turn. Heal: regain 8d10 HP. Trap: create one soul stone containing that soul; only one soul stone can exist
      at a time. The current Resurrect spell is the identified existing alternative to the unavailable Wish spell
      for restoring a soul trapped this way; on successful restoration the stone is destroyed. Source benefits,
      dice and durations are retained.'
  - name: Consume Soul (existing alternative)
    description: 'Action; spend one collected soul, or one soul stone held by the giant (destroying the stone as
      specified by the source). Use the existing current Occult Harvest burn-soul option: restore 3d10 HP to yourself
      or one undead within 10 ft. The soul is consumed. This supplies the omitted Consume Soul effect with an identified
      existing rule.'
  - name: Summon Wraith (1/day)
    description: Action; summon one Wraith into an unoccupied space within 60 ft. It acts as an ally and remains
      for 10 minutes, until it dies, or until dismissed by the titan as an action. This complete ability is already
      supplied in the campaign notes.
