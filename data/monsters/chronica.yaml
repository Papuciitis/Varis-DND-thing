    wis: '9'
    cha: '5'
  traits:
  - name: Berserk
    description: At the start of its turn the boar can gain advantage on all melee weapon attack rolls during that
      turn but attack rolls against it have advantage until the start of its next turn.
  - name: Charge
    description: If the boar moves at least 20 feet straight toward a target and then lands an unblocked strike
      against it with a tusk attack on the same turn the target takes an extra 7 (2d6) slashing damage. If the target
      is a creature it must succeed on a DC 14 Strength saving throw or be knocked prone.
  actions:
  - name: Tusks
    description: 'Attack +6 to hit; Block DC 14. Reach/range: 5 ft. Unblocked strike: 2d8+4 + 2d6 slashing + acid.'
  conversion_notes:
