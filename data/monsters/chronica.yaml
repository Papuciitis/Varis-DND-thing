  original_5e:
    description: 'Atropals are stillborn godlings who spontaneously rise as undead. A soul-numbing cold comes before
      and follows after an atropal — the life energy of heroic creatures is suppressed in its foul aura, and the
      life force of lesser creatures is extinguished. An atropal is black with afterbirth, malformed and unfinished,
      and obviously undead. Not even divine intervention can breathe life into this miserable abomination.

      Its wet, wrinkled, and bloated humanoid body is surmounted by a hairless, overlarge head, with glassy, vacant
      eyes. It constantly drools stinking ichor as it mouths obscenities. Its arms are too slender and its tiny
      hands end in cruelly sharpened nails, while its legs are atrophied, dead things that hang uselessly below
      it. An atropal never walks, but always floats.

      When an atropal rises, the gods cringe, and seek to banish the horrid remnant by sealing it away in a separate
      cemetery plane or beneath the crypts of dead civilizations. Woe to the adventuring party or wizard-archeologist
      who untombs an atropal — once released, the atropal kills everything in a wider and wider swath until it is
      somehow neutralized.

      In combat, an atropal sends undead minions and nightcrawlers before it. An atropal is quick to cast dispel
      magic on foes, especially those using spells like death ward to protect themselves from negative energy.'
    notes: 'The atropal can cast the following spells, requiring no material components:

      At will: arcane hand (as a 9th-level spell), cone of cold (as a 9th-level spell), dispel magic (as a 5th-level
      spell), greater invisibility, elemental bane (necrotic; as a 9th-level spell), nondetection (self only), plane
      shift, speak with dead, teleport

      5/day: haste, mislead, weird

      Senses: blindsight 120 ft., darkvision 120 ft., truesight 120 ft., passive Perception 25

      Languages: Abyssal, Celestial, Infernal, Common; telepathy 1000 ft

      LEGENDARY ACTIONS

      The atropal can take 3 legendary actions, choosing from the options below. Only one legendary action option
      can be used at a time and only at the end of another creature''s turn. The atropal regains spent legendary
      actions at the start of its turn.

      Touch. The atropal uses its Withering Touch.

      Death Ray (Costs 2 Actions). The atropal uses its Death Ray.

      Wail (Costs 3 Actions). The atropal lets out a withering wail. Any creature within 120 feet of the atropal
      that can hear the wail must succeed on a DC 22 Constitution saving throw or gain one level of exhaustion.'
