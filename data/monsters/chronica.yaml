        and takes 21 (6d6) acid damage at the start of each of the ooze's turns. When the ooze moves the engulfed
        creature moves with it. An engulfed creature can try to escape by taking an action to make a DC 15 Strength
        check. On a success the creature escapes and enters a space of its choice within 5 feet of the ooze.
