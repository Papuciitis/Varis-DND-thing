  original_5e:
    description: 'Death titans are dastardly giants that are feared as masters of undeath and necromantic lore.
      A death titan is constantly surrounded by wisps of translucent smoke that grow thicker the more souls it has
      gathered. Within the smoke, the tormented faces of those whose souls it has taken can be seen.

      This titan wields the power of death and darkness. He''s huge (about 50 ft/15m tall), muscular, and armed
      with black plate armor (though its open around his ribs and stomach) and a jagged greatsword, ornamented with
      dangling human and not-so-human skulls. His chest cavity is stuffed with various corpses, that slowly fall
      from his exposed rib cage as he moves.. and army of undead that fall from him.'
    notes: 'Senses: darkvision 120 ft, passive Perception 20

      Languages: Common, Giant, Primordial

      The giant can innately cast the following spells, requiring no material components:

      At will: darkness, detect magic, speak with dead (the giant doesn''t need a corpse to speak with a creature
      whose soul it has collected or trapped in a soul stone)

      3/day each: animate dead, blight, circle of death

      1/day: create undead

      Release Soul. If the giant has collected at least one soul, it can expend one soul to gain one of the following
      benefits.

      Guide. The giant gains advantage on each attack roll it makes before the end of its next turn.

      Harm. The giant makes one Death Shard attack. If the attack hits, it deals an additional 22 (4d10) necrotic
      damage and if the target is a creature, it must succeed on a DC 20 Constitution saving throw or be paralyzed
      until the end of its next turn.

      Heal. The giant regains 44 (8d10) hit points.

      Trap. The giant creates a soul stone. A creature whose soul is trapped in a soul stone can''t be restored
      to life by any means short of a wish spell, whereupon the soul stone is destroyed. While the giant is holding
      a soul stone, it can use its Consume Soul without expending one of its collected souls. The soul stone is
      then destroyed. The giant can''t create more than one soul stone at a time.

      Summon Wraith (1/Day). The giant summons a wraith. The summoned wraith appears in an unoccupied space within
      60 feet of its summoner and acts as an ally of the summoner. It remains for 10 minutes, until it dies, or
      until its summoner dismisses it as an action.'
