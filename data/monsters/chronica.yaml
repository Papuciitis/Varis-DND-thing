      * Fire bolt - Make a 30/60 foot spell attack against a target, dealing 1d4 + casting bonus fire damage. The
      attack has disadvantage in its second range increment.

      * Spark - Cause an object or creature within 30 feet to make a constitution save. On a failure, the target
      is set on fire.

      * Extinguish - Cause a burning creature to lose 1 stack of burning, or cause a lit object such as a torch,
      a lantern, or a campfire to extinguish.

      If you have access to a source of fire within 5 ft, such as a torch, lantern, or campfire, then any creature
      that is critically hit by singe or fire bolt is also set on fire.'
