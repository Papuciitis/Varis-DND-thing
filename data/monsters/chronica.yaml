    HP and attack modifiers remain the campaign creature's fixed statistics; no equipment is inferred from AC alone.
  - The six ability fields are numerical scores. Selected existing published scores; all six modifiers match the
    campaign. This does not claim the unrecorded original exact score was recovered. Original modifier-only values
    remain in source_ability_scores and original_5e. Current condition names use data/conditions.yaml; source durations,
    DCs and escape methods remain specific creature rules.
  - Short rest takes one day and long rest takes one week by default. Printed per-day uses remain per-day. Recharge
    X–Y is a d6 roll at the start of the creature's turn.
