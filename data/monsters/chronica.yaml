    level: '6'
    current_rule: 'Casting: 1 full round action.


      Range: special.


      Duration: 1 hour, concentration.


      Components: verbal, somatic, 1d8 HP worth of a spellcasters blood..


      As a full round action, cause a creature to rise as a greater undead, retaining their original stats and abilities
      (as applicable, subject to the GM.) and gain a +2 bonus to all attributes. They have undead fortitude, and
      a +2 bonus to all saves.

      Depending on the state of the body, the target gets additional upgrades:

      * Skeleton -> Skeletal lord - Gains a resistance to all physical damage and immunity to non-magical attacks.
      Gains proficiency with all armor, shields, and weapons.

      * Destroyed remains -> Wraith lord - Gains ethereal movement, immunity to non-magical attacks, and deals an
      extra 2d6 psychic damage with all attacks.

      * Rotting corpse -> Plague lord - Is healed by poison damage, deals 1d6 poison damage to adjacent creatures
      at the start of their turn and when entering melee range.

      * Frozen remains -> Draugr lord - Has advantage on saves vs spells, is immune to cold damage, and deals an
      extra 1d6 cold damage with their attacks.

      * Broken remains -> Ghoul knight - Gains proficiency with a weapon group of choice and all armors and shields.
      Gains an extra feat.

      * Fresh corpse -> Death knight - Gains a +1d20 max HP. Gains proficiency with all weapons and armors. Gains
      +1 maximum rest dice.

      * Burned ash or charred corpse -> Flame wraith - Gains fire immunity and immunity to non-magical attacks.
      Gains a +10 bonus to movement speed and deals 1d6 fire damage extra with all its attacks. The fire damage
      dealt ignores resistance.

      * Hanged corpse -> Gallows knight - Gains +3 block at the start of combat. Gains proficiency with all shields
      and weapons.

      * Crucified, Skewered, staked, or speared corpse -> Penitent ghoul - Has +2 max rest dice. Can spend 1 rest
      die to grant it to an ally or other undead.

      * Headless corpse -> Aspect ghoul - Choose an element. A spark of it occupies the targets head, granting it
      true sight at a range of 80 ft. Spells the target casts that deal the chosen kind of elemental damage, or
      are associated with that element have their level increased by 1.'
