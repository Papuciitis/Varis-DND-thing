  original_5e:
    description: 'A much stronger relative of the wight, native to the Shadowfell. Nightshade zombies look much
      like ordinary, Material Plane-native zombies, but are easily distinguishable from their lesser cousins by
      the fell aura emanating from them, visible to the naked eye as purple-black smoke curling around the corpse.

      One would be remiss to treat nightshades as flippantly as ordinary zombies. Nightshades lack the shambling
      gait of ordinary zombies; they are capable of incredible bursts of speed which close large distances quickly.
      Their touch can drain your very life force, and when you''re nothing more than a withered husk, your corpse
      is infused with energy from the Shadowfell, and you join their ranks. As if that weren''t enough, these creatures''
      shadow magic protects them from injury, and they spread deadly diseases which can debilitate their victims
      for days on end if they even survive an encounter with a nightshade. Worst of all: they''re as intelligent
      as humans, and can plan and strategize. One has to wonder how the world has not yet been overrun by these
      monstrosities.'
