  original_5e:
    description: 'The black orcs are among the strongest, biggest and most disciplined breeds of orcs, and get their
      name from their dark green skin and their tendency of wearing black or dark grey heavy armour. They are taller
      and stronger than the common orcs and pride themselves at being better fighters than the average orc or goblinoid
      creature.

      Super Soldier Orcs. The origins of the black orcs are shrouded in mystery, but there are rumors they were
      created by the duergar, the grey dwarves of the Underdark, perhaps to serve as better slaves or warriors.
      Certainly, the black orcs'' sturdy constitution would allow them to prosper in the harsh enviroment of the
      Underdark where other orcish workers would perish. They first appeared on the surface as a whole tribe escaped
      from the Underdark and conquered other orcs living on the surface world.

      Orcish disciplinarians. Black orcs regard other orcs and goblinoids with contempt, especially the small goblins,
      who are always running away instead of standing and fighting. In battle, black orcs keep a constant eye out
      for bickering in the ranks, and it takes little more than a dark scowl or a throaty growl from a single black
      orc to bring the other orcs into line. Should that fail, black orcs are perfectly willing, and exceptionally
      able, to wade in and smash some heads together, thus restoring order at the insignificant cost of the lives
      of the wrongdoers.'
