    current_rule: 'Casting: action or reaction.


      Range: 10 ft.


      Duration: 1 hour.


      Components: Verbal, 1 fatigue.


      As an action or reaction, manifest spectral wings and gain the ability to make a dash up to 60 ft + 5 ft per
      casting modifier bonus, or ignore or redirect a fall. You can choose to target the tile next to a creature
      within range and make an attack either with a weapon or innate attack you can use. This attack gains advantage
      to hit, deals an extra 1d10 force damage, and has its critical strike range increased by 1.

      The dash does not need to be a straight line, as the wings offer excellent maneuverability.

      When casting this spell, roll a 1d4 chance dice. On a 3 or higher, the spell slots/levels/resources used to
      cast this spell are not consumed.'
