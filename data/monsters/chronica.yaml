      the duration, the creature is in stasis and cannot take or deal damage, cannot be harmed, and cannot teleport
      or be subject to teleport effect, but can attempt to remake the save as an action, breaking 1 chain on a success.

      Other creatures can also attempt to break or dispel the chains.'
