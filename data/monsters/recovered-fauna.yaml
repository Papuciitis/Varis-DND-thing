          cannot be Blocked. The patch remains difficult terrain for 1 minute; creating another patch ends the
          previous one.
      -
        name: "Shape earth"
        description: >-
          As an action, move or shape up to a 5-ft. cube of loose earth within 30 ft. Cannot move creatures,
          cause damage, or undermine a structure. It remains until disturbed.
