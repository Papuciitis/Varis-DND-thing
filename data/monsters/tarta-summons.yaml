- name: Awakened Earth
  group: Tarta Homebrewery - Summons
  id: homebrewery-awakened-earth
  meta: Colossal elemental, unaligned
  size: Colossal
  type: elemental
  alignment: unaligned
  cr: '5'
  ac: 15 (natural armor)
  hp: '75'
  speed: 0 ft.; burrow 30 ft. within its anchored area only
  abilities:
    str: '20'
    dex: '8'
    con: '15'
    int: '3'
    wis: '10'
    cha: '1'
  traits:
  - name: Optional controlled companion
    description: When an existing effect or the GM assigns it a controller, that effect or the GM sets its
      duration, active limit and command rules. If command timing is not supplied, it shares the controller's
      initiative, acts immediately afterward and receives a free verbal command on the controller's turn. Without
      a command it takes Dodge if able and avoids obvious hazards. Without an assigned controller, it acts
      independently on its own turn. Its listed restrictions still apply. Instructions grant no extra action,
      bonus action or reaction. This statblock grants no ability to create or summon it.
  - name: False Appearance
    description: While the awakened earth remains motionless, it is indistinguishable from an ordinary, inanimate
      area of ground.
  - name: Anchored ground
    description: Occupies a 50-foot-radius area chosen by the GM when placed. It cannot leave or translate
      that area. Burrowing manipulates ground inside this same boundary; it does not move the entire area or
      grant reach beyond it.
  - name: Controller-linked vitality (optional)
    description: If an existing effect or the GM uses the source controller-linked variant, add its assigned
      controller's spellcasting ability modifier to maximum and initial HP (minimum total 1). Otherwise use
      the printed 75 HP.
  actions:
  - name: Multi-Assault
    description: Once as its action, make one Slam attack against each chosen creature standing on its anchored
      ground. Resolve a separate attack roll and Block for each target. This replaces the one-target Slam action;
      it does not grant an additional action.
  - name: Slam
    description: 'Melee attack +8; reach 5 ft. from a point of its anchored ground; one target; Block DC 16.
      Unblocked strike: 4d10 bludgeoning damage.'
  - name: Break control
    description: While controlled, make a Strength check against its controller's spell save DC, or a control
      DC assigned by the GM if the controller has none. On a success, end the controller's control; the animated
      area remains anchored for any duration already set by an existing effect or the GM. It may choose this
      action independently instead of following an order or Dodging; the controller cannot prevent the attempt
      with a command. The GM decides whether the elemental attempts it. This action is unavailable when it
      is already independent.
  source_ref: draft2.pdf / PDF page 60
  original_5e:
    name: Awakened Earth
    page: 60
    meta: Colossal elemental, unaligned
    ac: 15 (natural armor)
    hp: 75 (10d12 + 20 + spellcasting modifier)
    speed: 0 ft., burrow 30 ft.
    abilities:
      str: '20'
      dex: '8'
      con: '15'
      int: '3'
      wis: '10'
      cha: '1'
    damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
    damage_immunities: poison
    condition_immunities: exhaustion, paralyzed, petrified, poisoned, unconscious
    senses: tremorsense 60 ft., passive Perception 10
    languages: understands the languages of its creator but cannot speak
    cr: '5'
    xp: 1,800
    traits:
    - name: False Appearance
      description: While the awakened earth remains motionless, it is indistinguishable from an ordinary, inanimate
        area of ground.
    - name: Multi-Assault
      description: Once per turn, creature can attack all creatures who is standing on Awakened Earth with
        Slam attack.
    actions:
    - name: Slam
      description: 'Melee Weapon Attack: +8 to hit, reach 5 ft., one target. Hit: 4d10 bludgeoning damage.'
    notes: The awakened earth is stationary and cannot move from the spot it was summoned. It can, however,
      burrow and manipulate the ground within its reach. It follows the commands of the spellcaster who awakened
      it.
  conversion_notes:
  - Converted from the user's Homebrewery export draft2.pdf. Original stat fields and ability text are preserved
    below. Numerical source HP, AC, attack bonuses and damage expressions remain fixed monster values unless
    explicitly controller-scaled.
  - Use the current Dexterity-derived Block pool and check. Natural armor grants no equipment training or extra
    Block. Ordinary attack Block DC is attack bonus plus 8. Damage and on-strike riders require an unblocked
    strike; saving-throw-only and automatic effects cannot be Blocked.
  - Published as a separate optional monster, not a new spell or class feature. Original creation text is archived
    only as source context. When used as a controlled companion, an existing effect or the GM supplies its
    duration, active limit and control rules; this statblock grants no casting or creation ability. Independent
    creatures act normally.
  - 'Source stationary language wins over unrestricted travel: burrow 30 ft. works only inside the original
    anchored 50-foot-radius footprint.'
  - Use the printed 75 HP independently. The optional controller-linked variant adds an assigned controller's
    spellcasting ability modifier once (minimum total 1); the source dice expression is archived. Multi-Assault
    uses one action and one separate attack per selected target standing on the area.
  - The source creation text permits a Strength check to break control. Retained as an action only when a controller
    is assigned, using its spell save DC or an explicit GM-assigned control DC. This grants no extra attack
    and sets no duration.
  block: 0 pool / -1 check
  damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
  damage_immunities: poison
  senses: tremorsense 60 ft., passive Perception 10
