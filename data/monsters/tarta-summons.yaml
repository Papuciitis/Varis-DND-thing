  xp: 5,900
  condition_immunities: Fatigue; Paralyzed; Petrified; Poisoned; Unconscious
- name: Resilient Plant
  group: Tarta Homebrewery - Summons
  id: homebrewery-resilient-plant
  meta: Huge plant, unaligned
  size: Huge
  type: plant
  alignment: unaligned
  cr: '0'
  ac: 20 (natural armor)
  hp: '200'
  speed: 0 ft.
  abilities:
    str: '1'
    dex: '1'
    con: '22'
    int: '1'
    wis: '3'
    cha: '1'
  traits:
  - name: Optional controlled companion
    description: When an existing effect or the GM assigns it a controller, that effect or the GM sets its
      duration, active limit and command rules. If command timing is not supplied, it shares the controller's
      initiative, acts immediately afterward and receives a free verbal command on the controller's turn. Without
      a command it takes Dodge if able and avoids obvious hazards. Without an assigned controller, it acts
      independently on its own turn. Its listed restrictions still apply. Instructions grant no extra action,
      bonus action or reaction. This statblock grants no ability to create or summon it.
  - name: False Appearance
    description: While the resilient plant remains motionless, it is indistinguishable from an ordinary, inanimate
      plant.
  - name: Regeneration
    description: The resilient plant regains 10 hit points at the start of its turn if it has at least 1 hit
      point.
  - name: Rooted barrier
    description: It cannot move, take actions, bonus actions or reactions. It provides cover and blocks passage
      according to its occupied space; it makes no attacks. It still has a turn for Regeneration.
  - name: Controller-linked vitality (optional)
    description: If an existing effect or the GM uses the source controller-linked variant, add its assigned
      controller's spellcasting ability modifier to maximum and initial HP (minimum total 1). Otherwise use
      the printed 200 HP.
  actions:
  - name: None
    description: Cannot take actions. This is a stationary created plant, not a combat attacker.
  source_ref: draft2.pdf / PDF page 59
