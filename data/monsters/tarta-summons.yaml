section: monsters
entries:
- name: Earth Elemental Servant
  group: Tarta Homebrewery - Summons
  id: homebrewery-earth-elemental-servant
  meta: Large elemental, neutral
  size: Large
  type: elemental
  alignment: neutral
  cr: '10'
  ac: 17 (natural armor)
  hp: 126 (12d10 + 60)
  speed: 30 ft., burrow 30 ft.
  abilities:
    str: '20'
    dex: '8'
    con: '20'
    int: '5'
    wis: '10'
    cha: '5'
  traits:
  - name: Optional controlled companion
    description: When an existing effect or the GM assigns it a controller, that effect or the GM sets its
      duration, active limit and command rules. If command timing is not supplied, it shares the controller's
      initiative, acts immediately afterward and receives a free verbal command on the controller's turn. Without
      a command it takes Dodge if able and avoids obvious hazards. Without an assigned controller, it acts
      independently on its own turn. Its listed restrictions still apply. Instructions grant no extra action,
      bonus action or reaction. This statblock grants no ability to create or summon it.
  - name: Earth Glide
    description: The elemental can burrow through nonmagical, unworked earth and stone. While doing so, it
      does not disturb the material it moves through.
  - name: Siege Monster
    description: The elemental deals double damage to objects and structures.
  actions:
  - name: Multiattack
    description: Make two Slam attacks. Each is a separate blockable attack.
  - name: Slam
    description: 'Melee attack +8; reach 10 ft.; one target; Block DC 16. Unblocked strike: 14 (2d8 + 5) bludgeoning
      damage.'
  - name: Unstoppable Force (Recharge 5-6)
    description: Move up to 30 feet in a straight line, passing through creatures without ending in an occupied
      space. Each creature in the path makes a DC 16 Dexterity save, taking 28 (8d6) bludgeoning damage and
      falling Prone on a failure, or half damage without falling Prone on a success. Then make one Slam against
      a Prone creature within reach. The area save cannot be Blocked; the follow-up Slam can be Blocked normally.
      After use, roll a d6 at the start of each of its turns, recharging on 5-6.
  source_ref: draft2.pdf / PDF page 8
  original_5e:
    name: Earth Elemental Servant
    page: 8
    meta: Large elemental, neutral
    ac: 17 (natural armor)
    hp: 126 (12d10 + 60)
    speed: 30 ft., burrow 30 ft.
    abilities:
      str: '20'
      dex: '8'
      con: '20'
      int: '5'
      wis: '10'
      cha: '5'
    damage_vulnerabilities: thunder
    damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
    damage_immunities: poison
    condition_immunities: exhaustion, paralyzed, petrified, poisoned, unconscious
    senses: darkvision 60 ft., tremorsense 60 ft., passive Perception 10
    languages: Terran
    cr: '10'
    xp: 5,900
    traits:
    - name: Earth Glide
      description: The elemental can burrow through nonmagical, unworked earth and stone. While doing so, it
        does not disturb the material it moves through.
    - name: Siege Monster
      description: The elemental deals double damage to objects and structures.
    actions:
    - name: Multiattack
      description: The elemental makes two slam attacks.
    - name: Slam
      description: 'Melee Weapon Attack: +8 to hit, reach 10 ft., one target. Hit: 14 (2d8 + 5) bludgeoning
        damage.'
    - name: Unstoppable Force (Recharge 5-6)
      description: The elemental charges up to 30 feet in a straight line and can move through creatures in
        its path. Each creature in the elemental's path must make a DC 16 Dexterity saving throw. On a failed
        save, a creature takes 28 (8d6) bludgeoning damage and is knocked prone. On a successful save, a creature
        takes half as much damage and is not knocked prone. The elemental can then make one slam attack against
        a prone creature.
    parent_feature: 'Master of the Land, Artificer Geomorphy Specialist level 15: action, expend a spell slot
      of level 3 or higher, summon within 60 ft.; friendly and obeys commands; remains 1 hour, until 0 HP or
      dismissed as an action; once per long rest.'
  conversion_notes:
  - Converted from the user's Homebrewery export draft2.pdf. Original stat fields and ability text are preserved
    below. Numerical source HP, AC, attack bonuses and damage expressions remain fixed monster values unless
    explicitly controller-scaled.
  - Use the current Dexterity-derived Block pool and check. Natural armor grants no equipment training or extra
    Block. Ordinary attack Block DC is attack bonus plus 8. Damage and on-strike riders require an unblocked
    strike; saving-throw-only and automatic effects cannot be Blocked.
  - Published as a separate optional monster, not a new spell or class feature. Original creation text is archived
    only as source context. When used as a controlled companion, an existing effect or the GM supplies its
    duration, active limit and control rules; this statblock grants no casting or creation ability. Independent
    creatures act normally.
  - The final Slam of Unstoppable Force must still be within reach. Recharge 5-6 means a d6 at the start of
    each turn while expended. Source exhaustion immunity is presented as current Fatigue immunity. Source CR
    10 is retained rather than recalculated.
