  conversion_notes:
  - Converted from the user's Homebrewery export draft2.pdf. Original stat fields and ability text are preserved
    below. Numerical source HP, AC, attack bonuses and damage expressions remain fixed monster values unless
    explicitly controller-scaled.
  - Use the current Dexterity-derived Block pool and check. Natural armor grants no equipment training or extra
    Block. Ordinary attack Block DC is attack bonus plus 8. Damage and on-strike riders require an unblocked
    strike; saving-throw-only and automatic effects cannot be Blocked.
  - Published as a separate optional monster, not a new spell or class feature. Original creation text is archived
    only as source context. When used as a controlled companion, an existing effect or the GM supplies its
    duration, active limit and control rules; this statblock grants no casting or creation ability. Independent
    creatures act normally.
  - The source printed 200 HP and also added an undefined spellcasting modifier in its dice expression. Use
    200 HP independently; the optional controller-linked variant adds an assigned controller's spellcasting
    modifier once (minimum total 1). The inconsistent original dice expression is archived, not used to reroll
    HP.
  - The stationary/actionless restriction takes precedence over optional companion command timing. Cover and
