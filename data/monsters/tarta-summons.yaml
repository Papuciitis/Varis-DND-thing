- name: Geochemical Golem
  group: Tarta Homebrewery - Summons
  id: homebrewery-geochemical-golem
  meta: Large elemental, unaligned
  size: Large
  type: elemental
  alignment: unaligned
  cr: '5'
  ac: 16 (natural armor)
  hp: '80'
  speed: 30 ft., burrow 30 ft.
  abilities:
    str: '18'
    dex: '10'
    con: '16'
    int: '6'
    wis: '10'
    cha: '5'
  traits:
  - name: Optional controlled companion
    description: When an existing effect or the GM assigns it a controller, that effect or the GM sets its
      duration, active limit and command rules. If command timing is not supplied, it shares the controller's
      initiative, acts immediately afterward and receives a free verbal command on the controller's turn. Without
      a command it takes Dodge if able and avoids obvious hazards. Without an assigned controller, it acts
      independently on its own turn. Its listed restrictions still apply. Instructions grant no extra action,
      bonus action or reaction. This statblock grants no ability to create or summon it.
  - name: Elemental Infusion
    description: The golem can be configured with specific elemental properties, granting additional abilities
      such as leaving a trail of difficult terrain, emitting a noxious cloud, or radiating intense heat. Apply
      only the selected material options; an unconfigured golem has none of these infusions.
  - name: Earth Glide
    description: The golem can burrow through nonmagical, unworked earth and stone without disturbing the material
      it moves through.
  actions:
  - name: Slam
    description: 'Melee attack +7; reach 5 ft.; one target; Block DC 15. Unblocked strike: 2d8 + 4 bludgeoning
      damage, plus only the damage increases granted by its selected materials.'
  - name: Geochemical Blast
    description: 'Ranged spell attack +6; range 60 ft.; one target; Block DC 14. Unblocked strike: 3d6 acid
      or fire damage (choose when attacking), plus any selected-material rider. Material riders attached to
      this attack require an unblocked strike.'
  source_ref: draft2.pdf / PDF page 61
  original_5e:
    name: Geochemical Golem
    page: 61
    meta: Large elemental, unaligned
    ac: 16 (natural armor)
    hp: 80 (10d10 + 30)
    speed: 30 ft.
    abilities:
      str: '18'
      dex: '10'
      con: '16'
      int: '6'
      wis: '10'
      cha: '5'
    damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
    damage_immunities: poison
    condition_immunities: exhaustion, paralyzed, petrified, poisoned
    senses: darkvision 60 ft., passive Perception 10
    languages: understands the languages of its creator but cannot speak
    cr: '5'
    xp: 1,800
    traits:
    - name: Elemental Infusion
      description: The golem can be imbued with specific elemental properties, granting additional abilities
        such as leaving a trail of difficult terrain, emitting a noxious cloud, or radiating intense heat.
        The specific abilities are determined by the rare earth elements used in the casting.
    - name: Earth Glide
      description: The golem can burrow through nonmagical, unworked earth and stone without disturbing the
        material it moves through.
    actions:
    - name: Slam
      description: 'Melee Weapon Attack: +7 to hit, reach 5 ft., one target. Hit: 2d8 + 4 bludgeoning damage.'
    - name: Geochemical Blast
      description: 'Ranged Spell Attack: +6 to hit, range 60 ft., one target. Hit: 3d6 acid or fire damage.'
  conversion_notes:
  - Converted from the user's Homebrewery export draft2.pdf. Original stat fields and ability text are preserved
    below. Numerical source HP, AC, attack bonuses and damage expressions remain fixed monster values unless
    explicitly controller-scaled.
  - Use the current Dexterity-derived Block pool and check. Natural armor grants no equipment training or extra
    Block. Ordinary attack Block DC is attack bonus plus 8. Damage and on-strike riders require an unblocked
    strike; saving-throw-only and automatic effects cannot be Blocked.
  - Published as a separate optional monster, not a new spell or class feature. Original creation text is archived
    only as source context. When used as a controlled companion, an existing effect or the GM supplies its
    duration, active limit and control rules; this statblock grants no casting or creation ability. Independent
    creatures act normally.
  - Earth Glide is given burrow 30 ft. to match its printed walking speed; the source omitted a burrow number.
  - Apply only the materials chosen for this optional monster configuration. Its twelve material options retain
    source prices and combination limits as a component estimate, not a published player spell or automatic
    crafting rule. Infusions modify this one base creature; they do not create additional creatures or actions.
  - Natural Block remains the base Dexterity value even when a material raises AC. Material increases to melee
    attack bonus also raise that attack's Block DC by the same amount.
  block: 0 pool / +0 check
  damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
  damage_immunities: poison
  senses: darkvision 60 ft., passive Perception 10
  languages: understands the languages of its creator but cannot speak
  xp: 1,800
  condition_immunities: Fatigue; Paralyzed; Petrified; Poisoned
  material_options:
  - name: Neodrakite
    group: Tarta Homebrewery - Materials
    cost_gp: 300
    effect: As an action, the golem creates a magnetic pulse affecting metallic objects within 10 feet. It
      may move unattended metal objects up to 10 feet toward or away from itself. A creature holding a targeted
      metal item makes a DC 14 Strength save; on failure, it drops one such item in its space. The pulse does
      not move or damage the creature. This saving-throw-only effect cannot be Blocked. Only loose handheld
      objects weighing at most 50 pounds each may be moved; anchored objects, structures and worn armor are
      unaffected. A held weapon uses the printed disarm save.
  - name: Cerithal Stone
    group: Tarta Homebrewery - Materials
    cost_gp: 200
    effect: Each ground space the golem leaves while moving becomes difficult terrain until the start of its
      next turn. The trail occupies the spaces the golem occupied; overlapping trail spaces do not multiply
      movement costs. It affects creatures on the ground, not flying creatures.
  - name: Lanthara Crystal
    group: Tarta Homebrewery - Materials
    cost_gp: 400
    effect: Increase the golem's Armor Class by 2 while this infusion is present. The ordinary Geochemical
      Golem AC 16 becomes AC 18. This does not add Block, armor training or damage reduction.
  - name: Samarkium Ore
    group: Tarta Homebrewery - Materials
    cost_gp: 250
    effect: At the start of the golem's turn, each other creature within 5 feet takes 1d6 poison damage. This
      automatic cloud affects allies as well as enemies, permits no save, does not itself apply Poisoned, and
      cannot be Blocked.
  - name: Euralite Gem
    group: Tarta Homebrewery - Materials
    cost_gp: 150
    effect: The golem sheds bright light in a 20-foot radius and dim light for another 20 feet. It causes no
      damage.
  - name: Gadolix Shard
    group: Tarta Homebrewery - Materials
    cost_gp: 350
    effect: Each unblocked Slam strike by the golem deals an additional 1d8 fire damage. The fire is part of
      the blockable attack, so a successful Block negates this rider with the Slam.
  - name: Ytriun Metal
    group: Tarta Homebrewery - Materials
    cost_gp: 300
    effect: At the start of the golem's turn, each other creature within 5 feet takes 1d6 fire damage. This
      automatic heat affects allies and enemies, permits no save, and cannot be Blocked.
  - name: Erbion Essence
    group: Tarta Homebrewery - Materials
    cost_gp: 450
    effect: As an action once on its turn, the golem touches itself or an ally and restores 1d8 HP to that
      creature, up to its maximum HP. It cannot use this action more than once during the same turn.
  - name: Thulmara Dust
    group: Tarta Homebrewery - Materials
    cost_gp: 200
    effect: At the start of the golem's turn, enemies within 10 feet have their movement speeds reduced by
      10 feet, to a minimum of 0, until the start of the golem's next turn. This speed reduction does not stack
      with itself. It is not the old slow spell and does not grant a saving throw or a separate condition.
  - name: Holmara Rock
    group: Tarta Homebrewery - Materials
    cost_gp: 400
    effect: Add +2 to the golem's melee attack rolls and melee damage rolls. Its ordinary Slam becomes +9 to
      hit, Block DC 17, and 2d8 + 6 bludgeoning damage. This does not improve ranged attacks, saving-throw
      DCs, Armor Class or Block checks.
  - name: Dyspraxium Salt
    group: Tarta Homebrewery - Materials
    cost_gp: 350
    effect: As a bonus action once on its turn, the golem becomes incorporeal until the end of that turn. During
      its movement, it may pass through creatures and objects as difficult terrain. It must finish in an unoccupied
      space outside solid matter. If it ends inside solid matter, it takes 5 force damage that cannot be Blocked
      and moves to the nearest unoccupied space outside that matter. This does not otherwise grant damage resistance
      or immunity.
  - name: Terbithal Resin
    group: Tarta Homebrewery - Materials
    cost_gp: 300
    effect: After an unblocked Geochemical Blast strike, its target makes a DC 14 Constitution save. On failure,
      the target is Blinded until the end of its next turn; on success, it is not Blinded. The Blast's ordinary
      damage is unchanged. A successful Block against the Blast prevents both its damage and this rider.
  material_rules: Base statistics below have no infusions. When configuring or creating a golem, choose one
    to four distinct materials. The optional source component estimate is at least 1,000 gp or the material
    subtotal, whichever is greater, plus 400 gp for a third material and a further 2,000 gp for a fourth. This
    estimate grants no crafting or spellcasting ability; an existing effect or the GM determines how a golem
    can be obtained. Only selected effects apply; the same material never stacks with itself. The configuration
    panel previews these optional changes.
- name: Stone Servant
  group: Tarta Homebrewery - Summons
  id: homebrewery-stone-servant
  meta: Large construct, unaligned
  size: Large
  type: construct
  alignment: unaligned
  cr: '4'
  ac: 15 (natural armor)
  hp: '86'
  speed: 30 ft.
  abilities:
    str: '15'
    dex: '13'
    con: '16'
    int: '3'
    wis: '13'
    cha: '1'
  traits:
  - name: Optional controlled companion
    description: When an existing effect or the GM assigns it a controller, that effect or the GM sets its
      duration, active limit and command rules. If command timing is not supplied, it shares the controller's
      initiative, acts immediately afterward and receives a free verbal command on the controller's turn. Without
      a command it takes Dodge if able and avoids obvious hazards. Without an assigned controller, it acts
      independently on its own turn. Its listed restrictions still apply. Instructions grant no extra action,
      bonus action or reaction. This statblock grants no ability to create or summon it.
  - name: Immutable Form
    description: The golem is immune to any spell or effect that would alter its form.
  - name: Magic Resistance
    description: The golem has advantage on saving throws against spells and other magical effects.
  - name: Noncombat servant
    description: Cannot make attacks, opportunity attacks, cast spells or activate offensive magic items. It
      can carry, clean, mend, build, break unattended objects, dig or defend without attacking. When used as
      a controlled companion, it stops and does nothing beyond 60 feet from its controller until within 60
      feet again. An independent servant has no controller-distance restriction.
  actions:
  - name: Work or Help
    description: Perform one mundane task or take the current Help action on a nonattack task within reach.
      Work obeys normal ability checks, object durability and tool requirements; it grants no automatic success.
  - name: Guard
    description: Take Dodge, or position its body as cover for another creature using normal cover rules. Guard
      does not make an attack or automatically redirect damage.
  source_ref: draft2.pdf / PDF page 63
  original_5e:
    name: Stone Servant
    page: 63
    meta: Large construct, unaligned
