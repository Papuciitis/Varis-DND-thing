      the model creature's existing supply, recorded as the Controller profile. It creates no extra items,
      ammunition, slots, charges or class-feature uses. Costs cannot be paid if that shared resource is unavailable.
      Its spell actions use that creature's current spell attack and save DC. Concentration belongs to that
      same creature; the duplicate gains no independent concentration capacity. If that creature is already
      maintaining concentration, the duplicate cannot cast a spell that requires concentration without ending
      it normally. Block points are shared with that creature, not copied into a second pool.
  - name: Bound duplicate
    description: Cannot move farther than 30 feet from its assigned controller, or its model creature if independent;
      if forced beyond that distance, it disappears. It ends at 0 HP, at the end of any duration set by an
      existing effect or the GM, or when its controller dismisses it as an action. Use one duplicate per model
      creature by default; a replacement ends the previous duplicate. It cannot create another duplicate or
      summon through a copied action.
  - name: Challenge and chosen models
    description: The listed CR applies to the default body. If a different model is selected, use that model's
