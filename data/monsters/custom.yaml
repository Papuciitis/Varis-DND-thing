  entry:
    name: Camelfolk Pyromancer
    group: 'Chronica · Mercenary group #1 - The Shieldwrights'
    id: chronica-15893
    meta: Humanoid/Beast
    ac: '10'
    hp: '48'
    speed: '25'
    abilities:
      str: '12'
      dex: '8'
      con: '14'
      int: '12'
      wis: '12'
      cha: '16'
    traits:
    - name: Food storage
      description: Can survive 14 days without food and 7 days without water before deprivation applies.
    - name: Control Flames
      description: 'Existing Vara alternative: minor pyromancy (Arcane cantrips).


        Casting: action.


        Range: 30 ft.


        Duration: 1 minute.


        Components: somatic, verbal.


        As an action, produce one of the following effects:

        * Singe - make a melee spell attack against a target, dealing 1d4 + casting bonus fire damage

        * Fire bolt - Make a 30/60 foot spell attack against a target, dealing 1d4 + casting bonus fire damage.
        The attack has disadvantage in its second range increment.

        * Spark - Cause an object or creature within 30 feet to make a constitution save. On a failure, the target
        is set on fire.

        * Extinguish - Cause a burning creature to lose 1 stack of burning, or cause a lit object such as a torch,
        a lantern, or a campfire to extinguish.

        If you have access to a source of fire within 5 ft, such as a torch, lantern, or campfire, then any creature
        that is critically hit by singe or fire bolt is also set on fire.


        Monster spell attack +6; ordinary Block DC 14. Monster spell save DC 14. Use the printed monster casting-ability
        modifier. Ordinary attack damage and riders require an unblocked strike; the spell''s explicit exceptions
        take priority (including unblockable Harm damage and Acid bolt''s on-hit ongoing acid). Saving-throw-only
        effects cannot be Blocked. A printed (Nx) is a source use limit, not extra castings in one action.'
    - name: Heart of Fire
      description: A creature touching the pyromancer, or landing an unblocked melee strike against it while within
        5 ft., takes 5 (1d10) fire damage. This contact damage has no separate attack roll.
    - name: Fire in the Veins
      description: you gain resistance to fire damage. In addition spells you cast ignore resistance to fire damage.
    - name: Twinned Spell
      description: When casting a spell that targets one creature, spend 3 MP to target one additional creature
        within the spell's range. Reduce the cost by 1 for an Enchantment spell.
    - name: Flash Recall
      description: When casting a known spell, spend 2 MP to cast it as a bonus action instead of an action. Reduce
        the cost by 1 for a Divination spell. Shares the same Metamagic pool.
    actions:
    - name: Battleaxe
      description: 'Attack +4 to hit; Block DC 12. Reach/range: 5 ft. Unblocked strike: 1d8+1 (1d10+1) Slashing.'
    - name: Fire Bolt
      description: 'Existing Vara alternative: minor pyromancy (Arcane cantrips).


        Casting: action.


        Range: 30 ft.


        Duration: 1 minute.


        Components: somatic, verbal.


        As an action, produce one of the following effects:

        * Singe - make a melee spell attack against a target, dealing 1d4 + casting bonus fire damage

        * Fire bolt - Make a 30/60 foot spell attack against a target, dealing 1d4 + casting bonus fire damage.
        The attack has disadvantage in its second range increment.

        * Spark - Cause an object or creature within 30 feet to make a constitution save. On a failure, the target
        is set on fire.

        * Extinguish - Cause a burning creature to lose 1 stack of burning, or cause a lit object such as a torch,
        a lantern, or a campfire to extinguish.

        If you have access to a source of fire within 5 ft, such as a torch, lantern, or campfire, then any creature
        that is critically hit by singe or fire bolt is also set on fire.


        Monster spell attack +6; ordinary Block DC 14. Monster spell save DC 14. Use the printed monster casting-ability
        modifier. Ordinary attack damage and riders require an unblocked strike; the spell''s explicit exceptions
        take priority (including unblockable Harm damage and Acid bolt''s on-hit ongoing acid). Saving-throw-only
        effects cannot be Blocked. A printed (Nx) is a source use limit, not extra castings in one action.'
    - name: Burning Hands (4x)
      description: 'Existing Vara alternative: Cone of fire (Arcane spells).


        Casting: 1 action.


        Range: 15 ft cone.


        Components: verbal, somatic.


        As an action, conjure an arcane gesture with one or both hands to manifest a cone of fire from it at a range
        of 15 ft, dealing 2d6 damage to all creatures caught in the flames. Creatures hit must make a dexterity
        save to halve the damage. Creatures that fail this save are set on fire.

        If both hands are used (free) during the casting of this spell, the damage is increased by 1d6 and the range
        is increased by 5 feet.


        Monster spell attack +6; ordinary Block DC 14. Monster spell save DC 14. Use the printed monster casting-ability
        modifier. Ordinary attack damage and riders require an unblocked strike; the spell''s explicit exceptions
        take priority (including unblockable Harm damage and Acid bolt''s on-hit ongoing acid). Saving-throw-only
        effects cannot be Blocked. A printed (Nx) is a source use limit, not extra castings in one action.'
    - name: Flaming Sphere (4x)
      description: 'Existing Vara alternative: Fire flask (Occult spells).


        Casting: 1 action.


        Range: 40 feet.


        Duration: concentration.


        Components: Somatic, material(1 flask of oil).


        Throw an enchanted flask of oil at a 10-foot square within 40 feet. Each creature in the square or within
        5 feet of it makes a Dexterity save. On a failure, it takes 2d8 + casting bonus fire damage. On a success,
        it takes half.

        Creatures in the square have disadvantage on this save and must also make a Constitution save. On a failed
        Constitution save, they gain Burning. The enchanted oil sets the ongoing damage from this spell to 1d6 fire
        damage at the start of each affected creature’s turn.


        Monster spell attack +6; ordinary Block DC 14. Monster spell save DC 14. Use the printed monster casting-ability
        modifier. Ordinary attack damage and riders require an unblocked strike; the spell''s explicit exceptions
        take priority (including unblockable Harm damage and Acid bolt''s on-hit ongoing acid). Saving-throw-only
        effects cannot be Blocked. A printed (Nx) is a source use limit, not extra castings in one action.'
