    - 'The six ability fields are numerical scores. User-authorized reconstruction: choose the lower valid score
      for each recorded modifier (minimum 1). These are playable replacements, not claims about unrecorded original
      scores. Original modifier-only values remain in source_ability_scores and original_5e. Current condition names
      use data/conditions.yaml; source durations, DCs and escape methods remain specific creature rules.'
    - Short rest takes one day and long rest takes one week by default. Printed per-day uses remain per-day. Recharge
      X–Y is a d6 roll at the start of the creature's turn.
    - Papaya's unrecorded sorcerer level cannot supply Heart of Fire damage. The existing Azer Heated Body trait
      supplies a complete fire-themed alternative. Her current Metamagic options use the printed current class formula
      and share one six-point pool. Food storage uses the published Camel Constitution 14 as an explicit capacity
