    original_5e:
      description: 'A nightcrawler is a gargantuan behemoth which is a Shadowfell-native relative of the purple
        worm, and is utterly black in color.

        Nightcrawlers resembled purple worms, but were covered in solid black, chitinous armor. Even the teeth
        and the inside of the mouth were black. They were approximately 100 feet (30 meters) long and weighed
        55,000 pounds (25,000 kilograms).'
      notes: 'The nightcrawler can cast the following spells, requiring no material components:

        At will: blight, contagion, darkness, detect magic, dispel magic (as a 5th-level spell), haste*, invisibility,
        see invisibility*

        3/day: cone of cold (as a 7th-level spell), confusion, hold monster (as a 5th-level spell)

        1/day: finger of death, hold monster (as a 9th-level spell), plane shift

        *The nightcrawler casts these spells on itself before combat.

        Senses: blindsight 30 ft., darkvision 120 ft., tremorsense 60 ft., passive Perception 26

        Languages: Undercommon, telepathy 100 ft.

        A swallowed creature is blinded and restrained and has total cover against attacks and other effects
        outside the nightcrawler.

        At the start of each of the nightcrawler''s turns, each creature swallowed by the nightcrawler takes
        21 (6d6) necrotic damage and must succeed on a DC 17 Constitution saving throw or have its hit point
        maximum reduced by an amount equal to the necrotic damage taken. This reduction lasts until the target
        completes a long rest. The target dies if this effect reduces its hit point maximum to 0.

        Creatures which die inside the nightcrawler''s stomach immediately rise as nightshade zombies under
        the nightcrawler''s control, retaining their place in the initiative order, and are immediately regurgitated
        by the nightcrawler, landing in a space within 10 feet of the nightcrawler.

        If the nightcrawler takes 30 damage or more on a single turn from a creature inside it, the nightcrawler
        must succeed on a DC 21 Constitution saving throw at the end of that turn or regurgitate all swallowed
        creatures, which fall prone in a space within 10 feet of the nightcrawler. If the nightcrawler dies,
        a swallowed creature is no longer restrained by it and can escape from the corpse by using 20 feet
        of movement, exiting prone.'
