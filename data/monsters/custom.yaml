      original scores. Original modifier-only values remain in source_ability_scores and original_5e. Current
      condition names use data/conditions.yaml; source durations, DCs and escape methods remain specific creature
      rules.'
    - Short rest takes one day and long rest takes one week by default. Printed per-day uses remain per-day.
      Recharge X–Y is a d6 roll at the start of the creature's turn.
    - Papaya's unrecorded sorcerer level cannot supply Heart of Fire damage. The existing Azer Heated Body
