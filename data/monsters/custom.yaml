      description: The graveworm colossus's innate spellcasting ability is Charisma (save DC 17).
    - name: Magic resistance
      description: The graveworm colossus has advantage on saving throws against spells and other magical effects.
    - name: Magic Weapons
      description: The graveworm colossus's weapon attacks are magical.
    - name: Shadow Camouflage
      description: 'While in dim light or darkness, the creature can take Hide as a bonus action and has advantage
        on Dexterity (Stealth) checks. Existing alternative: the complete Shadow Camouflage trait of the Nightshade
        Zombie in the same campaign export.'
    - name: Turn Resistance aura
      description: The graveworm colossus and any other undead creature within 30 feet of it have advantage
        on saving throws against any effect that turns undead.
    - name: Sunlight Weakness
      description: 'While in sunlight, the creature has disadvantage on attack rolls, ability checks and saving
        throws. Existing alternative: the complete Nightshade Zombie sunlight trait replaces the copied Turn
        Resistance text.'
    actions:
    - name: Bite
      description: 'Melee attack +14, reach 10 ft., Block DC 22. Unblocked strike: 3d8+9 piercing damage. A
        Large or smaller target must make the source DC 20 Dexterity save or be swallowed. Swallowed creatures
        are Blinded and Pinned with total cover from outside. At the start of the graveworm colossus''s turn,
        each takes 6d6 necrotic damage and makes DC 17 Constitution save; on failure its HP maximum falls by
        the necrotic damage taken until a long rest. At HP maximum 0 it dies, rises as a Nightshade Zombie
        on its own initiative, and is regurgitated within 10 ft. Taking at least 30 damage in one turn from
        inside forces the graveworm colossus to make DC 21 Constitution save at that turn''s end or regurgitate
        all swallowed creatures Prone within 10 ft. On its death, escape takes 20 feet of movement, exiting
        Prone. Size/trigger uses the existing SRD Purple Worm swallow alternative; campaign necrotic effects
        remain.'
    - name: Stinger
      description: 'Melee attack +14, reach 10 ft., Block DC 22. Unblocked strike: 3d6+9 piercing damage. Then
        DC 20 Constitution save: 12d6 poison damage on failure, half on success. Existing SRD Purple Worm stinger
        supplies the omitted save outcome.'
    - name: Swallowed (ongoing effect)
      description: This is the Bite's ongoing stomach effect, not an additional action. Resolve it at the start
        of the graveworm colossus's turn as described in Bite; do not deal the damage twice.
    - name: Summon Undead (1/day)
      description: 'Action; once per day choose one source group: 1d8+8 Shadows, 1d4+2 Nightshade Zombies,
        1d4+2 Wraiths, or 1d4 Dread Specters. They appear in unoccupied spaces within 60 ft., act as allies,
        and cannot summon or create other creatures. They remain for 1 minute, until they or the summoner die,
        or until dismissed by the summoner as an action. These missing procedure/range/control/duration details
        use the existing 5e Graveworm Colossus Summon Undead alternative by rferries; campaign summon choices
        and quantities are retained.'
