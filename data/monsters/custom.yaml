    - name: Wing Attack (2 actions)
      description: Each other creature within 30 feet makes a DC 28 Dexterity save. On a failure, it takes 4d6 +
        10 bludgeoning damage and falls Prone. On a success, it takes no damage and does not fall Prone. The dragon
        may then fly up to half its flying speed. This saving-throw-only effect cannot be Blocked.
    - name: Prismatic Pulse (3 actions)
      description: Each other creature within 60 feet makes a DC 26 Constitution save, taking 6d10 force damage
        and becoming Hobbled for 1 minute on a failure, or taking half damage without becoming Hobbled on a success.
        An affected creature repeats the save at the end of each of its turns, ending Hobbled on a success. This
        saving-throw-only effect cannot be Blocked.
    bonus_actions:
    - name: Arcane Translocation
      description: Teleport up to 120 feet to an unoccupied space it can see. This uses its bonus action; it cannot
        teleport as unrestricted movement.
