  entry:
    name: Stoneform Duplicate
    group: Tarta Homebrewery - Summons
    id: homebrewery-rockplica-duplicate
    meta: Medium construct, unaligned
    size: Medium
    type: construct
    alignment: unaligned
    cr: '1'
    ac: '15'
    hp: '17'
    block: 0 / +0 check
    speed: 30 ft., climb 20 ft., burrow 20 ft.
    abilities:
      str: '16'
      dex: '10'
      con: '18'
      int: '2'
      wis: '12'
      cha: '6'
    senses: darkvision 60 ft., passive Perception 13
    languages: Controller's spoken languages when created; can provide verbal components
    traits:
    - name: Optional controlled companion
      description: When an existing effect or the GM assigns it a controller, that effect or the GM sets its
        duration, active limit and command rules. If command timing is not supplied, it shares the controller's
        initiative, acts immediately afterward and receives a free verbal command on the controller's turn.
        Without a command it takes Dodge if able and avoids obvious hazards. Without an assigned controller,
        it acts independently on its own turn. Its listed restrictions still apply. Instructions grant no extra
        action, bonus action or reaction. This statblock grants no ability to create or summon it.
    - name: Template setup
      description: 'Default profile: Boulder Guardian model, with half its HP (17), otherwise its printed base
        scores and actions; no second Block or resource pool. The GM may instead choose a model creature, including
        an NPC, before the encounter and replace the template fields using the archived setup. Record the model
        statistics and its CR on that variant. Merely selecting a model neither creates a creature nor grants
        control. The model supplies statistics and shared resources even if a different controller is assigned.'
    - name: Shared finite resources
      description: Copies the model creature's available action options when configured, subject to their ordinary
        requirements. Any spell slot, MP, HP cost, item charge, ammunition or limited-use resource is spent
        from the model creature's existing supply, recorded as the Controller profile. It creates no extra
        items, ammunition, slots, charges or class-feature uses. Costs cannot be paid if that shared resource
        is unavailable. Its spell actions use that creature's current spell attack and save DC. Concentration
        belongs to that same creature; the duplicate gains no independent concentration capacity. If that creature
        is already maintaining concentration, the duplicate cannot cast a spell that requires concentration
        without ending it normally. Block points are shared with that creature, not copied into a second pool.
    - name: Bound duplicate
      description: Cannot move farther than 30 feet from its assigned controller, or its model creature if
        independent; if forced beyond that distance, it disappears. It ends at 0 HP, at the end of any duration
        set by an existing effect or the GM, or when its controller dismisses it as an action. Use one duplicate
        per model creature by default; a replacement ends the previous duplicate. It cannot create another
        duplicate or summon through a copied action.
    - name: Challenge and chosen models
      description: The listed CR applies to the default body. If a different model is selected, use that model's
        CR as the provisional encounter estimate and record it for the configured variant; never treat a copied
        powerful creature as the low-CR default. A harmless decoy that retains no attacks remains CR 0.
    actions:
    - name: Multiattack
      description: In the default stone body, makes one Slam and one Swipe attack. This replaces, rather than
        adds to, a copied action.
    - name: Slam
      description: 'Melee attack: +5 to hit, reach 5 ft., one target; Block DC 13. Unblocked strike: 1d4 bludgeoning
        damage.'
    - name: Swipe
      description: 'Melee attack: +5 to hit, reach 5 ft., one target; Block DC 13. Unblocked strike: 2d6 +
        4 slashing damage.'
    - name: Copied action
      description: Take one action available to the model creature when configured, using that action's printed
        attack bonus, Block DC, damage and save DC. Attacks and their riders require an unblocked strike; saving-throw-only
        effects cannot be Blocked. Pay all costs from the recorded shared finite resources. No extra action,
        bonus action or reaction is gained.
    source_ref: draft2.pdf / PDF page 57
    original_5e:
      spell_name: Rockplica
      level: '4'
      casting_time: 1 action
      range: Self
      components: V, S
      duration: Concentration, up to 1 minute
      classes: Artificer, Sorcerer, Wizard
      effect: You create a stone duplicate of yourself. The duplicate has half your hit points and can perform
        any action you can, but it cannot move more than 30 feet from you. The duplicate disappears when it
        reaches 0 hit points or when the spell ends.
      higher_levels: When cast with a 5th-level slot or higher, the duplicate gains 10 hit points for each
        slot level above 4th.
    conversion_notes:
    - Converted from the user's Homebrewery export draft2.pdf. Original stat fields and ability text are preserved
      below. Numerical source HP, AC, attack bonuses and damage expressions remain fixed monster values unless
      explicitly controller-scaled.
    - Use the current Dexterity-derived Block pool and check. Natural armor grants no equipment training or
      extra Block. Ordinary attack Block DC is attack bonus plus 8. Damage and on-strike riders require an
      unblocked strike; saving-throw-only and automatic effects cannot be Blocked.
    - Published as a separate optional monster, not a new spell or class feature. Original creation text is
      archived only as source context. When used as a controlled companion, an existing effect or the GM supplies
      its duration, active limit and control rules; this statblock grants no casting or creation ability. Independent
      creatures act normally.
    - This is a variable creature-profile template. Choose an actual model creature, including an NPC, and
      replace each Controller field with its recorded value before use. No independent six-score profile or
      XP reward is invented, and no spell is required by this statblock.
    - For missing template defenses, use a snapshot of the model creature's AC, size, movement speeds, ordinary
      senses, six ability scores and base Block pool/check. Ongoing spell effects and equipment inventory are
      not copied. It has its own HP but shares remaining Block with the recorded resource provider; it grants
      no extra copy of finite resources.
    - The source half-your-HP wording is completed as half the model creature's maximum HP when configured,
      rounded down to minimum 1. This template grants no spell-level HP scaling.
    - Copied actions share the controller's finite resources and cannot recursively create duplicates/summons.
      These are explicit limits completing the source's otherwise unlimited action-copy wording.
    - The duplicate may provide verbal components but uses the recorded resource provider's concentration.
      If that creature already maintains concentration, casting another concentration spell follows the ordinary
      replacement rule; the duplicate has no independent concentration capacity. Remaining Block is one shared
      pool, and configuring this option does not refill it.
    - Completed the standard body with numeric defenses, six ability scores and a default challenge. Optional
      model configuration and all existing shared-resource/control restrictions remain available.
    - 'Naming-only override: reusable creature title and consistent creature references; combat statistics
      and equipment retained.'
    source_completion:
      default_model: Boulder Guardian
      fields:
      - Complete default body and numeric challenge; optional model substitution remains available.
      cr_status: Assigned default encounter CR; configured variants record their chosen model and challenge.
    source_template:
      meta: Controller-sized construct, unaligned
      size: Same as controller
      cr: Varies
      ac: Controller's AC when created
      hp: Half the controller's maximum HP when created (round down; minimum 1)
      block: Shares the controller's remaining Block points and Block check; no second pool
      speed: Controller's movement speeds when created
      abilities:
        str: Controller STR when created
        dex: Controller DEX when created
        con: Controller CON when created
        int: Controller INT when created
        wis: Controller WIS when created
        cha: Controller CHA when created
      senses: Controller's ordinary senses when created; no independently created magic items or ongoing spell
        effects
      languages: Controller's spoken languages when created; can provide verbal components
    encounter_theme: Constructs & workshops
    source_naming:
      original_name: Rockplica duplicate
      previous_names:
      - Rockplica duplicate
      note: Reusable encounter title; stable identity and combat statistics retained.
    ability_score_status: reconstructed
    source_ability_scores:
      method: Documented complete default body; the optional model fields are retained separately under source_template.
      note: Default-body scores are completed values, not previously supplied fixed template statistics.
