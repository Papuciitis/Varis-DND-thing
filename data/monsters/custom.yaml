    traits:
    - name: Rage (Berserker Bloodied Frenzy alternative)
      description: While at or below half maximum HP, the berserker has advantage on attack rolls and saving
        throws. This is the existing Berserker Bloodied Frenzy trait. It replaces the incomplete class-level
        Rage package, so it requires no invented barbarian level, Rage damage bonus or use pool.
    - name: Goring Rush
      description: Immediately after you use the move action on your turn and move at least 20 feet you can
        make one melee attack with your horns as a bonus action.
    - name: Hammering Horns
      description: Immediately after an unblocked melee strike made as part of the Attack action, use a bonus
        action to shove a creature within 5 ft. that is no more than one size larger. It makes a DC 14 Strength
        save; failure pushes it up to 10 ft. away. DC 14 uses the source feature formula and printed STR +3
        / attack proficiency +3.
    - name: Beastial Soul
      description: When you jump you can make a Strength (Athletics) check and extend your jump by a number
        of feet equal to the check’s total. You can make this special check only once per turn.
    - name: Headman's Chop
      description: When a creature falls Prone within your melee reach, you may spend your reaction to make
        an opportunity attack against it. When you have advantage on an attack against a Prone creature, you
        may reroll one of those dice once and use the new roll.
    actions:
    - name: Halberd
      description: 'Attack +6 to hit; Block DC 14. Reach/range: 10 ft. Unblocked strike: 1d10+3 Slashing.'
    - name: Horns
      description: 'Attack +6 to hit; Block DC 14. Reach/range: 5 ft. Unblocked strike: 1d6+3 Piercing.'
    - name: Bite (Bloodied; magical)
      description: 'Available only while at or below half maximum HP, using the existing Bloodied Frenzy condition
        as the replacement for Rage. Melee attack +6, reach 5 ft., Block DC 14. Unblocked strike: 1d8 piercing
        damage; the berserker regains 3 HP. This magical natural attack retains the campaign damage and healing.'
