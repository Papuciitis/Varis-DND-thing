        Range: 15 feet.


        Duration: 1 hour.


        Components: verbal, somatic, material (key).


        As an action, conjure restraints to do one of:

        * seal a door, window, portal, or similar opening.

        * restrain a subdued or unconscious creature.

        * lock and secure a container.

        * restrict a creature to a location or object with a 30 to 60 ft chain

        The dc to escape or break these restraints or barriers is equal to 10 + your arcana bonus

        Creatures that fail strength based checks made to break the conjured restraints take a level of fatigue.

        A metal key is required to cast this spell. Once cast, the key can be used to unlock any restraints or barriers
        created by the spell. A single turn of the key will completely undo them all. The restraints cannot be dismissed,
        but they can be dispelled.


