        description: "Advantage on saves against spells and magical effects."
      -
        name: "Eldritch Orbs"
        description: >-
          Starts an encounter with 3 orbs; regains 1d4 at the start of each turn, maximum 6. Spent orbs are
          removed immediately; never exceed 6.
      -
        name: "Legendary action budget"
        description: >-
          2 legendary actions, regained at the start of its turn. Spend one option at a time, at the end of
          another creature's turn. Each listed cost is deducted from this shared budget.
    actions:
      -
        name: "Multiattack"
        description: "Make one Bite and two Claw attacks. Resolve each attack and Block separately."
      -
        name: "Bite"
        description: "Melee attack: +9 to hit, reach 5 ft., one target; Block DC 17. Unblocked strike: 2d10 + 5 piercing damage."
      -
        name: "Claw"
        description: "Melee attack: +9 to hit, reach 10 ft., one target; Block DC 17. Unblocked strike: 2d8 + 5 slashing damage."
      -
        name: "Orb Blast (recharge 5-6)"
        description: >-
          Up to 3 visible creatures within 60 ft.; DC 16 Dexterity save. Failure: 6d8 force damage. Success:
          half damage and no other effect. Saving-throw-only damage cannot be Blocked.
      -
        name: "Mind Shatter (2 orbs)"
        description: >-
          One visible creature within 60 ft.; DC 16 Intelligence save. Failure: 4d10 psychic damage; Stunned
          until the end of its next turn. Success: half damage and no other effect. Saving-throw-only damage
          cannot be Blocked.
      -
        name: "Twisting Step (1 orb)"
        description: "Teleport up to 30 ft. to a visible unoccupied space; costs its action and 1 orb."
    ability_score_status: "sourced"
    source_recovery:
      kind: "numerical profile"
