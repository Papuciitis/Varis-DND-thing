      bonus: 9
      block_dc: 17
      dc_adjustment: 0
      damage_modifier: 4
      offset: 0
    - name: Lightning
      ability: int
      bonus: 8
      block_dc: 16
      dc_adjustment: 0
      damage_modifier: 5
      offset: 0
    batch: 2026-11-28-cross-system
  block_rules: 'Rested Block is max(0, DEX modifier); natural armor grants neither equipment Block nor armor
    training. Temporary Block does not stack: keep the higher grant. A successful Block negates blockable damage
    and attached strike riders. Saving-throw-only and automatic damage cannot be Blocked.'
  conversion_notes:
  - Adapted to current Varis rules. Source-system bonuses and action economies are not interchangeable; original
    statistics remain in the source panel.
  - Daily uses recover after 24 hours; a short rest is one day and a long rest is one week. Recharge rolls
    1d6 at the start of its turn while expended.
  - CR is a provisional encounter estimate. Powers with completed timings, limits or escape methods are conversions,
    not missing published text.
  - AGE Defense becomes fixed AC, Health becomes HP, and natural Armor Rating becomes explicit physical reduction.
    Worn armor uses current equipment instead; its Armor Rating is not added again. AGE Mana, focus bonuses,
    stunt points and extra-attack chains do not carry over. Penetrating damage does not automatically bypass
    Block.
  - Sustained legacy paralysis becomes current Stunned, allowing the listed repeat CON recovery saves. Current
    Paralyzed forbids saves; fixed one-turn paralysis elsewhere ends automatically instead.
  replacement_sources:
  - name: Current monster template
    description: docs/monsters.md
  - name: Block, equipment, conditions and rests
    description: data/draft-reference/combat.yaml; data/draft-reference/armor-and-shields.yaml; data/weapons.yaml;
      data/conditions.yaml; data/draft-reference/progression.yaml
  saving_throws: STR +4, DEX +6, CON +1, INT +5, WIS +2, CHA +0
  source_ability_scores:
    method: 'Score = 10 + 2 × AGE rating: STR=Strength, DEX=Dexterity, CON=Constitution, INT=Cunning, WIS=max(Perception,
      Willpower), CHA=Communication. For this caster, INT also includes max(existing rating, Magic).'
    ratings:
      Communication: 0
      Constitution: 1
      Cunning: 2
      Dexterity: 6
      Magic: 5
      Perception: 2
      Strength: 4
      Willpower: 2
    note: 'Score = 10 + 2 × AGE rating: STR=Strength, DEX=Dexterity, CON=Constitution, INT=Cunning, WIS=max(Perception,
      Willpower), CHA=Communication. For this caster, INT also includes max(existing rating, Magic).'
  casting_ability: INT
  spell_attack: '+8'
  spell_save_dc: '16'
  bonus_actions:
  - name: Storm Form (Recharge 5–6)
    description: 'Becomes a storm cloud until the start of its next turn: can move through gaps and other creatures
      using its flying speed and gains resistance to nonmagical bludgeoning, piercing and slashing damage.
      Cannot Bite or use Claws in this form. A creature that hits it with a magical attack immediately forces
      it solid for the remaining duration.'
