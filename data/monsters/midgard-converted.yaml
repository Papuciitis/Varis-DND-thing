  source_conversion:
    theme: Fire, storms & sky
    attack_profiles:
    - name: Bite
      ability: str
      bonus: 7
      block_dc: 15
      dc_adjustment: 0
      damage_modifier: 4
      offset: 0
    - name: Whirling Claws
