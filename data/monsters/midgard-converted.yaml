    cha: '16'
  proficiency_bonus: '+4'
  senses: passive Perception 15
  languages: Common, Draconic
  traits:
  - name: Runic Ward (3 charges)
    description: Its printed AC 18 includes its standing ward. As a reaction after taking damage, may spend
      one ward charge to reduce that damage by 8. No equipment Block or automatic spell-countering is granted.
      Charges recover after a long rest; this replaces source buff Armor Rating 8.
  - name: Bound Attendants
    description: May begin an encounter with up to 1d3 separately placed Bonepowder Ghoul attendants only if
      the GM includes them in encounter difficulty. This profile creates or controls no extra creatures and
      grants no free turns.
  actions:
  - name: Arcane Lance
    description: 'Ranged attack: +12 to hit, range 90/180 ft., one target; Block DC 20. Unblocked strike: 2d6
      + 8 force damage. '
  - name: Quarterstaff
    description: 'Melee attack: +8 to hit, reach 5 ft., one target; Block DC 16. Unblocked strike: 1d3 + 4
      bludgeoning damage. Two-handed, Balanced.'
  - name: Innate Spellcasting (4/day total)
    description: Casts one linked spell, using INT and that spell's current casting time, range, components,
      concentration and effects. The listed uses are shared across the whole list; casting consumes a use in
      addition to any conditions or resources specified by the current spell. No source Mana or fast-casting
      action is granted. These are monster-only permissions, not character spell grants.
  - name: Binding Brand (1/day)
    description: A willing or Incapacitated creature within touch makes a DC 20 WIS save; on success no brand.
      On failure, gains a visible brand for 24 hours. Once during that period, while within 120 ft., the magister
      may use an action to make the target take 2d6 psychic damage, with a new WIS save halving it. The brand
      grants no command control and can be ended by affliction-removal magic. This bounds the source's unlimited-range
      geas.
