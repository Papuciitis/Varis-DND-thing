  senses: passive Perception 12
  languages: Abyssal
  traits: []
  actions:
  - name: Multiattack
    description: Makes one Whirling Claws attack and one Bite attack, or one Lightning attack.
  - name: Bite
    description: 'Melee attack: +7 to hit, reach 5 ft., one target; Block DC 15. Unblocked strike: 1d6 + 4
      piercing damage. The target makes a DC 12 CON save; failure: Stunned for 1 minute, success: unaffected.
      Repeat the save at the end of each turn, ending it on success. After recovering, it is immune to this
      creature''s stun for 24 hours. '
  - name: Whirling Claws
    description: 'Melee attack: +9 to hit, reach 5 ft., one target; Block DC 17. Unblocked strike: 2d6 + 4
      slashing damage. '
  - name: Lightning
    description: 'Ranged attack: +8 to hit, range 35/70 ft., one target; Block DC 16. Unblocked strike: 2d6
      + 5 lightning damage. '
  - name: Stormburst (Recharge 5–6)
    description: 'Creatures within 20 ft. make a DC 16 DEX save. Failure: 3d6 lightning damage and pushed 10
      ft.; success: half damage and no push. The source''s 24-yard battlefield stunt becomes a bounded area
      power.'
  ability_score_status: reconstructed
  source_system: AGE System / Midgard Bestiary Volume 1
  source_ref: https://www.scribd.com/document/590183663/Midgard-Bestiary-AGE-Vol1#page=2
  original_5e:
