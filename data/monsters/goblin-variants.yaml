  block_rules: Trained Leather and Arm pauldron (wooden shield equivalent). Rested Block = max(0, DEX modifier)
    + 0 armor Block + 1 shield Block. Check +4 includes proficiency +2 and Protection 0; uses DEX. Natural
    hide grants no extra equipment Block. Successful Block negates blockable damage and strike riders; saves
    and automatic damage cannot be Blocked. Temporary Block does not stack.
  conversion_notes:
  - Adapted to current Varis rules. Source-system bonuses and action economies are not interchangeable; original
    statistics remain in the source panel.
  - Daily uses recover after 24 hours; a short rest is one day and a long rest is one week. Recharge rolls
    1d6 at the start of its turn while expended.
  - CR is a provisional encounter estimate. Powers with completed timings, limits or escape methods are conversions,
    not missing published text.
  - PF1 size-based damage/AC and feats are not imported as a class level. The wooden shield uses the current
    arm-pauldron shield profile; armor and weapon properties follow the item catalogue.
