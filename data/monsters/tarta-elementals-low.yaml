- name: Moonflyer
  group: Tarta Homebrewery - Earth elementals
  id: homebrewery-moonflyer
  size: Small
  type: elemental
  alignment: neutral
  meta: Small earth elemental, neutral
  cr: '3'
  ac: '13'
  hp: '33'
  block: 4 pool / +4 check
  speed: 20 ft., burrow 20 ft., fly 5 ft. (hover)
  abilities:
    str: '8'
    dex: '18'
    con: '15'
    int: '6'
    wis: '14'
    cha: '10'
  damage_immunities: poison, psychic
  condition_immunities: Blinded, Deafened, Paralyzed, Petrified, Poisoned, Prone
  senses: darkvision 60 ft., passive Perception 14
  languages: Terran, Celestial, Deep Speech
  traits:
  - &id005
    name: Earth Glide
    description: The elemental can burrow through nonmagical, unworked earth and stone. While doing so, the elemental
      does not disturb the material it moves through.
  - &id006
    name: Moonlit
    description: The elemental sheds dim light in a 30-foot radius. Bright light the aura touches is reduced to
      dim light.
  actions:
  - name: Slam
    description: 'Melee attack: +4 to hit; reach 5 ft.; one target; Block DC 12. Unblocked strike: 1d6 + 2 bludgeoning
      damage.'
  - name: Moonlight (Recharge 5-6)
    description: 'Ranged spell attack: +4 to hit; range 60 ft.; one target; Block DC 12. Unblocked strike: 5d6 radiant
      damage. If the target is a creature, it makes a DC 12 Constitution save. On a failure, its attack rolls have
      disadvantage until the start of its next turn. At the start of the elemental''s turn while Moonlight is expended,
      roll 1d6; it recharges on 5 or 6.'
  source_ref: draft2.pdf / PDF page 15
  original_5e:
    name: Moonflyer
    meta: Small earth elemental, neutral
    ac: 13 (natural armor)
    hp: 33 (8d6 + 5)
    speed: 20 ft., burrow 20 ft., fly 5 ft. (hover)
    abilities:
      str: '8'
      dex: '18'
      con: '15'
      int: '6'
      wis: '14'
      cha: '10'
    damage_immunities: poison, psychic
    condition_immunities: Blinded, Deafened, Paralyzed, Petrified, Poisoned, Prone
    senses: darkvision 60 ft., passive Perception 14
    languages: Terran, Celestial, Deep Speech
    cr: '3'
    traits:
    - *id005
    - *id006
    - name: Gleam
      description: The elemental becomes heavily obscured, with its space filled by bright light, and gains resistance
        to radiant damage for 1 minute. It can use this feature once per long rest.
    actions:
    - name: Slam
      description: 'Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 5 (1d6 + 2) bludgeoning damage.'
    - name: Moonlight (Recharge 5-6)
      description: 'Ranged Spell Attack: +4 to hit, range 60 ft., one target. Hit: 18 (5d6) radiant damage. If the
        target is a creature, it must succeed on a DC 12 Constitution saving throw or have disadvantage on any attack
        rolls it makes before the start of its next turn.'
    damage_resistances: bludgeoning, piercing, and slashing from nonmagical attacks
    skills: Perception +8
    xp: '700'
  conversion_notes:
  - Converted from the Tarta Homebrewery export. Printed AC, HP, CR, ability scores and attack/save modifiers are
    retained except for explicitly identified source completions.
  - Natural armor alone grants no equipment training or extra Block. The Block pool is the nonnegative Dexterity
    modifier; checks use the signed Dexterity modifier. Each ordinary attack lists Block DC 8 plus its printed attack
    bonus.
  - Ordinary attack damage and attached strike riders require an unblocked strike. Saving-throw-only and automatic
    damage cannot be Blocked. Source attack dice are retained; conflicting printed damage means and HP dice expressions
    are preserved only in original_5e.
  damage_resistances: bludgeoning, piercing, and slashing from nonmagical attacks
  skills: Perception +8
  bonus_actions:
  - name: Gleam (1/long rest)
    description: For 1 minute, the elemental is heavily obscured in its brightly lit space and has resistance to
      radiant damage.
  source_completion:
    decisions:
    - Gleam has a printed 1-minute duration and once-per-long-rest limit but no activation. It is assigned a bonus
      action; the immunity/resistance and obscuration effects are unchanged.
    - Moonlight uses the printed Recharge 5-6 as a d6 roll at the start of its turn. The Constitution-save rider
      applies only after an unblocked strike.
  xp: '700'
  summoned_by:
  - name: Geomorphic Form
    section: rules
    group: Tarta Homebrewery - Summoning features
