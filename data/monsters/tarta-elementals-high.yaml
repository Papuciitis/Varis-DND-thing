section: monsters
entries:
- name: Obsidian Obliterator
  group: Tarta Homebrewery - Earth elementals
  id: homebrewery-obsidian-obliterator
  meta: Large elemental, neutral
  size: Large
  type: elemental
  alignment: neutral
  cr: '3'
  xp: '700'
  ac: 16 (natural armor)
  hp: '75'
  speed: 25 ft., burrow 25 ft.
  abilities:
    str: '20'
    dex: '10'
    con: '16'
    int: '3'
    wis: '11'
    cha: '6'
  damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
  damage_immunities: poison
  condition_immunities: Paralyzed, Petrified, Poisoned, Prone
  senses: darkvision 60 ft., passive Perception 10
  languages: Terran
  traits:
  - name: Earth Glide
    description: The elemental can burrow through nonmagical, unworked earth and stone. While doing so, it does
      not disturb the material it moves through.
  - name: Obsidian Spikes
    description: When the elemental takes damage from an unblocked melee strike, the attacker takes 2d6 piercing
      damage. This automatic retaliation cannot be Blocked.
  actions:
  - name: Spike Launch
    description: 'Ranged attack +7, range 30/90 ft., one target; Block DC 15. Unblocked strike: 3d6 + 5 piercing
      damage. A creature struck makes a DC 14 Constitution save; on failure its movement speed is halved until the
      end of its next turn.'
  source_ref: draft2.pdf / PDF page 20
  original_5e:
    name: Obsidian Obliterator
    meta: Large earth elemental, neutral
    cr: '3'
    xp: '700'
    ac: 16 (natural armor)
    hp: 75 (10d10 + 15)
    speed: 25 ft., burrow 25 ft.
    abilities:
      str: '20'
      dex: '10'
      con: '16'
      int: '3'
      wis: '11'
      cha: '6'
    damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
    damage_immunities: poison
    condition_immunities: Paralyzed, Petrified, Poisoned, Prone
    senses: darkvision 60 ft., passive Perception 10
    languages: Terran
    traits:
    - name: Earth Glide
      description: The elemental can burrow through nonmagical, unworked earth and stone. While doing so, it does
        not disturb the material it moves through.
    - name: Obsidian Spikes
      description: When the Obsidian Obliterator is hit by a melee attack, the attacker takes 7 (2d6) piercing damage.
    actions:
    - name: Spike Launch
      description: 'Ranged Weapon Attack: +7 to hit, range 30/90 ft., one target. Hit: 15 (3d6 + 5) piercing damage.
        If the target is a creature, it must succeed on a DC 14 Constitution saving throw or have its movement speed
        halved.'
  conversion_notes:
  - Converted from The Tarta Guide - The Homebrewery (draft2.pdf), PDF page 20. Fixed printed HP and printed attack/save
    modifiers are retained. Inconsistent HP dice, printed averages and source wording remain in Original source
    statblock; attacks use printed damage dice instead of contradictory means.
  - Uses current Vara Block and named conditions. Ordinary attack damage and on-strike riders require an unblocked
    strike; automatic and saving-throw-only damage cannot be Blocked. Natural armor grants no extra Block or equipment
    proficiency.
  - 'Recharge X-Y: roll 1d6 at the start of each turn while expended and recover on a result in that range. All
    recharge abilities begin available. Printed rest uses follow current Vara rest durations.'
  - Spike Launch's missing duration is completed as ending at the end of the struck creature's next turn; repeated
    applications do not stack. Obsidian Spikes follows the unblocked-strike damage rule.
  block: 0 pool / +0 check
  block_rules: Spend 1 Block after an attack hits and before damage. A successful check against its Block DC negates
    blockable damage and unblocked-strike riders. Saving-throw-only and automatic damage cannot be Blocked. Natural
    armor grants no extra Block or armor training.
- name: Granite Goliath
  group: Tarta Homebrewery - Earth elementals
  id: homebrewery-granite-goliath
  meta: Large elemental, neutral
  size: Large
  type: elemental
  alignment: neutral
  cr: '4'
  xp: '1100'
  ac: 17 (natural armor)
  hp: '110'
  speed: 30 ft., burrow 30 ft.
  abilities:
    str: '22'
    dex: '8'
    con: '19'
    int: '5'
    wis: '12'
    cha: '7'
  damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
  damage_immunities: poison
  condition_immunities: Paralyzed, Petrified, Poisoned, Prone
  senses: darkvision 60 ft., passive Perception 11
  languages: Terran
  traits:
  - name: Earth Glide
    description: The elemental can burrow through nonmagical, unworked earth and stone. While doing so, it does
      not disturb the material it moves through.
  actions:
  - name: Ground Pound
    description: 'Each other creature within 10 feet makes a DC 16 Strength save. Failure: 3d8 + 5 bludgeoning damage
      and Prone. Success: half damage and no Prone. This saving-throw-only effect cannot be Blocked.'
  source_ref: draft2.pdf / PDF page 20
  original_5e:
    name: Granite Goliath
    meta: Large earth elemental, neutral
    cr: '4'
    xp: '1100'
    ac: 17 (natural armor)
    hp: 110 (13d10 + 39)
    speed: 30 ft., burrow 30 ft.
    abilities:
      str: '22'
      dex: '8'
      con: '19'
      int: '5'
      wis: '12'
      cha: '7'
    damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
    damage_immunities: poison
    condition_immunities: Paralyzed, Petrified, Poisoned, Prone
    senses: darkvision 60 ft., passive Perception 11
    languages: Terran
    traits:
    - name: Earth Glide
      description: The elemental can burrow through nonmagical, unworked earth and stone. While doing so, it does
        not disturb the material it moves through.
    - name: Granite Guard
      description: When the Granite Goliath is targeted by a direct attack or spell, it can use its reaction to
        gain resistance to that damage type until the end of its next turn.
    actions:
    - name: Ground Pound
      description: All creatures within 10 ft. must make a DC 16 Strength saving throw or be knocked prone and take
        14 (3d8 + 5) bludgeoning damage. On a successful save, they take half damage and aren't knocked prone.
  conversion_notes:
  - Converted from The Tarta Guide - The Homebrewery (draft2.pdf), PDF page 20. Fixed printed HP and printed attack/save
    modifiers are retained. Inconsistent HP dice, printed averages and source wording remain in Original source
    statblock; attacks use printed damage dice instead of contradictory means.
  - Uses current Vara Block and named conditions. Ordinary attack damage and on-strike riders require an unblocked
    strike; automatic and saving-throw-only damage cannot be Blocked. Natural armor grants no extra Block or equipment
    proficiency.
  - 'Recharge X-Y: roll 1d6 at the start of each turn while expended and recover on a result in that range. All
    recharge abilities begin available. Printed rest uses follow current Vara rest durations.'
  - Granite Guard is a reaction. Against a mixed-damage trigger choose one damage type; resistance does not stack.
    Ground Pound excludes the acting elemental itself.
  block: 0 pool / -1 check
  block_rules: Spend 1 Block after an attack hits and before damage. A successful check against its Block DC negates
    blockable damage and unblocked-strike riders. Saving-throw-only and automatic damage cannot be Blocked. Natural
    armor grants no extra Block or armor training.
  reactions:
  - name: Granite Guard
    description: When directly targeted by a damaging attack or spell, use a reaction before resolving the damage
      to gain resistance to one damage type that effect deals. It lasts until the end of the elemental's next turn.
      Merely being inside an area effect does not trigger it.
