      unrelated to transformation, or undo death.
  - name: Odsand
    description: For each incoming attack damage roll that remains after an unsuccessful or unused Block, compare
      its rolled dice total R before flat modifiers to its minimum possible total L and maximum H. If H exceeds
      L and (R-L)/(H-L) is at most 0.10, replace R with H. If the fraction is at least 0.90, replace R with L. Otherwise
      leave it unchanged. Apply flat modifiers and damage mitigation afterward. Fixed damage with H=L is unchanged;
      no reroll or repeated reversal occurs.
  - name: Sandstorm Aura
    description: The area within 10 feet is difficult terrain for other creatures.
