  - name: Whirlwind (Recharge 5-6)
    description: 'Each other creature within 15 feet makes a DC 15 Strength save. Failure: pull it straight toward
      the elemental until within 5 feet or blocked by solid terrain; it takes 1d6 bludgeoning damage per full 5
      feet actually pulled, then is thrown 15 feet vertically into the air. If that throw hits a solid obstruction,
      it takes another 1d6 bludgeoning damage. Resolve its subsequent fall using the normal falling rules. Success:
