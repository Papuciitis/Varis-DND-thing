- name: Sand Shambler
  group: Tarta Homebrewery - Earth elementals
  id: homebrewery-sand-shambler
  meta: Medium elemental, neutral
  size: Medium
  type: elemental
  alignment: neutral
  cr: '3'
  xp: '700'
  ac: 13 (natural armor)
  hp: '52'
  speed: 30 ft., burrow 30 ft.
  abilities:
    str: '14'
    dex: '16'
    con: '16'
    int: '1'
    wis: '10'
    cha: '6'
  damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
  damage_immunities: poison
  condition_immunities: Charmed, Afraid, Paralyzed, Petrified, Poisoned, Prone
  senses: tremorsense 60 ft., passive Perception 12
  languages: —
  traits:
  - name: Earth Glide
    description: The elemental can burrow through nonmagical, unworked earth and stone. While doing so, it does
      not disturb the material it moves through.
  - name: Sand Form
    description: The elemental can enter and stop in a hostile creature's space, and move through a space 1 inch
      wide without squeezing. A creature that touches it or damages it with an unblocked melee strike while within
      5 feet takes 1d6 slashing damage. This automatic damage cannot be Blocked.
  actions:
  - name: Slam
    description: 'Melee attack +5, reach 5 ft., one target; Block DC 13. Unblocked strike: 2d6 + 3 bludgeoning damage.'
  - name: Sandstorm (Recharge 5-6)
    description: Each other creature within 15 feet makes a DC 14 Constitution save, taking 4d6 slashing damage
      on failure, or half on success. The area within 15 feet is heavily obscured until the start of the elemental's
      next turn. This saving-throw-only effect cannot be Blocked.
  source_ref: draft2.pdf / PDF page 22
  original_5e:
    name: Sand Shambler
    meta: Medium earth elemental, neutral
    cr: '3'
    xp: '700'
    ac: 13 (natural armor)
    hp: 52 (7d8 + 21)
    speed: 30 ft., burrow 30 ft.
    abilities:
      str: '14'
      dex: '16'
      con: '16'
      int: '1'
      wis: '10'
      cha: '6'
    damage_resistances: bludgeoning, piercing and slashing from nonmagical attacks
    damage_immunities: poison
    condition_immunities: Charmed, frightened, Paralyzed, Petrified, Poisoned, Prone
    senses: tremorsense 60 ft., passive Perception 12
    languages: —
    traits:
    - name: Earth Glide
      description: The elemental can burrow through nonmagical, unworked earth and stone. While doing so, it does
        not disturb the material it moves through.
    - name: Sand Form
      description: The Sand Shambler can enter a hostile creature's space and stop there. It can move through a
        space as narrow as 1 inch wide without squeezing. A creature that touches the Sand Shambler or hits it with
        a melee attack while within 5 feet of it takes 3 (1d6) slashing damage.
    actions:
    - name: Slam
      description: 'Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 10 (2d6 + 3) bludgeoning damage.'
    - name: Sandstorm (Recharge 5-6)
      description: The Sand Shambler creates a swirling sandstorm in a 15-foot radius around itself. Each creature
        in that area must make a DC 14 Constitution saving throw, taking 14 (4d6) slashing damage on a failed save,
        or half as much damage on a successful one. The area becomes heavily obscured until the start of the Sand
        Shambler's next turn.
  conversion_notes:
  - Converted from The Tarta Guide - The Homebrewery (draft2.pdf), PDF page 22. Fixed printed HP and printed attack/save
    modifiers are retained. Inconsistent HP dice, printed averages and source wording remain in Original source
    statblock; attacks use printed damage dice instead of contradictory means.
  - Uses current Vara Block and named conditions. Ordinary attack damage and on-strike riders require an unblocked
    strike; automatic and saving-throw-only damage cannot be Blocked. Natural armor grants no extra Block or equipment
    proficiency.
  - 'Recharge X-Y: roll 1d6 at the start of each turn while expended and recover on a result in that range. All
    recharge abilities begin available. Printed rest uses follow current Vara rest durations.'
  - Source frightened immunity maps to current Afraid. Sandstorm does not harm its acting elemental. Sand Form contact
    damage is automatic, while its melee-strike trigger requires an unblocked strike.
  block: 3 pool / +3 check
  block_rules: Spend 1 Block after an attack hits and before damage. A successful check against its Block DC negates
    blockable damage and unblocked-strike riders. Saving-throw-only and automatic damage cannot be Blocked. Natural
    armor grants no extra Block or armor training.
