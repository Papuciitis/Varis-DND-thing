section: monsters
entries:
- name: Adult Red Dragon
  group: Creature template monsters
  id: template-adult-red-dragon
  meta: Huge dragon, chaotic evil
  cr: '17'
  ac: 19 (natural armor)
  hp: 256 (19d12 + 133)
  speed: 40 ft., climb 40 ft., fly 80 ft.
  block: 0 / +0 check
  abilities:
    str: '27'
    dex: '10'
    con: '25'
    int: '16'
    wis: '13'
    cha: '21'
  saving_throws: Dex +6, Con +13, Wis +7, Cha +11
  skills: Perception +13, Stealth +6
  damage_immunities: fire
  senses: blindsight 60 ft., darkvision 120 ft., passive Perception 23
  languages: Common, Draconic
  proficiency_bonus: '+6'
  traits:
  - name: Legendary Resistance (3/day)
    description: When the dragon fails a saving throw, it may choose to succeed instead. Uses recover per day,
      not per long rest.
  - name: Legendary action budget
    description: Three legendary actions each round, recovered at the start of its turn. Spend only one option
      at a time, at the end of another creature's turn.
  actions:
  - name: Multiattack
    description: Use Frightful Presence, then make one Bite and two Claw attacks.
  - name: Bite
    description: 'Melee attack: +14 to hit, reach 10 ft., one target; Block DC 22. Unblocked strike: 19 (2d10
      + 8) piercing plus 7 (2d6) fire damage.'
  - name: Claw
    description: 'Melee attack: +14 to hit, reach 5 ft., one target; Block DC 22. Unblocked strike: 15 (2d6
      + 8) slashing damage.'
  - name: Tail
    description: 'Melee attack: +14 to hit, reach 15 ft., one target; Block DC 22. Unblocked strike: 17 (2d8
      + 8) bludgeoning damage.'
  - name: Frightful Presence
    description: Each chosen creature within 120 ft. that is aware of the dragon makes a DC 19 Wisdom save.
      Failure applies Afraid for 1 minute. Repeat the save at the end of each affected turn; success ends the
      effect. A successful save or ending the effect grants immunity to this dragon's presence for 24 hours.
  - name: Fire Breath (recharge 5–6)
    description: '60 ft. cone; DC 21 Dexterity save. Failure: 63 (18d6) fire damage; success: half. This saving-throw-only
      damage cannot be Blocked. At the start of each turn while expended, roll 1d6; recharge on 5 or 6.'
  legendary_actions:
  - name: Detect (1 action)
    description: Make a Wisdom (Perception) check.
  - name: Tail Attack (1 action)
    description: Make one Tail attack.
  - name: Wing Attack (2 actions)
    description: 'Each creature within 10 ft. makes a DC 22 Dexterity save. Failure: 15 (2d6 + 8) bludgeoning
      damage and Prone. The dragon may then fly up to half its flying speed. Saving-throw-only damage cannot
      be Blocked.'
  replacement_sources:
  - name: Frightful Presence completion
    description: 'D&D Beyond / Basic Rules (2014), Adult Red Dragon: https://www.dndbeyond.com/monsters/16771-adult-red-dragon'
  conversion_notes:
  - The example red dragon is a playable compendium entry. Its truncated Frightful Presence was completed using
    the matching 2014 monster. The current Afraid condition replaces legacy frightened. Natural armor grants
    no unprinted Block or armor proficiency.
  - Uses the current Vara Block pool/check and conditions. Damage and attached attack effects below require
    an unblocked strike; saving-throw-only effects cannot be Blocked.
  - Printed source HP, AC, attacks, speeds and saves are retained except for the explicitly identified existing-rule
    replacements. Source CR is an encounter reference, not a new balance assessment.
  source_ref: Faila DnD 5e StyleTemplate kopija.docx / page 5
  original_5e: "Adult Red Dragon\n\n\n      Huge dragon, chaotic evil\n\n    Armor Class 19 (natural armor)\n\
    \n\n    Hit Points 256 (19d12 + 133)\n    Speed 40ft., climb 40ft., fly 80ft.\n       STR        DEX  \
    \       CON          INT         WIS         CHA\n      27 (+8)    10 (+0)     25 (+7)      16 (+3)   \
    \  13 (+1)     21 (+5)\n\n\n    Saving Throws Dex +6, Con +13, Wis +7, Cha +11\n\n    Skills Perception\
    \ +13, Stealth +6\n    Damage Immunities fire\n,   Senses blindsight 60 ft., darkvision 120 ft., passive\
    \ Perception 23\n    Languages Common, Draconic\n    Challenge 17 (18,000 XP)\n\n    Legendary Resistance\
    \ (3/Day). If the dragon fails a saving\n    throw, it can choose to succeed instead.\n\n    Actions\n\
    \    Multiattack. The dragon can use its Frightful Presence. It then\n    makes three attacks: one with\
    \ its bite and two with its claws.\n    Bite. Melee Weapon Attack: +14 to hit, reach 10 ft., one\n    target.\
    \ Hit: 19 (2d10 + 8) piercing damage plus 7 (2d6) fire\n\n    damage.\n\n    Claw. Melee Weapon Attack:\
    \ +14 to hit, reach 5 ft., one\n    target. Hit: 15 (2d6 + 8) slashing damage.\n    Tail. Melee Weapon\
    \ Attack: +14 to hit, reach 15 ft., one\n    target. Hit: 17 (2d8 + 8) bludgeoning damage.\n\n    Frightful\
    \ Presence. Each creature...\n\n    Fire Breath (Recharge 5–6). The dragon exhales fire in a 60-\n    foot\
    \ cone. Each creature in that area must make a DC 21\n    Dexterity saving throw, taking 63 (18d6) fire\
    \ damage on a\n    failed save, or half as much damage on a successful one.\n\n    Legendary Actions\n\
    \    The dragon can take 3 legendary actions, choosing from the\n    options below. Only one legendary\
    \ action can be used at a\n    time and only at the end of another creature's turn. The\n    dragon regains\
    \ spent legendary actions at the start of its turn.\n\n    Detect. The dragon makes a Wisdom (Perception)\
    \ check.\n    Tail Attack. The dragon makes a tail attack.\n    Wing Attack (Costs 2 Actions). The dragon\
    \ beats its wings.\n    Each creature within 10 feet of the dragon must succeed on a\n    DC 22 Dexterity\
    \ saving throw or take 15 (2d6 + 8)\n    bludgeoning damage and be knocked prone. The dragon can\n    then\
    \ fly up to half its flying speed.\n\n\n\n\n                                                          \
    \                  5"
