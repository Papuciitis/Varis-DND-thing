      3) slashing damage. An unblocked strike applies one stack of Bleeding using the current condition.'
  reactions:
  - name: Judging Gaze
    description: When a creature within 30 ft. fails a Block check against this creature's attack, it makes
      a DC 13 Wisdom save. Failure applies Afraid until the end of that creature's current turn.
  replacement_sources:
  - name: Missing reaction save DC
    description: The source spellcasting already gives Wisdom DC 13; Judging Gaze uses that existing Wisdom
      save DC.
  - name: Current spells
    description: data/draft-spells/occult-cantrips.yaml / Devitalize; mystic-cantrips.yaml / Soulfire; lvl-2-occult-spells.yaml
      / Essence leech; lvl-2-mystic-spells.yaml / Void touch
  conversion_notes:
  - The unfinished Judging Gaze reuses the statblock's existing Wisdom save DC 13 and the current Afraid condition.
    Confirmed Rend applies current Bleeding. Unspecified Follow-Up ? uses the printed Multiattack instead of
    an invented extra attack. The source spellcasting gives no character level, so unselected cantrip upgrades
