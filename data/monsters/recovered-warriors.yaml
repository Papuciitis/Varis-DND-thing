  -
    name: "Mountain Orc"
    group: "Recovered warbands"
    id: "recovered-mountain-orc"
    meta: "Medium humanoid (orc), chaotic evil"
    size: "Medium"
    type: "humanoid (orc)"
    alignment: "chaotic evil"
    cr: "1/2"
    ac: "10"
    hp: "13"
    speed: "30 ft."
    block: "0 / +0 check"
    abilities:
      str: "18"
      dex: "10"
      con: "14"
      int: "8"
      wis: "8"
      cha: "8"
    proficiency_bonus: "+2"
    senses: "darkvision 60 ft., passive Perception 9"
    languages: "Common, Orc"
    traits:
      -
        name: "Light Sensitivity"
        description: "Attack rolls take a −1 penalty in bright sunlight or a daylight effect."
      -
        name: "Rest Dice"
        description: "Two d12 rest dice, recovered after a long rest; used only for Overpower."
      -
        name: "Critical Takedown"
        description: "An unblocked critical strike with its melee javelin applies Prone to a Large or smaller target."
    actions:
      -
        name: "Greataxe"
        description: >-
          Melee attack: +6 to hit, reach 5 ft., one target; Block DC 15. Unblocked strike: 1d12 + 4 slashing
          damage. Attack with disadvantage if it moved since the start of its previous turn.
      -
        name: "Heavy Cleave"
        description: >-
          Spend its bonus action or move action while taking its Attack action (including its listed
          Multiattack), replacing one weapon attack. Make one Greataxe attack with disadvantage against two
          adjacent creatures within its reach, using one attack roll against both ACs. Each target may Block
          separately against DC 15; each unblocked strike deals that weapon's damage.
      -
        name: "javelin"
        description: "Melee attack: +5 to hit, reach 5 ft., one target; Block DC 13. Unblocked strike: 1d4 + 4 piercing damage."
      -
        name: "Overpower"
        description: >-
          Spend its bonus action or move action while taking its Attack action (including its listed
          Multiattack), replacing one weapon attack. Spend 1 rest die and make a Greataxe attack. On an
          unblocked strike, add the d12 result to damage; do not multiply this extra maneuver damage on a
          critical hit.
      -
        name: "Javelin Throw"
        description: >-
          Ranged attack: +5 to hit, range 30/60 ft., one target; Block DC 13. Unblocked strike: 1d4 + 4
          piercing damage. Throw: no disadvantage merely for a target being in melee range.
    ability_score_status: "sourced"
    source_recovery:
      kind: "numerical profile"
      original_name: "Mountain Orc"
      date: "2025-02-09"
      note: >-
        Recovered chat-search summary, not a verbatim transcript. Missing and conflicting rules were
        completed with explicit user authorization on 2026-11-27.
    original_5e:
      name: "Mountain Orc"
      date: "2025-02-09"
      recorded_statistics:
        ac: "10"
        hp: "13"
        scores:
          - "18"
          - "10"
          - "14"
          - "8"
          - "8"
          - "8"
        block: "0"
        greataxe: "+6,1d12+4"
      recovered_summary: "Later consolidated Mountain Orc; older AC12/HP24 and hide-derived Block are superseded."
      format: "Recovered search extract/summary; not a verbatim transcript or claim of an official published statblock."
    source_ref: "GPT discussion / 2025-02-09 / Mountain Orc; recovered summaries in the 2026-11-27 monster conversation"
    source_completion:
      fields:
        - "proficiency, senses and language defaults"
        - "complete action timings, save outcomes and escape procedures"
        - "current Block, conditions and weapon conversion"
      basis: >-
        Existing monster templates and current combat rules; new completion values are conversions rather
        than recovered source claims.
      cr_status: "Recorded encounter estimate; not a Varis balance certification"
    block_rules: >-
      Rested Block is max(0, Dexterity modifier); natural armor grants no extra Block or equipment
      training. Check +0. Temporary Block is spent first and does not stack; keep the higher grant. A
      successful Block negates damage and attached strike effects.
    conversion_notes:
      - >-
        Uses current Vara Block and conditions. Saving-throw-only and automatic damage cannot be Blocked;
        attack damage and attached strike effects require an unblocked strike.
      - >-
        Daily uses recover after 24 hours. Short-rest and long-rest uses follow the current one-day and
        one-week defaults. Recharge X-Y rolls 1d6 at the start of its turn while expended.
      - >-
        Uses the later AC10/HP13 profile. Current Greataxe DC+ and Very Inaccurate, current javelin
        dice/range and current maneuver costs replace legacy weapon labels.
      - >-
        Legacy frightened/restraint/confusion terminology is expressed through current
        Afraid/Snared/Confused conditions where applicable; legacy thunder damage is sonic. New completion
        values are not advertised as recovered source facts.
    replacement_sources:
      -
        name: "Current monster conversion guide"
        description: "docs/monsters.md / Conversion conventions"
      -
        name: "Block and checks"
        description: "data/draft-reference/combat.yaml / Block; Making a block check"
