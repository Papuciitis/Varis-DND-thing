      -
        name: "javelin weapon conversion"
        description: "data/weapons.yaml / javelin; historical monster-only dice overrides are identified in conversion notes."
    bonus_actions:
      -
        name: "Aggressive"
        description: >-
          Move up to its speed toward a visible hostile creature. If it closes the distance, gain 1 temporary
          Block until the start of its next turn; temporary Block does not stack.
    equipment:
      -
        name: "Greataxe"
        description: >-
          two-handed; very inaccurate; DC+. Current weapon properties and listed maneuvers apply; its trained
          loadout is included in the fixed monster statistics.
      -
        name: "javelin"
        description: >-
          balanced; throw 30/60. Current weapon properties and listed maneuvers apply; its trained loadout is
          included in the fixed monster statistics.
