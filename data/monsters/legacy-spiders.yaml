# Reviewed conversions from multiple source systems; see docs/cross-system-monsters.md.
section: monsters
entries:
- name: Monstrous Spiderling
  group: Monstrous spider age variants
  id: converted-monstrous-spiderling
  meta: Tiny beast, neutral
  size: Tiny
  type: beast
  alignment: neutral
  cr: 1/4
  ac: '13'
  hp: '2'
  speed: 15 ft., climb 15 ft.
  block: 3 / +3 check
  abilities:
    str: '3'
    dex: '17'
    con: '10'
    int: '1'
    wis: '10'
    cha: '2'
  proficiency_bonus: '+2'
  senses: darkvision 60 ft., scent 30 ft. (imprecise), passive Perception 10
  languages: —
  traits:
  - name: Spider Climb
    description: Can climb difficult surfaces, including ceilings, without an ability check.
  - name: Web Sense and Walker
    description: While touching a web, knows the location of any other creature touching that web. Ignores
      movement restrictions caused by webbing.
  actions:
  - name: Bite
    description: 'Melee attack: +5 to hit, reach 5 ft., one target; Block DC 13. Unblocked strike: 1d3 + 3
      piercing damage. The target makes a DC 10 CON save. Failure: 1d2 poison damage and Weakened for 1 minute;
      success: half poison damage and no Weakened. Repeat the save at the end of each turn to end Weakened.
      This toxin cannot reduce ability scores. '
  - name: Web (Recharge 5–6)
    description: 'Ranged attack: +5 to hit, range 30/60 ft., one Medium or smaller creature; Block DC 13. Unblocked
      strike: Snared until freed. The target or an adjacent ally can spend an action to make a STR or DEX check
      DC 13 to break or slip the strands. The web can also be attacked (AC 10, HP 5, fire vulnerability, poison/psychic
      immunity); destroying it frees the target. No damage on the initial web strike.'
  ability_score_status: reconstructed
  source_system: Legacy d20 homebrew / age progression table
  source_ref: User-supplied Huge Monstrous Spider by Age screenshot
  original_5e:
    source_system: Legacy d20 homebrew / age progression table
    age: Spiderling
    printed_size: Tiny
    printed_hp: 2
    printed_scores:
    - 3
    - 17
    - 10
    - —
    - 10
    - 2
    printed_cr: 1/4
    printed_ac: not supplied
    printed_attack: +5; 1d3
    printed_poison: 1d2 STR damage; DC 10
    printed_frightful_presence: —
    alignment: neutral
  source_completion:
    fields:
    - current proficiency, saves, Block, action costs, durations and escape procedures
    - Missing AC 13, walking/climbing speed 15 ft., web action and senses are current-template completions;
      INT 1 represents a mindless body.
    cr_status: Provisional Varis encounter estimate; not a balance certification
  source_conversion:
    theme: Forests & wilds
    attack_profiles:
    - name: Bite
      ability: dex
      bonus: 5
      block_dc: 13
      dc_adjustment: 0
      damage_modifier: 3
      offset: 0
    - name: Web
      ability: dex
      bonus: 5
      block_dc: 13
      dc_adjustment: 0
      offset: 0
    batch: 2026-11-28-cross-system
  block_rules: 'Rested Block is max(0, DEX modifier); natural armor grants neither equipment Block nor armor
    training. Temporary Block does not stack: keep the higher grant. A successful Block negates blockable damage
    and attached strike riders. Saving-throw-only and automatic damage cannot be Blocked.'
  conversion_notes:
  - Adapted to current Varis rules. Source-system bonuses and action economies are not interchangeable; original
    statistics remain in the source panel.
  - Daily uses recover after 24 hours; a short rest is one day and a long rest is one week. Recharge rolls
    1d6 at the start of its turn while expended.
  - CR is a provisional encounter estimate. Powers with completed timings, limits or escape methods are conversions,
    not missing published text.
  - Old size bonuses, BAB, Fort/Ref/Will and escalating poison DCs are replaced with current proficiency and
    six saves. Legacy STR damage becomes HP poison damage plus Weakened with recovery. No frightful presence
    is invented from the empty source column. Mature forms' extra attack routine is a documented completion.
  replacement_sources:
  - name: Current monster template
    description: docs/monsters.md
  - name: Block, equipment, conditions and rests
    description: data/draft-reference/combat.yaml; data/draft-reference/armor-and-shields.yaml; data/weapons.yaml;
      data/conditions.yaml; data/draft-reference/progression.yaml
  saving_throws: STR -4, DEX +3, CON +0, INT -5, WIS +0, CHA -4
  source_ability_scores:
    method: Physical/WIS/CHA scores copied from the table; absent INT completed as 1 for a mindless spider.
    printed:
    - 3
    - 17
    - 10
    - —
    - 10
    - 2
    note: Physical/WIS/CHA scores copied from the table; absent INT completed as 1 for a mindless spider.
