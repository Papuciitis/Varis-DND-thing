    proficiency_bonus: "+4"
    senses: "darkvision 120 ft., blindsight 30 ft., passive Perception 16"
    languages: "—"
    traits:
      -
        name: "Water Breathing"
        description: "Breathes water; can survive out of water for 10 minutes before normal suffocation rules apply."
      -
        name: "Abyssal Camouflage"
        description: "Advantage on Dexterity (Stealth) checks while submerged and stationary."
    actions:
      -
        name: "Multiattack"
        description: "Make one Bite and two Tentacle attacks. Resolve each attack and Block separately."
      -
        name: "Bite"
        description: "Melee attack: +11 to hit, reach 10 ft., one target; Block DC 19. Unblocked strike: 4d8 + 7 piercing damage."
      -
        name: "Tentacle"
        description: >-
          Melee attack: +11 to hit, reach 20 ft., one target; Block DC 19. Unblocked strike: 3d6 + 7
          bludgeoning damage. A Large or smaller target is Grappled (escape DC 18: spend an action to make a
          Strength (Athletics) or Dexterity (Acrobatics) check). The grapple ends if the grappler is
          Incapacitated or the target leaves its reach. Each of its two tentacles holds at most one target.
      -
        name: "Constrict"
        description: >-
          Melee attack: +11 to hit, reach 20 ft., one target; Block DC 19. Unblocked strike: 4d8 + 7
          bludgeoning damage. May target only a creature it currently grapples; an unblocked strike also
          applies Snared until that grapple ends.
    ability_score_status: "reconstructed"
    source_recovery:
      kind: "lore-only or fragmentary source"
      original_name: "Rhedottoia Reaper"
      date: "2023-07-28"
      note: >-
        Recovered chat-search summary, not a verbatim transcript. Missing and conflicting rules were
