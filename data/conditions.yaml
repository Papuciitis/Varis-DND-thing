conditions:

  other conditions:
    Prone:
      desc: >-
        A prone character's movement speed is reduced to 5 feet. Ranged attacks against them that are not in point-blank
        range have disadvantage. Melee attacks against them have advantage. A prone character's melee attacks have disadvantage. You can
        spend a bonus action to stand up and end the condition.

    Fatigue:
      desc: >
        When an ability makes a character gain fatigue, record the damage as a condition with levels from 1 to 10, with 10 the highest.
        Each level of fatigue applies an increasing penalty to rolls.
        
        1: -1 penalty.
        2: -1d2 penalty.
        3: -1d3 penalty.
        4: -1d4 penalty.
        5: -1d6 penalty.
        8: -1d8 penalty.
        9: -1d10 penalty.
        10: -1d12 penalty. When gaining more fatigue, instead make a DC 10 constitution save, and automatically fail a death
        save on a failure.
      
        The rules do not specify penalties for the two unlisted levels.

        Fatigue is fully restored during a long rest.
        After a short rest, a number of levels of fatigue are lost equal to your con modifier (min 1).
        During a short rest, you can choose to spend 1 rest die to remove one level of fatigue.

    Grappled:
      desc: >-
        A grappled character is usually grappled by at least one other character. 

        Grappled characters cannot make move actions, but can spend a move action to attempt a contested strength check to move themselves and the grappling character 5 feet.
        Grappled characters have disadvantage on block checks.

        The grappled condition ends if the restraining character is incapacitated, or if by some effect the grappled character exits the reach of their grapplers.

    On-fire/Burning:
      desc: >-
        Creatures set on fire take damage at the start of each of their turns, 
        depending on their size (small/smaller - 1d4, medium - 1d6, large - 1d8, etc.)

        Becoming soaked can end the condition.

        A character may also drop prone and roll, making a Dexterity save at the start of the action. On a success, the burning condition ends.

    Bleeding:
      desc: >-
        Creatures that are bleeding take damage at the end of their turn. Damage is determined by size:
        (small/smaller - 1d4, medium 1d6, large/larger - 1d8)
        Bleeding stacks, multiplying the dice per stack.

        At the start of a character's turn, they may make a DC 15 constitution save to remove 1 stack
        of bleeding.

        A DC 15 medical check with either a rag, bandage, or a set of healer's or doctor's tools may be
        performed by a character to remove 1 stack of bleeding.

        If magic or alchemy heals you with an effect that restores health
        and involves dice ("restore 2d6+2 HP" instead of "Restore 2 HP") you may forgo one die and
        remove one instance of bleeding instead.

    Frostbite:
      desc: >-
        Frostbite may stack.
        A frostbitten character must make a DC 17 constitution save every minute, taking 1 cold 
        damage on a failure, and gaining 1 fatigue on a critical failure. On a nat 20, remove 1 stack.
        The DC is increased by 1 per stack of frostbite beyond the first.

        If hours are used, increase it to 1d6 per stack.

        If magic or alchemy heals you with an effect that restores health
        and involves dice ("restore 2d6+2 HP" instead of "Restore 2 HP") you may forgo two dice and
        remove one instance of frostbite instead.

    Soaked:
      desc: >-
        Entering water makes you soaked.

        You have resistance to fire damage, so long as that damage is 10 or less.

        You have disadvantage on saves against spells and abilities that deal lightning or cold damage.

    Maimed:
      desc: >-
        A maimed creature has loss of function significant enough to not permit using an action and
        a bonus action in a single turn. Once one is performed, the other is lost.

    Melting:
      desc: >-
        A melting character takes 1d10 acid damage at the start of their turn. This is doubled
        for constructs.

        Melting must always be applied with a duration, indicating how many turns it lasts. If none
        is provided, assume this lasts 1 round.

    Invisible: 
      desc: >-
        An invisible creature is impossible to see without the aid of magic or a special sense. 
        The creature's location can still be discovered by noises it makes or tracks it leaves.
        
        Attack rolls against invisible creatures have disadvantage, even if that attacker is aware of
        where the invisible creature is supposed to be.

    Ethereal:
      desc: >-
        An ethereal creature becomes immune to physical damage and unable to attack or meaningfully
        interact with the material world, but can still be detected as their ghostly image remains
        visible. 
        
        An ethereal creature can walk on solid physical surfaces of any kind, may move 
        through walls as though there were nothing there, and has perfect darkvision. While walking
        through a solid, they move at the fastest of their climb, swim, or fly speed.

        If an ethereal creature loses its ethereal nature while encased or moving through solids, 
        they are forcefully thrown to the nearest free tile in the physical world, taking fall damage
        as though they fell twice the distance traveled.

    Diseased:
      desc: >-
        A diseased character is any character who has contracted a disease. If a diseased character
        spends no rest dice during a short rest, they may attempt a Constitution save against the disease.
        On a success, they may lose one mundane disease.

        The DC and negative effects are specific to each disease, but being diseased makes healing half
        as effective (rounded down, min 0.)

        On a long rest, if given good conditions, a character may lose all diseases.

    Pinned:
      desc: >-
        The character cannot move, and cannot change their prone/upright status. They may still perform actions and bonus actions.



    


  
  loss of function conditions:

    Dazed: 
      desc: You cannot use bonus actions.

    Shocked: 
      desc: You cannot use reactions.
      special: If below 9 constitution, make a DC 10 wisdom save when becoming shocked, fainting on a failure.

    Blinded: 
      desc: You cannot see, make block checks, or make vision-based checks. All attacks you make have disadvantage, and you can only target adjacent tiles.

    Deafened: 
      desc: You cannot hear or make hearing-based checks.
      special: When casting spells with verbal components, make a DC 15 performance check. The spell fizzles on a failure.

    Incapacitated:
      desc: You cannot perform any action or reaction.

    Winded:
      desc: You cannot perform reactions. At the start of your turn, you must forfeit one action, bonus action, or move action. 
      special: Becoming winded again requires a DC 13 constitution save. On a failure, the character becomes exhausted for the duration instead.

    Exhausted:
      desc: You cannot perform reactions. At the start of your turn, you must forfeit two action types (regular, bonus, or move.)
      special: Becoming winded or exhausted while exhausted instead incurs 1 damage to fatigue.

    Stunned: 
      desc: You are incapacitated and your block checks have disadvantage. You can only speak semi-coherently.
      special: You automatically fail strength, dexterity, intelligence, and wisdom saves if those attributes are below 15. Otherwise they are made with disadvantage.

    Paralyzed: 
      desc: You are incapacitated, cannot block, cannot speak or make saves. You automatically fail strength, dex, int, and wis saves.

    Hobbled:
      desc: Cannot spend move actions. Movement speed is halved. May still move or dash with a standard action.
      special: If below 10 dexterity, movement speed is instead reduced to 1/3 (rounded up, min 5 ft.)

    Snared: 
      desc: Cannot move.



  disadvantage conditions:

    Weakened: 
      desc: Your attacks have disadvantage.

    Off-balance:
      desc: Your block checks have disadvantage.

    Disoriented: 
      desc: Your attack and block checks have disadvantage. You cannot target creatures further than 15 ft away.

    Sickened: 
      desc: Your physical skill checks and saves have disadvantage.
      special: You must make a DC 14 constitution save when consuming a potion in order to keep it down and benefit from its effect.

    Confused: 
      desc: Your mental skill checks and saves have disadvantage. You cannot make reactions or maintain concentration.
      special: If below 10 intelligence, you cannot read or cast spells with verbal or somatic components.

    Poisoned: 
      desc: Your saves and skill checks have disadvantage.

    Intoxicated: 
      desc: Your d20 rolls have disadvantage.

  
  combat conditions:

    exposed:
      desc: The next attack against you has advantage.
      special: Unless otherwise stated, taking damage or moving removes the condition.

    tricked:
      desc: The next maneuver against you has no cost, or the next save you make has disadvantage.
      special: Unless otherwise stated, taking damage, moving, or making a save removes the condition.

    distracted:
      desc: Your mental skill checks and saves have disadvantage. You cannot take reactions or maintain concentration.


  fear effect conditions:

    shaken:
      desc: You have a -1d4 penalty to d20 rolls.
      special: >-
        If you become demoralized again, make a DC 14 wisdom save, becoming afraid for the duration instead.

    afraid:
      desc: You have a -1d8 penalty to d20 rolls.
      special: >-
        If the source of your fear is detectable, you must either spend your movement actions at the start of your 
        turn to move away or you must forfeit them. If you become afraid again, you must make a DC 15 wisdom save, 
        becoming terrified instead.

    terrified:
      desc: You have a -1d12 penalty to d20 rolls. Same movement action rules as fear.
      special: >-
        If you become terrified again, you must make a DC 16 wisdom save, taking a failed death save on a failure.


  enchantment effect conditions:

    charmed:
      desc: >-
        A charmed creature can't attack the charmer or target the charmer with harmful abilities or magical effects.
      special: The charmer has advantage on any ability check to interact socially with the creature.
      
    fascinated:
      desc: >-
        A fascinated creature cannot target creatures other than the source of its fascination, and has disadvantage 
        on perception checks on things other than the source of its fascination.
      special: Taking damage, direct interaction, and sudden noises end the condition.

    enraged:
      desc: >-
        An enraged creature must make an attack action or otherwise attack at the start of their turn if
        possible, and treats all other creatures as enemies for the purposes of spells and abilities. An enraged 
        creature must make saves even VS previously allied or beneficial spells.
      special: >-
        If below 11 intelligence, not performing an attack at the start of your turn results in taking 1d6 
        psychic damage.
 
    hypnotized:
      desc: >-
        A hypnotized creature is fascinated and charmed by the source of hypnosis. A hypnotized creature automatically fails
        its non-constitution saves.
      special: damage or pain end the condition unless otherwise stated.

    compulsion:
      desc: >-
        A compelled character must spend actions in accordance with its source of compulsion.
      spec: If above 18 wisdom, may make a wisdom save at the start of the turn to become stunned for 1 round.

    madness:
      desc: A creature with madness has disadvantage on all skill checks and mental saves, and cannot benefit from their proficiency modifier.
      special: If below 18 intelligence, madness also prevents coherent speaking. If below 12, you automatically fail perception checks.

    clarity:
      desc: >-
        A creature with clarity has advantage on their mental saves and block checks.
        A creature with clarity cannot become enraged, hypnotized, or charmed.
        Creatures with clarity move before creatures without clarity in turn order.
    


     