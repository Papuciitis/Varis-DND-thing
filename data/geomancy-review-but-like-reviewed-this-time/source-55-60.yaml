section: geomancy-review
entries:
- name: Boulder Roll
  group: 4th level
  level: '4'
  school: geomorphy
  casting: 1 action
  range: 60 feet
  components: V, S, M (a small stone)
  duration: Instantaneous
  classes: Druid, Ranger, Sorcerer, Wizard
  description: You create a large boulder and roll it in a straight line. Each creature in the boulder's path must
    make a Dexterity saving throw, taking 3d10 bludgeoning damage on a failed save, or half as much damage on a
    successful one.
  review: kinda funny. A rolling disk/boulder/hazard spell is a neat idea. Idk if boulder is the right word. it
    needs something extra though. Also perhaps should be sub-effect of bigger geomancy spell.
  higher_levels: When you cast this spell using a spell slot of 5th level or higher, the damage increases by 1d10
    for each slot level above 4th.
  source_ref: draft2.pdf / PDF page 55
- name: Earthbound Echo
  group: 4th level
  level: '4'
  school: geomorphy
  casting: 1 reaction, which you take when you are hit by an attack
  range: 30 feet
  components: V, S
  duration: 1 round
  classes: Druid, Sorcerer, Warlock, Wizard
  description: You bind the spirit of a creature that attacks you to the earth, reducing its speed by half until
    the end of its next turn.
  review: binding smite but without the smite part. This is sort of just earth bind.
  higher_levels: When you cast this spell using a spell slot of 5th level or higher, the speed is reduced by another
    half for each slot level above 4th.
  source_ref: draft2.pdf / PDF page 55
- name: Rockplica
  group: 4th level
  level: '4'
  school: geomorphy
  casting: 1 action
  range: Self
  components: V, S
  duration: Concentration, up to 1 minute
  classes: Artificer, Sorcerer, Wizard
  description: You create a stone duplicate of yourself. The duplicate has half your hit points and can perform
    any action you can, but it cannot move more than 30 feet from you. The duplicate disappears when it reaches
    0 hit points or when the spell ends.
  review: too complex. needs stat block, needs more rules for what specifies "any action you can" also too narrow.
    But, a mimic tear effect from elden ring is a funny idea. kinda strong though. needs rework.
  higher_levels: When you cast this spell using a spell slot of 5th level or higher, the duplicate gains an additional
    10 hit points for each slot level above 4th.
  source_ref: draft2.pdf / PDF page 57
  summon_label: Related monster option (converted)
  summons:
  - monster: Rockplica duplicate
- name: Temblor
  group: 4th level
  level: '4'
  school: geomorphy
  casting: 1 action
  range: 60 feet
  components: V, S
  duration: Instantaneous
  classes: Druid, Sorcerer, Warlock, Wizard
  description: You cause the ground in a 20-foot radius to shake violently. Each creature in the area must make
    a Dexterity saving throw or be knocked prone and take 4d6 bludgeoning damage.
  review: help, I fell and took ENOUGH DAMAGE TO KILL A FAMILY. 8D It seems kinda eh tbh. its just an aoe spell.
  higher_levels: When you cast this spell using a spell slot of 5th level or higher, the damage increases by 1d6
    for each slot level above 4th.
  source_ref: draft2.pdf / PDF page 58
- name: Bloomguard
  group: 5th level
  level: '5'
  school: geomorphy
  casting: 1 action
  range: Touch
  components: V, S, M (a seed from a resilient plant, worth at least 100 gp)
  duration: Instantaneous
  classes: Druid
  description: You touch a plant, causing it to grow rapidly and become incredibly resilient. The plant can be used
    as cover and is nearly impossible to destroy.
  review: I guess. The wording needs to be better. Nearly impossible seems odd.
  higher_levels: 'When you cast this spell using a spell slot of 6th level, the duration is 1 day. When you cast
    this spell using a 7th-level spell slot, the duration is 10 days.


    When you cast this spell using an 8th-level spell slot, the duration is 30 days.


    When you cast this spell using a 9th-level spell slot, the duration is a year and a day.'
  source_ref: draft2.pdf / PDF page 59
  source_notes: The source prints an instantaneous base duration and finite durations at higher levels. A Resilient
    Plant statblock accompanies the source spell; its converted monster option is separate.
  summon_label: Related monster option (converted)
  summons:
  - monster: Resilient Plant
- name: Boulder's Dominion
  group: 5th level
  level: '5'
  school: geomorphy
  casting: 1 action
  range: 150 feet
  components: V, S
  duration: Concentration, up to 10 minutes
  classes: Druid, Wizard
  description: You gain control over all stone within a 50-foot radius of designated, allowing you to shape it as
    you wish. You can shape up to 10 cubic feet of stone per round and create structures, weapons, or other objects
    from the stone, but they cannot have any moving parts. All the alterations are permanent.
  review: already exists I think. theres versions of this, or at least should be, in game. If not, sure lvl 5 or
    6 mystic spell perhaps?
  higher_levels: When you cast this spell using a spell slot of 6th level or higher, the radius of the effect increases
    by 10 feet for each slot level above 5th.
  source_ref: draft2.pdf / PDF page 60
- name: Dunedash
  group: 5th level
  level: '5'
  school: geomorphy
  casting: 1 bonus action
  range: Self
  components: V, S
  duration: 1 minute
  classes: Druid, Sorcerer, Warlock, Wizard
  description: You transform into a whirlwind of sand. You gain a flying speed of 60 feet, and you can enter and
    occupy the space of another creature. At the start of each of your turns, you can deal 3d10 slashing damage
    to any creature whose space you occupy.
  review: lvl 6 occult maybe, alongside things like verminform or similar. Maybe occult 4 or 5 now that I think
    about it.
  higher_levels: When you cast this spell using a spell slot of 6th level or higher, the flying speed increases
    by 10 feet and the damage increases by 1d10 for each slot level above 5th.
  source_ref: draft2.pdf / PDF page 60
- name: Earth's Awakening
  group: 5th level
  level: '5'
  school: geomorphy
  casting: 1 action
  range: 150 feet
  components: V, S
  duration: Concentration, up to 1 minute
  classes: Druid, Warlock, Wizard
  description: You cause the ground in a 50-foot radius to come to life, sprouting arms and legs. The ground can
    attack creatures within the area, dealing 4d10 bludgeoning damage. The summoned creature can use its action
    to make a Strength check against your spell save DC to free itself from your control.
  review: needs work.
  higher_levels: When you cast this spell using a spell slot of 6th level or higher, the damage increases by 1d10
    for each slot level above 5th.
  source_ref: draft2.pdf / PDF page 60
  source_notes: An Awakened Earth statblock accompanies the source spell; its converted monster option is separate.
  summon_label: Related monster option (converted)
  summons:
  - monster: Awakened Earth
