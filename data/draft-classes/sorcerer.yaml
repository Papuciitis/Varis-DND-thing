# https://sites.google.com/view/dnd5plus/home/classes/sorcerer-x
- name: Sorcerer
  group: Base class
  description: A sorcerer is someone who has become themselves infused with arcane magic, bypassing the need for arcane
    runes as they themselves have become the imprinted arcana with a will of its own. Some are born with such a gift, while
    others have it inflicted on them, either willingly or otherwise. For some this grants great power, allowing them to
    will the arcane, while for others it manifests in negative side-effects.
