# https://sites.google.com/view/dnd5plus/home/classes/barbarian-x
- name: Barbarian
  group: Base class
  description: The barbarian is a survivor and a threat, the one who relies on nothing other than their own raw strength
    and might to carry on, and one who harbors a deep and powerful rage.
  sections:
  - heading: Class progression
    body:
      columns:
      - Level
      - Proficiency bonus
      - Features
      - Battle dice
      rows:
      - - '1'
        - '+2'
        - Barbarian ways, Rage
        - '-'
      - - '2'
        - '+2'
        - Barbarian traits, Used to trouble
        - '-'
      - - '3'
        - '+2'
        - Ability score improvement
        - '-'
      - - '4'
        - '+3'
        - Battle dice
        - 1d8
      - - '5'
        - '+3'
        - 1st archetype
        - 1d8
      - - '6'
        - '+3'
        - Ability score improvement
        - 1d8
      - - '7'
        - '+4'
        - '-'
        - 1d10
      - - '8'
        - '+4'
        - Ability score improvement
        - 1d10
      - - '9'
        - '+4'
        - 2nd archetype
        - 1d10
