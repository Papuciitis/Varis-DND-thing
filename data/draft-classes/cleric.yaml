section: classes
entries:
# https://sites.google.com/view/dnd5plus/home/classes/cleric-x
- name: Cleric
  group: Base class
  description: In the kingdoms of men and other lands of order, there is a respect for those that bear the oaths that remain.
    The oaths are old traditions that bind their adherents with magic, older than the kingdoms themselves. A cleric is one
    who has taken on such oaths in the name of a greater good. While some declare their fealty to the oaths in the name
    of higher powers or gods, others partake in royal rituals and ceremonies, while others see the oaths themselves to bear
    a spirit that they serve, all clerics understand that their life is burdened with great purpose.
