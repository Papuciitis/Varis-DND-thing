# https://sites.google.com/view/dnd5plus/home/classes/bard-x
- name: Bard
  group: Base class
  description: In a world of arcane lore, alchemical mysteries, ancient ruins, dark cults, and sorcerer kings, there still
    remains room for a bit of gossip and entertainment. The bard is a socialite, and while neither warlord, nor arch-mage,
    nor high priest, the bard is the all-round traveled chronicler of these figures.
  sections:
  - heading: Class progression
    body:
      columns:
      - Level
      - Proficiency bonus
      - Features
      - Inspiration die
      - Talent spells
      rows:
      - - '1'
