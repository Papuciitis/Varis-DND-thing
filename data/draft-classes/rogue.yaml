# https://sites.google.com/view/dnd5plus/home/classes/rogue-x
- name: Rogue
  group: Base class
  description: The rogue is someone who does not pretend to ignore the more unfair and exploitative aspects of life. You
    prefer to win the fight, get the gold, or have the last laugh, plain and simple. Life's short and one best not worry
    about adhering to rugged paths when cunning and speed can serve them better in the here and now.
  sections:
  - heading: Class progression
    body:
      columns:
      - Level
      - Proficiency bonus
      - Sneak attack
      - Features
      rows:
      - - '1'
        - '2'
        - 1d6
        - Sneak attack, Expertise, Dodge
      - - '2'
