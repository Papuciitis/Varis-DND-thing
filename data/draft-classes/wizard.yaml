  - heading: Health and proficiencies
    body: "Hit dice: 1d6\n\nArmor: none\nWeapons: light crossbow, dagger, quarterstaff\nTools: \nSaving throws: intelligence\
      \ and wisdom\nSkills: 2 of arcana, history, religion, nature, mechanism, perception, insight, or medicine."
  - heading: Equipment
    body: |-
      You start with the following equipment, in addition to the equipment granted by your background:

      * (a) quarterstaff, or (b) a dagger
      * (a) a cartographer's pack, (b) a dungeoneer’s pack, or (c) an explorer’s pack
  - heading: Spellcasting
    body: |-
      At 1st level you gain the ability to cast arcane spells. You start with a spell book with 2 level 1 spells, and an additional number of level 1 spells equal to your intelligence bonus. During a long rest, you can prepare any combination of spells, up to the number of prepared spells specified in the class table.

      When leveling up, you can add 1 more arcane spell of any spell level you can cast to your spellbook.

      You can copy over spells into your spellbook as written in the base rules.

      Your casting attribute is intelligence.

      The DC of your spells is equal to 8 + your proficiency + your intelligence modifier (min 0)
