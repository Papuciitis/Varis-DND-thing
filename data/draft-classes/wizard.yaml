# https://sites.google.com/view/dnd5plus/home/classes/wizard-x
- name: Wizard
  group: Base class
  description: A wizard is a practitioner of the arcane who, either through genius, madness, stubbornness, or sheer dedication,
    has managed to understand and decipher the various arcane models, texts, diagrams, metaphors, and explanations of the
    orders, schools, and mystics of the world to a sufficient degree. Unlike sorcerers and clerics, wizards neither bind
    their magic to a higher oath, nor rely on another's gift. Rather, they have dedicated their lives and training to be
    able to wield and interface with the arcane aspects of magic by their own will and hand alone. It is the nature of the
    arcane to be extendable to the material world, and as such most wizards rely on the use of rune magic in some form,
    typically personal spell books.
