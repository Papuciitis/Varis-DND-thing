section: classes
entries:
# https://sites.google.com/view/dnd5plus/home/classes/druid-x
- name: Druid
  group: Base class
  description: Of the old ways that are forgotten by history, the druids are the mystics, fortunetellers, oracles, and grove
    wardens that are the inheritors of dying and less known traditions. Druids are either given or have earned the magical
    gift of mysticism from the descendants of the old circles, which are rumored to be orders whose founding oaths are long
    since lost.
