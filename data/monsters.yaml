- name: False wisp
  group: Workbook reference creatures
  meta: small elemental, aberration
  cr: '2'
  ac: '14'
  status: Incomplete draft
  notes:
  - Workbook reference variant. The existing spell's rules and embedded creature statistics take priority
    where they differ.
  - The source does not provide HP, speed, actions.
  source_ref: dnd spreadsheet.xlsx / creatures!A12:P12
  hp: '4'
  speed: Fly 25 ft. while following; fly 60 ft. while bothering or protecting
  abilities:
    str: '1'
    dex: '28'
    con: '10'
    int: '13'
    wis: '14'
    cha: '11'
  block: 9 / +9 check
  actions:
  - name: Follow a creature
    description: 'Use the existing Conjure minor wisp behavior: follow a creature the controlling caster
      can see or is keenly aware of, flying 25 feet per round for 1d12 minutes.'
  - name: Bother a creature
    description: 'Use the existing Conjure minor wisp behavior: pursue a creature the controlling caster
      can see or is keenly aware of at 60 feet per round for 1 minute. On reaching it, the target makes
      a Dexterity save against the controlling caster''s spell save DC each round for 1d6 rounds; failure
      Distracts it for that round and forces it to remake any concentration check.'
  - name: Protect a creature
    description: 'Use the existing Conjure minor wisp behavior: pursue the assigned creature at 60 feet
      per round, then impose disadvantage on one incoming attack per turn. These three behaviors are the
      wisp''s only chosen actions. It always knows its assigned target and automatically fails all saving
      throws, as specified by the current spell.'
  source_completion:
    original_missing_fields:
    - hp
    - speed
    - abilities
    - block
    - actions
    donors:
    - fields:
      - hp
      - speed
      - actions
      source: data/draft-spells/lvl-1-arcane-spells.yaml / Conjure minor wisp
      link: '#section=spells&group=Arcane+spells&entry=Conjure+minor+wisp'
    - fields:
      - abilities
      source: Basic Rules 2014 / Will-o'-Wisp / six ability scores only
      link: https://www.dndbeyond.com/monsters/17060-will-o-wisp
    - fields:
      - block
      source: data/draft-reference/combat.yaml / Block and Making a block check; published wisp DEX 28
      link: '#section=rules&group=Combat&entry=Block'
    note: The workbook gives only name, type, CR 2 and AC 14; all remain unchanged. HP, movement and non-damaging
      behaviors use the existing current Conjure minor wisp profile. That spell has no six-score array,
      so the published CR 2 Will-o'-Wisp supplies only those missing attributes; none of its attacks,
      life drain, immunities or undead type are imported. Current DEX-based Block gives nine instances
      and +9 with no armor training. When actually casting Conjure minor wisp, its own AC 20, tiny size
      and action restrictions take priority; this completed False wisp remains a separate workbook reference
      variant, with its original CR rather than a newly calculated balance rating.
