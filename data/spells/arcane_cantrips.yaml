- name: arcane eye
  types: ["arcane","divination","concentration"]
  lvl: "0"
  components:
    - somatic
  range: "self"
  casting: "action"
  duration: "concentration"
  effect: ->
    As an action assume an arcane lens between both hands. This allows you to gain darksight through it in a narrow arc, and allows you to see through illusions with it. 
    It remains so long as you retain concentration and retain both hands free to form the lens. The lens grants a faint aura-sight out to a range of 5ft.
  upgrades: >-
    The range of the aura-sight is increased by 5ft per casting midifier.
    At 5th level, you can form the lens with one hand 
    At 9th level, the lens simply hovers in front of one of your eyes, and you no longer need your hands to manage it.

- name: arcane hex
  types: ["arcane","necromancy","curse"]
  lvl: "0"
  components:
    - somatic
    - verbal
  range: "30ft"
  casting: "action"
  duration: "1 minute"
  effect: >-
    As an action, force a creature within 60ft to make a wisdom save. On a failure, they become the subject of a lesser arcane curse for 1 minute. For the duration of the 
    spell, your spell attacks and spell DCs are increased by 1 against the target. 
    
    Only one hex can be applied at a time. Casting a new hex dispells the previous.
  upgrades: >-
    At 3rd, 7th, and 11th level, choose an upgrade: 
     * The bonus for spell attacks and DCs is increased by 1. Can be taken multiple times
     * The next spell attack you make against the target has advantage, or the next save the target makes against your spells incurs disadvantage, whichever comes first. 
     * The bonus is increased by 2 for transmutation spells you cast.
     * The bonus is increased by 2 for evocation spells you cast.
     * The bonus is increased by 2 for necromancy spells you cast.

- name: arcane inscription
  types: ["arcane","divination","illusion"]
  lvl: "0"
  components:
    - somatic
    - material(ink, or chalk)
  range: "touch"
  duration: "permanent"
  casting: "action"
  effect: >-
    As an action, inscribe up to a square foot large rune on an object within range. The rune is visible only to you and those that have either arcane or true sight, or 
    if investigated with the detect magic spell. The rune can contain a message made of up to 25 symbols.
    
    You may have only such created rune at a time. When a new rune is created, the oldest existing rune is dispelled.
  upgrades: >-
    At 1st, 4th, 7th, and 10th level, choose an upgrade: 
    * You always know the direction towards a rune, so long as there is a possible path. 
    * Allows the maximum size of the inscribed surface to be up to a 5ft square.
    * You can listen to the surroundings of a rune, regardless of distance. If you are in another plane, listening will require concentration.
    * The amount of symbols possible is increased by 25 and it can be visible to targets of choice with regular sight.
    * Can be inscribed on a willing creature, granting it a +1 bonus to intelligence saves. 
    * You can have an extra rune active. Can be taken multiple times. 
    * When inscribed on a weapon, the weapon deals 1 extra force damage. Repeatable.
    * You gain a +1 bonus to checks made to decipher runes. Repeatable.
    * When inscribed on a floor, allows you to place a touch spell in it, sacrificing a spell slot in the process, and casting it on the next enemy creature that steps on it.

- name: minor illusion
  types: ["arcane","illusion","concentration"]
  lvl: "0"
  components:
    - somatic
  range: "30ft"
  duration: "10 minutes"
  casting: "action"
  effect: >-
    As an action, perform or maintain one of the following effects: 
      * Lesser image - create an image of an object or creature within range. The image cannot occupy more than a 5-foot cube. The image cannot emit more than a dim light, and 
        the image must remain in place, either fixed to a point, or fixed to an object. The image cannot give off sound or smell, or other such sensory effect. If a creature 
        examines the image, it must make an intelligence save. On a success, it sees that it is an illusion.
     
      * Phantasmal sound - create a sound originating anywhere within range. The sound can vary in volume from almost silent to a scream, and can be of anything of your 
        choosing. It can be either discrete, or continuous.
      
      * Light - cause an small or smaller object within range to shine a light up to half the range of this spell. The brightness and color of the light is up to you, and you 
      can cause it to alternate in a particular pattern.
  upgrades: >-
    At 5th and 9th level, increase the range of this spell by 30 feet. Also at those levels, choose an upgrade: 
      * Gain a +1 bonus to the DC of your illusion spells.
      * You can choose phantasmal sound to originate in the ears of a creature within range, dealing 1d4 nonlethal sonic damage, if it can hear.
      * Lesser image can be moved up to 30 feet per turn, and can emit low volume, simple sounds.
      * Light can be momentarily cast in the eyes of a creature within range. The creature must make a constitution save. On a failure, they are blinded for 1 turn.

- name: minor necromancy
  types: ["arcane","necromancy"]
  lvl: "0"
  components:
    - somatic
    - verbal
  range: "30ft"
  duration: "per effect"
  casting: "special"
  effect: >-
    You have dabbled in necromancy, gaining the ability to perform the following effects as an action:
      * False life: As an action, cause a recently dead creature to forcefully come to life for one turn. A creature cannot be subject to this effect more than twice in its 
        existence. After 1 turn the creature collapses again and its decay is accelerated. The creature cannot act beyond speaking, looking, or pointing.

      * Suppress: As an action deal 1d4 necrotic damage to a creature within range. Deals double damage to temporary health.

      * Shortcut: As a bonus action take 1 necrotic damage and gain a +1 bonus to your next d20 roll until the end of your next turn (1 round)
  upgrades: >-
    At 2nd, 6th, and 10th level choose an upgrade:
      * Double the effect of one of the cantrip abilities, if possible. Can be taken multiple times. Progression is linear, not geometric (1d4 > 2d4 > 3d4)
      * Double the duration of one of the cantrip abilities, if possible. Can be taken multiple times. Progression is linear, not geometric.
      * Learn a new ability: fleshmend - As an action, heal a non-construct non-elemental creature below 10 health by 1d4 HP.

- name: prestidigitation
  types: ["arcane", "illusion", "transmutation", "conjuration"]
  lvl: "0"
  components:
    - somatic
    - verbal
  range: 10ft
  duration: persistent
  casting: "action"
  effect: >-
    As an action, you can manifest any of the following effects:
      * Cause a mundane near-worthless(Subject to GM) object that can fit in your hand to manifest within range.
      * Instantly light or snuff out a candle, torch, or small campfire.
      * Instantly clean or soil an object or area no larger than 1 cubic foot.
      * Cause a pen, ink, and scroll to write to your liking.
      * Cause an instantaneous, harmless sensory effect, such as a small flash, a funny smell, a slight breeze, or a faint tune.
      * Create a nonmagical trinket or an illusory image that can fit in your hand. It lasts until the end of your next turn.
      * Cause an article of clothing to alter in appearance in a way that does not alter the material it is made of. Can alter color or markings.
      * Cause small objects such as stools, pebbles, and clothes etc. in a 5ft cube to become organized in some way. Clothes become folded, pebbles are piled up neatly, etc.
      * Cause a small light object such as a dagger, cup, or book to levitate lightly within range.
      
    If you cast this spell multiple times, you can have up to three of its non-instantaneous effects active at a time, and you can dismiss such an effect as an action.
  upgrades: >-
    At 5th level, you may choose to learn one of the following upgrades:
      * You may cast this cantrip as a bonus action
      * You may retain up to 5 effects.

- name: ward 
  types: ["arcane", "abjuration"]
  lvl: "0"
  components:
    - somatic
    - verbal
  range: self
  duration: instant
  casting: action
  effect: >-
    When making a block check, you may spend a reaction to roll a spell attack (1d20 + prof + casting bonus) in place of a block check.
  upgrades: >-
    At 5th and 9th level, choose an upgrade:
      * You can cast this spell as a reaction to an ally within 10 feet being attacked, effectively blocking in their place. If you fail, the ally may still attempt to block.
      * You gain a +1 bonus to the block check. Can be taken twice.
      * You can also cast ward as a reaction when making a saving throw, to grant yourself a 1d4 bonus to it.
      * You gain a +1 bonus to death saves. Increases to +2 at 9th level.
  
- name: lesser cryomancy
  types: ["arcane", "evocation"]
  lvl: "0"
  components:
    - somatic
    - verbal
  range: 20ft
  duration: per effect
  effect: >-
    As an action, invoke a minor cryomancy effect: 
      * Ice spike - make a ranged spell attack, dealing 1d4 + casting bonus cold damage if the target does not block it. 
        The critical multiplier of ice spike is x3.

      * Ice barrier - Conjure an ice barrier up to 5ft in area. Requires nearby available water. it has 1d10 + casting bonus HP, and otherwise functions as regular ice.

      * Freeze - Cause exposed liquids in a 5ft cube to freeze, or a 5ft surface to become difficult terrain. Creatures can become encased by this, requiring a strength check 
        as an action to break free.

      * Dispell fire - Cause a medium fire to go out, a creature to lose 1d6 instances of the burning condition, or a fire elemental to take twice the ice spike damage on a 
        failed constitution save.
  upgrades: >-
    At 2nd, 5th, 8th, and 11th level, choose an upgrade: 
      * Double the range. Can be taken multiple times. 
      * Increase ice spike damage dealt by 1d4. Can be taken multiple times.
      * Ice barrier may have double the area, and double the HP. Can be taken multiple times.

- name: lesser ethurgy
  types: ["arcane","evocation"]
  components:
    - somatic
    - verbal
  range: per effect
  duration: per effect
  casting: action
  effect: >-
    As an action, produce one of the following effects: 

      * Zap: Force a creature within 20ft to make a constitution save, taking 1d6 + casting bonus lightning damage, or half the amount if they succeed on the save.
      
      * Bubble: Create a small persistent bubble around the head of a creature within 10ft, or a 5ft bubble around a specific location or point underwater within 10ft. 
        The bubble repels liquids, contains fresh air, and lasts 5 minutes. You cannot have more bubbles active than your casting bonus - 2 (min 1.)
      
      * Wind Jump: Jump in 10ft in a direction of choice. Distance is increased by 5ft per casting bonus.
  upgrades: >-
    At 2nd, 5th, 8th, and 10th level, increase the range and distance(but not area) of all this cantrips effects by 5 feet. Also at those levels, choose an upgrade: 
      * You have resistance to fall damage while conscious.
      * Increase the number of bubbles that can remain active at once by 4.
      * Increase the damage of zap by 1 dice size category (1d6 > 1d8 > 1d10 > 1d12.) May be taken up to 3 times.
      * Increase the duration of bubbles to 15 minutes. May be taken twice to increase it to 1 hour.
      * Bubble may be cast to magically encase a target creature, allowing the entire creature to remain dry while submerged.
      * Further increase the range and distance of all effects by 5 feet. Can be taken multiple times.
      * Your ranged attacks and ranged spell attacks gain a +1 bonus to hit.
      * Your ranged weapon attacks gain a 20/40ft bonus to range. Can be taken multiple times.
  
- name: minor geomancy
  types: ["arcane", "transmutation"]
  components:
    - somatic
    - verbal
  range: 10ft
  duration: instant
  casting: action
  effect: >-
    As an bonus action, invoke geomantic energies and cause one of the following effects to occur: 
      * Move earth - As an action to cause up to a 5ft cube of soil or dirt within 30 feet to move and shift up to 5 feet. If this would encase a creature, it must make 
        a strength save if it's strength is below 14 when attempting to move. On a failure, the move attempt is wasted.
      
      * Erosion - As an action, turn a 5ft area of hard rocky surfaces into soil or brittle earth, or erode a 5ft cube area of soil, effectively granting you a tunneling 
        speed of 5 feet in brittle earth or soil, and 5 feet per two rounds, in hard rocky earth. 
  upgrades: >-
    At 5th level, this spell can effect even hard stone or clay masonry. 
    At 9th level, this spell can affect solid stone. 
    
    Also at 5th and 9th level, choose an upgrade, which grants a new option to pick for the spell effect:
      * Earthbind: As an action, cause a creature within 30 feet to make a dexterity save. On a failure, they are entangled for 1d6 rounds, and 
        can attempt a strength save as an action to escape.
      
      * Rust: As an action, cause a metal object within 10 feet to rapidly corrode, dealing 1d8 damage to the item.
      
      * Crush: As an action, cause a medium or smaller creature inside a pit, partially buried, or encased in dirt to take 2d10 + casting bonus bludgeoning damage as they 
        are crushed. The creature may make a constitution save to halve the damage, but on a critical failure they gain 1 level of fatigue.

- name: minor pyromancy
  types: ["arcane", "evocation"]
  components:
    - somatic
    - verbal
  range: 30ft
  duration: 1 minute
  casting: action
  effect: >-
    As an action, do one of the following effects: 
      * Singe - make a melee spell attack against a target, dealing 1d4 + casting bonus fire damage
      
      * Fire bolt - Make a 30/60 foot spell attack against a target, dealing 1d4 + casting bonus fire damage. The attack has disadvantage in its second range increment.
      
      * Spark - Cause object or creature within 30 feet to make a constitution save. On a failure, the target is set on fire.
      
      * Extinguish - Cause a burning creature to lose 1 stack of on fire, or cause a lit object such as a torch, a lantern, or a campfire to extinguish. 
    
    If you have access to a source of fire within 5ft, such as a torch, lantern, or campfire, then any creature that is critically hit by singe or fire bolt is also 
    set on fire.
  upgrades: >-
    At 4th, 7th, and 10th level, increase the number of damage dice of any spell effect by 1.
    
    Also at those levels, choose one upgrade from the list below:
    * Increase the number of times you can cast spark with or without a source of fire by 1. Can be taken multiple times.; 
    
    * If your source of fire is an item you wield, which can be used to make a melee attack, then singe may be cast as a bonus action on any creature you strike with it.
    
    * Extinguish removes all on fire instances from 1 creature.
    
    * Increase fire bolt range by 30/60 feet.
    
    * If your source of fire is a campfire or brazier, or similar powerful source, you may choose to cast a new effect, Fireflies: Cause 2d4 arcane sparks to rise from the
    source of fire and land in a 20ft cone. The cone originates from the source of fire, and the direction is always in the direction from the caster towards the source 
    of fire. You may choose where each spark lands, but no more than 1 spark may land in the same tile. Any creature in a tile where a spark lands must make a dexterity save,
    taking 1d6 + casting mod(min 1) damage, and only half damage on a success.

    * Increase all fire damage you deal by 1.

- name: arcane dart
  types: ["arcane", "conjuration"]
  components:
    - verbal
    - somatic
    - arcane focus
  duration: 3 rounds
  range: 40/80ft
  casting: action
  effect: >-
    As an action, conjure a glowing spark in your palm, which levitates in it and remains for 3 rounds, turning to spectral dust afterwards.
    
    For the duration, you may spend an action to launch it at a target creature within range by making a ranged spell attack against it. The spark deals 1d10 + casting mod
    force damage. The attack has disadvantage in the second range increment. 
    
    The target may attempt to block to negate damage, but the attack is treated as a critical hit, if the target critically fails the block check.
  upgrades: >-
    At 4th, 8th, and 12th level, choose an upgrade:
      * increase damage by 1d10.
      * increase range by 40/80.
      * you may fire the arcane dart as a bonus action.
      * increase crit range by 1, and increase enemy block fumble range by 1(they critically fail a check on a nat 2.)

- name: counteract
  types: ["arcane", "abjuration"]
  components:
    - verbal
    - somatic
    - arcane focus
  duration: 2 rounds
  range: self
  casting: 1 action
  effect: >-
    As an action, grant yourself a +1d4 bonus to a save of choice for 2 rounds.
  upgrades: >-
    At 4th, 8th, and 12th level, choose an upgrade:
      * Increase duration by 1 round. May be taken multiple times.
      * May be cast as a reaction instead, but doing so grants the caster 1 point of fatigue.
      * May be cast on an ally within 20ft. 
      * When cast, the spell target must immediately remake saves VS ongoing effects which offer a save that the target may make.










  

