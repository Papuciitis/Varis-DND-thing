- entry:
  - feats
  - ''
  - Sworn
  mechanics:
    choices:
    - key: upgrade
      label: Choose an upgrade
      type: select
      count: 1
      upgradeable: true
      options:
      - id: third
        name: Learn a level 3 oath spell
      - id: cantrip
        name: Learn an oath cantrip
      - id: fourth
        name: Forfeit the level 2 spell for a level 4 oath spell
    - key: learn-first
      label: 1st-level oath spell
      type: spell
      count: 1
      level: 1
      traditions:
      - oath
      grantSpell:
        ability: wis
        resource: manual
    - key: learn-second
      label: 2nd-level oath spell
      type: spell
      count: 1
      level: 2
      traditions:
      - oath
      grantSpell:
        ability: wis
        resource: manual
      when:
        not:
          choice: upgrade
          includes: fourth
    - key: learn-third
      label: 3rd-level oath spell
      type: spell
      count: 1
      level: 3
      traditions:
      - oath
      grantSpell:
        ability: wis
        resource: manual
      when:
        choice: upgrade
        includes: third
    - key: learn-cantrip
      label: Oath cantrip
      type: spell
      count: 1
      level: 0
      traditions:
      - oath
      grantSpell:
        ability: wis
        resource: free
      when:
        choice: upgrade
        includes: cantrip
    - key: learn-fourth
      label: 4th-level oath spell
      type: spell
      count: 1
      level: 4
      traditions:
      - oath
      grantSpell:
        ability: wis
        resource: manual
      when:
        choice: upgrade
        includes: fourth
    effects: []
- entry:
  - feats
  - ''
  - Grimness
  mechanics:
    choices:
    - key: upgrade
      label: Choose an upgrade
      type: select
      count: 1
      upgradeable: true
      options:
      - id: social
        name: +1 Deception, Intimidation and Disguise
      - id: stealth
        name: +2 Stealth
      - id: charisma
        name: +1 Charisma saves
    effects:
    - add:
        skillBonuses:
          Deception: 1
          Intimidation: 1
          Disguise: 1
      when:
        choice: upgrade
        includes: social
    - add:
        skillBonuses:
          Stealth: 2
      when:
        choice: upgrade
        includes: stealth
    - add:
        saveBonuses:
          cha: 1
      when:
        choice: upgrade
        includes: charisma
- entry:
  - feats
  - ''
  - Arcane insight
  mechanics:
    choices:
    - key: upgrade
      label: Choose an upgrade
      type: select
      count: 1
      upgradeable: true
      options:
      - id: cost
        name: Reduce psychic damage to d6
      - id: spell
        name: Learn a level 2 arcane spell
      - id: int
        name: +1 Intelligence
      - id: arcana
        name: +3 Arcana
    - key: learn-cantrip
      label: Arcane cantrip
      type: spell
      count: 1
      level: 0
      traditions:
      - arcane
      grantSpell:
        ability: int
        resource: free
    - key: learn-first
      label: 1st-level arcane spell
      type: spell
      count: 1
      level: 1
      traditions:
      - arcane
      grantSpell:
        ability: int
        resource: restDice
    - key: learn-second
      label: 2nd-level arcane spell
      type: spell
      count: 1
      level: 2
      traditions:
      - arcane
      grantSpell:
        ability: int
        resource: restDice
      when:
        choice: upgrade
        includes: spell
    effects:
    - add:
        abilities:
          int: 1
      when:
        choice: upgrade
        includes: int
    - add:
        skillBonuses:
          Arcana: 3
      when:
        choice: upgrade
        includes: arcana
- entry:
  - feats
  - ''
  - More upgrades
  mechanics:
    choices:
    - key: targets
      label: Two different upgrade lists
      type: upgrade-target
      targetMode: upgrades
      count: 2
    effects: []
    grants:
    - from: targets
      count: 1
      ownerKey: source
    notes:
    - Only upgrade lists qualify. Extra feature slots are restricted to the chosen list; this feat cannot grant
      another feat.
