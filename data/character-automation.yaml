# Character mechanics, separate from player-facing rules. See docs/character-automation.md.
# Choice keys and option IDs are persistent save identifiers; do not rename them.
version: 1
rules:
- entry:
  - feats
  - ''
  - Dual wielding
  mechanics:
    choices:
    - key: upgrade
      label: Choose an upgrade
      type: select
      count: 1
      upgradeable: true
      options:
      - id: trained
        name: Trained hand
      - id: quick
        name: Quick strikes
      - id: defense
        name: Agile defense
      - id: reaction
        name: Hasty reactions
      - id: swift
        name: Swift combat
    - key: ability
      label: Ability score +1
      type: ability
      abilities:
      - dex
      - str
    effects:
    - target: abilities
      choice: ability
      amount: 1
    - add:
        offHandAbilityDamage: true
      when:
        choice: upgrade
        includes: trained
    repeatLimit: 3
    repeatRequirements:
    - Dexterity 13
    - Dexterity 15
    - Dexterity 17
    abilityIncrease: true
- entry:
  - feats
  - ''
  - Mutant kobold
  mechanics:
    choices:
    - key: upgrade
      label: Choose an upgrade
      type: select
      count: 1
      upgradeable: true
      options:
      - id: troglodyte
        name: Troglodyte
      - id: drakeling
        name: Drakeling
      - id: cavebold
        name: Cavebold
      - id: rokold
        name: Rokold
      - id: goldling
        name: Goldling
      - id: kobolid
        name: Kobolid
      - id: kobolisk
        name: Kobolisk
    effects:
    - add:
        abilities:
          int: -2
      when:
        choice: upgrade
        includes: troglodyte
    - add:
        abilities:
          wis: -2
      when:
        choice: upgrade
        includes: drakeling
    - add:
        abilities:
          cha: -2
        resistances:
        - cold
        - fire
      when:
        choice: upgrade
        includes: cavebold
    - add:
        abilities:
          con: -2
      when:
        choice: upgrade
        includes: rokold
    - add:
        abilities:
          int: 3
        deathSaveBonus: -2
        ac: -1
      when:
        choice: upgrade
        includes: goldling
    - add:
        speed: -5
        resistances:
        - acid
        - slashing
      when:
        choice: upgrade
        includes: kobolisk
    abilityIncrease: true
- entry:
  - feats
  - ''
  - Rite magic
  mechanics:
    choices:
    - key: upgrade
      label: Choose an upgrade
      type: select
      count: 1
      upgradeable: true
      options:
      - id: spell
        name: Rite spell
      - id: slot
        name: Rite slot
      - id: cantrips
        name: Minor rites
      - id: die
        name: Rite dice
    - key: learn-rite
      label: 2nd-level oath spell
      type: spell
      count: 1
      level: 2
      traditions:
      - oath
      grantSpell:
        ability: wis
        resource: manual
      when:
        choice: upgrade
        includes: spell
    - key: learn-rites
      label: Cantrips (cannot be upgraded)
      type: spell
      count: 2
      level: 0
      traditions:
      - oath
      - mystic
      grantSpell:
        ability: wis
        resource: free
      when:
        choice: upgrade
        includes: cantrips
    effects:
    - add:
        hpFlat: -1
