- name: Bloomguard
  group: Geomorphy spells
  lvl: '5'
  types: Conjuration, Transmutation, Geomorphy 5
  casting: 1 action
  range: Touch
  components: verbal, somatic, material (a seed worth 100 gp; not consumed)
  duration: 1 day
  effect: Touch a living plant and grow one Resilient Plant in an unoccupied space within 5 feet of it. The plant
    is Huge, stationary, and provides cover according to its position. It has no actions or attacks. Set its maximum
    and initial HP to 200 + your casting-ability modifier (minimum 1); use the linked statblock for all other statistics.
    It regains 10 HP at the start of each of its turns while it has at least 1 HP. It cannot be commanded to move
    or attack. At 0 HP or when this spell ends it becomes an ordinary plant. You may maintain only one Bloomguard
    plant; creating another ends the previous spell.
  source_ref: draft2.pdf / PDF page 59
  source_original:
    spell: Bloomguard
    page: 59
    source_system: Homebrewery 5e draft
    level: 5
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - Source prints instantaneous duration but finite higher-level durations. Completion uses a one-day base duration
    and a ten-day tier-6 duration, with one active plant. Printed flat 200 HP is the base; the casting modifier
    is added once, not an inconsistent dice average.
  summons:
  - monster: Resilient Plant
  higher_levels: At tier 6 the duration becomes 10 days.
- name: Earth's Awakening
  group: Geomorphy spells
  lvl: '5'
  types: Conjuration, Transmutation, Geomorphy 5
  casting: 1 action
  range: 150 feet
  components: verbal, somatic
  duration: Concentration, up to 1 minute
  effect: Animate one 50-foot-radius area of natural earth or stone centered on a point in range as Awakened Earth.
    Its body remains anchored to that area; burrowing only reshapes its own area and cannot transport it elsewhere.
    Set its maximum and initial HP to 75 + your casting-ability modifier (minimum 1). It can use Multi-Assault against
    chosen creatures standing on its area, making a separate printed Slam attack roll for each target; reach 5 feet
    applies to creatures at its boundary. The creature shares your initiative and acts immediately after your turn.
    On your turn you may give it one verbal command without spending an action; it follows that order using its
    own movement and actions. Without an order it Dodges and avoids hazards. It cannot create or command further
    summons unless the creating effect expressly permits it. Each spell states its own active-creature limit, range
    and duration. Dismiss a creature as an action unless its spell says otherwise. Independently of commands or
    its Dodge default, the elemental may choose to use its action to attempt a Strength check against your spell
    save DC to break your control. The controller cannot forbid this attempt; the GM decides whether it tries. On
    success it remains animated for the remaining duration but acts independently under the GM. It becomes ordinary
    ground at 0 HP or when the spell ends.
  source_ref: draft2.pdf / PDF page 60
  source_original:
    spell: Earth's Awakening
    page: 60
    source_system: Homebrewery 5e draft
    level: 5
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - Anchored area resolves the stationary/burrow contradiction. The source 4d10 area attack uses the printed Slam
    attack and Block DC per target, rather than automatic unavoidable damage. The loss-of-control check is retained.
  summons:
  - monster: Awakened Earth
  higher_levels: At tier 6 its Slam damage increases by 1d10; add this once to each successful unblocked Slam.
- name: Geochemical Golem
  group: Geomorphy spells
  lvl: '5'
  types: Conjuration, Transmutation, Geomorphy 5
  casting: 10-minute ritual
  range: 30 feet
  components: verbal, somatic, material (rare-earth mixture costing at least 1,000 gp, consumed; selected infusion
    costs may increase this)
  duration: Concentration, up to 1 hour
  effect: Create one Geochemical Golem in a visible unoccupied space within range. Use its linked base statblock
    and choose one to four distinct material infusions before casting. Pay max(1,000 gp, the sum of chosen material
    prices), plus 400 gp for a third material and a further 2,000 gp for a fourth. Only chosen effects apply; no
    effect stacks with itself. The golem crumbles at 0 HP, dismissal or spell end. You may maintain only one Geochemical
    Golem from this spell; creating another dismisses the previous one. The creature shares your initiative and
    acts immediately after your turn. On your turn you may give it one verbal command without spending an action;
    it follows that order using its own movement and actions. Without an order it Dodges and avoids hazards. It
    cannot create or command further summons unless the creating effect expressly permits it. Each spell states
    its own active-creature limit, range and duration. Dismiss a creature as an action unless its spell says otherwise.
    Beyond 100 feet from you it follows its last order instead of receiving a new one. Infusion configurations and
    exact individual rules are in the linked golem material selector and the Geochemical Golem infusion options
    rule.
  source_ref: draft2.pdf / PDF page 61
  source_original:
    spell: Geochemical Golem
    page: 61
    source_system: Homebrewery 5e draft
    level: 5
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - 'Material prices on page 62 are combined with the page-61 minimum mixture: pay the greater of 1,000 gp or the
    material subtotal, then the third/fourth material surcharges. This resolves conflicting source cost wording.
    One active golem, shared initiative and free verbal command are explicit completions.'
  summons:
  - monster: Geochemical Golem
  higher_levels: At tier 6 the duration is 8 hours. Maintain concentration for the first hour; after one uninterrupted
    hour concentration is no longer required for the remaining duration.
- name: Geomorpher's Stone Servant
  group: Geomorphy spells
  lvl: '5'
  types: Conjuration, Transmutation, Geomorphy 5
  casting: 1-hour ritual
  range: Touch
  components: verbal, somatic, material (a gemstone worth 500 gp, consumed)
  duration: Until dispelled
  effect: Touch one Large or smaller nonmagical stone or a collection of stones fitting within a 5-foot cube. It
    becomes one Large Stone Servant. It can carry, clean, mend, build, break inanimate objects and dig, and may
    Help or Guard as its linked statblock describes. It cannot attack a creature or cast spells; the spell’s express
    noncombat restriction takes priority over the source block’s unused Slam. The creature shares your initiative
    and acts immediately after your turn. On your turn you may give it one verbal command without spending an action;
    it follows that order using its own movement and actions. Without an order it Dodges and avoids hazards. It
    cannot create or command further summons unless the creating effect expressly permits it. Each spell states
    its own active-creature limit, range and duration. Dismiss a creature as an action unless its spell says otherwise.
    Beyond 60 feet it stops obeying and takes no actions until you return within 60 feet. It reverts to stone at
    0 HP, when dispelled, or when dismissed. Only one servant from this spell may be active per caster; creating
    another reverts the previous one.
  source_ref: draft2.pdf / PDF page 63
  source_original:
    spell: Geomorpher's Stone Servant
    page: 63
    source_system: Homebrewery 5e draft
    level: 5
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - Resolves the source contradiction in favor of the spell’s explicit cannot-attack rule. The source Slam remains
    in provenance; the playable summoned servant has noncombat actions. A one-active-servant limit prevents unlimited
    permanent accumulation.
  summons:
  - monster: Stone Servant
  higher_levels: At tier 6 increase its maximum and initial HP by 10.
- name: Sandsoverign
  group: Geomorphy spells
  lvl: '6'
  types: Conjuration, Transmutation, Geomorphy 6
  casting: 1 full-round action
  range: Self; golem appears within 60 feet
  components: verbal, somatic, material (a vial of desert sand worth 1,000 gp; not consumed)
  duration: Concentration, up to 1 hour
  effect: Take command of existing nonmagical sand within 1 mile. As an action, shape up to one 10-foot cube into
    a simple stationary object or terrain feature; this cannot create moving machinery, precious materials or a
    creature. Structures remain after the spell, but the ability to reshape them ends with it. As an action form
    one Colossal Sand Golem in a visible unoccupied space within 60 feet. Despite its proper name it is mechanically
    Huge. The golem uses its own listed Sandstorm rather than granting an extra separate mile-wide damage action.
    The creature shares your initiative and acts immediately after your turn. On your turn you may give it one verbal
    command without spending an action; it follows that order using its own movement and actions. Without an order
    it Dodges and avoids hazards. It cannot create or command further summons unless the creating effect expressly
    permits it. Each spell states its own active-creature limit, range and duration. Dismiss a creature as an action
    unless its spell says otherwise. The golem must remain within 1 mile, collapses into sand at 0 HP or when this
    spell ends, and replaces any prior golem created by you through this spell. Only one may exist per caster.
  source_ref: draft2.pdf / PDF page 78
  source_original:
    spell: Sandsoverign
    page: 78
    source_system: Homebrewery 5e draft
    level: 9
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - Source ninth-level Sandsoverign is adapted to current tier 6. Retain its source spelling as the canonical title;
    Sandsovereign is an alias. One active golem, concentration one hour, local creation range and a ten-foot-cube
    shaping limit complete the otherwise unbounded instantaneous summon.
  summons:
  - monster: Colossal Sand Golem
  aliases:
  - Sandsovereign
- name: Thorn Spitter
  group: Geomorphy spells
  lvl: '6'
  types: Conjuration, Transmutation, Geomorphy 6
  casting: 1 bonus action
  range: 20 feet
  components: verbal, somatic
  duration: Concentration, up to 1 minute
  effect: 'Root one Thorn Spitter in an unoccupied space on earth or stone within range. It cannot move. The creature
    shares your initiative and acts immediately after your turn. On your turn you may give it one verbal command
    without spending an action; it follows that order using its own movement and actions. Without an order it Dodges
    and avoids hazards. It cannot create or command further summons unless the creating effect expressly permits
    it. Each spell states its own active-creature limit, range and duration. Dismiss a creature as an action unless
    its spell says otherwise. It can make one Thorn Spit as its action: use your spell attack bonus, range 60 feet,
    Block DC 8 + that bonus, and 4d10 piercing damage on an unblocked strike. It has the completed defenses and
    ability scores in its linked statblock. Only one may be active per caster; creating another dismisses the first.
    It withers at 0 HP, dismissal or spell end.'
  source_ref: draft2.pdf / PDF page 71
  source_original:
    spell: Thorn Spitter
    page: 71
    source_system: Homebrewery 5e draft
    level: 7
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - Source seventh-level spell is adapted to current tier 6. A documented plant chassis supplies missing defenses;
    one spell attack per action resolves the missing attack/save and frequency. Caster spell-attack bonus is used
    rather than inventing an unrelated fixed bonus.
  summons:
  - monster: Thorn Spitter
- name: Rockplica
  group: Geomorphy spells
  lvl: '4'
  types: Conjuration, Transmutation, Geomorphy 4
  casting: 1 action
  range: Self; adjacent unoccupied space
  components: verbal, somatic
  duration: Concentration, up to 1 minute
  effect: Create one stone duplicate of yourself in an adjacent unoccupied space. On creation it copies your current
    size, AC, movement, six ability scores, attack bonuses, save bonuses and known action options; its maximum and
    initial HP are half your maximum HP, rounded down, minimum 1. Use the linked Rockplica duplicate template. The
    creature shares your initiative and acts immediately after your turn. On your turn you may give it one verbal
    command without spending an action; it follows that order using its own movement and actions. Without an order
    it Dodges and avoids hazards. It cannot create or command further summons unless the creating effect expressly
    permits it. Each spell states its own active-creature limit, range and duration. Dismiss a creature as an action
    unless its spell says otherwise. It must remain within 30 feet of you and crumbles if that distance is exceeded,
    at 0 HP or when the spell ends. Spell slots, mana, rest-limited features, ammunition, consumables and item charges
    are shared with you, not duplicated. Spending a resource through it spends your resource once. Its copied equipment
    has no independent inventory or sale value. It cannot create Rockplicas, summon creatures, duplicate itself
    or activate a feature that grants another creature an independent resource pool. One duplicate per caster. The
    copy can speak your languages and provide verbal components. It uses your spell attack and save DC. Its Block
    points share your remaining pool rather than adding another pool. It cannot maintain concentration separately
    and cannot cast concentration spells while Rockplica occupies your concentration.
  source_ref: draft2.pdf / PDF page 57
  source_original:
    spell: Rockplica
    page: 57
    source_system: Homebrewery 5e draft
    level: 4
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - Snapshot copied combat statistics, shared finite resources and a no-recursion rule complete the unspecified
    copied-stat boundaries. This is a caster-derived template, not a fixed-CR monster awarding XP.
  summons:
  - monster: Rockplica duplicate
  higher_levels: At tiers 5 and 6 add 10 HP per tier above 4 to the duplicate’s maximum and initial HP.
- name: Nature's Grasp
  group: Geomorphy spells
  lvl: '4'
  types: Conjuration, Transmutation, Geomorphy 4
  casting: 1 bonus action
  range: 60 feet
  components: verbal, somatic
  duration: Concentration, up to 1 minute
  effect: An earth spirit manifests around one creature you can see on earth or stone within range. The target makes
    a Strength save against your spell save DC. On failure it is Pinned; on success the spell has no effect on it.
    A Pinned target may use an action to make a Strength check against the same DC, ending the effect on success.
    The spirit has no independent HP, initiative or attacks and is not an additional summoned monster. This saving-throw-only
    effect cannot be Blocked.
  source_ref: draft2.pdf / PDF page 56
  source_original:
    spell: Nature's Grasp
    page: 56
    source_system: Homebrewery 5e draft
    level: 4
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - Current Pinned replaces the source grapple/restrain wording; an explicit action to escape completes the missing
    procedure.
  higher_levels: A tier-5 casting may target two creatures; tier 6 may target three. Each target resolves and escapes
    separately.
- name: Stone Sentinel
  group: Geomorphy spells
  lvl: '6'
  types: Conjuration, Transmutation, Geomorphy 6
  casting: 1 action
  range: 30 feet
  components: verbal, somatic
  duration: 8 hours
  effect: Create one Medium stone statue in a visible unoccupied space on the ground within range. It is an object
    with AC 15, 30 HP, poison and psychic immunity, and speed 0 except when commanded. A creature appropriately
    positioned behind it gains half cover (+2 AC and Dexterity saves against effects crossing the statue; no bonus
    against attacks from an uncovered direction). On your turn, spend a bonus action to move it up to 30 feet along
    supported ground while it remains within 120 feet. It cannot attack, take creature actions, occupy an occupied
    space or trap a creature by moving onto it. It crumbles at 0 HP or spell end. Only one statue from this spell
    may be active per caster.
  source_ref: draft2.pdf / PDF page 67
  source_original:
    spell: Stone Sentinel
    page: 67
    source_system: Homebrewery 5e draft
    level: 6
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - Source movable half-cover statue is implemented as an object, not an extra monster. AC, HP, command range, one-instance
    limit and cover geometry are explicit completions.
- name: Treetimber
  group: Geomorphy spells
  lvl: '6'
  types: Conjuration, Transmutation, Geomorphy 6
  casting: 1 bonus action
  range: 60 feet
  components: verbal, somatic
  duration: Instantaneous
  effect: A conjured tree crashes onto one creature you can see within range. It makes a Dexterity save against
    your spell save DC, taking 5d10 bludgeoning damage on a failure, or half on a success. The tree vanishes immediately
    after the damage. It creates no persistent plant creature or valuable timber. This saving-throw-only effect
    cannot be Blocked.
  source_ref: draft2.pdf / PDF page 75
  source_original:
    spell: Treetimber
    page: 75
    source_system: Homebrewery 5e draft
    level: 8
  conversion_notes:
  - Optional Tarta Homebrewery add-on. Existing spells with other names retain their current rules. Use the current
    casting ability, spell attack, save DC, Block, conditions and rest rules. New spells above source level 6 are
    adapted to current tier 6 rather than adding unsupported 7th–9th player spell tiers.
  - Source eighth-level instantaneous tree attack is adapted to current tier 6; Dexterity save for half completes
    the missing attack/save resolution. It does not grant a permanent summon.
