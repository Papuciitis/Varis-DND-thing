<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#791d29">
  <meta name="description" content="An editable Vara DnD character sheet with resource tracking and portable character backups.">
  <title>Character sheet · Vara DnD</title>
  <link rel="stylesheet" href="character.css">
  <script defer src="catalog.js"></script>
  <script defer src="character-state.js"></script>
  <script defer src="character-effects.js"></script>
  <script defer src="character-equipment.js"></script>
  <script defer src="character-rules.js"></script>
  <script defer src="character-builder.js"></script>
  <script defer src="character.js"></script>
</head>
<body>
  <a class="sr-only skip-link" href="#sheet-content">Skip to character sheet</a>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">V</span><span>VARA <span class="brand-subtitle">Character sheet</span></span></a>
      <a class="rules-link" href="index.html" target="_blank" rel="noopener">Rules compendium</a>
      <div class="top-tools">
        <label class="sr-only" for="character-picker">Switch character</label>
        <select id="character-picker" class="character-picker"></select>
        <button class="button button-quiet button-small" type="button" data-action="new">New character</button>
        <button class="button button-small" type="button" data-action="export">Save backup</button>
        <button class="button button-small" type="button" data-action="import">Load backup</button>
      </div>
    </div>
  </header>
  <main class="sheet-shell">
    <header class="character-banner">
      <div class="character-title">
        <label class="sr-only" for="character-name">Character name</label>
        <input id="character-name" class="character-name" data-path="name" type="text" maxlength="120" placeholder="Name your character" autocomplete="off">
        <p class="character-subtitle" id="character-subtitle">Level 1 · Choose your class and ancestry</p>
      </div>
      <div class="banner-tools">
        <button class="button" type="button" data-action="identity">Edit character</button>
        <button class="button button-primary" type="button" data-action="builder">Build character</button>
        <span class="save-status" id="save-status" role="status">Autosaves on this device</span>
      </div>
    </header>
    <nav class="tabs" role="tablist" aria-label="Character sections">
      <button class="tab-button" id="tab-sheet" type="button" role="tab" aria-selected="true" aria-controls="pane-sheet" data-tab="sheet">Sheet</button>
      <button class="tab-button" id="tab-spells" type="button" role="tab" aria-selected="false" aria-controls="pane-spells" data-tab="spells" tabindex="-1">Spells</button>
      <button class="tab-button" id="tab-gear" type="button" role="tab" aria-selected="false" aria-controls="pane-gear" data-tab="gear" tabindex="-1">Gear</button>
      <button class="tab-button" id="tab-features" type="button" role="tab" aria-selected="false" aria-controls="pane-features" data-tab="features" tabindex="-1">Features</button>
      <button class="tab-button" id="tab-notes" type="button" role="tab" aria-selected="false" aria-controls="pane-notes" data-tab="notes" tabindex="-1">Notes</button>
    </nav>
    <div class="sheet-content" id="sheet-content">
      <section class="pane" id="pane-sheet" role="tabpanel" aria-labelledby="tab-sheet" tabindex="0"></section>
      <section class="pane" id="pane-spells" role="tabpanel" aria-labelledby="tab-spells" tabindex="0" hidden></section>
      <section class="pane" id="pane-gear" role="tabpanel" aria-labelledby="tab-gear" tabindex="0" hidden></section>
      <section class="pane" id="pane-features" role="tabpanel" aria-labelledby="tab-features" tabindex="0" hidden></section>
      <section class="pane" id="pane-notes" role="tabpanel" aria-labelledby="tab-notes" tabindex="0" hidden></section>
    </div>
    <footer class="sheet-footer"><span>Vara DnD</span><span>Character sheet prototype</span><button class="text-button" type="button" data-action="print">Print sheet</button></footer>
  </main>
  <dialog class="modal" id="editor-dialog" aria-labelledby="dialog-title">
    <div class="modal-header"><h2 id="dialog-title"></h2><button class="button button-quiet" type="button" data-action="close-dialog" aria-label="Close dialog">Close</button></div>
    <div class="modal-body" id="dialog-body"></div>
    <div class="modal-footer" id="dialog-footer"></div>
  </dialog>
  <input id="backup-input" type="file" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p>This character sheet needs JavaScript enabled.</p></noscript>
</body>
</html>
