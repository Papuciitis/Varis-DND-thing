<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19392f">
  <title>Open D&amp;D · Rules compendium</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="catalog-loader.js"></script>
  <script defer src="entry-order.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#reader" id="skip">Skip to content</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="identity" href="#" aria-label="Open D&amp;D compendium home">
        <span class="book-mark" aria-hidden="true"></span>Open D&amp;D
      </a>
      <div class="global-tools">
        <a class="sheet-link" href="character.html">Character sheet</a>
        <label class="sr-only" for="section-picker">Browse a section</label>
        <select id="section-picker"><option value="">Compendium index</option></select>
        <form role="search" id="search-form" aria-label="Search the compendium">
          <span class="search-icon" aria-hidden="true"></span>
          <label class="sr-only" for="search">Search all rules</label>
          <input id="search" type="search" placeholder="Search all rules" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </form>
      </div>
    </div>
  </header>
  <main class="page">
    <nav id="trail" aria-label="Breadcrumb"></nav>
    <article id="reader" tabindex="-1" aria-labelledby="entry-title"></article>
    <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </main>
  <noscript><p>This compendium needs JavaScript to display its entries.</p></noscript>
</body>
</html>
